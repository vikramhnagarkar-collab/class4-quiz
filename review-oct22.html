nterfere with pedestrians who are crossing or about to cross.", "h": "Close enough to see, without blocking people on foot.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Stop signs", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Stop signs, PDF p.61"}, {"id": "V301", "q": "About passing a STOPPED ambulance with its lights flashing, which statement is NOT true?", "o": ["Every lane on the road must slow to 60 km/h", "The lowered limit applies to the lane(s) right next to it", "Fines for speeding in the lane next to it are doubled", "In the other lanes you must still be watchful and cautious"], "a": 0, "ex": "Driver's Guide (Emergency vehicles, PDF 87): reduce to 60 km/h or the posted speed, whichever is lower, in the lane(s) immediately next to emergency vehicles or tow trucks stopped with lights flashing; the fine for speeding there is doubled. If you are not in the lane next to them you still need to be watchful and cautious.", "h": "Read WHERE the rule applies.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Emergency vehicles", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency vehicles, PDF p.87"}, {"id": "V302", "q": "Under the National Safety Code, which is NOT on the Commercial Guide's list of what each driver should do?", "o": ["Write the carrier's preventive maintenance plan", "Be medically fit to drive, not fatigued, and not under alcohol or drugs", "Be qualified, with a valid licence and the other required documents", "Report any violations, convictions, and collisions to the carrier"], "a": 0, "ex": "Commercial Guide (National Safety Code, PDF 22): each driver should be medically fit to drive and not fatigued or under the influence of alcohol or any drug, be qualified with the required documents, and report violations, convictions and collisions to the carrier. The carrier, not the driver, must establish and follow the written maintenance program; the driver must understand it and carry out the inspections it requires.", "h": "One task belongs to the company, not the driver.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Driver responsibilities", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Driver responsibilities, PDF p.22"}];const QH=[{"id": "W1", "q": "Your carrier operates ONE vehicle outside Alberta. You drive a bus that never leaves Alberta. Which hours-of-service rules apply to you?", "o": ["Federal, because the carrier falls under the federal legislation", "Alberta rules for in-province trips, and federal rules only on the days the other vehicle leaves", "Alberta, because your bus never leaves the province", "Both, whichever is stricter on that day"], "a": 0, "ex": "Federal legislation applies to carriers and their drivers who operate one or more vehicles outside of Alberta. Once a carrier falls within the federal legislation, all drivers of its regulated vehicles must comply, even those that never leave Alberta.", "h": "It depends on the carrier, not on your own route.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service, PDF p.23"}, {"id": "W2", "q": "You are on Cycle 2 with 69 on-duty hours since your last 24 consecutive hours off. What must you do BEFORE reaching hour 70?", "o": ["Take at least 24 consecutive hours off-duty", "Nothing until you reach 120 hours in 14 days", "Take 10 hours off, 8 of them consecutive", "Switch to Cycle 1 without a reset"], "a": 0, "ex": "Drivers using cycle 2 are required to take at least 24 consecutive hours off prior to reaching their 70th hour of on-duty time. A driver cannot move between cycles without a reset.", "h": "Cycle 2 has a checkpoint at the Cycle 1 limit.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "W3", "q": "Which pairing of cycle and RESET time is correct?", "o": ["Cycle 1: 36 hours off \u00b7 Cycle 2: 72 hours off", "Cycle 1: 36 hours off \u00b7 Cycle 2: 120 hours off", "Cycle 1: 72 hours off \u00b7 Cycle 2: 36 hours off", "Cycle 1: 24 hours off \u00b7 Cycle 2: 36 hours off"], "a": 0, "ex": "Cycle 1 resets with 36 consecutive hours off-duty; cycle 2 resets with 72 consecutive hours off-duty.", "h": "The longer cycle needs the longer reset.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "W4", "q": "Which vehicle does the Vehicle Inspection Program inspect EVERY six months, not every 12?", "o": ["A school bus designed for 11 or more, including the driver", "A truck and trailer combination registered at 11,794 kg or more", "A truck-tractor with a GVW of 11,794 kg", "A municipal transit bus operating only in Alberta"], "a": 0, "ex": "All buses designed to carry 11 or more including the driver (not municipal transit buses) must be inspected every six months. Trucks and trailers of 11,794 kg or more are inspected every 12 months.", "h": "Passengers get the more frequent check.", "cat": "t3", "ch": "3 \u00b7 Vehicle Inspection Program", "sec": "Vehicle Inspection Program", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Vehicle Inspection Program, PDF p.25"}, {"id": "W5", "q": "At the FRONT of the vehicle, which item is checked on school buses ONLY?", "o": ["Pedestrian-student safety crossing arm is secure and works", "Clearance and marker lights work, lenses are clean, reflectors are clean", "Windshield is clean and free of major cracks", "High and low-beam headlights work"], "a": 0, "ex": "Front of the vehicle (Class 2 and 4): alternating amber and red flashing lights, pedestrian-student safety crossing arm, and crossover mirror are school bus only; clearance and marker lights apply to all.", "h": "It swings out to keep children in view.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "W6", "q": "Minimum tire tread in the guide: steering axle tires vs ambulance drive axle tires?", "o": ["Steering axle: 3.2 mm \u00b7 ambulance drive axle: 1.6 mm", "Steering axle: 1.6 mm \u00b7 ambulance drive axle: 3.2 mm", "Steering axle: 3.2 mm \u00b7 ambulance drive axle: 3.2 mm", "Steering axle: 2 mm \u00b7 ambulance drive axle: 1.6 mm"], "a": 0, "ex": "Steering axle tires: tread not less than 3.2 mm (PDF p.33). Further items for Class 4 vehicles (ambulances): drive axle tire tread not less than 1.6 mm (PDF p.37).", "h": "The wheels you steer with need more.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Further items for Class 4 vehicles (ambulances)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Further items for Class 4 vehicles (ambulances), PDF p.37"}, {"id": "W7", "q": "Inside a bus, which pair are BOTH checks for ALL buses, NOT school buses ONLY?", "o": ["Handrail is secure \u00b7 parking brake works", "Handrail is secure \u00b7 stop arm and lights work", "Parking brake works \u00b7 emergency exit alarm works", "Stop arm and lights work \u00b7 emergency exit alarm works"], "a": 0, "ex": "Inside the vehicle (Class 2 and Class 4): the handrail and parking brake checks apply to all buses. \"Stop arm and lights work\" and \"emergency exit alarm works\" are marked school bus only.", "h": "Two of the listed items belong to yellow buses only.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "W8", "q": "The guide says a commercial bus driver should know the basic components and systems, including:", "o": ["Where they are, what they do, and how they operate", "Where they are and how to repair each one at the roadside", "What they do only, since the layout is the same on every bus", "How to rebuild each one using the steps in this guide"], "a": 0, "ex": "Components and systems of a bus: it is important for a commercial bus driver to know the basic components and systems of the vehicle, where they are located, their functions, and how they operate.", "h": "Location, purpose, operation.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Special information for buses (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Special information for buses (Class 2 and Class 4 vehicles), PDF p.41"}, {"id": "W9", "q": "At the rear of a COMMERCIAL (not school) bus, which check does NOT apply?", "o": ["White flashing strobe light works", "Spare tire, if equipped, is inflated and secure, with jack and tools secured", "Mud flaps are secure and do not rub on the tires", "Brake lights work, lenses clean and not cracked"], "a": 0, "ex": "The white flashing strobe light is a school bus only item. Brake lights and mud flaps apply to all vehicle types, and the spare tire, jack and tools check applies to buses if equipped.", "h": "Find the school-bus-only item.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "W10", "q": "At the REAR of a school bus, which pair of lights is marked school bus ONLY?", "o": ["Alternating amber and red flashing lights \u00b7 white flashing strobe light", "Alternating amber and red flashing lights \u00b7 clearance and marker lights", "Brake lights and turn signals \u00b7 white flashing strobe light", "Alternating red and white flashing lights \u00b7 amber flashing strobe light"], "a": 0, "ex": "Rear of the vehicle: alternating amber and red flashing lights work (school bus only) and white flashing strobe light works (school bus only). Clearance and marker lights, brake lights and turn signals are on every vehicle.", "h": "Check every colour word.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "W11", "q": "Which pair of warning signs does the guide list under SUSPENSION?", "o": ["Excessive bounce or bottoming out \u00b7 weaving or swaying on corners", "Pulling to one side when braking \u00b7 a shaking steering wheel at speed", "Excessive bounce or bottoming out \u00b7 pulling to one side when braking", "A shaking steering wheel at speed \u00b7 weaving or swaying on corners"], "a": 0, "ex": "Suspension: is there excessive bounce or does the vehicle bottom out when going over bumps or potholes? Does it weave or sway excessively when turning corners or curves? (This may be due to broken springs or faulty shock absorbers.)", "h": "Both halves have to come from the same heading.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Suspension", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Suspension, PDF p.40"}, {"id": "W12", "q": "Which gauge pairing is NOT correct, per the guide's table?", "o": ["Odometer: distance driven since the last service", "Ammeter: how much the battery is being charged or discharged", "Water temperature gauge: temperature of the coolant in the engine", "Thermostat: a temperature-sensitive device that regulates coolant flow"], "a": 0, "ex": "Gauges: the odometer \"indicates how many kilometres or miles the vehicle has been driven since manufacturing\", not since the last service. The other three pairings match the table.", "h": "Check what each one counts from.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Gauges", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Gauges, PDF p.47"}, {"id": "W13", "q": "In the Cooling System table, the exhaust system and muffler:", "o": ["Expel burned gases and fumes to the rear and reduce engine combustion sound", "Expel burned gases to the side and help cool the engine through heat exchange", "Reduce engine sound and lower nitrogen oxide emissions by injecting DEF", "Expel burned gases to the rear and keep the coolant sealed under pressure"], "a": 0, "ex": "Cooling System: Exhaust system/muffler/exhaust pipe \u2014 \"This system assists in removing or expelling burned gases and fumes to the rear of the vehicle and reduce the sound of the engine combustion.\" DEF is a gauge item; the radiator cap keeps coolant pressure.", "h": "Two jobs: where the gases go, and the noise.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Cooling System", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Cooling System, PDF p.44"}, {"id": "W14", "q": "Which pairing matches the guide's Tires and Wheels table?", "o": ["Wheel hub: the central portion of a wheel through which the axle passes", "Wheel hub: the ring-shaped, air-cushioned part that provides traction", "Tire: the central portion of a wheel through which the axle passes", "Wheel fasteners: the multi-piece rim assembly used to mount large tires"], "a": 0, "ex": "Tires and Wheels: Tire \u2014 ring-shaped, air-cushioned, provides traction. Wheel hub \u2014 \"the central portion of a wheel through which the axle passes.\" Wheel/rim \u2014 single and multi-piece rim assembly. Wheel fasteners (nuts, bolts, studs) secure the wheels.", "h": "Where does the axle go?", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Tires and Wheels", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Tires and Wheels, PDF p.47"}, {"id": "W15", "q": "Which pairing of warning light and colour is correct?", "o": ["Low coolant level: blue \u00b7 water temperature: red", "Low coolant level: red \u00b7 water temperature: blue", "Low coolant level: yellow \u00b7 water temperature: red", "Low coolant level: blue \u00b7 water temperature: yellow"], "a": 0, "ex": "Warning lights: Low coolant level \u2014 Blue \u2014 \"Displays when the coolant level is low\" (PDF p.48). Water temperature warning light \u2014 Red \u2014 \"goes on when the engine coolant temperature is hot\" (PDF p.49).", "h": "Hot is the danger colour.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Warning lights and indicator symbols", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Warning lights and indicator symbols, PDF p.48"}, {"id": "W16", "q": "Which pair of limits matches the bus inspection summary?", "o": ["Wiper-area chip: no more than 25 mm \u00b7 exhaust: no closer than 50 mm to wiring or fuel parts", "Wiper-area chip: no more than 50 mm \u00b7 exhaust: no closer than 25 mm to wiring or fuel parts", "Wiper-area chip: no more than 20 mm \u00b7 exhaust: no closer than 50 mm to wiring or fuel parts", "Wiper-area chip: no more than 25 mm \u00b7 exhaust: no closer than 100 mm to wiring or fuel parts"], "a": 0, "ex": "Summary \u2014 Windows: cracks or chips in any area swept by windshield wipers must not be greater than 25 millimetres in diameter (PDF p.50). Exhaust: no part of the exhaust system must be closer than 50 millimetres to wiring, any part of a fuel or brake component, or unshielded combustible material (PDF p.52).", "h": "One number is double the other.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection, PDF p.50"}, {"id": "W17", "q": "Which suspension statement matches the bus inspection summary?", "o": ["Shock absorbers must not show evidence of active fluid leakage", "A light film of fresh fluid on a shock absorber is acceptable", "Some play in ball joints is normal, so only the springs are checked", "U-bolts may be loose, provided the spring itself is not cracked"], "a": 0, "ex": "Summary \u2014 Suspension: no excessive play for ball joints, control arm pivots, wheel and axle bearings; springs, shackles, U-bolts etc. must not be loose, bent, cracked, broken, or missing; shock absorbers must not be loose, bent, disconnected, missing or damaged, or show evidence of active fluid leakage.", "h": "None of the parts may be \"a little\" bad.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection, PDF p.51"}, {"id": "W18", "q": "Which PARKING BRAKE statement matches the interior inspection summary?", "o": ["Fully applied with no foot, hand, or air force holding it, it holds the bus against the engine momentarily in reverse and low gear at light throttle", "Fully applied with no foot, hand, or air force holding it, it holds the bus against the engine for 10 seconds in neutral with the engine at idle", "Fully applied while you hold moderate foot force on the pedal, it holds the bus against the engine momentarily in reverse and low gear at light throttle", "Fully applied with no foot, hand, or air force holding it, it holds the bus against the engine momentarily in high gear at full throttle setting"], "a": 0, "ex": "Interior Inspection \u2014 Parking Brake: \"When fully applied and not held by foot or hand force or by hydraulic or air pressure, the parking brake must hold the vehicle stationary against the engine momentarily while the vehicle is operated in reverse gear and low forward gear at a light throttle setting\"; brakes are fully released in the \"off\" position.", "h": "Gear, throttle, and what holds it.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection: Interior Inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection: Interior Inspection, PDF p.53"}, {"id": "W19", "q": "Your bus is loaded to twice its empty weight and travelling at the same speed. Per the guide, it will take:", "o": ["About twice as long to stop", "About four times as long to stop", "About the same time, because of better traction", "Eight times as long to stop"], "a": 0, "ex": "When the weight is doubled, the force needed to stop is doubled, and it will take about twice as long to stop. A heavy vehicle, even though it has better traction, needs more time and distance to stop.", "h": "Only the weight changed, not the speed.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "W20", "q": "Which statement about traction and stopping is correct?", "o": ["Traction is greatest just before the wheels lock, and less once they skid", "Traction is greatest once the wheels lock, since rubber grips best while sliding", "A heavier vehicle has less traction, so it stops sooner", "Tire inflation has no effect on traction"], "a": 0, "ex": "There is the most traction just before all the wheels lock up and less traction when the wheels are skidding. Traction depends on road condition, tire contact, tire condition and inflation, and GVW.", "h": "Skidding is NOT gripping.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "W21", "q": "Braking time, after the brakes are applied, depends on which set of factors?", "o": ["Brake force, lining and drum condition, tire traction, and vehicle weight and speed", "Brake force, lining and drum condition, the driver's perception time, and speed", "Tire traction, vehicle weight and speed, and the driver's reaction time to the hazard", "Brake force, tire traction, engine size, and how long the driver took to react"], "a": 0, "ex": "Stopping distance \u2014 Braking time is the time it takes the vehicle to come to a complete stop after the brakes have been applied. It depends on the force applied to the brakes, the condition of the brake linings and drums, the traction of the tires on the road surface, and the vehicle weight and speed. Perception and reaction come BEFORE braking time.", "h": "The clock starts once the brakes are on.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "W22", "q": "For a SINGLE UNIT vehicle on the RIGHT side of the road, which hill-parking set is correct?", "o": ["Uphill no curb: right \u00b7 Uphill curb: left \u00b7 Downhill: right", "Uphill no curb: right \u00b7 Uphill curb: right \u00b7 Downhill: left", "Uphill no curb: left \u00b7 Uphill curb: left \u00b7 Downhill: right", "Uphill no curb: left \u00b7 Uphill curb: right \u00b7 Downhill: left"], "a": 0, "ex": "Downhill (with or without a curb): right. Uphill with a curb: left. Uphill without a curb: single unit vehicles turn right.", "h": "Only ONE situation turns the wheels left.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "W23", "q": "Which statement matches the guide's note on speeding?", "o": ["Speeding increases stopping distance, raising the risk to pedestrians with wheelchairs, children and the elderly", "Speeding increases following distance, raising the risk to cyclists, children and the elderly in a sudden, abrupt stop", "Speeding reduces stopping distance, because the brakes get hotter and grab harder in an abrupt stop", "Speeding increases stopping distance, but the guide says this matters only on wet, icy or snow-covered roads"], "a": 0, "ex": "Speeding increases stopping distance, putting pedestrians with wheelchairs, children and elderly persons at higher risk in an abrupt stop.", "h": "Two words decide it: which distance, and who.", "cat": "t9", "ch": "12 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "W24", "q": "Which combination follows the guide when pushing a wheelchair?", "o": ["Normal walking speed \u00b7 watch 3 m ahead and at the sides \u00b7 judge by the foot pedals", "Normal walking speed \u00b7 watch 3 m ahead and at the sides \u00b7 judge by the front of the seat", "Brisk walking speed \u00b7 watch 10 m ahead and at the sides \u00b7 judge by the foot pedals", "Normal walking speed \u00b7 watch 3 ft ahead only \u00b7 judge by the foot pedals"], "a": 0, "ex": "Normal walking speed; watch at least 3 m (10 ft) in front and along the sides; judge distances by the front of the foot pedals, not the seat.", "h": "Each wrong option changes just one part.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "W25", "q": "Which ORDER matches the guide's scooter procedure?", "o": ["Secure spot \u2192 power off \u2192 armrest/swivel \u2192 assist to seat \u2192 secure scooter", "Power off \u2192 secure spot \u2192 armrest/swivel \u2192 assist to seat \u2192 secure scooter", "Secure spot \u2192 power off \u2192 assist to seat \u2192 armrest/swivel \u2192 secure scooter", "Secure spot \u2192 armrest/swivel \u2192 power off \u2192 assist to seat \u2192 secure scooter"], "a": 0, "ex": "Manoeuvre to a secure spot, turn off the power, remove the armrest or swivel the seat, assist to the vehicle seat, secure the scooter.", "h": "Park it, shut it off, clear the way, move the person, then tie it down.", "cat": "t11", "ch": "14 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "W26", "q": "A 4-year-old weighing 17 kg rides in your taxi. Which is correct?", "o": ["You must ensure a car seat is properly installed and the child is secured in it", "The parent alone is responsible, so a properly fastened adult seat belt is enough", "A seat belt is enough, because the child is over 16 kg", "A car seat is needed only if the child is under 40 kg"], "a": 0, "ex": "The driver must ensure a child under 18 kg/40 lb has a car seat, properly installed, with the child properly secured.", "h": "Whose job is it, and is 17 under the line?", "cat": "t12", "ch": "15 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "W27", "q": "Which statement about emergency vehicle exemptions is correct?", "o": ["Red flashing lights alone do not exempt the driver from the Traffic Safety Act", "Red flashing lights alone give the same exemptions as the siren", "With the siren on, the driver no longer needs to consider the safety of other road users", "With the siren on, you may assume other drivers have seen you"], "a": 0, "ex": "Use of the red flashing lights alone does not exempt the driver from the Traffic Safety Act. Even in the most serious emergency, consider the safety of others; do not assume others have seen you.", "h": "Lights versus siren.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "W28", "q": "Approaching an intersection with cross traffic, lights and siren on. The guide says:", "o": ["Slow down, stop briefly if practical, make eye contact, go once you are seen", "Keep your speed, since the siren gives you the right-of-way at every intersection", "Slow down, sound the horn, and go through without stopping", "Stop, make eye contact, and go once the light turns green"], "a": 0, "ex": "Slow down and, if practical, stop briefly. Make eye contact with the other drivers and proceed when you have been seen by them.", "h": "Being seen is the signal to go.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "W29", "q": "Which pairing of emergency-vehicle exemption and what must be operating is correct?", "o": ["Park contrary to rules: flashing lights \u00b7 speed: siren \u00b7 right-of-way: siren", "Park contrary to rules: siren \u00b7 speed: siren \u00b7 right-of-way: flashing lights", "Park contrary to rules: siren \u00b7 speed: flashing lights \u00b7 right-of-way: siren", "Park contrary to rules: siren and lights \u00b7 speed: siren \u00b7 right-of-way: siren"], "a": 0, "ex": "Parking contrary to the rules: flashing lights operating. Speeding, passing a stop signal or sign, and right-of-way: siren operating. Red flashing lights alone do not exempt the driver.", "h": "Only one exemption works without the siren.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.110"}, {"id": "W30", "q": "Which list is EXACTLY the guide's grounds for refusing a customer?", "o": ["At maximum passengers, OR the passenger is offensive or dangerous", "At maximum passengers, offensive or dangerous, OR a trip under 2 km", "Offensive or dangerous ONLY; you may never refuse for passenger count", "At maximum passengers ONLY; offensive passengers must still be driven"], "a": 0, "ex": "You may refuse if the vehicle is already carrying the maximum allowed number of passengers, or a passenger is offensive or dangerous to you or others.", "h": "Exactly two, no more, no fewer.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "W31", "q": "Now and then you drive coworkers to a job site in your private car. They pay only for gas and parking. Under sections 23/25 this is:", "o": ["Not for hire, as straight reimbursement of out-of-pocket expenses", "For hire, because any payment at all makes it for hire", "Not for hire, but only if they also pay per km above the 7306 rate", "For hire, because coworkers are not family or household members"], "a": 0, "ex": "Not for hire when incidental/occasional in a private passenger vehicle and compensation is only straight out-of-pocket reimbursement such as gas, parking, gate passes and tolls.", "h": "Gas and parking are named.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "W32", "q": "Which pair are BOTH pre-driving procedures in the guide?", "o": ["Circle check \u00b7 lock the doors before you begin", "Circle check \u00b7 unlock the doors so passengers can exit fast", "Check seat belts work \u00b7 enter GPS at the first stop", "Park at a designated space \u00b7 close the door, then seat them"], "a": 0, "ex": "Pre-driving includes a circle check and locking the doors before you begin; GPS before starting; passenger seated before closing the door.", "h": "One half of each wrong pair is fine.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "W33", "q": "Which pair are BOTH on the Traffic Safety Act list of fined distractions?", "o": ["Personal grooming \u00b7 programming portable audio players", "Personal grooming \u00b7 a dispatch system for transporting passengers", "Reading printed materials \u00b7 a gauge for the vehicle's systems", "Texting \u00b7 a CB radio when escorting an oversized vehicle"], "a": 0, "ex": "Fined: grooming, programming audio players, reading printed materials, texting. Allowed: passenger dispatch systems, vehicle gauges, CB radios when escorting oversized vehicles.", "h": "One half of each wrong pair is allowed.", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "W34", "q": "Using a hand-held radio to warn others about a collision on the highway ahead:", "o": ["Could fall under the \"emergency\" scenario category", "Is always a fined distraction under the law", "Is allowed only for police and fire services", "Is allowed only after you stop in a legal place"], "a": 0, "ex": "The use of hand-held radios to communicate extreme weather or a hazard such as a collision could fall under the \"emergency\" scenario category.", "h": "The guide says the law is not about removing safety tools.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "W35", "q": "Which statement about fatigue matches the guide?", "o": ["Opening a window helps only for a short time; stop if you become sleepy on the road", "Opening a window prevents fatigue, so you can keep going if you become sleepy on the road", "Drive straight through rather than stay overnight, so you finish before you get tired", "Fatigue crashes happen mostly at low speeds, so slowing down removes most of the risk"], "a": 0, "ex": "Window, radio, coffee, gum and eating help only for short periods. Stop if you become sleepy. Stay overnight rather than driving straight through. Fatigue collisions typically occur at higher speeds.", "h": "Short-term fixes are not prevention.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "W36", "q": "Why does the guide say fatigue-related crashes are common in young drivers?", "o": ["They stay up late, sleep less than they should, and drive more often at night", "They drive alone more often, take medication, and drive long distances", "They are shift workers who drive commercial vehicles at night more often", "They drink more coffee, which wears off quickly during a long drive"], "a": 0, "ex": "Fatigue-related crashes are common in young drivers because they tend to stay up late, sleep less than they should, and drive more often at night.", "h": "Think about their habits.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "W37", "q": "At an uncontrolled crossing, which lights does a school bus use?", "o": ["Hazard lights; NOT the alternately flashing amber or red lights", "The alternately flashing red lights; NOT the hazard lights", "The alternately flashing amber lights, then the hazard lights", "No lights at all, so other drivers are not confused"], "a": 0, "ex": "Activate hazard lights. The alternately flashing amber or red lights must not be used for railway crossings.", "h": "Those lights mean something else to other drivers.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "W38", "q": "Before resuming travel across the tracks, how much wider than the rails is a train?", "o": ["About a metre wider on BOTH sides", "About a metre wider on one side only", "About 15 cm wider on both sides", "The same width as the rails"], "a": 0, "ex": "Make sure there is enough room on the other side for your entire vehicle. A train will be a metre wider than the rails on both sides.", "h": "More than you might guess, on each side.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "W39", "q": "Which ORDER matches the guide's basic steps for using any fire extinguisher?", "o": ["Remove from bracket \u2192 pull pin \u2192 approach from upwind \u2192 hold upright", "Pull pin \u2192 remove from bracket \u2192 approach from upwind \u2192 hold upright", "Remove from bracket \u2192 approach from upwind \u2192 pull pin \u2192 hold upright", "Remove from bracket \u2192 pull pin \u2192 approach from downwind \u2192 hold upright"], "a": 0, "ex": "Remove it from its bracket. Pull the safety pin, breaking the seal. Approach the fire from upwind if possible. Hold the extinguisher upright.", "h": "Get it out, arm it, then move in.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "W40", "q": "Which line matches PASS exactly?", "o": ["Pull the pin \u00b7 Aim low at the base \u00b7 Squeeze slowly and evenly \u00b7 Sweep side to side", "Pull the pin \u00b7 Aim high at the flames \u00b7 Squeeze slowly and evenly \u00b7 Sweep side to side", "Pull the pin \u00b7 Aim low at the base \u00b7 Squeeze hard and fast \u00b7 Sweep from the middle", "Point the nozzle \u00b7 Aim low at the base \u00b7 Spray in short bursts \u00b7 Sweep up and down"], "a": 0, "ex": "Pull the pin and point the nozzle away; Aim low at the base; Squeeze the handle slowly and evenly; Sweep side-to-side, starting at one side.", "h": "Low, slow, side to side.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "W41", "q": "Which ORDER matches the guide's propane fuelling steps?", "o": ["Attach hose \u2192 open bleeder valve \u2192 stop at mist \u2192 shut gauge and disconnect", "Open the bleeder valve \u2192 attach the hose \u2192 stop at mist \u2192 shut gauge and disconnect", "Attach hose \u2192 open bleeder valve \u2192 disconnect \u2192 stop at mist, shut gauge", "Attach hose \u2192 stop at mist \u2192 open bleeder valve \u2192 shut gauge and disconnect"], "a": 0, "ex": "Attach the hose, open the fixed-liquid level gauge (bleeder valve), end fuelling when mist discharges, shut off the gauge and disconnect the fill-line.", "h": "Connect, open, watch, close.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "W42", "q": "Compared with a flat multi-lane highway, which pairing of fuel savings is correct?", "o": ["Flat two-lane: 4\u201311% \u00b7 mountainous: up to 18% \u00b7 suburban: 25\u201335%", "Flat two-lane: 25\u201335% \u00b7 mountainous: as much as 18% \u00b7 suburban: 4\u201311%", "Flat two-lane: 4\u201311% \u00b7 mountainous: 25\u201335% \u00b7 suburban: up to 18%", "Flat two-lane: up to 18% \u00b7 mountainous: 4\u201311% \u00b7 suburban: 25\u201335%"], "a": 0, "ex": "A flat multi-lane highway improves fuel efficiency 4\u201311% vs a flat two-lane highway, up to 18% vs a mountainous highway, and 25\u201335% vs a suburban route.", "h": "The most similar route saves the least.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "W43", "q": "Which pairing from \"Caring for your vehicle\" is correct?", "o": ["Tires: manufacturer's recommendation, 1% fuel wasted per 10 psi under \u00b7 Post-trip: spot problems that could delay you next time", "Tires: maximum pressure on the sidewall, 1% fuel wasted per 10 psi under \u00b7 Post-trip: spot problems that could delay you next time", "Tires: manufacturer's recommendation, 10% fuel wasted per 1 psi under \u00b7 Post-trip: spot problems that could delay you next time", "Tires: manufacturer's recommendation, 1% fuel wasted per 10 psi under \u00b7 Post-trip: replaces the pre-trip inspection required by law"], "a": 0, "ex": "Inflate tires according to the manufacturer's recommendations; one per cent of fuel is wasted for each 10 psi of under-inflation. Perform a post-trip inspection to spot problems that could delay you next time; the pre-trip inspection is the law.", "h": "Check three things: the pressure source, the percentage-per-psi, and the post-trip purpose.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "W44", "q": "After a mechanical failure, your bus stops near a body of water and could still shift. Which is the BEST answer?", "o": ["Evacuate, starting with those nearest the door, to a safe location", "Keep everyone on board and seated so no one ends up near the water", "Evacuate, starting with those at the back, onto the roadway beside the bus", "Keep everyone on board until a tow truck arrives and stabilizes the bus"], "a": 0, "ex": "A bus near water or a precipice could still move and should be evacuated, with maximum safety. Evacuate starting with those nearest the door and send passengers to a safe location away from the bus.", "h": "Both where they start and where they go matter.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "W45", "q": "Which statement about being passed on a highway is NOT correct?", "o": ["A driver may pass you on the shoulder, right of the solid white line", "If the passer cuts in too quickly, slow down, and brake if necessary", "If the passer aborts and drops behind you, accelerate quickly to help", "During a safe pass, maintain or reduce speed and avoid accelerating"], "a": 0, "ex": "Under the law, a driver must not pass in a \"parking lane\", which includes the shoulder of a provincial highway to the right of the solid white line. Using the shoulder to pass is against the law.", "h": "One statement describes something illegal.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "W46", "q": "Which pairing of situation and action is correct when you are being passed?", "o": ["Safe pass: hold or ease speed \u00b7 cuts in: slow down \u00b7 aborts behind you: speed up", "Safe pass: hold or ease speed \u00b7 cuts in: speed up \u00b7 aborts behind you: slow down", "Safe pass: speed up a little \u00b7 cuts in: slow down \u00b7 aborts behind you: brake hard", "Safe pass: use the shoulder \u00b7 cuts in: slow down \u00b7 aborts behind you: speed up"], "a": 0, "ex": "Safe pass: maintain or reduce speed. Cuts in too quickly: slow down, braking if needed. Aborts and tries to get back behind you: accelerate quickly to let them in.", "h": "Each wrong set changes one action.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "W47", "q": "Which pairing of brake system and emergency technique is correct?", "o": ["ABS: steady firm pressure, no pumping \u00b7 No ABS: just before lock, ease off if wheels lock", "ABS: just before lock, ease off if wheels lock \u00b7 No ABS: steady firm pressure, no pumping", "ABS: steady firm pressure, no pumping \u00b7 No ABS: lock the wheels, then release fully", "ABS: pump the pedal if it vibrates \u00b7 No ABS: just before lock, ease off if wheels lock"], "a": 0, "ex": "ABS: steady firm pressure, do not pump or release (the vibration is normal). No ABS: threshold braking, just before the wheels lock; if they lock, release slightly, then press firmly again. In both cases, look and steer where you want to go.", "h": "One swap trap reverses the two systems.", "cat": "t28", "ch": "30 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "W48", "q": "Which is NOT part of the guide's procedure for merging onto a highway?", "o": ["If no gap appears, stop in the merge lane and wait for one", "Keep glancing at the gap you chose to adjust speed and timing", "Signal, then use mirrors and direct view to check the right lane", "Hold speed at or near that of traffic, then cancel your signal"], "a": 0, "ex": "Avoid reducing your speed abruptly or stopping when merging. The Driver's Guide adds that drivers behind expect you to keep moving, and if you slow or stop you may be hit from behind.", "h": "Which step would surprise the driver behind you?", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "W49", "q": "While merging onto a highway, which is the BEST way to make sure the merge is safe?", "o": ["Keep glancing at your chosen gap and adjust speed and timing", "Watch for the solid white line to end, then move over at once", "Slow well below traffic speed so a wider gap can open up for you", "Hold a steady speed and expect highway drivers to yield to you"], "a": 0, "ex": "The guide says to keep glancing at the gap you chose so you make the needed speed and timing adjustments. Crossing the white line alone is not enough, slowing abruptly is to be avoided, and neither side has the right-of-way.", "h": "Two distractors break a rule; one is only half the job.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "W50", "q": "Which ORDER is correct once you stop at a school bus stop?", "o": ["Secure bus \u2192 mirror and shoulder checks, traffic stopped \u2192 red lights \u2192 open door", "Red lights \u2192 secure bus \u2192 mirror and shoulder checks, traffic stopped \u2192 open door", "Secure bus \u2192 red lights \u2192 open door \u2192 mirror and shoulder checks, traffic stopped", "Mirror and shoulder checks, traffic stopped \u2192 open door \u2192 secure bus \u2192 red lights"], "a": 0, "ex": "Cancel the right signal and secure the bus (neutral or park, parking brake, keep pressure on the brake, every time). Do mirror and shoulder checks and verify traffic has stopped. Activate the red lights once the bus is secured, then open the door.", "h": "Make the bus safe before you signal and open.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "W51", "q": "Before pulling away from a school bus stop, which is NOT required?", "o": ["Leave the red lights on until you re-enter traffic", "Close all doors before the bus is moved", "Check all mirrors, including the cross over mirror", "Make sure all passengers are seated, except on transit"], "a": 0, "ex": "All doors must be closed and all passengers seated (standing is allowed on transit buses). Check all mirrors, including the cross over mirror. Turn off the flashing lights: closing the door automatically cancels the red lights.", "h": "What happens when the door closes?", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.109"}, {"id": "W52", "q": "Which plan is correct for a LATER exit on a two-lane roundabout?", "o": ["Left lane in \u00b7 left signal \u00b7 right signal after passing the exit before yours \u00b7 leave by the left lane", "Left lane in \u00b7 right signal \u00b7 left signal after passing the exit before yours \u00b7 leave by the left lane", "Left lane in \u00b7 left signal \u00b7 right signal after passing the exit before yours \u00b7 leave by the right lane", "Right lane in \u00b7 left signal \u00b7 right signal after passing the exit before yours \u00b7 leave by the right lane"], "a": 0, "ex": "Approach in the left lane, signal left, signal right after you pass the exit before yours, check for right-lane traffic continuing around, and exit using the left lane. Do not change lanes in the circle. Drivers on the right yield to drivers on the left. If you cannot exit safely, go around again.", "h": "You never change lanes inside the circle.", "cat": "t31", "ch": "33 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65"}, {"id": "W53", "q": "Which statement about medical fitness for commercial drivers is NOT correct?", "o": ["Only Class 1 and 2 drivers can be asked for a medical report", "A Registry Agent may request a report from any licensed driver", "A driver must report any condition that may affect safe driving", "A medical report is required to upgrade to a Class 4 licence"], "a": 0, "ex": "A Registry Agent may request a medical report from a driver who holds ANY class of licence, if they have concerns. Drivers are legally required to report any disease or disability that may interfere with safe driving, and a report is required to upgrade to Class 1, 2 or 4.", "h": "Who can a Registry Agent ask?", "cat": "t32", "ch": "34 \u00b7 Medical fitness & medical reports", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16"}, {"id": "W54", "q": "Which is NOT on the Chapter 4 list of documents commercial drivers are required to carry?", "o": ["The vehicle owner's manual", "Bill of Lading (if required)", "Permit Books (if required)", "Safety fitness certificates"], "a": 0, "ex": "Make sure you have documentation \u2014 commercial drivers are required to carry: Registration Certificate, Insurance Certificate, Vehicle Inspection Certificate, Bill of Lading (if required), Permit Books (if required), Pre-trip inspection form, Safety fitness certificates, Logbooks. Personal documents such as your licence and employer ID are also needed.", "h": "The two \"if required\" items are on it.", "cat": "t36", "ch": "35 \u00b7 Consequences & trip documents", "sec": "Make sure you have documentation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Make sure you have documentation, PDF p.56"}, {"id": "W55", "q": "Which statement about driving errors matches the Commercial Guide?", "o": ["Fixation is a recognition error; speed is a decision error", "Fixation is a decision error; speed is a recognition error", "Both are recognition errors, because the driver is not fully conscious of them", "Both are decision errors, arising from conscious factors the driver thinks are significant"], "a": 0, "ex": "Managing emotions and distractions: recognition errors (not fully conscious) include distraction, general inattention, and improper lookout (fixation). Decision errors (conscious factors the driver does not consider significant) include speed, risk taking, and failing to obey traffic control indicators. Both arise from the driver's mental or physical condition.", "h": "Aware or unaware?", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Managing emotions and distractions", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Managing emotions and distractions, PDF p.66"}, {"id": "W56", "q": "Which is the Commercial Guide's basic collision prevention formula, in order?", "o": ["Recognize the hazard \u00b7 Understand the defence \u00b7 Act in time", "React to the hazard \u00b7 Understand the defence \u00b7 Act in time", "Recognize the hazard \u00b7 Act in time \u00b7 Understand the defence", "Recognize the hazard \u00b7 Understand the risk \u00b7 React in time"], "a": 0, "ex": "Basic collision prevention formula: Recognize the hazard; Understand the defence; Act in time. Most people practise it subconsciously, but the process stops when the mind wanders or daydreams.", "h": "Check every word and the order.", "cat": "t39", "ch": "38 \u00b7 Defensive driving & avoiding hazards", "sec": "Defensive driving", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Defensive driving, PDF p.71"}, {"id": "W57", "q": "Which statement about commentary driving matches the Commercial Guide?", "o": ["With practice, silent but \"active\" observation is just as effective", "It must always be spoken aloud, or it gives no benefit", "It replaces the identify, predict, decide, execute steps", "It is useful only when an instructor is in the vehicle"], "a": 0, "ex": "Commentary driving: the driver verbalizes observations and interpretations; it builds awareness, develops visual skills, helps resist distractions, and (done aloud with an instructor) helps evaluation. It can be combined with identify, predict, decide, execute. \"With regular practice, 'real observation' will become habit... Silent but 'active' observation is just as effective for collision avoidance.\"", "h": "Does it always need to be out loud?", "cat": "t39", "ch": "38 \u00b7 Defensive driving & avoiding hazards", "sec": "Commentary driving", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Commentary driving, PDF p.72"}, {"id": "W58", "q": "Which pair of amber-light meanings matches the guide?", "o": ["Approaching: prepare to stop \u00b7 waiting in the intersection to turn left: clear the intersection", "Approaching: clear the intersection \u00b7 waiting in the intersection to turn left: prepare to stop", "Approaching: speed up to clear \u00b7 waiting in the intersection to turn left: stop and wait", "Approaching: prepare to stop \u00b7 waiting in the intersection to turn left: back up behind the line"], "a": 0, "ex": "Traffic Lights: approaching, \"an amber light should be treated as 'prepare to stop'\"; if already in the intersection waiting to turn left, \"the amber light means 'clear the intersection'.\"", "h": "It depends on where you are.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Traffic Lights", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Traffic Lights, PDF p.78"}, {"id": "W59", "q": "Which off-tracking pairing matches the guide?", "o": ["Low speed: rear tires pulled inward \u00b7 high speed: rear tires pulled outward", "Low speed: rear tires pulled outward \u00b7 high speed: rear tires pulled inward", "Low speed and high speed: rear tires pulled inward, more with a shorter wheelbase", "Low speed and high speed: rear tires pulled outward, by centrifugal force"], "a": 0, "ex": "Off-tracking: low or moderate speed turns pull the rear tires inward of the steering path (more with a longer wheelbase or tighter turn); high speed off-tracking is centrifugal (outward) force, pulling the rear tires outward.", "h": "Speed changes the direction.", "cat": "t41", "ch": "40 \u00b7 Surroundings, off-tracking & turns", "sec": "Off-tracking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Off-tracking, PDF p.81"}, {"id": "W60", "q": "Which set lists ONLY steps the guide gives for preparing to make a turn?", "o": ["Signal about 30 m ahead (urban) \u00b7 downshift (manual) \u00b7 scan left, centre, right, left", "Signal about 100 m ahead (urban) \u00b7 downshift (manual) \u00b7 scan left, centre, right, left", "Signal about 30 m ahead (urban) \u00b7 shift gears during the turn \u00b7 scan left, centre, right, left", "Signal about 30 m ahead (urban) \u00b7 downshift (manual) \u00b7 scan right, centre, left, right"], "a": 0, "ex": "Prepare to make the turn: signal approximately 30 m ahead in urban areas (100 m rural); reduce speed and downshift (manual); position in the proper lane; check right-of-way; scan left, centre, right and left again; check signals and signs. Never shift gears during the turn.", "h": "One detail is off in each wrong set.", "cat": "t41", "ch": "40 \u00b7 Surroundings, off-tracking & turns", "sec": "Making turns", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Making turns, PDF p.82"}, {"id": "W61", "q": "A school bus may make a U-turn only if ALL the guide's conditions apply. Which is NOT one of them?", "o": ["A spotter stands in the median to direct the bus", "The road is a four-lane divided highway", "The bus is shorter than the width of the median separating traffic", "The bus stops on the cross-road so no part projects over the traffic lanes"], "a": 0, "ex": "Special U-turn information for buses: a school bus cannot make a U-turn unless the road is a four-lane divided highway, the bus length is less than the median width, and the bus is stopped on the cross-road so no part projects over the traffic lanes on either side of the median. A spotter is not one of the conditions.", "h": "Three are about the road and the bus.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Special U-turn information for buses (Class 2 and Class 4)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special U-turn information for buses (Class 2 and Class 4), PDF p.93"}, {"id": "W62", "q": "Which ORDER matches the guide's steps for starting off in a manual transmission?", "o": ["Clutch down and ignition on \u2192 shift \u2192 foot brake \u2192 release park brake \u2192 clutch to friction point \u2192 accelerate", "Clutch down and ignition on \u2192 foot brake \u2192 release park brake \u2192 shift \u2192 clutch to friction point \u2192 accelerate", "Ignition on \u2192 release park brake \u2192 clutch down \u2192 shift \u2192 accelerate \u2192 clutch to friction point", "Clutch down and ignition on \u2192 shift \u2192 release park brake \u2192 foot brake \u2192 accelerate \u2192 clutch to friction point"], "a": 0, "ex": "To change gears: depress the clutch and turn the ignition on; shift into the appropriate gear; depress the foot brake; release the park brake; release the clutch to the friction point; move your foot from the brake to the accelerator and accelerate gradually; then take your left foot off the clutch completely. Do not ride the clutch.", "h": "The brake goes on before the park brake comes off.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Shifting gears, accelerating, decelerating", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Shifting gears, accelerating, decelerating, PDF p.93"}, {"id": "W63", "q": "Parallel parking a bus into a RIGHT spot, which plan matches the guide?", "o": ["Pull 1.5 unit lengths past \u00b7 walk around counter-clockwise \u00b7 lowest reverse \u00b7 first turn the wheel right", "Pull 1.5 unit lengths past \u00b7 walk around counter-clockwise \u00b7 lowest reverse \u00b7 first turn the wheel left", "Pull 1.5 unit lengths past \u00b7 walk around clockwise \u00b7 lowest reverse \u00b7 first turn the wheel right", "Pull 2 unit lengths past \u00b7 walk around counter-clockwise \u00b7 lowest reverse \u00b7 first turn the wheel right"], "a": 0, "ex": "To parallel park a bus to a right spot: drive forward until the front is 1.5 times the total unit length past the front of the parking lane; walk around counter-clockwise; select the lowest reverse gear; release the park brake and start reversing, turning the wheel to the right; then turn left at the right time to align, and straighten.", "h": "Check each of the four parts.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Reversing while parallel parking (bus)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing while parallel parking (bus), PDF p.92"}, {"id": "W64", "q": "Which set of tips for avoiding a collision with a vehicle on the SIDE matches the guide?", "o": ["Keep centred in the lane \u00b7 avoid dense traffic \u00b7 stay out of other vehicles' blind spots", "Hug the right edge of the lane \u00b7 avoid dense traffic \u00b7 stay out of other vehicles' blind spots", "Keep centred in the lane \u00b7 join dense traffic in convoy \u00b7 stay out of other vehicles' blind spots", "Keep centred in the lane \u00b7 avoid dense traffic \u00b7 ride beside other vehicles so they see you"], "a": 0, "ex": "Avoiding collision with a vehicle on the side: \"Manage space around your commercial vehicle by keeping it centred in the lane. Also, avoid traveling in dense traffic. Find an open spot to drive whenever possible... avoid driving in other vehicles' blind spots.\"", "h": "One part is off in each wrong set.", "cat": "t43", "ch": "42 \u00b7 Following, side & head-on collisions", "sec": "Avoiding collision with a vehicle on the side", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle on the side, PDF p.128"}, {"id": "W65", "q": "Other than passing, which is NOT one of the guide's four reasons a driver could be on the wrong side of the road?", "o": ["Following too closely behind a large vehicle", "A problem in their own lane, such as an animal", "A faulty manoeuvre from an error in judgement", "Centrifugal force on curves"], "a": 0, "ex": "The four reasons: a problem in their lane; faulty driving manoeuvres, usually from an error in judgement; centrifugal force on curves; and loss of control (wheel off the edge and overcompensating, loss of visibility, worn centre line, sleep, impairment, blowout, skid, poor roads or judgement).", "h": "Three are on the list; one is a different hazard.", "cat": "t43", "ch": "42 \u00b7 Following, side & head-on collisions", "sec": "Avoiding collision with an oncoming vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with an oncoming vehicle, PDF p.128"}, {"id": "W66", "q": "Which ORDER matches the guide's steps to avoid a head-on collision?", "o": ["Read the road ahead \u2192 ride to the right \u2192 reduce speed \u2192 drive off the road to the right", "Ride to the right \u2192 read the road ahead \u2192 drive off the road to the right \u2192 reduce speed", "Read the road ahead \u2192 reduce speed \u2192 pull to the left \u2192 drive off the road to the right", "Reduce speed \u2192 read the road ahead \u2192 ride to the right \u2192 pull to the left"], "a": 0, "ex": "To avoid a head-on collision: read the road ahead; ride to the right; reduce speed (horn and lights if needed); and if those three steps fail, drive off the road to the right. Never out-guess the other driver by pulling to the left.", "h": "Leaving the road is the last resort.", "cat": "t43", "ch": "42 \u00b7 Following, side & head-on collisions", "sec": "Avoiding collision with an oncoming vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with an oncoming vehicle, PDF p.129"}, {"id": "W67", "q": "Which two-person lift set matches the guide?", "o": ["Taller person behind \u00b7 front person removes armrests and folds footrests \u00b7 lift on three", "Taller person in front \u00b7 front person removes armrests and folds footrests \u00b7 lift on three", "Taller person behind \u00b7 back person removes armrests and folds footrests \u00b7 lift on three", "Taller person behind \u00b7 front person removes armrests and folds footrests \u00b7 lift on two"], "a": 0, "ex": "Two-person lift: move the passenger close to the exit and slide them onto an aisle seat; the taller person stands behind and the second in front, off to the side; the front person removes the armrests and folds the footrests; the back person grasps the wrists (or clasps hands across the chest); the front person lifts under the thighs and hips; lift together on a count of three.", "h": "Check all three parts.", "cat": "t44", "ch": "43 \u00b7 Collision steps, lifts & blanket drag", "sec": "Evacuating passengers with disabilities: two-person lift", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Evacuating passengers with disabilities: two-person lift, PDF p.134"}, {"id": "W68", "q": "In an emergency, which list matches what the guide says a bus driver should know about passengers with disabilities?", "o": ["Who can exit alone \u00b7 who can be removed from a wheelchair \u00b7 who must NOT be removed", "Who can exit alone \u00b7 who has a doctor's note \u00b7 who must NOT be removed from a wheelchair", "Who can exit alone \u00b7 who can be removed from a wheelchair \u00b7 who has paid the fare", "Who has an attendant \u00b7 who can be removed from a wheelchair \u00b7 who uses a scooter"], "a": 0, "ex": "Evacuating passengers with disabilities: the driver should know which passengers can come off the bus by themselves, which can be removed from their wheelchair, and which must not be removed from their wheelchair.", "h": "It is about abilities and limits.", "cat": "t44", "ch": "43 \u00b7 Collision steps, lifts & blanket drag", "sec": "Evacuating passengers with disabilities", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Evacuating passengers with disabilities, PDF p.134"}, {"id": "W69", "q": "You are in the LEFT lane of a two-lane circle and your exit is next. Which plan matches the Driver's Guide?", "o": ["Right signal after the exit before yours \u00b7 check the right lane \u00b7 go around again if you can't exit safely", "Right signal after the exit before yours \u00b7 move to the right lane \u00b7 then exit from the right lane", "Left signal until your exit \u00b7 check the right lane \u00b7 stop in the circle if you can't exit safely", "Right signal as you enter \u00b7 check the right lane \u00b7 exit across it whether or not it is clear"], "a": 0, "ex": "Exiting from the left lane: use your right signal when you pass the exit one before yours; check for traffic in the right lane that may be continuing around; look for pedestrians; exit using the left lane; if you cannot stop or exit safely, stay in your lane and travel around the circle again.", "h": "Patience beats a forced exit.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.63"}, {"id": "W70", "q": "Which ORDER matches the Driver's Guide for passing on a two-lane highway?", "o": ["Mirrors \u2192 shoulder check left \u2192 left signal \u2192 recheck oncoming \u2192 pass \u2192 car visible in inside mirror \u2192 shoulder check right \u2192 right signal \u2192 return", "Left signal \u2192 mirrors \u2192 shoulder check right \u2192 pass \u2192 car visible in outside mirror \u2192 shoulder check left \u2192 right signal \u2192 return", "Mirrors \u2192 left signal \u2192 pass \u2192 shoulder check left \u2192 car visible in outside mirror \u2192 right signal \u2192 shoulder check right \u2192 return", "Shoulder check left \u2192 pass \u2192 left signal \u2192 mirrors \u2192 car visible in inside mirror \u2192 right signal \u2192 return \u2192 shoulder check right"], "a": 0, "ex": "Check mirrors; shoulder check left; left signal; check again for oncoming traffic; pass without exceeding the speed limit; once the passed vehicle is visible in your inside rear view mirror, shoulder check right; right signal; return to your lane maintaining speed; signal off.", "h": "Look before you signal, and look again before you return.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Passing on a two-lane highway", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Passing on a two-lane highway, PDF p.74"}, {"id": "W71", "q": "Your wheels have left the pavement. Which set matches the Driver's Guide?", "o": ["Firm grip \u00b7 off the gas \u00b7 avoid braking (gradual if needed) \u00b7 check traffic \u00b7 return gradually", "Firm grip \u00b7 brake hard \u00b7 steer back at once \u00b7 check traffic \u00b7 return at speed", "Light, relaxed grip \u00b7 off the gas \u00b7 steer back at once \u00b7 avoid braking \u00b7 return gradually", "Firm grip \u00b7 keep accelerating \u00b7 avoid braking \u00b7 check traffic \u00b7 return sharply"], "a": 0, "ex": "Off-road recovery: keep a firm grip; do not try to steer back immediately; take your foot off the gas; try to avoid braking (if needed, gradual pressure); check for traffic; with controlled speed, return to the road gradually.", "h": "Slow and gradual wins here.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Off-road recovery", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Off-road recovery, PDF p.82"}, {"id": "W72", "q": "Which statement matches the Driver's Guide on idling?", "o": ["Turn the engine off if parked more than 10 seconds; one minute of idling is enough on a cold winter day", "Turn the engine off if parked more than 60 seconds; three minutes of idling is enough on a cold winter day", "Turn the engine off if parked more than 10 seconds; idling is the best way to warm the tires and steering", "Turn the engine off if parked more than 30 seconds; ten minutes of idling uses only a small sip of fuel"], "a": 0, "ex": "Ten seconds of idling can use more fuel than restarting; if parking for more than 10 seconds, turn off your engine. Idling does not warm tires, steering and other moving parts. According to Natural Resources Canada, one minute of idling on a cold winter day is enough.", "h": "Short on both counts.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Improving fuel efficiency", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Improving fuel efficiency, PDF p.95"}, {"id": "W73", "q": "Which set of fuel facts matches the Driver's Guide?", "o": ["Each 10 km/h above 90: about 10% more \u00b7 rapid acceleration: up to 40% more \u00b7 EnerGuide: L/100 km and annual cost", "Each 10 km/h above 90: about 40% more \u00b7 rapid acceleration: up to 10% more \u00b7 EnerGuide: L/100 km and annual cost", "Each 10 km/h above 90: about 10% more \u00b7 rapid acceleration: up to 40% more \u00b7 EnerGuide: km per litre and resale value", "Each 10 km/h above 100: about 10% more \u00b7 rapid acceleration: up to 50% more \u00b7 EnerGuide: L/100 km and annual cost"], "a": 0, "ex": "Every 10 km/h above 90 km/h burns about 10 per cent more fuel. Rapid acceleration and changes in speed can increase fuel consumption by as much as 40 per cent. The EnerGuide label shows litres per 100 km and estimated annual fuel cost.", "h": "Speed is the smaller number.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Improving fuel efficiency", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Improving fuel efficiency, PDF p.95"}, {"id": "W74", "q": "A SECOND IRS: WARN occurrence. Which set matches the Driver's Guide?", "o": ["15-day suspension \u00b7 7-day seizure \u00b7 Crossroads course \u00b7 $600 fine", "15-day suspension \u00b7 3-day seizure \u00b7 Crossroads course \u00b7 $600 fine", "30-day suspension \u00b7 7-day seizure \u00b7 Crossroads course \u00b7 $1,200 fine", "15-day suspension \u00b7 7-day seizure \u00b7 IMPACT program \u00b7 $600 fine"], "a": 0, "ex": "IRS: WARN second occurrence: 15 day immediate suspension, seven day vehicle seizure, Crossroads course (or Planning Ahead as an equivalent), and $600 fine plus 20 per cent. A 3-day seizure is the first occurrence; 30 days, IMPACT and $1,200 are the third.", "h": "Middle tier: check the seizure days.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "IRS: WARN", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, IRS: WARN, PDF p.114"}, {"id": "W75", "q": "Which statement about IRS: FAIL is TRUE?", "o": ["Its penalties apply with or without a criminal charge", "Its penalties apply only after a conviction in criminal court", "Refusing a breath demand is handled under IRS: WARN instead", "The 80 mg level is measured within four hours after driving"], "a": 0, "ex": "IRS: FAIL penalties \"are imposed with or without a criminal charge\"; a conviction adds more. It covers refusing a demand without reasonable excuse, and a BAC of 80 mg or more in 100 mL within TWO hours after driving.", "h": "Roadside, not courtroom.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "IRS: FAIL", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, IRS: FAIL, PDF p.115"}, {"id": "W76", "q": "A criminal-level impaired driving occurrence was on November 15, 2020, and the driver has NOT been convicted under the Criminal Code. Which interlock stream fits?", "o": ["The Alberta Administrative Licence Suspension Program stream", "The IRS: FAIL Interlock Ignition Program stream", "The Mandatory Interlock Ignition Program stream", "None; Alberta interlock programs only began on December 1, 2020"], "a": 0, "ex": "Three streams: IRS: FAIL (occurrence on or after December 1, 2020); Alberta Administrative Licence Suspension Program (on or before November 30, 2020); Mandatory (drivers convicted of impaired driving under the Criminal Code).", "h": "Check the date against the cut-over.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Ignition interlock program", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Ignition interlock program, PDF p.118"}, {"id": "W77", "q": "Which pairing matches the Driver's Guide?", "o": ["No signs/signals: yield to the vehicle on your right \u00b7 four-way stop: first to arrive goes first", "No signs/signals: first to arrive goes first \u00b7 four-way stop: always yield to the vehicle on your right", "No signs/signals: first to arrive goes first \u00b7 four-way stop: first to arrive goes first", "No signs/signals: yield to the vehicle on your left \u00b7 four-way stop: first to arrive goes first"], "a": 0, "ex": "Uncontrolled intersection (no signs, no signals): yield the right-of-way to a vehicle on your right. Three- and four-way stops (courtesy corners): the vehicle that arrived first proceeds first; if two arrive at the same time, the vehicle on the right goes first.", "h": "The two rules are different; one uses arrival order.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61"}, {"id": "W78", "q": "You are almost stopped at a red light. Which matches the Driver's Guide AND the Commercial Guide?", "o": ["Ease off the brake just before the stop, then apply it again", "Keep the same firm pressure all the way until you stop", "Press harder at the end so the vehicle stops on the line", "Release the brake fully and let the vehicle roll the rest of the way to a stop"], "a": 0, "ex": "Driver's Guide (PDF 52): to finish braking smoothly, release pressure on the brake pedal slightly and then reapply pressure just before you come to a stop. Commercial Guide (PDF 62): just before the stop, release the brakes to avoid a sudden jerk or rebound, then apply pressure again to hold the vehicle while stopped.", "h": "Both guides describe a small change right at the end.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.3 The Basics of Driving, Braking, PDF p.52"}, {"id": "W79", "q": "Your school bus is stopped beside the school grounds. Hazards are on and your mirrors look clear, but no one is outside. May you reverse?", "o": ["No: a responsible person must be outside at the rear giving direction", "Yes: hazards on and clear mirrors make reversing legal at this location", "Yes: the rule only covers the school grounds, not next to them", "No: reversing a school bus is NEVER allowed, even with a guide"], "a": 0, "ex": "It is illegal to reverse a school bus on school grounds, or at a location next to school grounds, unless there is a responsible person located outside at the rear of the bus giving direction.", "h": "Neither lights nor mirrors replace a person.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Restrictions on reversing a bus", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Restrictions on reversing a bus, PDF p.90"}, {"id": "W80", "q": "On a rural route you must turn the bus around. Which does the Commercial Guide ALLOW?", "o": ["Back into a side road on the right, if it cannot be done on private property", "Back across the highway into a side road on the left, as long as hazards are on", "Back onto the highway any time your mirrors show no traffic in either direction", "Nothing: a bus is NEVER allowed to do a turnaround on a two-lane highway"], "a": 0, "ex": "The only time a turnaround should ever be done on a two-lane highway is if it cannot be done on private property. Turnarounds are done by backing into a road on the right of the main roadway. Never back onto or across a highway.", "h": "Which side, and is there a better place first?", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Restrictions on reversing a bus", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Restrictions on reversing a bus, PDF p.90"}, {"id": "W81", "q": "Your ambulance reaches a collision on the highway. Where and how does the Commercial Guide say to park?", "o": ["Where it protects the injured and the attendant, flashing lights and headlights on", "On the shoulder well past the scene, flashing lights off so drivers are not distracted", "In the merge lane, so traffic can keep moving in all the through lanes", "Behind the scene with flashing lights only, headlights off to avoid glare"], "a": 0, "ex": "When reaching the scene of a collision, park the vehicle so it protects the injured person(s) and the attendant. Keep the flashing lights activated and turn on the headlights so the vehicle is clearly visible. While its flashing lights are operating, it may be parked contrary to parking rules where reasonable and safe.", "h": "Protection first, and be as visible as possible.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Ambulance at a collision scene", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Ambulance at a collision scene, PDF p.110"}, {"id": "W82", "q": "No signs, no signals. Which set matches the Driver's Guide?", "o": ["Yield to the right \u00b7 check left and right \u00b7 slow so you can
