ined distractions?", "o": ["Entering information on GPS units", "Using a dispatch system for transporting passengers", "Reading a gauge about the vehicle's systems", "Using a CB radio while escorting an oversized vehicle"], "a": 0, "ex": "Entering information on GPS units is on the fines list. Dispatch systems, vehicle-system gauges and CB radios when escorting oversized vehicles are allowed.", "h": "Three of these are on the \"allowed\" list.", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V97", "q": "The distracted driving law applies to:", "o": ["All vehicles as defined in the Traffic Safety Act, including bicycles and farm vehicles", "Only commercial vehicles that are defined in the Traffic Safety Act", "All motor vehicles defined in the Traffic Safety Act, but not bicycles", "Cars, trucks and motorcycles, but not farm vehicles or motor homes"], "a": 0, "ex": "It applies to all vehicles as defined in the TSA: cars, motorcycles, motor homes, truck tractors, farm vehicles, and bicycles.", "h": "Wider than you might think.", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V98", "q": "Two-way or hand-held (CB) radios are NOT specifically restricted when:", "o": ["Escorting oversized vehicles, contacting your employer, or in search, rescue and emergency management", "Escorting oversized vehicles, contacting your family, or in search, rescue and emergency management", "Contacting your employer, chatting with other drivers, or in search, rescue and emergency management", "Escorting any vehicle, contacting your employer, or reporting traffic to a radio station"], "a": 0, "ex": "Allowed: two-way or hand-held radios (CB) when escorting oversized vehicles, to contact one's employer, or in search, rescue, and emergency management situations.", "h": "Each wrong option swaps one part.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V99", "q": "A GPS navigation system is a permitted display screen as long as it is:", "o": ["Affixed to the vehicle and programmed before you begin driving, or voice activated", "Held in your hand and programmed before you begin driving, or voice activated", "Affixed to the vehicle and programmed only at red lights, or voice activated", "Affixed to the vehicle and programmed while moving slowly, or voice activated"], "a": 0, "ex": "GPS: as long as it is affixed to the vehicle and programmed before you begin driving or is voice activated. You cannot hold the unit or manually enter information while driving.", "h": "Where it is, and when it is set up.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V100", "q": "Dispatch computers, like those used in taxicabs, can be:", "o": ["Installed and activated, but drivers should not type into them while driving", "Installed and activated, and used to type short messages at low speed", "Installed, but they must stay switched off while the taxi is in service", "Used only by a passenger, never by the driver, while the taxi is in motion"], "a": 0, "ex": "Drivers using dispatch systems can still have mobile data computers installed and activated. Drivers should not type information into these devices while driving.", "h": "Present is fine; typing is the problem.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "V101", "q": "Tour bus drivers who want to give information to passengers should:", "o": ["Use hands-free units or other technology that complies with the law", "Hold a microphone, but only on straight and level roads", "Ignore the law, since tour buses are exempt from it", "Use any device, as long as the bus moves at a slow speed"], "a": 0, "ex": "Tour bus drivers must comply with the law and must not drive distracted. Hands-free units are available to ensure compliance.", "h": "Tour buses are NOT exempt.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "V102", "q": "Which is NOT a permitted display screen for commercial drivers?", "o": ["A video entertainment display visible to the driver", "A gauge or system with information about the vehicle's systems", "A dispatch system for transporting passengers", "A logistics tracking system that tracks driver status"], "a": 0, "ex": "Permitted: GPS (affixed and programmed or voice activated), vehicle system/location gauges, passenger dispatch systems, logistical tracking systems. Video entertainment displays are on the fines list.", "h": "One of these is from the fines list.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V103", "q": "According to the guide, drowsy driving is:", "o": ["As dangerous as impaired driving", "Less dangerous than impaired driving", "Dangerous only between 2 and 6 a.m.", "Only dangerous for teenage drivers"], "a": 0, "ex": "Drowsy driving is as dangerous as impaired driving because it slows reaction time, decreases awareness and can impair judgement.", "h": "Compare it with alcohol or drugs.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V104", "q": "Which does the guide call one of the MOST common causes of drowsy driving (not just an \"other contributing factor\")?", "o": ["Lack of sleep", "Driving alone", "Driving through the night", "Taking medication that increases sleepiness"], "a": 0, "ex": "Lack of sleep is one of the most common causes. Other contributing factors: driving alone, long distances without breaks, driving through the night, medication, alcohol.", "h": "The others are listed after \"Other contributing factors\".", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V105", "q": "Most fatigue-related collisions happen between:", "o": ["1\u20134 p.m. and 2\u20136 a.m.", "2\u20136 p.m. and 1\u20134 a.m.", "1\u20134 a.m. and 2\u20136 p.m.", "12\u20133 p.m. and 3\u20136 a.m."], "a": 0, "ex": "Most fatigue-related collisions happen between 1 - 4 p.m. and early in the morning between 2 - 6 a.m.", "h": "The afternoon window is the shorter one.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V106", "q": "To prevent fatigue, schedule a break every:", "o": ["Two hours or every 160 km", "Two hours or every 200 km", "Three hours or every 160 km", "Four hours or every 100 km"], "a": 0, "ex": "Schedule a break every two hours or every 160 km. Stretch or take a walk.", "h": "Check both the time and the distance.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V107", "q": "The guide suggests a nap of how long, and when?", "o": ["20\u201340 minutes, mid-afternoon", "40\u201360 minutes, mid-afternoon", "20\u201340 minutes, after midnight", "10\u201320 minutes, mid-morning"], "a": 0, "ex": "Take a mid-afternoon break. Have a 20-40 minute nap.", "h": "Check both the length and the time of day.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V108", "q": "Which helps reduce fatigue ONLY for a short period of time?", "o": ["Drinking coffee", "Getting plenty of sleep the night before a long trip", "Travelling with an awake and alert passenger", "Scheduling a break every two hours"], "a": 0, "ex": "Turning up the radio, opening a window, drinking coffee, chewing gum, or eating help only for short periods; the other actions help prevent fatigue.", "h": "A quick fix, not prevention.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V109", "q": "Which is NOT one of the guide's warning signs of driver fatigue?", "o": ["Feeling hungry before a meal break", "Yawning", "Drifting between lanes, tailgating or missing traffic signs", "A vehicle in the mirror that seemed to appear out of nowhere"], "a": 0, "ex": "Warning signs: yawning; eyes/head; wandering thoughts; not remembering the last kilometres; drifting, tailgating, missing signs; a vehicle appearing out of nowhere in the mirror.", "h": "Three are signs your body or attention is fading.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V110", "q": "Which group is NOT named as most at risk of falling asleep at the wheel?", "o": ["Retired drivers over 65", "Shift workers", "Commercial drivers", "People with untreated sleep disorders"], "a": 0, "ex": "Most at risk: shift workers, commercial drivers, people with untreated sleep disorders, teenagers, and young adults.", "h": "The guide talks about young drivers, not older ones.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V111", "q": "If there is a STOP sign at a railway crossing, stop the vehicle:", "o": ["No closer than 5 m and no further than 15 m from the nearest rail", "No closer than 15 m and no further than 50 m from the nearest rail", "No closer than 5 m and no further than 50 m from the nearest rail", "No closer than 3 m and no further than 15 m from the nearest rail"], "a": 0, "ex": "If there is a stop sign, stop no closer than five metres and no further than 15 metres (about 49 feet) from the nearest rail.", "h": "Five and fifteen.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V112", "q": "When a train is approaching a crossing, all drivers must stop no closer than ______ from the nearest rail.", "o": ["5 metres (about 16 feet)", "15 metres (about 49 feet)", "5 feet (about 1.5 metres)", "50 metres (about 164 feet)"], "a": 0, "ex": "Stop the vehicle no closer than five metres back (about 16 feet) from the nearest rail.", "h": "Check the unit.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V113", "q": "If a train is seen within what distance of the crossing, you must stop even if no signal is activated?", "o": ["500 metres", "50 metres", "150 metres", "1,000 metres"], "a": 0, "ex": "If a train is observed within 500 metres of the crossing, regardless of whether a signal is activated, the vehicle must be stopped.", "h": "Half a kilometre.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V114", "q": "Which vehicle is NOT required by law to stop at every uncontrolled railway crossing?", "o": ["A taxi carrying four passengers", "A school bus", "A vehicle carrying explosive substances as cargo", "A vehicle used for carrying flammable liquids and gas"], "a": 0, "ex": "At uncontrolled crossings the law requires a school bus, a vehicle carrying explosives, or one used for flammable liquids and gas to stop 5\u201315 m from the nearest rail.", "h": "Passengers alone do not trigger it; school children do.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V115", "q": "Which reason is NOT given for why crossings are especially hazardous for commercial vehicles?", "o": ["Heavier vehicles are less likely to be pushed off the tracks", "Longer vehicles need more time to clear a crossing", "Heavier vehicles need more time and room to stop", "Larger vehicles are more likely to derail a train"], "a": 0, "ex": "Longer vehicles need more time to clear; heavier ones need more time and room to stop; larger ones are more likely to derail a train.", "h": "One option turns weight into an advantage.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V116", "q": "While crossing railway tracks, shifting gears is:", "o": ["Prohibited, so use a gear you will not need to change", "Allowed, if the engine is about to stall on the tracks", "Required, to gain speed so you clear the tracks faster", "Allowed, as long as you do it before the second rail"], "a": 0, "ex": "Drive across in a gear that will not need to be changed. Shifting gears is prohibited while crossing the tracks.", "h": "It is against the law.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V117", "q": "You have started across and the crossing lights begin to flash. You should:", "o": ["Keep going, because it is safer than backing up", "Stop on the tracks and wait for the train to pass", "Back up, because it is safer than continuing", "Stop, then reverse once the gate starts lowering"], "a": 0, "ex": "If the crossing lights begin to flash after starting, keep going. It is safer to continue than to back up.", "h": "You are already committed.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V118", "q": "At night, at an uncontrolled RURAL crossing, a train crossing in front of you may appear as:", "o": ["A black, dark object against the dark road", "A row of bright lights against the dark road", "A flashing amber light low to the ground", "A grey shadow, but only in fog or smoke"], "a": 0, "ex": "A train may appear like a black, dark object against the background of a dark road.", "h": "You may not see lights at all.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V119", "q": "Which is NOT a reason to pay extra attention at RURAL railway crossings?", "o": ["Approach grades tend to be flatter", "Snow banks may be higher", "Brush and trees may be more common", "There tend to be fewer automated warning systems"], "a": 0, "ex": "Rural: approach grades may be steeper, snow banks higher, brush and trees more common, fewer automated warnings, rough or uneven crossings.", "h": "One option flips a word.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V120", "q": "Your vehicle stalls on a crossing and a train is coming. After getting out, move away from the track:", "o": ["Toward the oncoming train", "Away from the oncoming train", "Straight back the way you came", "Ahead, the way you were going"], "a": 0, "ex": "Move away from the track toward the oncoming train. This reduces the chance of being struck by flying debris.", "h": "Debris flies the way the train is moving.", "cat": "t21", "ch": "21 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V121", "q": "A fire starts on your bus. Get the passengers off and to a safe spot at least:", "o": ["35 metres (115 feet) from the vehicle", "30 metres (100 feet) from the vehicle", "35 feet (11 metres) from the vehicle", "50 metres (164 feet) from the vehicle"], "a": 0, "ex": "Get your passengers off the bus and to a safe spot at least 35 metres (115 feet) from the vehicle.", "h": "Not the warning-device distance.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V122", "q": "Depending on its type and size, a fire extinguisher gives only about how much chemical discharge?", "o": ["Eight to ten seconds", "Eighteen to twenty seconds", "Thirty to forty seconds", "Two to three minutes"], "a": 0, "ex": "You will have only eight to ten seconds of chemical discharge.", "h": "Very short.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V123", "q": "In PASS, the \"A\" means:", "o": ["Aim low, at the base of the fire", "Aim high, at the top of the flames", "Aim at the middle of the fire", "Aim at the thickest smoke"], "a": 0, "ex": "Aim low and direct the extinguisher at the base of the fire.", "h": "Fuel is at the bottom.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V124", "q": "In PASS, how do you \"Sweep\"?", "o": ["Side to side, starting at one side of the fire", "Side to side, starting in the middle of the fire", "Up and down, starting at the base of the fire", "In circles, starting at the outer edge of the fire"], "a": 0, "ex": "Sweep from side-to-side. Start at one side of the fire and slowly work to the other side. Do not start in the middle.", "h": "The guide says where NOT to start.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V125", "q": "When using a fire extinguisher, approach the fire:", "o": ["From upwind, if possible", "From downwind, if possible", "From whichever side is closest", "From the side with the most smoke"], "a": 0, "ex": "Approach the fire from upwind if possible.", "h": "Keep the smoke and heat blowing away from you.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V126", "q": "To prevent sparks from static electricity when refuelling:", "o": ["Touch the fuel nozzle to the filler pipe before filling", "Touch the fuel nozzle to the filler pipe after filling", "Touch the vehicle body with your hand before filling", "Keep the engine running while you fill the tank"], "a": 0, "ex": "Touch the fuel hose nozzle against the filler pipe of the vehicle tank before filling to ground it.", "h": "Before or after?", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V127", "q": "Why does the guide say all brakes must be fully released while moving?", "o": ["Dragging brakes can ignite grease in the hubs when the vehicle stops", "Dragging brakes can ignite fuel in the tank while the vehicle moves", "Dragging brakes make soft tires build heat and burst into flames", "Dragging brakes only wear the pads; they are not a fire risk"], "a": 0, "ex": "Dragging brakes generate heat that can ignite grease in the hubs when the vehicle stops.", "h": "Which part has grease?", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V128", "q": "Which is NOT one of the guide's fire prevention tips?", "o": ["Keep the engine running when refuelling, to avoid a restart spark", "Never start a vehicle with a fuel leak", "Check your tire pressure often, as soft tires build heat", "Do not smoke near the fuelling areas"], "a": 0, "ex": "Tips: never start with a fuel leak; shut off the engine when refuelling; ground the nozzle; no smoking; check tire pressure; brakes fully released.", "h": "One option reverses a tip.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V129", "q": "After using a fire extinguisher, you should:", "o": ["Replace the pin, store it, note it on the post-trip inspection, and recharge or replace it immediately", "Replace the pin, store it, note it on the post-trip inspection, and recharge it at the next annual check", "Store it, note it on the pre-trip inspection, and recharge or replace it immediately", "Throw it away, note it on the post-trip inspection, and buy a new one within 30 days"], "a": 0, "ex": "Replace the safety pin, return it to storage, note on the post-trip inspection that it was used, and have it recharged immediately or replaced.", "h": "When, and which inspection report?", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V130", "q": "In most commercial vehicles, portable fire extinguishers are carried:", "o": ["In the driver's compartment", "At the rear emergency exit", "In the luggage compartment", "Under the front passenger seat"], "a": 0, "ex": "Portable fire extinguishers are carried in the driver's compartment in most commercial vehicles.", "h": "Within reach of the driver.", "cat": "t22", "ch": "22 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V131", "q": "Who can refuel a propane vehicle or container?", "o": ["Only people with the proper certification or training", "Any driver holding a Class 4 or higher licence", "Any fuel station attendant on duty", "The driver, as long as no passengers are on board"], "a": 0, "ex": "Only people with the proper certification or training can refuel a propane vehicle or container.", "h": "A special qualification.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V132", "q": "When refuelling propane, ensure nothing that could ignite is within:", "o": ["Three metres (10 feet) of the dispenser or container", "Ten metres (30 feet) of the dispenser or container", "Three feet (1 metre) of the dispenser or container", "Thirty metres (100 feet) of the dispenser or container"], "a": 0, "ex": "Ensure there is nothing that could ignite within three metres (10 feet) of the dispenser or container being filled.", "h": "Check the unit.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V133", "q": "After properly attaching the filling hose to a propane tank, you open the:", "o": ["Fixed-liquid level gauge (bleeder valve)", "Magnetic float gauge (bleeder valve)", "Fixed-liquid level gauge (pressure relief valve)", "Fill-line shut-off (bleeder valve)"], "a": 0, "ex": "Properly attach the filling hose, then open the fixed-liquid level gauge (bleeder valve).", "h": "Two gauges are named; only one is opened.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V134", "q": "While fuelling propane, you know fuelling should END when:", "o": ["Liquid propane mist discharges from the liquid level gauge", "Propane vapour hisses from the pressure relief valve", "The magnetic float gauge first starts to move", "The dispenser pump clicks off on its own"], "a": 0, "ex": "When the fuel level reaches the maximum permitted, liquid propane in the form of a mist will be discharged from the liquid level gauge. Fuelling should now end.", "h": "Watch the valve you opened.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V135", "q": "When the propane tank is filled to capacity, the total capacity of the tank is approximately:", "o": ["80 per cent", "90 per cent", "100 per cent", "60 per cent"], "a": 0, "ex": "The magnetic float gauge should show the tank is filled to capacity. The total capacity of the tank is approximately 80 per cent.", "h": "Room is left for expansion.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V136", "q": "Which is NOT a step in the guide's propane fuelling procedure?", "o": ["Keep electrical accessories on so the float gauge can be read", "Wear protective gloves and clothing, such as long sleeve shirts", "Properly attach the filling hose to the vehicle's fuel tank", "Shut off the fixed level gauge and disconnect the fill-line"], "a": 0, "ex": "Engine and electrical accessories must be switched off during propane fuelling.", "h": "One option reverses a rule.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V137", "q": "Why should you NOT repeatedly enter and exit the vehicle while fuelling?", "o": ["It can cause static build-up and a spark at the fuel nozzle", "It lets fuel vapour build up inside the cab and the cargo area", "It resets the pump and the fuel may overflow from the tank", "It drains the battery while the electrical accessories are off"], "a": 0, "ex": "Repeatedly entering and exiting can cause static build-up that can cause a static spark when handling the fuel nozzle.", "h": "Think about sliding across a seat.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Fuelling a vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuelling a vehicle, PDF p.138"}, {"id": "V138", "q": "Buses, school buses and taxis should be fuelled:", "o": ["Only when no passengers are on board", "With passengers on board, if the engine is off", "Only by a station attendant, never the driver", "With passengers on board, if no one is smoking"], "a": 0, "ex": "Vehicles such as a bus, school bus, or taxi should not be fuelled when passengers are on board. Have enough fuel before picking them up.", "h": "Plan ahead before pick-up.", "cat": "t23", "ch": "23 \u00b7 Fuelling & propane", "sec": "Fuelling a vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuelling a vehicle, PDF p.138"}, {"id": "V139", "q": "Nearly what share of all greenhouse gas emissions in Canada come from the road transportation sector?", "o": ["30 per cent", "13 per cent", "50 per cent", "3 per cent"], "a": 0, "ex": "Nearly 30 per cent of all greenhouse gas emissions in Canada are produced by the road transportation sector.", "h": "About a third.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.138"}, {"id": "V140", "q": "To be fuel efficient, the guide says to maximize your payload by trying to reach:", "o": ["80 or 90 per cent capacity, instead of 60 per cent", "60 per cent capacity, instead of 80 or 90 per cent", "70 or 80 per cent capacity, instead of 50 per cent", "100 per cent capacity, even above the legal weight"], "a": 0, "ex": "Instead of 60 per cent capacity, try to achieve 80 or 90 per cent capacity.", "h": "Fuller is better, within the rules.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.139"}, {"id": "V141", "q": "Driving on snow-covered roads can increase fuel consumption by:", "o": ["15 to 20 per cent", "4 to 11 per cent", "25 to 35 per cent", "5 to 10 per cent"], "a": 0, "ex": "Driving on snow-covered roads can increase fuel consumption by 15 to 20 per cent.", "h": "Two of the wrong ranges are route comparisons.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.139"}, {"id": "V142", "q": "How much fuel is wasted by tire under-inflation?", "o": ["One per cent for each 10 psi of under-inflation", "Ten per cent for each 1 psi of under-inflation", "One per cent for each 1 psi of under-inflation", "Five per cent for each 10 psi of under-inflation"], "a": 0, "ex": "One per cent of fuel is wasted for each 10 pounds per square inch of under inflation.", "h": "Small loss, big pressure drop.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V143", "q": "For warm-up, the guide says:", "o": ["About five minutes of idling is adequate; do not increase engine speed", "About five minutes of idling is adequate, at a raised engine speed", "About fifteen minutes of idling is needed; do not increase engine speed", "No idling is needed; drive off right away at full throttle"], "a": 0, "ex": "When warming up do not increase the engine speed. Five minutes of idling is generally adequate.", "h": "Short and gentle.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V144", "q": "Practise progressive gear shifting at approximately:", "o": ["1600 rpm", "2000 rpm", "1200 rpm", "The maximum governed rpm"], "a": 0, "ex": "Practise progressive gear shifting at approximately 1600 rpm. (New engines: downshift about 1200, up-shift about 1600 rather than 2000.)", "h": "Before the old shift point.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.141"}, {"id": "V145", "q": "During a trip, check gauges, tires, and cargo every:", "o": ["Three hours", "Two hours or every 160 km", "Four hours", "Hour"], "a": 0, "ex": "Continually monitor your vehicle's condition: check gauges, tires, and cargo every three hours.", "h": "Not the fatigue-break rule.", "cat": "t24", "ch": "24 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V146", "q": "With new engine designs, the guide says you can downshift at about:", "o": ["1200 rpm", "1600 rpm", "2000 rpm", "900 rpm"], "a": 0, "ex": "You can downshift at about 1200 rpm and up-shift at about 1600 rpm, rather than 2000 rpm.", "h": "Lowest of the three shift numbers.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V147", "q": "With new engine designs, you can up-shift at about 1600 rpm rather than:", "o": ["2000 rpm", "1200 rpm", "1800 rpm", "2400 rpm"], "a": 0, "ex": "Up-shift at about 1600 rpm, rather than 2000 rpm.", "h": "The old, higher shift point.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V148", "q": "Generally, how much more fuel do you use when driving faster?", "o": ["10 per cent more for every 10 km/h over 90 km/h", "10 per cent more for every 10 km/h over 100 km/h", "5 per cent more for every 10 km/h over 90 km/h", "10 per cent more for every 20 km/h over 90 km/h"], "a": 0, "ex": "Generally, for every 10 km/h over 90 km/h you use 10 per cent more fuel.", "h": "Check the baseline speed.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V149", "q": "Driving at 70 km/h requires a stopping distance of about:", "o": ["300 feet (90 metres)", "300 metres (900 feet)", "90 feet (30 metres)", "200 feet (60 metres)"], "a": 0, "ex": "Driving at 70 km/h requires a stopping distance of about 300 feet (90 metres).", "h": "Watch feet vs metres.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Safe stopping", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Safe stopping, PDF p.142"}, {"id": "V150", "q": "For light conditions, the guide says to:", "o": ["Wear sunglasses in bright conditions and reduce speed in poor light", "Wear sunglasses in poor light and reduce speed in bright conditions", "Use high beams in bright conditions and reduce speed in poor light", "Keep your normal speed in poor light but use your four-way flashers"], "a": 0, "ex": "Light: adjust your driving based on visibility. Wear sunglasses in bright conditions and reduce speed in poor light conditions.", "h": "One option swaps the two halves.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V151", "q": "The guide's posture tip says to adjust your seat for comfort, alertness, visibility, and:", "o": ["Access to controls", "Maximum leg room only", "Easy entry and exit", "Mirror placement only"], "a": 0, "ex": "Posture: keep your seat adjusted to the correct position for comfort, alertness, visibility, and access to controls.", "h": "Reaching what you need.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V152", "q": "For traffic, the guide says to:", "o": ["Travel at the same speed as other traffic, staying within the speed limit", "Travel at the same speed as other traffic, even above the speed limit", "Travel well below the speed of other traffic to save fuel", "Pass slower traffic whenever possible to keep a constant speed"], "a": 0, "ex": "Traffic: try to travel at the same speed as other traffic, staying within the speed limit. Be considerate and give way to other drivers.", "h": "Match the flow, but within the rules.", "cat": "t25", "ch": "25 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V153", "q": "Your bus is stopped on the highway after a collision, just around a curve where traffic cannot see it from 300 m. What is the BEST action?", "o": ["Evacuate passengers to a safe location away from the bus", "Keep passengers seated on the bus and wait for the police", "Keep passengers on the bus and turn on the hazard lights", "Let each passenger decide whether to stay on or get off"], "a": 0, "ex": "A stopped position without 300 m of visibility, such as just over a hill or around a curve, is a sufficient reason to evacuate. Passengers go to a safe location away from the bus.", "h": "Ask where the danger is: on the bus or off it.", "cat": "t26", "ch": "26 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V154", "q": "After a breakdown, which stopping position is NOT, by itself, a listed reason to evacuate the bus?", "o": ["On a straight, level shoulder visible from 500 m", "Just over the crest of a hill, out of sight of traffic", "Immediately next to railroad tracks, out of a train's path", "Near a body of water, where the bus could still move"], "a": 0, "ex": "The guide lists: in the path of a train or next to railroad tracks; a position that may change (near water or a precipice); and a position not visible for 300 m (over a hill, around a curve).", "h": "Which spot is easy for traffic to see?", "cat": "t26", "ch": "26 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V155", "q": "When passengers must be evacuated, the guide's objective is to get them off the vehicle:", "o": ["Safely, in the shortest time possible, in an orderly fashion", "Quickly, back rows first, so the aisle clears from the rear", "Only after police or fire crews arrive to direct the evacuation", "As fast as possible, even if passengers push past each other"], "a": 0, "ex": "Always evacuate starting with those nearest the door. The objective is to get passengers off safely, in the shortest time possible, in an orderly fashion.", "h": "Speed matters, but so do two other things.", "cat": "t26", "ch": "26 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V156", "q": "Another vehicle is passing you on a highway and the pass appears safe. What should you do with your lane position?", "o": ["Keep to the centre of your lane or slightly to the right", "Move partly onto the shoulder to give the passer more room", "Move to the left side of your lane so you stay visible", "Move right of the solid white line until the pass is done"], "a": 0, "ex": "Maintain your lane position, either in the centre of the lane or slightly to the right, to give the passing vehicle extra clearance. The Driver's Guide (printed p.72) also says to stay in your lane and move to the right side of it on a two-lane highway.", "h": "Stay in your lane.", "cat": "t27", "ch": "27 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V157", "q": "While a safe pass is being made around you, what should you do with your speed?", "o": ["Maintain or reduce it, and avoid accelerating", "Speed up slightly to close the gap behind the passer", "Brake hard right away so the passer can cut in sooner", "Hold your speed, but accelerate if the passer is slow"], "a": 0, "ex": "Maintain or reduce your speed; avoid a tendency to accelerate.", "h": "Don't make the pass longer.", "cat": "t27", "ch": "27 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V158", "q": "A vehicle passing you gives up the pass and tries to get back in line BEHIND you. What do you do FIRST?", "o": ["Accelerate quickly so they can pull back in", "Brake hard so they can pull back in ahead of you", "Hold your speed and let them sort out the gap", "Move onto the shoulder so they can get past you"], "a": 0, "ex": "If the passing vehicle tries to abort the pass and get back in line behind you, accelerate quickly to let them pull back into the lane safely.", "h": "They need space behind you, not in front.", "cat": "t27", "ch": "27 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V159", "q": "The vehicle that just passed you cuts back in too quickly. What is the BEST response?", "o": ["Slow down for a safe following distance, braking if needed", "Speed up to stay close so others don't cut in", "Sound the horn and keep driving at the same speed", "Move to the left of your lane and pass them back"], "a": 0, "ex": "If the passing vehicle cuts in too quickly, slow down to keep a safe following distance. Depending on the situation, braking may be needed.", "h": "Rebuild your space cushion.", "cat": "t27", "ch": "27 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V160", "q": "In a vehicle WITHOUT ABS, pressing firmly on the brake pedal to the point just before the wheels lock is called:", "o": ["Threshold braking", "Controlled pumping", "Cadence braking", "Lock-up braking"], "a": 0, "ex": "Press firmly on the brake pedal to the point just before the wheels lock. This is called threshold braking.", "h": "\"Threshold\" means right at the edge.", "cat": "t28", "ch": "28 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V161", "q": "You are threshold braking WITHOUT ABS and the wheels lock. What do you do FIRST?", "o": ["Release the brake pedal slightly to regain steering", "Release the brake pedal fully and coast to a stop", "Press harder on the pedal to stop more quickly", "Pump the brake pedal rapidly until you stop"], "a": 0, "ex": "If the wheels lock, release the brake pedal slightly to regain steering control, then press firmly again without locking the wheels.", "h": "Ease off a little, not all the way.", "cat": "t28", "ch": "28 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V162", "q": "Emergency braking in a vehicle WITH ABS. Which is correct?", "o": ["Apply steady, firm pressure; do not pump or release", "Press to just before lock-up, then release slightly", "Pump the pedal rapidly to stop the wheels locking", "Slam the pedal to lock the wheels, then steer"], "a": 0, "ex": "With ABS: apply steady firm pressure to the brake pedal, do not pump or release it, and look and steer where you want to go. A vibration in the pedal is ABS working.", "h": "Let the system do the cycling.", "cat": "t28", "ch": "28 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V163", "q": "You are in the acceleration lane, entering a busy highway. What is the BEST action?", "o": ["Choose a safe gap and merge at or near the speed of traffic", "Stop at the end of the merge lane and wait for a clear gap", "Adjust your speed, then get in wherever there is room", "Stop at the beginning of the merge lane until traffic clears"], "a": 0, "ex": "Signal, check mirrors and direct view, keep glancing at the gap you chose, and move into it at or near the speed of other vehicles. Avoid reducing speed abruptly or stopping when merging.", "h": "Adjusting speed is only part of it.", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V164", "q": "When a vehicle merges onto a highway, who has the right-of-way?", "o": ["Neither; merging is a shared responsibility", "The vehicles already on the highway, always", "The merging vehicle, once it has signalled", "Whichever vehicle is the larger and heavier one"], "a": 0, "ex": "Merging is a shared responsibility between vehicles joining the roadway and vehicles already on it. Neither has the right-of-way.", "h": "Both sides must cooperate.", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V165", "q": "When it is safe and legal, you move into your chosen gap:", "o": ["After you are past the solid white line of the acceleration lane", "As soon as you enter the acceleration lane, before the white line", "In the middle of the merge lane, after stopping to check traffic", "Only once the acceleration lane is about to end, wherever possible"], "a": 0, "ex": "When it is safe and legal to merge, move into the gap after you are past the solid white line of the acceleration lane.", "h": "Look for the painted line.", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V166", "q": "You are driving on the main roadway and traffic is merging from the right. What should you do?", "o": ["Move left to the next lane, if it is safe", "Speed up so merging vehicles must fit in behind you", "Brake hard to let every merging vehicle in ahead", "Stay in the right lane, since you have the right-of-way"], "a": 0, "ex": "If you are on the main roadway and traffic is merging, move left to the next lane if it is safe. This leaves the right lane clear for merging vehicles.", "h": "Make room without braking.", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting a major roadway: merging", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Entering and exiting a major roadway: merging, PDF p.75"}, {"id": "V167", "q": "You are in the acceleration lane and have just passed the solid white line. What should you do NEXT?", "o": ["Move into the gap you chose, once it is safe", "Move over right away, since the line is now behind you", "Slow down and wait for a highway driver to wave you in", "Stop and wait until the whole right lane is clear of traffic"], "a": 0, "ex": "Passing the solid white line only makes the merge legal. Keep glancing at your chosen gap, and move into it when it is safe and legal, at or near the speed of traffic. Avoid slowing abruptly or stopping.", "h": "The line makes it legal; what makes it safe?", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V168", "q": "Which BEST describes what decides the moment you move from the acceleration lane into traffic?", "o": ["A safe gap you have picked and timed your speed to", "Reaching the end of the solid white line, gap or no gap", "Highway drivers moving over or braking to let you in first", "The acceleration lane running out, whatever the traffic does"], "a": 0, "ex": "Signal, check mirrors and direct view, and keep glancing at the gap you chose so you can adjust speed and timing. Neither side has the right-of-way, so you merge into a safe gap; you cannot count on others yielding.", "h": "Neither side has the right-of-way.", "cat": "t29", "ch": "29 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V169", "q": "When must a school bus driver turn on the alternately flashing AMBER lights?", "o": ["When beginning to slow down to stop to load or unload", "Once the bus is stopped and secured, before the door opens", "Only while passengers are actually getting on or off the bus", "Whenever extra visibility is wanted, such as in fog or smoke"], "a": 0, "ex": "Activate the alternately flashing amber lights when you begin to slow down the school bus to stop to load and unload passengers. Red lights and the stop arm are for loading and unloading; a strobe is for fog, blizzard and smoke.", "h": "Amber is a warning that comes early.", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.107"}, {"id": "V170", "q": "At a school bus stop, the alternately flashing RED lights are turned on:", "o": ["Once the bus has been secured", "As the bus begins to slow down", "As soon as the door is opened", "Once the passengers are seated"], "a": 0, "ex": "Secure the bus, do mirror and shoulder checks and verify all traffic has stopped, then activate the alternately flashing red lights once the bus has been secured.", "h": "After the bus can no longer roll.", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V171", "q": "Students must cross a rural highway after getting off your bus. You instruct them to go at least:", "o": ["10 paces in front of the bus, stop, and wait for your direction", "10 metres in front of the bus, then cross once it looks clear", "1 metre in front of the bus, stop, and wait for your direction", "10 paces behind the bus, stop, and wait for your direction"], "a": 0, "ex": "Instruct them to go at least 10 paces in front of the bus, stop before the roadway and wait for your direction. Keep a line of sight and account for all of them.", "h": "Where can you see them?", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V172", "q": "When stopping on the roadway to load, pull as far right as practical and stop at least how far from the students waiting to board?", "o": ["One metre", "Ten paces", "Three metres", "Ten metres"], "a": 0, "ex": "It is courteous to pull as far to the right as practical before stopping to load or unload, at least one metre away from the students waiting to board.", "h": "A short distance, measured in metres.", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V173", "q": "While loading or unloading, how does a bus driver communicate with other motorists?", "o": ["By using the bus's lights", "By using clear hand signals", "By waving traffic past the bus", "By using the horn and hand signals"], "a": 0, "ex": "Bus drivers communicate to other motorists through the use of their lights, not by using hand signals.", "h": "Not with your hands.", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.109"}, {"id": "V174", "q": "Traffic is following your school bus as you near a stop. The guide says the safest place for that traffic is:", "o": ["GONE: slow early and let it pass before you stop", "Behind the bus, so your red lights will stop it", "On the shoulder beside the bus, out of your way", "Right behind you, at a safe following distance"], "a": 0, "ex": "If traffic is following or oncoming and you can let it pass, slow down well before the stop and let it clear. The safest place for other traffic is GONE. Do not use the shoulder as a driving lane for your bus.", "h": "Fewer cars around the stop is safer.", "cat": "t30", "ch": "30 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.107"}, {"id": "V175", "q": "On a two-lane roundabout you will take the FIRST exit (turning right). Which signal do you use, and when?", "o": ["Right signal as you approach; leave it on until you exit", "Left signal as you approach; switch to right at your exit", "Right signal only after passing the exit before yours", "No signal until inside the circle, then signal right"], "a": 0, "ex": "For the first exit: approach using the right lane, use your right signal as you approach and leave it on until you have exited, yield to traffic in the circle, and exit using the right lane.", "h": "The first exit is a right turn.", "cat": "t31", "ch": "31 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65"}, {"id": "V176", "q": "On a two-lane roundabout you plan to leave at an exit PAST the first one. As you approach, you:", "o": ["Use the left lane and signal left to show you will not take the first exit", "Use the left lane and signal right to show you will not take the first exit", "Use the right lane and signal left to show you will not take the first exit", "Use the right lane and give no signal until you are already in the circle"], "a": 0, "ex": "For any other exit: approach using the left lane and activate your left signal to show you do not plan to use the first exit.", "h": "Lane and signal point the same way.", "cat": "t31", "ch": "31 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65"}, {"id": "V177", "q": "In a roundabout, when you are heading for a later exit, you turn on your right signal:", "o": ["After passing the exit just before your intended exit", "Before reaching the exit just before your intended exit", "As soon as you have entered the circle and yielded", "Only once you are already in your exit lane"], "a": 0, "ex": "Always wait to activate your right turn signal after passing the exit that is before your intended exit. This tells other drivers you will leave at the next exit.", "h": "Wait until the exit before yours is behind you.", "cat": "t31", "ch": "31 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.64"}, {"id": "V178", "q": "A 40-year-old driver holds a Class 4 licence. To keep it, a medical report is required:", "o": ["Every five years until age 45", "Every five years until age 50", "Every three years until age 45", "Every two years until age 40"], "a": 0, "ex": "A medical report is required every five years until 45, every three years between 45 and 65, and every year after 65.", "h": "Watch both numbers: the interval AND the age.", "cat": "t32", "ch": "32 \u00b7 Medical fitness & medical reports", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16"}, {"id": "V179", "q": "A Class 4 driver is 58 years old. How often must they submit a medical report?", "o": ["Every three years", "Every five years, until age 60", "Every two years after age 45", "Once a year after age 50"], "a": 0, "ex": "Between 45 and 65, a medical report is required every three years. It is every five years until 45 and every year after 65.", "h": "The middle age band.", "cat": "t32", "ch": "32 \u00b7 Medical fitness & medical reports", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16"}];const QH=[{"id": "W1", "q": "Your carrier operates ONE vehicle outside Alberta. You drive a bus that never leaves Alberta. Which hours-of-service rules apply to you?", "o": ["Federal, because the carrier falls under the federal legislation", "Alberta rules for in-province trips, and federal rules only on the days the other vehicle leaves", "Alberta, because your bus never leaves the province", "Both, whichever is stricter on that day"], "a": 0, "ex": "Federal legislation applies to carriers and their drivers who operate one or more vehicles outside of Alberta. Once a carrier falls within the federal legislation, all drivers of its regulated vehicles must comply, even those that never leave Alberta.", "h": "It depends on the carrier, not on your own route.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service, PDF p.23"}, {"id": "W2", "q": "You are on Cycle 2 with 69 on-duty hours since your last 24 consecutive hours off. What must you do BEFORE reaching hour 70?", "o": ["Take at least 24 consecutive hours off-duty", "Nothing until you reach 120 hours in 14 days", "Take 10 hours off, 8 of them consecutive", "Switch to Cycle 1 without a reset"], "a": 0, "ex": "Drivers using cycle 2 are required to take at least 24 consecutive hours off prior to reaching their 70th hour of on-duty time. A driver cannot move between cycles without a reset.", "h": "Cycle 2 has a checkpoint at the Cycle 1 limit.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "W3", "q": "Which pairing of cycle and RESET time is correct?", "o": ["Cycle 1: 36 hours off \u00b7 Cycle 2: 72 hours off", "Cycle 1: 36 hours off \u00b7 Cycle 2: 120 hours off", "Cycle 1: 72 hours off \u00b7 Cycle 2: 36 hours off", "Cycle 1: 24 hours off \u00b7 Cycle 2: 36 hours off"], "a": 0, "ex": "Cycle 1 resets with 36 consecutive hours off-duty; cycle 2 resets with 72 consecutive hours off-duty.", "h": "The longer cycle needs the longer reset.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "W4", "q": "Which vehicle does the Vehicle Inspection Program inspect EVERY six months, not every 12?", "o": ["A school bus designed for 11 or more, including the driver", "A truck and trailer combination registered at 11,794 kg or more", "A truck-tractor with a GVW of 11,794 kg", "A municipal transit bus operating only in Alberta"], "a": 0, "ex": "All buses designed to carry 11 or more including the driver (not municipal transit buses) must be inspected every six months. Trucks and trailers of 11,794 kg or more are inspected every 12 months.", "h": "Passengers get the more frequent check.", "cat": "t3", "ch": "3 \u00b7 Vehicle Inspection Program", "sec": "Vehicle Inspection Program", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Vehicle Inspection Program, PDF p.25"}, {"id": "W5", "q": "At the FRONT of the vehicle, which item is checked on school buses ONLY?", "o": ["Pedestrian-student safety crossing arm is secure and works", "Clearance and marker lights work, lenses are clean, reflectors are clean", "Windshield is clean and free of major cracks", "High and low-beam headlights work"], "a": 0, "ex": "Front of the vehicle (Class 2 and 4): alternating amber and red flashing lights, pedestrian-student safety crossing arm, and crossover mirror are school bus only; clearance and marker lights apply to all.", "h": "It swings out to keep children in view.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "W6", "q": "At the rear of a COMMERCIAL (not school) bus, which check does NOT apply?", "o": ["White flashing strobe light works", "Spare tire, if equipped, is inflated and secure, with jack and tools secured", "Mud flaps are secure and do not rub on the tires", "Brake lights work, lenses clean and not cracked"], "a": 0, "ex": "The white flashing strobe light is a school bus only item. Brake lights and mud flaps apply to all vehicle types, and the spare tire, jack and tools check applies to buses if equipped.", "h": "Find the school-bus-only item.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "W7", "q": "Your bus is loaded to twice its empty weight and travelling at the same speed. Per the guide, it will take:", "o": ["About twice as long to stop", "About four times as long to stop", "About the same time, because of better traction", "Eight times as long to stop"], "a": 0, "ex": "When the weight is doubled, the force needed to stop is doubled, and it will take about twice as long to stop. A heavy vehicle, even though it has better traction, needs more time and distance to stop.", "h": "Only the weight changed, not the speed.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "W8", "q": "Which statement about traction and stopping is correct?", "o": ["Traction is greatest just before the wheels lock, and less once they skid", "Traction is greatest once the wheels lock, since rubber grips best while sliding", "A heavier vehicle has less traction, so it stops sooner", "Tire inflation has no effect on traction"], "a": 0, "ex": "There is the most traction just before all the wheels lock up and less traction when the wheels are skidding. Traction depends on road condition, tire contact, tire condition and inflation, and GVW.", "h": "Skidding is NOT gripping.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "W9", "q": "For a SINGLE UNIT vehicle on the RIGHT side of the road, which hill-parking set is correct?", "o": ["Uphill no curb: right \u00b7 Uphill curb: left \u00b7 Downhill: right", "Uphill no curb: right \u00b7 Uphill curb: right \u00b7 Downhill: left", "Uphill no curb: left \u00b7 Uphill curb: left \u00b7 Downhill: right", "Uphill no curb: left \u00b7 Uphill curb: right \u00b7 Downhill: left"], "a": 0, "ex": "Downhill (with or without a curb): right. Uphill with a curb: left. Uphill without a curb: single unit vehicles turn right.", "h": "Only ONE situation turns the wheels left.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "W10", "q": "Which statement matches the guide's note on speeding?", "o": ["Speeding increases stopping distance, raising the risk to pedestrians with wheelchairs, children and the elderly", "Speeding increases following distance, raising the risk to cyclists, children and the elderly in a sudden, abrupt stop", "Speeding reduces stopping distance, because the brakes get hotter and grab harder in an abrupt stop", "Speeding increases stopping distance, but the guide says this matters only on wet, icy or snow-covered roads"], "a": 0, "ex": "Speeding increases stopping distance, putting pedestrians with wheelchairs, children and elderly persons at higher risk in an abrupt stop.", "h": "Two words decide it: which distance, and who.", "cat": "t9", "ch": "9 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "W11", "q": "Which combination follows the guide when pushing a wheelchair?", "o": ["Normal walking speed \u00b7 watch 3 m ahead and at the sides \u00b7 judge by the foot pedals", "Normal walking speed \u00b7 watch 3 m ahead and at the sides \u00b7 judge by the front of the seat", "Brisk walking speed \u00b7 watch 10 m ahead and at the sides \u00b7 judge by the foot pedals", "Normal walking speed \u00b7 watch 3 ft ahead only \u00b7 judge by the foot pedals"], "a": 0, "ex": "Normal walking speed; watch at least 3 m (10 ft) in front and along the sides; judge distances by the front of the foot pedals, not the seat.", "h": "Each wrong option changes just one part.", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "W12", "q": "Which ORDER matches the guide's scooter procedure?", "o": ["Secure spot \u2192 power off \u2192 armrest/swivel \u2192 assist to seat \u2192 secure scooter", "Power off \u2192 secure spot \u2192 armrest/swivel \u2192 assist to seat \u2192 secure scooter", "Secure spot \u2192 power off \u2192 assist to seat \u2192 armrest/swivel \u2192 secure scooter", "Secure spot \u2192 armrest/swivel \u2192 power off \u2192 assist to seat \u2192 secure scooter"], "a": 0, "ex": "Manoeuvre to a secure spot, turn off the power, remove the armrest or swivel the seat, assist to the vehicle seat, secure the scooter.", "h": "Park it, shut it off, clear the way, move the person, then tie it down.", "cat": "t11", "ch": "11 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "W13", "q": "A 4-year-old weighing 17 kg rides in your taxi. Which is correct?", "o": ["You must ensure a car seat is properly installed and the child is secured in it", "The parent alone is responsible, so a properly fastened adult seat belt is enough", "A seat belt is enough, because the child is over 16 kg", "A car seat is needed only if the child is under 40 kg"], "a": 0, "ex": "The driver must ensure a child under 18 kg/40 lb has a car seat, properly installed, with the child properly secured.", "h": "Whose job is it, and is 17 under the line?", "cat": "t12", "ch": "12 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "W14", "q": "Which class number and name pair is correct?", "o": ["Class 8 \u00b7 corrosive materials", "Class 7 \u00b7 corrosive materials", "Class 6 \u00b7 radioactive materials", "Class 5 \u00b7 flammable solids"], "a": 0, "ex": "Class 4 flammable solids\u2026; 5 oxidizing substances and organic peroxides; 6 toxic and infectious; 7 radioactive; 8 corrosive.", "h": "The wrong ones are each off by one class.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.121"}, {"id": "W15", "q": "Which list matches class 9 divisions 9.1, 9.2, 9.3 IN ORDER?", "o": ["Miscellaneous \u00b7 environmentally hazardous \u00b7 dangerous waste", "Miscellaneous \u00b7 dangerous waste \u00b7 environmentally hazardous", "Environmentally hazardous \u00b7 miscellaneous \u00b7 dangerous waste", "Dangerous waste \u00b7 environmentally hazardous \u00b7 miscellaneous"], "a": 0, "ex": "9.1 miscellaneous dangerous goods; 9.2 environmentally hazardous substance; 9.3 dangerous waste.", "h": "The class name comes first.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.123"}, {"id": "W16", "q": "Which statement about emergency vehicle exemptions is correct?", "o": ["Red flashing lights alone do not exempt the driver from the Traffic Safety Act", "Red flashing lights alone give the same exemptions as the siren", "With the siren on, the driver no longer needs to consider the safety of other road users", "With the siren on, you may assume other drivers have seen you"], "a": 0, "ex": "Use of the red flashing lights alone does not exempt the driver from the Traffic Safety Act. Even in the most serious emergency, consider the safety of others; do not assume others have seen you.", "h": "Lights versus siren.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "W17", "q": "Approaching an intersection with cross traffic, lights and siren on. The guide says:", "o": ["Slow down, stop briefly if practical, make eye contact, go once you are seen", "Keep your speed, since the siren gives you the right-of-way at every intersection", "Slow down, sound the horn, and go through without stopping", "Stop, make eye contact, and go once the light turns green"], "a": 0, "ex": "Slow down and, if practical, stop briefly. Make eye contact with the other drivers and proceed when you have been seen by them.", "h": "Being seen is the signal to go.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "W18", "q": "Which pairing of emergency-vehicle exemption and what must be operating is correct?", "o": ["Park contrary to rules: flashing lights \u00b7 speed: siren \u00b7 right-of-way: siren", "Park contrary to rules: siren \u00b7 speed: siren \u00b7 right-of-way: flashing lights", "Park contrary to rules: siren \u00b7 speed: flashing lights \u00b7 right-of-way: siren", "Park contrary to rules: siren and lights \u00b7 speed: siren \u00b7 right-of-way: siren"], "a": 0, "ex": "Parking contrary to the rules: flashing lights operating. Speeding, passing a stop signal or sign, and right-of-way: siren operating. Red flashing lights alone do not exempt the driver.", "h": "Only one exemption works without the siren.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.110"}, {"id": "W19", "q": "Which list is EXACTLY the guide's grounds for refusing a customer?", "o": ["At maximum passengers, OR the passenger is offensive or dangerous", "At maximum passengers, offensive or dangerous, OR a trip under 2 km", "Offensive or dangerous ONLY; you may never refuse for passenger count", "At maximum passengers ONLY; offensive passengers must still be driven"], "a": 0, "ex": "You may refuse if the vehicle is already carrying the maximum allowed number of passengers, or a passenger is offensive or dangerous to you or others.", "h": "Exactly two, no more, no fewer.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "W20", "q": "Now and then you drive coworkers to a job site in your private car. They pay only for gas and parking. Under sections 23/25 this is:", "o": ["Not for hire, as straight reimbursement of out-of-pocket expenses", "For hire, because any payment at all makes it for hire", "Not for hire, but only if they also pay per km above the 7306 rate", "For hire, because coworkers are not family or household members"], "a": 0, "ex": "Not for hire when incidental/occasional in a private passenger vehicle and compensation is only straight out-of-pocket reimbursement such as gas, parking, gate passes and tolls.", "h": "Gas and parking are named.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "W21", "q": "Which pair are BOTH pre-driving procedures in the guide?", "o": ["Circle check \u00b7 lock the doors before you begin", "Circle check \u00b7 unlock the doors so passengers can exit fast", "Check seat belts work \u00b7 enter GPS at the first stop", "Park at a designated space \u00b7 close the door, then seat them"], "a": 0, "ex": "Pre-driving includes a circle check and locking the doors before you begin; GPS before starting; passenger seated before closing the door.", "h": "One half of each wrong pair is fine.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "W22", "q": "Which pair are BOTH on the Traffic Safety Act list of fined distractions?", "o": ["Personal grooming \u00b7 programming portable audio players", "Personal grooming \u00b7 a dispatch system for transporting passengers", "Reading printed materials \u00b7 a gauge for the vehicle's systems", "Texting \u00b7 a CB radio when escorting an oversized vehicle"], "a": 0, "ex": "Fined: grooming, programming audio players, reading printed materials, texting. Allowed: passenger dispatch systems, vehicle gauges, CB radios when escorting oversized vehicles.", "h": "One half of each wrong pair is allowed.", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "W23", "q": "Using a hand-held radio to warn others about a collision on the highway ahead:", "o": ["Could fall under the \"emergency\" scenario category", "Is always a fined distraction under the law", "Is allowed only for police and fire services", "Is allowed only after you stop in a legal place"], "a": 0, "ex": "The use of hand-held radios to communicate extreme weather or a hazard such as a collision could fall under the \"emergency\" scenario category.", "h": "The guide says the law is not about removing safety tools.", "cat": "t19", "ch": "19 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "W24", "q": "Which statement about fatigue matches the guide?", "o": ["Opening a window helps only for a short time; stop if you become sleepy on the road", "Opening a window prevents fatigue, so you can keep going if you become sleepy on the road", "Drive straight through rather than stay overnight, so you finish before you get tired", "Fatigue crashes happen mostly at low speeds, so slowing down removes most of the risk"], "a": 0, "ex": "Window, radio, coffee, gum and eating help only for short periods. Stop if you become sleepy. Stay overnight rather than driving straight through. Fatigue collisions typically occur at higher speeds.", "h": "Short-term fixes are not prevention.", "cat": "t20", "ch": "20 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "W25", "q": "Why does the guide say fatigue-related crashes are common in young drivers?", "o": ["They stay up late, sleep less than they should, and drive more often at night", "They drive alone more often, take medication, and drive long distances", "They are shift workers who drive commercial vehicles at night more often", "They drink more coffee, which wears off quickly durin
