 "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.107"}, {"id": "V201", "q": "At a school bus stop, the alternately flashing RED lights are turned on:", "o": ["Once the bus has been secured", "As the bus begins to slow down", "As soon as the door is opened", "Once the passengers are seated"], "a": 0, "ex": "Secure the bus, do mirror and shoulder checks and verify all traffic has stopped, then activate the alternately flashing red lights once the bus has been secured.", "h": "After the bus can no longer roll.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V202", "q": "Students must cross a rural highway after getting off your bus. You instruct them to go at least:", "o": ["10 paces in front of the bus, stop, and wait for your direction", "10 metres in front of the bus, then cross once it looks clear", "1 metre in front of the bus, stop, and wait for your direction", "10 paces behind the bus, stop, and wait for your direction"], "a": 0, "ex": "Instruct them to go at least 10 paces in front of the bus, stop before the roadway and wait for your direction. Keep a line of sight and account for all of them.", "h": "Where can you see them?", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V203", "q": "When stopping on the roadway to load, pull as far right as practical and stop at least how far from the students waiting to board?", "o": ["One metre", "Ten paces", "Three metres", "Ten metres"], "a": 0, "ex": "It is courteous to pull as far to the right as practical before stopping to load or unload, at least one metre away from the students waiting to board.", "h": "A short distance, measured in metres.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.108"}, {"id": "V204", "q": "While loading or unloading, how does a bus driver communicate with other motorists?", "o": ["By using the bus's lights", "By using clear hand signals", "By waving traffic past the bus", "By using the horn and hand signals"], "a": 0, "ex": "Bus drivers communicate to other motorists through the use of their lights, not by using hand signals.", "h": "Not with your hands.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.109"}, {"id": "V205", "q": "Traffic is following your school bus as you near a stop. The guide says the safest place for that traffic is:", "o": ["GONE: slow early and let it pass before you stop", "Behind the bus, so your red lights will stop it", "On the shoulder beside the bus, out of your way", "Right behind you, at a safe following distance"], "a": 0, "ex": "If traffic is following or oncoming and you can let it pass, slow down well before the stop and let it clear. The safest place for other traffic is GONE. Do not use the shoulder as a driving lane for your bus.", "h": "Fewer cars around the stop is safer.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Passenger loading and unloading (Class 2 and Class 4 vehicles), PDF p.107"}, {"id": "V206", "q": "On a two-lane roundabout you will take the FIRST exit (turning right). Which signal do you use, and when?", "o": ["Right signal as you approach; leave it on until you exit", "Left signal as you approach; switch to right at your exit", "Right signal only after passing the exit before yours", "No signal until inside the circle, then signal right"], "a": 0, "ex": "For the first exit: approach using the right lane, use your right signal as you approach and leave it on until you have exited, yield to traffic in the circle, and exit using the right lane.", "h": "The first exit is a right turn.", "cat": "t31", "ch": "33 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65"}, {"id": "V207", "q": "On a two-lane roundabout you plan to leave at an exit PAST the first one. As you approach, you:", "o": ["Use the left lane and signal left to show you will not take the first exit", "Use the left lane and signal right to show you will not take the first exit", "Use the right lane and signal left to show you will not take the first exit", "Use the right lane and give no signal until you are already in the circle"], "a": 0, "ex": "For any other exit: approach using the left lane and activate your left signal to show you do not plan to use the first exit.", "h": "Lane and signal point the same way.", "cat": "t31", "ch": "33 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65"}, {"id": "V208", "q": "In a roundabout, when you are heading for a later exit, you turn on your right signal:", "o": ["After passing the exit just before your intended exit", "Before reaching the exit just before your intended exit", "As soon as you have entered the circle and yielded", "Only once you are already in your exit lane"], "a": 0, "ex": "Always wait to activate your right turn signal after passing the exit that is before your intended exit. This tells other drivers you will leave at the next exit.", "h": "Wait until the exit before yours is behind you.", "cat": "t31", "ch": "33 \u00b7 Roundabout signals", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.64"}, {"id": "V209", "q": "A 40-year-old driver holds a Class 4 licence. To keep it, a medical report is required:", "o": ["Every five years until age 45", "Every five years until age 50", "Every three years until age 45", "Every two years until age 40"], "a": 0, "ex": "A medical report is required every five years until 45, every three years between 45 and 65, and every year after 65.", "h": "Watch both numbers: the interval AND the age.", "cat": "t32", "ch": "34 \u00b7 Medical fitness & medical reports", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16"}, {"id": "V210", "q": "A Class 4 driver is 58 years old. How often must they submit a medical report?", "o": ["Every three years", "Every five years, until age 60", "Every two years after age 45", "Once a year after age 50"], "a": 0, "ex": "Between 45 and 65, a medical report is required every three years. It is every five years until 45 and every year after 65.", "h": "The middle age band.", "cat": "t32", "ch": "34 \u00b7 Medical fitness & medical reports", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16"}, {"id": "V211", "q": "Under the guide, you are convicted of an offence when you:", "o": ["Pay the fine on your ticket voluntarily", "Receive a ticket, even before you pay it or go to court", "Are pulled over and given only a verbal warning", "Ask for a court date so you can dispute the ticket"], "a": 0, "ex": "Know the law \u2014 Demerit points: you are convicted when you pay the fine assessed on your ticket voluntarily, appear in a court and are found guilty, or fail to appear in a court and are convicted (guilty) in absence.", "h": "Paying is admitting.", "cat": "t36", "ch": "35 \u00b7 Consequences & trip documents", "sec": "Know the law", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Know the law, PDF p.56"}, {"id": "V212", "q": "Driving privileges can be immediately suspended for reasons including accumulating:", "o": ["15 or more demerit points within two years", "12 or more demerit points within one year", "15 or more demerit points within one year", "12 or more demerit points within two years"], "a": 0, "ex": "Know the law \u2014 Driver's licence suspension: privileges can be immediately suspended for various reasons, including accumulation of 15 or more demerit points within two years, impaired driving, refusal to comply with a lawful demand of a peace officer, etc.", "h": "Check the number and the time span.", "cat": "t36", "ch": "35 \u00b7 Consequences & trip documents", "sec": "Know the law", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Know the law, PDF p.56"}, {"id": "V213", "q": "The guide says you may face jail time if found guilty under the Criminal Code of Canada of:", "o": ["Causing bodily harm or death while impaired", "Building up 15 demerit points in two years", "Driving without your logbook on a trip", "Paying a traffic fine after its due date"], "a": 0, "ex": "Know the law \u2014 Jail time: \"If you are found guilty under the Criminal Code of Canada to cause bodily harm or death while impaired, you may face a time in jail.\"", "h": "The most serious outcome on the list.", "cat": "t36", "ch": "35 \u00b7 Consequences & trip documents", "sec": "Know the law", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Know the law, PDF p.56"}, {"id": "V214", "q": "Adjusting the LEFT exterior mirror on a bus, the horizon line should be seen:", "o": ["Three-quarters of the way up the mirror", "Halfway up the mirror", "One-quarter of the way up the mirror", "Along the very top edge of the mirror"], "a": 0, "ex": "Mirror adjustment (Commercial Guide): left mirror \u2014 the left side of the vehicle along the right edge of the mirror, the rear of the vehicle at ground level near the bottom, and \"the horizon line is seen three quarters of the way up the mirror.\" The right mirror is set the same way.", "h": "Higher than the middle.", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Mirror adjustment", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Mirror adjustment, PDF p.65"}, {"id": "V215", "q": "Position a bus's inside mirror so the TOP of the mirror shows:", "o": ["The top of the rear window", "The ceiling above the last row of seats", "The driver's own eyes and forehead", "The road surface directly behind the bus"], "a": 0, "ex": "Mirror adjustment: position the inside mirror to see \"the top of the rear window in the top of the mirror\" and all of the passengers, including the heads of the passengers right behind you.", "h": "A fixed edge at the back of the bus.", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Mirror adjustment", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Mirror adjustment, PDF p.65"}, {"id": "V216", "q": "The Commercial Guide says the two-second rule is:", "o": ["The minimum following distance for passenger vehicles, accurate at any speed", "The minimum following distance for large vehicles in ideal conditions", "Accurate only at speeds below 50 km/h", "The doubled distance to use in poor weather"], "a": 0, "ex": "Following distance between vehicles: \"the two-second rule is the minimum following distance for passenger vehicles and is accurate at any speed.\" Large vehicles use the four-second rule; double it in poor weather, road, or traffic conditions.", "h": "Which kind of vehicle is it for?", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Following distance between vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Following distance between vehicles, PDF p.65"}, {"id": "V217", "q": "Which is an ON-GOING issue (rather than an immediate one) that the guide says can affect your driving?", "o": ["Money issues", "Time pressure on a tight schedule", "Poor conduct by others on the road", "A sudden distraction to your attention"], "a": 0, "ex": "Managing emotions and distractions: issues may be on-going, such as health problems, money issues, or family issues; or immediate, such as distractions to your attention, time pressure, or poor conduct by others on the road.", "h": "It follows you from day to day.", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Managing emotions and distractions", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Managing emotions and distractions, PDF p.66"}, {"id": "V218", "q": "A driver is following too closely and your bus is already at the maximum posted speed. What does the guide say to do?", "o": ["Slow down a little to see if they pass; if they stay, increase your distance", "Speed up slightly above the limit so the gap behind you grows larger", "Tap your brakes firmly several times so the driver backs off right away", "Move onto the shoulder and stop until the driver behind has gone past"], "a": 0, "ex": "Avoiding collision with a vehicle behind: allow or encourage the tailgater to pass. \"If your commercial vehicle is already travelling at the maximum posted speed limit, slow down a little to see if the driver behind you will pass. If the driver behind you stays behind, then increase your distance from the vehicle. This will give the driver behind you more time to react to a sudden or unexpected situation.\"", "h": "Give them a chance to pass, then give yourself room.", "cat": "t37", "ch": "36 \u00b7 Bus mirrors, following distance & emotions", "sec": "Avoiding collision with a vehicle behind", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle behind, PDF p.128"}, {"id": "V219", "q": "The Commercial Guide says your gaze should be approximately how far ahead of your present position?", "o": ["12 seconds", "10 seconds", "20 seconds", "30 seconds"], "a": 0, "ex": "Sight \u2014 additional good practices (Commercial Guide): \"Your gaze should be approximately 12 seconds ahead of your present position.\" (The Class 5 Driver's Guide gives 12 to 15 seconds for urban driving.)", "h": "A bit longer than the mirror-check interval.", "cat": "t38", "ch": "37 \u00b7 Sight, blind spots & parked vehicles", "sec": "Zone of awareness: Sight", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Zone of awareness: Sight, PDF p.69"}, {"id": "V220", "q": "In an urban area, the Commercial Guide says to view the road ahead:", "o": ["One full block", "Half a block", "Two full blocks", "Three full blocks"], "a": 0, "ex": "Sight \u2014 additional good practices: \"In an urban area, view the road ahead one full block.\" Focus farther down in rural areas than urban areas.", "h": "Corner to corner.", "cat": "t38", "ch": "37 \u00b7 Sight, blind spots & parked vehicles", "sec": "Zone of awareness: Sight", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Zone of awareness: Sight, PDF p.69"}, {"id": "V221", "q": "The Commercial Guide says to check your mirrors every:", "o": ["Five to ten seconds", "10 to 15 seconds", "15 to 20 seconds", "20 to 30 seconds"], "a": 0, "ex": "Sight \u2014 additional good practices (Commercial Guide): \"Check mirrors every five to ten seconds,\" as part of scanning 360 degrees. (The Class 5 Driver's Guide says every 8 to 12 seconds.)", "h": "More often than you might think.", "cat": "t38", "ch": "37 \u00b7 Sight, blind spots & parked vehicles", "sec": "Zone of awareness: Sight", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Zone of awareness: Sight, PDF p.69"}, {"id": "V222", "q": "What is the \"right turn squeeze\"?", "o": ["A cyclist or motorcyclist caught between a large vehicle turning right and the curb", "Two large vehicles turning right side by side out of a single lane", "A car cutting into the gap in front of a bus at a right-turn signal", "A pedestrian trapped between a turning bus and a parked car"], "a": 0, "ex": "Managing blind spots: \"The 'right turn squeeze' could occur if a motorcycle or bicycle rider is positioned between a large vehicle that is turning right and the curb. In this position, the driver of the large vehicle may not see the cyclist.\"", "h": "Think two wheels and a curb.", "cat": "t38", "ch": "37 \u00b7 Sight, blind spots & parked vehicles", "sec": "Managing blind spots", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Managing blind spots, PDF p.70"}, {"id": "V223", "q": "What does the Commercial Guide say about EXPERIENCE as a source of driving knowledge?", "o": ["It is not necessarily the best teacher, as bad habits may develop", "It is the best teacher, so a planned program is not needed", "It counts only after five years of commercial driving", "It matters more than knowledge from driver guides or courses"], "a": 0, "ex": "Elements of defensive driving \u2014 Knowledge: \"A great deal of knowledge about driving can be acquired through experience, but experience is not necessarily the best teacher as bad habits may develop and are hard to break.\" Experts say knowledge should come through a planned program.", "h": "A common saying, challenged.", "cat": "t39", "ch": "38 \u00b7 Defensive driving & avoiding hazards", "sec": "Defensive driving", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Defensive driving, PDF p.71"}, {"id": "V224", "q": "In the steps for avoiding hazards, which step comes right AFTER Predict?", "o": ["Decide", "Execute", "Identify", "React"], "a": 0, "ex": "Steps for avoiding hazards: Identify \u2192 Predict \u2192 Decide \u2192 Execute. After predicting what may happen, you decide which course of action is needed.", "h": "Follow the logical sequence.", "cat": "t39", "ch": "38 \u00b7 Defensive driving & avoiding hazards", "sec": "Steps for avoiding hazards", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Steps for avoiding hazards, PDF p.72"}, {"id": "V225", "q": "According to the Commercial Guide, a FRESH green light is one that:", "o": ["You see turning green", "Has been green for quite a while before you arrive", "Was green before you first noticed it", "Shows a steady green arrow beside the ball"], "a": 0, "ex": "Traffic Lights: \"A fresh green light is a light that is seen turning green. A stale green light is one that was green before it was seen, or one that has been green for quite a while.\"", "h": "You saw the change happen.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Traffic Lights", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Traffic Lights, PDF p.78"}, {"id": "V226", "q": "At an intersection with NO pedestrian walk light, the guide says to:", "o": ["Cover your brakes and be prepared to stop", "Treat the light as fresh and keep your speed", "Sound the horn as you enter the intersection", "Speed up so you clear it before it changes"], "a": 0, "ex": "Traffic Lights: with a stale green, \"Scan to see if the 'Do Not Walk' light is activated, if one is present. At intersections without a pedestrian walk light, cover your brakes and be prepared to stop.\"", "h": "Without that clue, be ready.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Traffic Lights", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Traffic Lights, PDF p.78"}, {"id": "V227", "q": "Using visual lead time, how far ahead does the Commercial Guide say to scan as you approach traffic lights?", "o": ["12 to 15 seconds", "5 to 8 seconds", "8 to 10 seconds", "20 to 30 seconds"], "a": 0, "ex": "Traffic Lights: \"Engage in visual lead time techniques and observe traffic lights from afar. Scan 12-15 seconds ahead of you.\"", "h": "Longer than the mirror-check interval.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Traffic Lights", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Traffic Lights, PDF p.78"}, {"id": "V228", "q": "Entering traffic from an alley, side street, driveway or terminal, the Commercial Guide says to:", "o": ["Stop before entering the cross street, then proceed with extreme caution", "Yield, and roll through if no traffic is coming", "Signal four flashes, then merge without stopping", "Sound the horn, then enter at traffic speed"], "a": 0, "ex": "Entering traffic: \"When entering traffic from an alley, side street, driveway or terminal, come to a stop before entering a cross street and proceed with extreme caution.\" (Four flashes applies to pulling away from a curb or loading zone.)", "h": "Not just a yield.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Entering and exiting roadways", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways, PDF p.79"}, {"id": "V229", "q": "In a weave zone, the guide says to control:", "o": ["Your speed and the timing of your lane change", "Only your following distance behind the exiting vehicle", "Your horn and headlights, to warn entering traffic", "Nothing, since entering traffic has the right-of-way"], "a": 0, "ex": "Weave zones: where the highway entrance and exit use the same lane; \"In weave zones, control your speed and the timing of your lane change to merge with other traffic. This requires skillful use of time and space.\"", "h": "Two things you adjust to fit in.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Entering and exiting roadways", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways, PDF p.79"}, {"id": "V230", "q": "Exiting a highway, where should you do MOST of your slowing, if possible?", "o": ["In the deceleration lane", "On the highway, before you reach the exit sign", "On the curve of the exit ramp", "On the shoulder just before the deceleration lane"], "a": 0, "ex": "Exiting a roadway: move into the deceleration lane as soon as space is available; \"If possible, do most of the slowing in the deceleration lane. Some deceleration lanes are short. You may need to start reducing your speed while still on the highway.\"", "h": "The lane built for it.", "cat": "t40", "ch": "39 \u00b7 Traffic lights, entering & exiting", "sec": "Entering and exiting roadways", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways, PDF p.79"}, {"id": "V231", "q": "Why does the guide say to stop about two to three car lengths back from a crosswalk for a pedestrian?", "o": ["So traffic in another lane can see the pedestrian and have time to stop", "So the pedestrian can walk around the front of your bus", "So you have room to pull ahead if the light changes", "So your mirrors can show the pedestrian behind you"], "a": 0, "ex": "Pedestrians: \"When stopping for a pedestrian at a crosswalk, stop far enough back (about two to three car lengths) so that traffic in another lane will be able to see the pedestrian and have time to stop.\"", "h": "Think of the other lane.", "cat": "t41", "ch": "40 \u00b7 Surroundings, off-tracking & turns", "sec": "Be aware of your surroundings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Be aware of your surroundings, PDF p.80"}, {"id": "V232", "q": "The Commercial Guide says to signal approximately how far before a turn in a RURAL area?", "o": ["100 metres", "30 metres", "50 metres", "150 metres"], "a": 0, "ex": "Making turns: \"Give the proper right or left-turn signal approximately 30 metres from the turn in urban areas, or approximately 100 metres in rural areas.\"", "h": "Higher speeds need more warning.", "cat": "t41", "ch": "40 \u00b7 Surroundings, off-tracking & turns", "sec": "Making turns", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Making turns, PDF p.82"}, {"id": "V233", "q": "Recovering the steering wheel after a turn, the Commercial Guide says:", "o": ["Letting the wheel spin freely is not acceptable; stay in control", "Let it spin back through loose hands to save effort", "Let go briefly so the wheel can centre itself", "Use one hand only, so the other is free to signal"], "a": 0, "ex": "Making turns: always use both hands; hand-over-hand is recommended. \"Letting the steering wheel spin freely when recovering from a turn is not acceptable. You must stay in control even when recovering from a turn.\"", "h": "Control the whole way.", "cat": "t41", "ch": "40 \u00b7 Surroundings, off-tracking & turns", "sec": "Making turns", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Making turns, PDF p.82"}, {"id": "V234", "q": "If a bus engine will stay running while parked, which is NOT one of the guide's steps?", "o": ["Leave the transmission in gear so the bus cannot roll", "Place the transmission in neutral (manual transmission)", "Set the parking brake", "Engage fast idle"], "a": 0, "ex": "Special information for parking a Class 2 or Class 4 vehicle: if the engine is to remain running while parked, the transmission should be placed in neutral (manual), the parking brake must be set, and fast idle is engaged.", "h": "One of these is the opposite of neutral.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Special information for parking a Class 2 or Class 4 vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special information for parking a Class 2 or Class 4 vehicle, PDF p.87"}, {"id": "V235", "q": "Before straight-line reversing, the guide says to walk around the vehicle in which direction?", "o": ["Counter-clockwise", "Clockwise", "Either direction, as long as you check the rear", "Only along the rear, from one corner to the other"], "a": 0, "ex": "Straight line reversing: \"Prior to reversing, walk around the vehicle in a counter-clockwise direction and check for obstacles and clearance.\" Straight line is the easiest and safest form of reversing.", "h": "Check every side as you go.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Reversing", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing, PDF p.88"}, {"id": "V236", "q": "The guide says to sound the horn as a safety precaution before reversing, then repeat it:", "o": ["At least once for every vehicle-length reversed", "Only if a pedestrian is in your mirrors", "Once more when you stop at the end", "Every 30 seconds until you finish"], "a": 0, "ex": "Reversing \u2014 General information: \"Sound the horn as a safety precaution before reversing. Repeat at least once for every vehicle-length reversed.\"", "h": "It repeats with distance, not time.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Reversing", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing, PDF p.88"}, {"id": "V237", "q": "While reversing with a guide, you lose sight of the guide. You should:", "o": ["Stop immediately", "Keep reversing slowly and sound the horn", "Rely on your mirrors until you see them again", "Speed up to finish before something changes"], "a": 0, "ex": "Reversing \u2014 General information: the guide must be able to see the vehicle's path and the driver must be able to see the guide. \"Stop immediately if you cannot see the guide or you lose sight of the guide.\"", "h": "No guide, no movement.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Reversing", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing, PDF p.88"}, {"id": "V238", "q": "Country turnarounds are done by backing into a road on the right of the main roadway. The guide says NEVER to:", "o": ["Back onto or across a highway", "Turn on your hazard lights while backing", "Sound your horn while backing", "Back into a side road on the right"], "a": 0, "ex": "Making a country turnaround: \"Turnarounds are done by backing into a road on the right of the main roadway. Never back onto or across a highway.\" On a two-lane highway, do one only if it cannot be done on private property.", "h": "Where should the bus never end up backing?", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Special information for reversing a bus (Class 2 or Class 4)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special information for reversing a bus (Class 2 or Class 4), PDF p.90"}, {"id": "V239", "q": "Why accelerate to the proper engine speed before shifting into the next higher gear?", "o": ["It prevents the engine from lugging", "It keeps the clutch from ever wearing", "It lets you skip using the clutch", "It keeps the brake lights from coming on"], "a": 0, "ex": "Changing gears when accelerating: \"Accelerate the vehicle to the proper engine speed before attempting to shift into the next higher gear. This will prevent the engine from lugging.\" With practice you learn to feel and hear the right engine speed.", "h": "Think about a struggling engine.", "cat": "t42", "ch": "41 \u00b7 Bus parking, reversing & U-turns", "sec": "Shifting gears, accelerating, decelerating", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Shifting gears, accelerating, decelerating, PDF p.93"}, {"id": "V240", "q": "If a collision cannot be avoided, the guide says to try to hit the object or vehicle:", "o": ["At an angle, not head-on", "Squarely head-on, at the lowest speed possible", "With the rear of the bus, after spinning around", "On the driver's side, so you can see the impact"], "a": 0, "ex": "Drive right off the road: \"If a collision is unavoidable, try to hit the object or vehicle at an angle rather than head-on to lessen the impact.\"", "h": "Lessen the force of impact.", "cat": "t43", "ch": "42 \u00b7 Following, side & head-on collisions", "sec": "Avoiding collision with an oncoming vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with an oncoming vehicle, PDF p.129"}, {"id": "V241", "q": "\"Ride to the right.\" In urban areas, why does the guide say the right lane generally moves quicker?", "o": ["Right-turning vehicles normally cause less delay than left-turning ones", "Buses and taxis are required by law to use only the left lane in a city", "The right lane always has a higher speed limit posted than the left lane", "Parked cars are not allowed in the right lane during the morning rush hour"], "a": 0, "ex": "Ride to the right: \"If there are two lanes available going in the same direction, use the right lane as a matter of preference. In urban areas, the right lane generally moves quicker because vehicles turning right normally cause less delay than those turning left.\"", "h": "Compare the two kinds of turns.", "cat": "t43", "ch": "42 \u00b7 Following, side & head-on collisions", "sec": "Avoiding collision with an oncoming vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with an oncoming vehicle, PDF p.129"}, {"id": "V242", "q": "At a major collision, after you quickly assess the situation and evacuate if necessary, the guide's NEXT step is to:", "o": ["Assign someone to protect the scene", "Treat for shock and minor injuries", "Note the marks on the pavement", "Discuss who was at fault with the other driver"], "a": 0, "ex": "Major collision: quickly assess and evacuate if necessary; \"Assign someone to protect the scene to prevent other motorists from becoming involved\"; set out warning devices; give first aid if trained (not breathing, then bleeding, shock and minor injuries last); summon help.", "h": "Keep other motorists out of it.", "cat": "t44", "ch": "43 \u00b7 Collision steps, lifts & blanket drag", "sec": "Major collision", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Major collision, PDF p.133"}, {"id": "V243", "q": "In a two-person lift, when do the two helpers lift and lower the passenger?", "o": ["Together, on a count of three each time", "Lift on a count of two, then lower without counting", "The back person lifts first, then the front person follows", "Each helper lifts when ready, then lowers on a count of five"], "a": 0, "ex": "Two-person lift: \"Squat down and lift together on a count of three.\" Then \"Move to the designated area and lower the passenger on the count of three.\"", "h": "Teamwork needs a shared signal.", "cat": "t44", "ch": "43 \u00b7 Collision steps, lifts & blanket drag", "sec": "Evacuating passengers with disabilities: two-person lift", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Evacuating passengers with disabilities: two-person lift, PDF p.135"}, {"id": "V244", "q": "In a blanket drag, how should the passenger be positioned on the blanket?", "o": ["With their head toward the exit", "With their feet toward the exit", "Sideways across the aisle", "Face down, arms outside the blanket"], "a": 0, "ex": "Blanket drag: legs onto the blanket first, then the body; \"Place the passenger with their head toward the exit\"; wrap the blanket to protect arms and legs; grasp near the head and drag to the exit.", "h": "Think about which way you pull.", "cat": "t44", "ch": "43 \u00b7 Collision steps, lifts & blanket drag", "sec": "Evacuating passengers with disabilities: blanket drag", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Evacuating passengers with disabilities: blanket drag, PDF p.135"}, {"id": "V245", "q": "Cars B and C are entering this two-lane roundabout side by side. Car A is already circulating. Which is correct?", "o": ["Both B and C must yield to A", "Only C must yield; B is in the left lane", "A must yield to B, the car on its right", "B and C go first, since A is about to exit"], "a": 0, "ex": "Drivers entering the circular intersection must yield to drivers already in the circle. The guide's picture: \"Vehicles B and C must yield to Vehicle A.\"", "h": "Lane choice does not change the entry rule.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.63", "img": "dRBentry2", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V246", "q": "Inside this two-lane roundabout, car G in the left lane is exiting across the right lane. Car H is in the right lane. Who must yield?", "o": ["Car H must yield to car G", "Car G must yield to car H", "Neither; they may exit side by side", "Whichever car is going faster"], "a": 0, "ex": "While in the circle, drivers on the right must yield to drivers on the left. The guide's picture: \"Vehicle H must yield to Vehicle G.\"", "h": "Right gives way to left.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Two-lane traffic circle / roundabout", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Two-lane traffic circle / roundabout, PDF p.65", "img": "dRBexitG", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V247", "q": "In the Driver's Guide, REACTION time is how long it takes to:", "o": ["Move your foot from the accelerator pedal to the brake pedal", "Recognize a situation and understand that you need to stop the vehicle", "Bring the vehicle to a stop after the brakes are applied", "Go from first seeing a hazard to a complete stop"], "a": 0, "ex": "Reaction time is how long it takes to respond to a situation by moving your foot from the accelerator pedal to the brake pedal. Recognizing the need to stop is perception time; stopping after the brakes are applied is braking time.", "h": "Think about your right foot.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Stopping time and distance", "g": "CG", "ref": "Alberta Driver's Guide, Ch.3 The Basics of Driving, Stopping time and distance, PDF p.52"}, {"id": "V248", "q": "Why are pedestrian crossings at roundabouts located away from the intersection?", "o": ["For safety and better lines of sight for drivers and pedestrians", "To give buses room to stop at the crosswalk", "So pedestrians can stop and rest on the centre island partway across the circle", "To keep pedestrians off the sloped curb"], "a": 0, "ex": "Pedestrian crossings on roundabouts are located away from the intersection for safety, as well as improved lines of sight for motorists and pedestrians.", "h": "Distance helps everyone see.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Traffic circles and roundabouts", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Traffic circles and roundabouts, PDF p.63"}, {"id": "V249", "q": "A roundabout may have a sloped curb around the centre island. Its purpose is to:", "o": ["Allow more room for larger commercial vehicles", "Let drivers park briefly beside the island", "Slow traffic by making cars bump over it", "Give pedestrians a place to wait while crossing"], "a": 0, "ex": "The roundabout has a tighter curve to encourage lower speeds and may have a sloped curb to allow more room for larger commercial vehicles.", "h": "Think about long vehicles.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Traffic circles and roundabouts", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Traffic circles and roundabouts, PDF p.63"}, {"id": "V250", "q": "Unless something such as a parking meter shows parking is allowed, do not park closer than how far to the edge of an intersecting roadway?", "o": ["5 metres", "3 metres", "6 metres", "10 metres"], "a": 0, "ex": "Do not park closer than five metres of the edge of the intersecting roadway, except where there is an indication that parking is permitted, such as with a parking meter.", "h": "The same number as for hydrants.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Do not park here", "g": "CG", "ref": "Alberta Driver's Guide, Ch.3 The Basics of Driving, Do not park here, PDF p.58"}, {"id": "V251", "q": "The Driver's Guide defines a TRAVEL lane as:", "o": ["A section of roadway wide enough for a single line of vehicles", "Only a lane marked with painted lines or signs", "Any lane except the curb lane, which is meant to be used only for parking", "The lane furthest to the left on a multi-lane road"], "a": 0, "ex": "A travel lane is a section of roadway wide enough to allow the passage of a single line of vehicles. Lanes are not always marked. This includes a curb lane lined with parking meters; curb lanes are used to turn off and onto a road.", "h": "Paint is not required.", "cat": "t45", "ch": "44 \u00b7 Stopping, hill parking & circles (DG)", "sec": "Right turns", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Right turns, PDF p.65"}, {"id": "V252", "q": "Two cars are joining the highway, as shown. Which one is merging the WRONG way?", "o": ["Car A, cutting in at a sharp angle", "Car B, using the acceleration lane", "Both; neither should signal while merging", "Neither; both methods are acceptable"], "a": 0, "ex": "The guide's merging diagram: adjust to highway speed in the acceleration lane, then signal and move carefully into the highway lane. \"Do not enter highway here at a sharp angle\" is marked WRONG.", "h": "One skips the lane built for speeding up.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Entering and exiting a major roadway", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Entering and exiting a major roadway, PDF p.76", "img": "dMerge", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V253", "q": "Three cars near a highway exit, as shown (red dots = brake lights). Which car is exiting CORRECTLY?", "o": ["Car Q, slowing in the deceleration lane", "Car P, slowing in the highway lane well before the exit", "Car R, turning off from the left lane at the last minute", "None of them; you should not brake until on the ramp"], "a": 0, "ex": "Exiting diagram: do not slow down on the highway before the exit; slow down after turning into the deceleration lane; do not make a last-minute turn-off; check the posted safe speed for the ramp.", "h": "Where was the extra lane built for slowing?", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Exiting", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Exiting, PDF p.76", "img": "dExit", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V254", "q": "Why does the Driver's Guide say to avoid slowing abruptly or stopping when you merge?", "o": ["Drivers behind expect you to keep moving, and you may be hit from behind", "Stopping in a merge lane always earns demerit points, even when no one is behind you", "Vehicles on the highway must yield to you anyway", "Your engine may stall when you speed up again"], "a": 0, "ex": "Avoid reducing your speed abruptly or stopping when merging. The drivers behind you are expecting you to continue moving ahead. If you slow or stop, your vehicle may be hit from behind.", "h": "Think about who is behind you.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Merging", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Merging, PDF p.75"}, {"id": "V255", "q": "According to the Driver's Guide, merging lanes are designed to:", "o": ["Let your vehicle reach the posted speed limit of the road you are joining", "Give you a place to stop and wait for a gap", "Let traffic already on the main road speed up so it can pass you before you join", "Hold slower vehicles until the highway is clear"], "a": 0, "ex": "Merging lanes are designed to allow your vehicle to reach the posted speed limit of the road you are merging onto.", "h": "What do you need before you join fast traffic?", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Merging", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Merging, PDF p.75"}, {"id": "V256", "q": "The rear of your car is sliding to the right, as shown. Where do you look and steer?", "o": ["Where you want the front of the car to go, without large corrections", "Hard to the left, away from the slide, and hold it there", "Toward the right shoulder, the same way the rear is sliding, and brake gently", "Straight ahead while you brake firmly to stop the slide"], "a": 0, "ex": "Keep your foot off the brake pedal if you start to skid. Look and steer in the direction you want the front of the vehicle to go. Point the tires along the centre of your lane and do not make large steering adjustments.", "h": "Eyes lead the hands.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Skid recovery", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Skid recovery, PDF p.81", "img": "dSkid", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V257", "q": "Your vehicle has mechanical problems and must stop. Which is NOT on the Driver's Guide list?", "o": ["Do quick roadside repairs on the highway so you are moving again soon", "Change lanes safely and park in a safe location, if possible", "Raise your hood", "Turn on your four-way flashers if the location is potentially dangerous"], "a": 0, "ex": "If your vehicle has problems: change lanes safely and park in a safe place; do not stop on a bridge or in a tunnel; use hazard lights in a potentially dangerous location; raise your hood; place reflective triangles; do not try to do roadside repairs on crowded or fast-moving highways.", "h": "One choice puts you in the traffic.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Vehicle mechanical problems", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Vehicle mechanical problems, PDF p.82"}, {"id": "V258", "q": "Your brakes fail and your wheels are not turned. The Driver's Guide says you may:", "o": ["Carefully use your park brake, and possibly shift to a lower gear", "Shift into park at once to lock the transmission", "Turn the ignition off right away so the engine compression slows the car down", "Steer onto the shoulder and pump the clutch"], "a": 0, "ex": "If your brakes fail, and your wheels are not turned, carefully use your park brake to slow your vehicle. You may be able to shift to a lower gear to bring your vehicle to a safe and controlled stop.", "h": "The other brake.", "cat": "t46", "ch": "45 \u00b7 Passing, merging, skids & breakdowns (DG)", "sec": "Brake failure", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Brake failure, PDF p.82"}, {"id": "V259", "q": "According to the Driver's Guide, checking your rear view mirrors every 8 to 12 seconds works out to about how often in an URBAN area?", "o": ["About every block", "About every two blocks", "About every half block", "Only at each traffic light"], "a": 0, "ex": "Check behind you by glancing in your rear view mirrors every eight to 12 seconds (about every block in an urban area).", "h": "Match it to one unit of city distance.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Scan all around your vehicle", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Scan all around your vehicle, PDF p.91"}, {"id": "V260", "q": "You must turn sharply to avoid something in your lane. The Driver's Guide says, if possible:", "o": ["Stay on your side of the yellow line", "Swerve onto the shoulder at full speed", "Cross into the oncoming lane if it looks clear", "Brake hard and hold the wheel straight"], "a": 0, "ex": "Collision avoidance: if you must turn sharply to avoid something in your lane, stay on your side of the yellow line if possible.", "h": "Avoid trading one hazard for a worse one.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Collision avoidance", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Collision avoidance, PDF p.92"}, {"id": "V261", "q": "Under the Traffic Safety Act, personal grooming while driving can bring a fine and:", "o": ["Three demerits", "Two demerits", "Four demerits", "No demerits"], "a": 0, "ex": "The Traffic Safety Act includes fines and three demerits for certain distractions, including personal grooming, reading, writing, texting, hand-held phones and entering GPS information.", "h": "The same number as for texting.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Cellular phones and other distractions", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Cellular phones and other distractions, PDF p.93"}, {"id": "V262", "q": "From birth, a child rides in a rear-facing infant or convertible seat until:", "o": ["They reach the manufacturer's recommended weight to switch", "Their first birthday, whatever their weight or the seat maker's instructions say", "They weigh 10 kg, the same for every seat", "They can sit up without help"], "a": 0, "ex": "From birth, all children must ride in a rear-facing infant seat or rear-facing convertible seat until reaching the recommended weight to switch to a forward-facing seat, according to the manufacturer's instructions.", "h": "Check the seat's own instructions.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Rear facing safety seats", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Rear facing safety seats, PDF p.93"}, {"id": "V263", "q": "Per the Driver's Guide, children who weigh MORE than 18 kg (40 lb) should:", "o": ["Use an approved booster seat before using only the seat belt", "Use the vehicle seat belt alone from then on", "Stay in a forward-facing seat until age eight", "Ride in the front seat with the airbag turned off and the lap belt fastened low"], "a": 0, "ex": "Children who weigh more than 18 kilograms (40 pounds) should be secured in an approved booster seat prior to using only the vehicle's seat belt without a booster seat.", "h": "One more step before the belt alone.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Booster seats", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Booster seats, PDF p.94"}, {"id": "V264", "q": "Proper use of a block heater can improve overall fuel economy by as much as:", "o": ["10 per cent", "5 per cent", "25 per cent", "50 per cent"], "a": 0, "ex": "Proper use of a block heater can improve overall fuel economy by as much as 10 per cent. Do not leave it on overnight, or your savings disappear in higher electricity costs.", "h": "Same as each 10 km/h over 90.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Improving fuel efficiency", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Improving fuel efficiency, PDF p.95"}, {"id": "V265", "q": "For every 10 minutes of idling, the AVERAGE vehicle uses about:", "o": ["One-third of a litre of fuel", "One-tenth of a litre of fuel", "One-half of a litre of fuel", "One full litre of fuel"], "a": 0, "ex": "For every 10 minutes of idling, the average vehicle uses about one-third of a litre of fuel. A vehicle with a larger engine can use up to one-half of a litre.", "h": "The larger engine gets the bigger number.", "cat": "t47", "ch": "46 \u00b7 Proactive driving, child seats & fuel (DG)", "sec": "Improving fuel efficiency", "g": "CG", "ref": "Alberta Driver's Guide, Ch.7 Responsible Driving, Improving fuel efficiency, PDF p.95"}, {"id": "V266", "q": "You fail to stop for a school bus. The Driver's Guide demerit table lists:", "o": ["6 demerits", "5 demerits", "4 demerits", "7 demerits, the maximum"], "a": 0, "ex": "Demerit table: 6 points \u2014 careless driving, failing to stop for a school bus, racing, speeding at least 51 km/h over. (A school bus failing to stop at a railway crossing is 5.)", "h": "One below the top.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Demerit point penalties", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Demerit point penalties, PDF p.111"}, {"id": "V267", "q": "Which offence carries FOUR demerit points?", "o": ["Failing to yield to a pedestrian in a crosswalk", "Racing another vehicle on a highway", "Failing to stop at an intersection controlled by a stop sign", "Making an improper U-turn"], "a": 0, "ex": "Demerit table: 4 points \u2014 failing to yield right-of-way to a pedestrian in a crosswalk; following too closely; speeding 31 to 50 km/h over. Racing is 6; a stop sign is 3; an improper U-turn is 2.", "h": "Someone on foot.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Demerit point penalties", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Demerit point penalties, PDF p.111"}, {"id": "V268", "q": "Failing to stop for a peace officer carries how many demerit points?", "o": ["Five", "Three", "Six", "Seven"], "a": 0, "ex": "Demerit table: 5 points \u2014 failing to stop at a railway crossing (school bus or dangerous-load vehicle); failing to stop for a peace officer.", "h": "Same tier as a school bus at a railway crossing.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Demerit point penalties", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Demerit point penalties, PDF p.111"}, {"id": "V269", "q": "A Class 7 learner is found to have consumed alcohol before driving. Under IRS ZERO: Novice, the penalties are:", "o": ["30-day suspension, 7-day vehicle seizure, $200 fine plus 20%", "3-day suspension, 3-day vehicle seizure, $300 fine plus 20%", "30-day suspension, 30-day vehicle seizure, $1,000 fine plus 20%", "15-day suspension, no vehicle seizure, $600 fine plus 20%"], "a": 0, "ex": "IRS ZERO: Novice: an immediate 30 day licence suspension, a seven day vehicle seizure, and a $200 fine plus victim fine surcharge of 20 per cent.", "h": "The smallest fine of the IRS programs.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "IRS ZERO: Novice", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, IRS ZERO: Novice, PDF p.114"}, {"id": "V270", "q": "Which is NOT one of the reasons the Driver's Guide gives for a PROVINCIAL suspension?", "o": ["Unpaid parking tickets", "A poor driving record", "Failure to pay a legal judgement", "Failure to comply with a Notice to Report"], "a": 0, "ex": "Provincial suspensions may be imposed for reasons such as a poor driving record, failure to pay a legal judgement, medical reasons, or failure to comply with a Notice to Report.", "h": "One unpaid debt is on the list; another is made up.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Provincial suspensions", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Provincial suspensions, PDF p.119"}, {"id": "V271", "q": "Your Notice of Suspension is mailed to the last address on your file. Who must tell an Alberta registry agent when your address changes?", "o": ["You, any time you change your mailing address", "Canada Post, through its mail forwarding service", "Your insurance company, when it renews your policy", "Driver Fitness and Monitoring, once mail is returned"], "a": 0, "ex": "\"It is your responsibility to notify an Alberta registry agent office anytime you change your mailing address.\"", "h": "Whose licence is it?", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Driver's licence suspension", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Driver's licence suspension, PDF p.119"}, {"id": "V272", "q": "Your demerit point suspension takes effect on Friday. What does the Driver's Guide say to do with your licence?", "o": ["Hand it to a registry agent on or before Friday", "Keep it with you, but do not drive until the suspension ends", "Mail it to the police service that issued your tickets", "Turn it in at a registry agent within 30 days after Friday"], "a": 0, "ex": "You must turn your driver's licence over to any Alberta registry agent office on or before the effective date. It is illegal to be in possession of your licence while serving a suspension.", "h": "Holding it at all is the problem.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Driver's licence suspension", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Driver's licence suspension, PDF p.119"}, {"id": "V273", "q": "Which statement about SafeRoads Alberta VEHICLE SEIZURE reviews is TRUE?", "o": ["Review fees are non-refundable, and return is not guaranteed", "The review fee is refunded if the vehicle is returned to you", "The registered owner pays no seizure costs if someone else drove", "Applying for a review guarantees a stolen vehicle is returned"], "a": 0, "ex": "Vehicle seizure reviews: a stolen, taken-without-consent or rental-agency vehicle can seek return through SafeRoads Alberta. Registered owners are responsible for all costs. Applying does not guarantee return, and review fees are non-refundable.", "h": "Money paid stays paid.", "cat": "t48", "ch": "47 \u00b7 Demerits, IRS & suspensions (DG)", "sec": "Vehicle seizure reviews", "g": "CG", "ref": "Alberta Driver's Guide, Ch.9 Driving within the Law, Vehicle seizure reviews, PDF p.119"}, {"id": "V274", "q": "Driver's Guide: braking hard in a car WITH ABS, you feel a vibration through the brake pedal. This means:", "o": ["The ABS is working; keep steady, firm pressure", "The wheels have locked, so release the pedal and pump it", "The ABS has failed, so switch to threshold braking at once", "The brakes are overheating, so ease off and downshift"], "a": 0, "ex": "ABS applies brake pressure at each wheel, cycling from locked to slightly rolling. You will feel this as a vibration through the brake pedal. Apply steady firm pressure; do not pump or release.", "h": "A feeling the guide says to expect, not a fault.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Emergency braking: ABS", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking: ABS, PDF p.80"}, {"id": "V275", "q": "According to the Driver's Guide, what does ABS let you do during hard braking?", "o": ["Steer while the brakes are being applied", "Stop in a shorter distance on any road surface", "Keep braking safely even when the ABS light stays on", "Pump the pedal faster than you could with your foot"], "a": 0, "ex": "The ABS allows you to steer while the brakes are being applied. With ABS you can brake as hard as you need without losing your ability to steer.", "h": "Think about the steering wheel, not the distance.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Emergency braking: ABS", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking: ABS, PDF p.80"}, {"id": "V276", "q": "Which is NOT on the Driver's Guide list of ways a skid can occur?", "o": ["Using steady, firm pressure on ABS brakes", "Turning the steering wheel too much for your speed", "Accelerating too quickly", "Braking too firmly"], "a": 0, "ex": "A skid can occur when you: drive too quickly on poor roads; turn the wheel too sharply or too much for your speed; brake too firmly; accelerate too quickly. Steady firm pressure is the correct ABS technique.", "h": "Three are driver errors; one is the recommended method.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Loss of control", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Loss of control, PDF p.80"}, {"id": "V277", "q": "No signs and no signals at this intersection. You and car B arrive at about the same time. Which is BEST?", "o": ["You have the right-of-way, but make sure B yields", "Yield to B, since vehicles from the left go first", "Both stop fully; the one going straight goes first", "Speed up a little so you clear the intersection first"], "a": 0, "ex": "At an intersection with no signs or signals, yield to a vehicle on your RIGHT. B is on your left, so B must yield to you. Even if you have the right-of-way, be sure the other vehicle is going to yield before you proceed.", "h": "Whose right side is the other car on?", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61", "img": "dUnc", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V278", "q": "At an intersection with NO traffic signs and NO signal lights, which is NOT required by the Driver's Guide?", "o": ["Coming to a complete stop every time, as at a stop sign", "Yielding to a vehicle on your right", "Checking for traffic from both your left and your right", "Reducing your speed to suit visibility and road conditions"], "a": 0, "ex": "At uncontrolled intersections you must yield to a vehicle on your right, check left and right, and adjust speed to visibility and road conditions so you can stop easily. A full stop is not required by rule.", "h": "Slowing down is not the same as stopping.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61"}, {"id": "V279", "q": "Facing a solid red light, you want to turn right and no sign prohibits it. Where must you stop FIRST?", "o": ["Before the stop line or crosswalk; if neither, before the intersection", "Anywhere you can see cross traffic clearly, even if that is past the crosswalk", "Only if pedestrians are waiting; otherwise slow and turn", "Within 3 metres of the curb line of the street you turn onto"], "a": 0, "ex": "Turning right at a red light is permitted provided there is no sign prohibiting the turn. Before turning, the vehicle must come to a complete stop before the stop line or crosswalk (or before the intersection if neither). Then turn when safe, yielding to other traffic.", "h": "A full stop, at the first painted line you reach.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Solid red light", "g": "CG", "ref": "Alberta Driver's Guide, Ch.2 Traffic Control, Solid red light, PDF p.24"}, {"id": "V280", "q": "A traffic signal shows a solid DOUBLE red light. According to the Driver's Guide, it means:", "o": ["The same as a single red light", "Stop, then you may go straight once it is clear", "A right turn is NOT allowed, even after stopping", "The signal is broken, so treat it as a yield sign"], "a": 0, "ex": "A solid double red light has the same meaning as a single red light.", "h": "Two of the same light, one meaning.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Solid red light", "g": "CG", "ref": "Alberta Driver's Guide, Ch.2 Traffic Control, Solid red light, PDF p.24"}, {"id": "V281", "q": "Under the Traffic Safety Act, an emergency vehicle's siren shall be operated ONLY when the vehicle is:", "o": ["Used in response to an emergency, an emergency call, or an alarm", "Carrying any patient to the hospital, even a stable one", "Travelling faster than other traffic for any reason", "Parked at a collision scene, to warn the drivers approaching from behind"], "a": 0, "ex": "The Traffic Safety Act states that a siren on an emergency vehicle shall be operated only when the vehicle is being used in response to an emergency, an emergency call, or an alarm.", "h": "Three kinds of call for help.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V282", "q": "An emergency medical operator disregards traffic laws WITHOUT meeting the required circumstances and has a collision. The Commercial Guide says they may face:", "o": ["Civil and criminal penalties", "Only a warning from their employer", "Demerit points only, never a court case", "No penalty, since ambulances are always exempt"], "a": 0, "ex": "The Traffic Safety Act authorizes emergency medical operators to disregard some traffic laws under limited circumstances. Failure to meet those requirements means the driver may be subject to civil and criminal penalties in the event of a collision.", "h": "Two kinds of court.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V283", "q": "On a TWO-WAY road, an ambulance with its siren sounding comes up behind you. The Driver's Guide says to:", "o": ["Drive as close as possible to the right curb or edge, and stop until it passes", "Move to the nearest curb, left or right, and keep driving slowly until it passes", "Stop right where you are in your lane so it can go around you", "Speed up to the next intersection and turn off the road"], "a": 0, "ex": "When an emergency vehicle is sounding a siren: move to allow passage; drive as closely as possible to the right curb or edge of a two-way roadway (on one-way streets, the nearest curb, left or right); stop until it has passed, and check that no other emergency vehicles are approaching.", "h": "Two-way and one-way roads have different rules.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Emergency vehicles", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency vehicles, PDF p.87"}, {"id": "V284", "q": "Driving an ambulance with lights and siren on, you approach a pedestrian crossing. The Commercial Guide says to:", "o": ["Be even more careful, since many pedestrians may not know you are coming", "Keep your speed, because pedestrians must always yield to a vehicle using its siren", "Sound the horn instead of the siren so they hear you", "Switch off the siren so you do not startle children"], "a": 0, "ex": "Be even more careful at pedestrian crossings. Many pedestrians, including school children, may not be aware that an ambulance is coming toward them.", "h": "Who may not hear or see you coming?", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V285", "q": "When is it legal to reverse a SCHOOL bus on school grounds, or at a location next to school grounds?", "o": ["Only with a responsible person outside at the rear giving direction", "Never allowed, not even with someone directing from outside", "Any time, as long as you check all of your mirrors very carefully before you start", "Any time the hazard lights are on and you sound the horn first"], "a": 0, "ex": "It is illegal to reverse a school bus on school grounds, or at a location next to school grounds, unless there is a responsible person located outside at the rear of the bus giving direction.", "h": "Someone has to be standing in a particular spot.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Special information for reversing a bus (Class 2 or Class 4)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special information for reversing a bus (Class 2 or Class 4), PDF p.90"}, {"id": "V286", "q": "In a passenger-side turnaround, once the bus is stopped in position and traffic is clear, the Commercial Guide says to:", "o": ["Sound the horn, turn on hazard lights, and shift into reverse", "Activate the alternately flashing amber lights, then reverse", "Signal left, open the door, and back out slowly at engine idle speed", "Shift into reverse, then sound the horn once per bus-length"], "a": 0, "ex": "Passenger-side turnaround: stop in position, check traffic in all directions, then sound the horn, turn on hazard lights and shift into reverse. Slowly reverse until your right rear wheels line up with the side road entry point.", "h": "A sound and a light come before the gear.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Passenger-side turnaround", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Passenger-side turnaround, PDF p.91"}, {"id": "V287", "q": "During a passenger-side turnaround, you slowly reverse until you see which line up with the side road entry point?", "o": ["Your right rear wheels", "Your left rear wheels", "Your front bumper", "Your right front wheels"], "a": 0, "ex": "Slowly begin reversing until you see your right rear wheels line up with the side road entry point. Then begin turning the steering wheel to the right as the rear of the bus enters the side road.", "h": "The side road is on the passenger side; the bus pivots on its back axle.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Passenger-side turnaround", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Passenger-side turnaround, PDF p.91"}, {"id": "V288", "q": "For a driver-side (left-side) turnaround, the Commercial Guide says to signal left at approximately:", "o": ["100 metres", "150 metres", "30 metres", "1,000 metres"], "a": 0, "ex": "Driver-side turnaround: signal left at approximately 100 metres to show your intention to turn into the next road ahead.", "h": "Neither the shortest nor the longest choice.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Driver-side (left-side) turnaround", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Driver-side (left-side) turnaround, PDF p.91"}, {"id": "V289", "q": "Per the Commercial Guide, the ONLY time a turnaround should be done on a two-lane highway is:", "o": ["If it cannot be done on private property", "If no traffic is visible in either direction", "If a responsible person is at the rear of the bus", "If the side road is paved and wide enough"], "a": 0, "ex": "Some bus routes require a turnaround. The only time a turnaround should ever be done on a two-lane highway is if it cannot be done on private property. Turnarounds are done by backing into a road on the right; never back onto or across a highway.", "h": "Think about where else the bus could turn around.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Special information for reversing a bus (Class 2 or Class 4)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special information for reversing a bus (Class 2 or Class 4), PDF p.90"}, {"id": "V290", "q": "Driver's Guide: you are braking for a red light and are almost stopped. To finish SMOOTHLY, you:", "o": ["Release pedal pressure slightly, then reapply just before you stop", "Press harder in the last metre so the vehicle does not roll", "Pump the brake pedal quickly until the vehicle has stopped", "Shift into neutral and let the vehicle coast the rest of the way to the stop line"], "a": 0, "ex": "To finish braking smoothly, release pressure on the brake pedal slightly and then reapply pressure on the pedal just before you come to a stop.", "h": "Less, then more, in that order.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.3 The Basics of Driving, Braking, PDF p.52"}, {"id": "V291", "q": "Commercial Guide: just before your vehicle comes to a stop, you release the brakes. WHY?", "o": ["To avoid a sudden jerk or rebound", "To let the brakes cool before the next stop", "To check the brakes are still working", "To save fuel while the engine idles"], "a": 0, "ex": "When applying the brakes, press down using an even pressure and ease off as the vehicle slows. Just before the stop, release the brakes to avoid a sudden jerk or rebound. Then apply pressure to the brake pedal again to hold the vehicle while it is stopped.", "h": "Think about your passengers' heads.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "General braking information", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, General braking information, PDF p.62"}, {"id": "V292", "q": "No signs or signals here. You arrived a moment BEFORE car B, as shown. Driver's Guide: who has the right-of-way?", "o": ["Car B, the vehicle on your right", "You, because you were the first to arrive", "Whichever driver is going straight through", "Whichever driver signals and goes first"], "a": 0, "ex": "At an intersection with no traffic signs and no traffic signal lights, you must yield the right-of-way to a vehicle on your right. \"Arrived first goes first\" is the courtesy rule for three- and four-way STOPS, not for uncontrolled intersections.", "h": "No stop signs means the arrival-order rule does not apply.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61", "img": "dUncR", "cap": "Diagram (not to scale), based on the guide text"}, {"id": "V293", "q": "Driver's Guide: at a four-way STOP, you stop first and then a car stops on your RIGHT. Who should go first?", "o": ["You, the vehicle that arrived first", "The car on your right, since right always goes first", "Whichever car is going straight through", "The car on the right, once it waves you on"], "a": 0, "ex": "Three- and four-way stops are \"courtesy corners\". Courtesy is to allow the vehicle that arrived first to proceed first. If two vehicles arrive at the same time, the vehicle on the right proceeds first.", "h": "The right-hand rule here is only a tie-breaker.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Three- and four-way stops", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Three- and four-way stops, PDF p.61"}, {"id": "V294", "q": "Commercial Guide: is the driver of a bus allowed to reverse it?", "o": ["Yes, when necessary, if it can be done safely", "No, a bus is never allowed to reverse on any road", "Only on school grounds, where traffic is lower", "Only once all of the passengers are off the bus"], "a": 0, "ex": "Reversing a commercial vehicle is a hazardous movement and should only be done when absolutely necessary. When reversing cannot be avoided, great caution should be used. AR 304/2002 s.32: a driver shall not back up unless the movement can be made in safety and will not interfere with other traffic.", "h": "Hazardous is not the same as forbidden.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Reversing", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing, PDF p.87"}, {"id": "V295", "q": "Your manual-transmission bus is parked, and you need to step out while the engine keeps running. The Commercial Guide says to:", "o": ["Put it in neutral, set the parking brake, and engage fast idle", "Put it in neutral and engage fast idle; the parking brake is optional", "Shift into reverse and open the door so others hear the alarm", "Set only the parking brake, since gear position does not matter"], "a": 0, "ex": "If the engine of the bus is to remain running while the vehicle is parked: the transmission should be placed in neutral (manual transmission), the parking brake must be set, and fast idle is engaged. The parking brake must be set whenever the driver is not at the controls.", "h": "Three steps: a gear, a brake, and an engine setting.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Special information for parking a Class 2 or Class 4 vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Special information for parking a Class 2 or Class 4 vehicle, PDF p.87"}, {"id": "V296", "q": "Driver's Guide: an UNCONTROLLED intersection is one that has:", "o": ["No traffic signs and no traffic signal lights", "Stop signs on every corner, also called a courtesy corner", "Only a yield sign facing the side road", "Flashing yellow lights facing every direction"], "a": 0, "ex": "Some intersections have no traffic signs and no traffic signal lights. At these uncontrolled intersections, you must yield the right-of-way to a vehicle on your right.", "h": "Nothing is posted or lit to tell you who goes.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61"}, {"id": "V297", "q": "Commercial Guide: parked parallel to the curb on a roadway, which wheel-to-curb distance is the ONLY one the law allows?", "o": ["Up to 20 inches (half a metre)", "Up to 1 metre (3 feet), the same as for a right turn", "Up to 1.5 metres (5 feet) when the street is wide", "Touching it; any gap at all is against the law"], "a": 0, "ex": "The law requires that the wheels of a parked vehicle be no more than 50 centimetres (about 20 inches, half a metre) from the curb. The Driver's Guide (parallel parking, PDF 54) states the same rule.", "h": "A gap is fine, but a small one.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Parking on a hill", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking on a hill, PDF p.86"}, {"id": "V298", "q": "In an URBAN area, which reversing move does the Use of Highway and Rules of the Road Regulation NOT allow?", "o": ["Backing so any part of the bus enters an intersection", "Backing slowly in a straight line, using both mirrors and a guide", "Backing out of a stall after checking that the area behind is clear", "Backing a short distance when it is safe and will not interfere with traffic"], "a": 0, "ex": "Commercial Guide (Reversing, PDF 87-88, AR 304/2002 s.32-33): you may back up only if it can be done safely without interfering with other traffic, and in an urban area it is illegal to back up so that the vehicle or any portion of it enters into or is in motion within an intersection or crosswalk.", "h": "Think of where cross traffic and pedestrians meet.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Reversing", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Reversing, PDF p.88"}, {"id": "V299", "q": "Driver's Guide: you want to park near a MARKED crosswalk. You must NOT park within how far of its nearest side?", "o": ["5 metres (16 feet)", "3 metres (10 feet), the same as a stop line", "1.5 metres (5 feet), as for a driveway", "1 metre (3 feet) from the painted lines"], "a": 0, "ex": "Driver's Guide (Do not park here, PDF 57-58): do not park within five metres (16 feet) of the nearest side of a marked crosswalk; the same five metres applies to a stop or yield sign and a fire hydrant.", "h": "The same number as for a fire hydrant.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Do not park here", "g": "CG", "ref": "Alberta Driver's Guide, Ch.3 The Basics of Driving, Do not park here, PDF p.58"}, {"id": "V300", "q": "Driver's Guide: at a stop sign where there is NO stop line and NO marked crosswalk, where do you stop?", "o": ["Within 3 metres (10 feet) of the intersecting roadway", "Within 1 metre (3 feet) of the roadway, so you can see past cars", "At least 6 metres (20 feet) back from the intersecting roadway", "Exactly 5 metres (16 feet) back from the roadway, as for parking"], "a": 0, "ex": "Driver's Guide (Stop signs, PDF 61): if there is no stop line or marked crosswalk at the intersection, you must stop within three metres (10 feet) of the intersecting roadway, where you will not i
