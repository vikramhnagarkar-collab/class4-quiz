<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonight's Review — Commercial Guide topics</title>
<style>
:root{--bg:#070a11;--fg:#e6ebf5;--card:#0f1522;--card2:#141c2c;--line:#1f2a3d;--mut:#8b97ad;--ok:#22c55e;--bad:#ef4444;--acc:#3b82f6;--acc2:#60a5fa;--warn:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#13213d 0%,var(--bg) 60%);color:var(--fg);font:17px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:1040px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 30px #0006;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{display:block;width:100%;min-height:56px;margin:9px 0;padding:12px 14px;font:inherit;font-size:17px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
button:hover{border-color:#2e4466}button:active{transform:scale(.985)}
button.pri{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;text-align:center;font-weight:700;border:0;box-shadow:0 6px 18px #2563eb40}
button.hard{background:linear-gradient(135deg,#b91c1c,#f97316);box-shadow:0 6px 18px #ef444440}
button.ok{border-color:var(--ok);background:#22c55e1f}button.bad{border-color:var(--bad);background:#ef44441f}
.bar{height:6px;background:#1c2638;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#26324a;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sign{text-align:center;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}.sign img{max-height:150px;max-width:80%}.cap{font-size:12px;color:#5b6475}
.fb{font-weight:700;font-size:20px}.ref{font-size:13px;color:var(--mut)}h1{font-size:23px;margin:6px 0 4px}h2{font-size:19px}h3{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 4px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);color:var(--acc2);text-decoration:none;font-weight:600;background:var(--card2)}
nav.top{display:flex;gap:6px;max-width:1040px;margin:8px auto 0;padding:0 12px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-decoration:none;line-height:1.2;transition:all .2s}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 14px #3b82f655}
.hint{background:#3a2f0b;color:#fde68a;border:1px solid #6b5313;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;min-height:48px;padding:8px 16px;font-size:16px}button.elim{opacity:.3;text-decoration:line-through}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.cats button{font-size:14px;min-height:48px}
.grid2{display:grid;gap:10px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
/* dashboard */
.dash{position:relative;background-color:#0b1120;background-image:linear-gradient(#1a2335 1px,transparent 1px),linear-gradient(90deg,#1a2335 1px,transparent 1px);background-size:128px 128px;background-position:-1px -1px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:10px 0;box-shadow:0 10px 40px #000a;animation:fade .45s ease both}
.dtop{display:grid;grid-template-columns:1fr;gap:6px;padding:18px 14px 8px}@media(min-width:760px){.dtop{grid-template-columns:300px 1fr;padding:24px 22px 10px}}
.ringw{display:flex;justify-content:center;align-items:flex-start;padding:6px 0}@media(min-width:760px){.ringw{position:sticky;top:20px;padding-top:30px}}
.ring{position:relative;width:220px;height:220px}.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:#1e3a66;opacity:.55}.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px #3b82f688)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lab{font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase}.ring .pct{font-size:44px;font-weight:800;line-height:1.05;margin:2px 0}.ring .sub{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.tick{position:absolute;left:50%;top:50%;width:0;height:0}.tick i{position:absolute;left:-1.5px;top:-110px;width:3px;height:18px;background:var(--bad);border-radius:2px;box-shadow:0 0 6px var(--bad)}.tick b{position:absolute;left:10px;top:-116px;font-size:10px;color:#f87171;white-space:nowrap;font-weight:600}
.dom h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase;padding-right:52px}
.drow{background:#0f172acc;border:1px solid #1c2740;border-radius:10px;padding:9px 12px 8px 14px;margin:0 0 8px;position:relative;animation:fade .4s ease both}
.drow:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--c)}
.drow .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}.drow .t span:last-child{color:var(--mut);font-weight:500;white-space:nowrap}
.drow .bar{height:3px;margin-top:7px}.drow .bar i{background:var(--c)}
.rbtn{position:absolute;right:14px;top:14px;width:42px;height:42px;min-height:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:#1e293b;border:1px solid #2b3a55;font-size:20px;text-align:center;transition:transform .5s}.rbtn:hover{transform:rotate(180deg)}
.dfoot{font-size:10px;letter-spacing:.1em;color:#5d6b85;text-transform:uppercase;padding:0 18px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0d1424}
.tile{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}.tile:last-child{border-right:0}.tile .k{font-size:10.5px;letter-spacing:.1em;color:#aab6cc;text-transform:uppercase}.tile .v{font-size:22px;font-weight:800;margin-top:2px}
.drow{padding:7px 12px 7px 14px;margin-bottom:6px}@media(min-width:900px){main#app.home{display:flex;flex-direction:column}#app.home>h1{order:-2}#app.home>.hd{order:-1}}
@media(min-width:1000px){.drows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.drow .t{font-size:12.5px}}
.qwrap{animation:fade .3s ease both}
/* ADHD-friendly quiz screen */
.qbar{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:8px 12px 0;background:#070a11f2;border-bottom:1px solid var(--line)}
.qbar .pb{height:8px;background:#1c2638;border-radius:6px;overflow:hidden}.qbar .pb i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
.qbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;font-size:17px;font-weight:700}
.qbar .row #qs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar button{width:auto;min-height:48px;min-width:48px;margin:0;padding:6px 14px;font-size:15px;text-align:center;border-radius:12px}
.qbar #tm{font-size:13px;color:var(--mut);font-weight:500;padding-bottom:6px}
.qtext{font-size:22px;line-height:1.4;font-weight:700;color:#fff;margin:6px 0 4px}
.qtext strong.kw{color:#fde047;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
body.quiz button[id^=o]{min-height:64px;font-size:19px;line-height:1.35;padding:14px 16px;border-width:2px;color:#fff}
body.quiz button.ok{background:#14532d;border-color:#4ade80}body.quiz button.bad{background:#7f1d1d;border-color:#f87171}
body.quiz button.ok:before{content:'✔ ';color:#4ade80}body.quiz button.bad:before{content:'✘ ';color:#fca5a5}
.fb1{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px;line-height:1.4;border:2px solid}.fb1.y{background:#052e16;border-color:#22c55e}.fb1.n{background:#450a0a;border-color:#ef4444}
.fb1 b{font-size:20px;display:block;margin-bottom:2px}.fb1 details{margin-top:8px;font-size:15px;color:#cbd5e1}.fb1 summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--acc2)}
body.quiz .card,body.quiz .qwrap,body.quiz .drow,body.quiz .dash{animation:none!important}body.quiz button{transition:none}
body.focus nav.top,body.focus .qbar #qs,body.focus .qbar .pb,body.focus #tm,body.focus #hb,body.focus .hint,body.focus .cap,body.focus .fb1 details{display:none!important}
body.focus .qbar{background:transparent;border:0}
.r3{counter-reset:r}.r3 li{list-style:none;counter-increment:r;margin:10px 0;padding:12px 14px 12px 50px;position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:17px}
.r3 li:before{content:counter(r);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calm{font-size:18px;color:#cbd5e1}details.more{margin:12px 0}details.more>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--acc2);padding:0 4px}
/* history, weak areas, streak */
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3b1d0a,#1a1206);border:1px solid #9a3412;border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:0 6px 22px #f9731633}.streak .fl{font-size:40px;line-height:1}.streak .sn{font-size:24px;font-weight:800;color:#fdba74}.streak .ss{font-size:14px;color:#fed7aa}
.badge{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;border:1px solid #334155}.badge.rep{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.wk .wtp{display:flex;align-items:center;gap:10px;min-height:56px}.wtp .wn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.wtp .wl{flex:1;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tchip{width:auto;min-height:44px;margin:0;padding:6px 12px;font-size:14px;border-radius:999px}.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.mq{margin:8px 0}.mqh{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:16px}.mqh .mqt{flex:1}.mqh .chev{flex:none;color:var(--acc2);font-weight:800}.mqh[aria-expanded=true]{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.mqb{background:var(--card);border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px 12px;font-size:16px}.mqb .yp{color:#fca5a5}.mqb .cp{color:#86efac;font-weight:700}
.hist .avgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}.avg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.avg b{display:block;font-size:22px}.avg span{font-size:12px;color:var(--mut)}
.hl{list-style:none;padding:0;margin:8px 0 0}.hl li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.hl .hd1{color:var(--mut);font-size:13px}.hl .hm{grid-row:2;font-weight:600}.hl .hs{text-align:right;font-weight:700}.pf{text-align:right;font-size:13px;font-weight:700}.pf.p{color:var(--ok)}.pf.f{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "V1", "q": "A person or company operating a commercial truck or bus is commonly referred to as a:", "o": ["Motor carrier (or \u201ccarrier\u201d)", "Registered commercial fleet operator", "Commercial registrant", "Licensed transport agent"], "a": 0, "ex": "A person or company operating a commercial truck or bus is commonly referred to as a \u201cmotor carrier\u201d, or \u201ccarrier\u201d for short.", "h": "Think of who carries the goods or people.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V2", "q": "Under BOTH federal and provincial NSC law, a commercial passenger vehicle needs a Safety Fitness Certificate when its original manufacturer's seating capacity is:", "o": ["11 or more persons, including the driver", "11 or more persons, NOT including the driver", "15 or more persons, including the driver", "24 or more passengers"], "a": 0, "ex": "Both federal and provincial law cover a commercial passenger vehicle with an original manufacturer's seating capacity of 11 or more persons including the driver.", "h": "Count everyone in the seats.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V3", "q": "How many pieces of NSC legislation (federal or provincial) apply to a carrier at any given time?", "o": ["Only one", "Both, at all times", "Both, whenever the carrier runs buses", "None, if the carrier is a farmer"], "a": 0, "ex": "Only one piece of legislation will apply to a carrier at any given time. (Farmers are exempt under provincial law but NOT the federal regulations.)", "h": "Federal OR provincial, never both at once.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V4", "q": "Under FEDERAL hours of service, Cycle 1 allows a driver to drive until they have accumulated:", "o": ["70 hours of on-duty time in 7 consecutive days", "120 hours of on-duty time in 7 consecutive days", "70 hours of on-duty time in 14 consecutive days", "60 hours of on-duty time in 7 consecutive days"], "a": 0, "ex": "Cycle 1: 70 hours of on-duty time in seven consecutive days.", "h": "Match the cycle number to the number of weeks.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V5", "q": "Under FEDERAL hours of service, Cycle 2 allows a driver to drive until they have accumulated:", "o": ["120 hours of on-duty time in 14 consecutive days", "120 hours of on-duty time in 7 consecutive days, then a reset", "70 hours of on-duty time in 14 consecutive days", "100 hours of on-duty time in 10 days"], "a": 0, "ex": "Cycle 2: 120 hours of on-duty time in 14 consecutive days.", "h": "Match the cycle number to the number of weeks.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V6", "q": "A driver on Cycle 1 may reset accumulated hours back to zero by taking:", "o": ["36 consecutive hours off-duty", "At least 72 consecutive hours", "24 consecutive hours", "48 consecutive hours"], "a": 0, "ex": "A driver operating on cycle 1 may reset their accumulative hours back to zero by taking 36 consecutive hours off-duty.", "h": "A day and a half.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V7", "q": "A driver on Cycle 2 may reset accumulated hours to zero by taking:", "o": ["72 consecutive hours off-duty", "36 consecutive hours off-duty", "24 consecutive hours off-duty, twice in 14 days", "120 consecutive hours"], "a": 0, "ex": "A driver operating on cycle 2 may reset their accumulative hours to zero by taking 72 consecutive hours off-duty.", "h": "Three full days.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V8", "q": "A driver using Cycle 2 must take at least 24 consecutive hours off BEFORE reaching which on-duty hour?", "o": ["The 70th hour", "The 36th hour", "The 120th hour", "The 100th hour"], "a": 0, "ex": "Drivers using cycle 2 are required to take at least 24 consecutive hours off prior to reaching their 70th hour of on-duty time.", "h": "A number borrowed from the other cycle.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V9", "q": "Which statement about switching between Cycle 1 and Cycle 2 is correct?", "o": ["You cannot move from one cycle to the other without taking a reset", "You must switch to Cycle 2 after 70 hours in any week, without a reset", "You may switch at any time if your carrier agrees", "You may switch once per day, at the start of a shift"], "a": 0, "ex": "A driver cannot move from one cycle to the other without taking a reset.", "h": "Clear the hours first.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V10", "q": "Under federal rules, NO driver may drive unless they have taken at least 24 consecutive hours off in the preceding:", "o": ["14 days", "7 days", "30 consecutive days", "10 days"], "a": 0, "ex": "No driver may drive unless they have taken at least 24 consecutive hours off in the preceding 14 days.", "h": "Same span as the longer cycle.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V11", "q": "Where must a driver indicate which cycle (1 or 2) they are operating under?", "o": ["On their daily log", "On the trip inspection report", "On a decal in the windshield", "In the carrier's safety plan only"], "a": 0, "ex": "A carrier must ensure their drivers are following cycle 1 or 2. The driver must then indicate which cycle they are operating under on their daily log.", "h": "The same paper that tracks your hours.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V12", "q": "Under FEDERAL hours of service, during a day a driver cannot drive after:", "o": ["13 hours driving or 14 hours on duty", "13 hours driving or 15 hours on duty", "12 hours driving or 16 hours on duty in a work shift", "10 hours driving or 13 hours on duty"], "a": 0, "ex": "During a day a driver cannot drive after having driven 13 hours, or after being on-duty for 14 hours. (Alberta's work-shift rule is 13 driving or 15 on duty.)", "h": "Federal is stricter than Alberta on on-duty time.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V13", "q": "A commercial vehicle that passes a Vehicle Inspection Program inspection receives:", "o": ["A Commercial Vehicle Inspection Certificate and decal", "A stamp on the driver's daily log for the inspection date", "A Safety Fitness Certificate for the carrier", "A new licence plate sticker for that year"], "a": 0, "ex": "A vehicle passing inspection will receive a Commercial Vehicle Inspection Certificate, as well as a Commercial Vehicle Inspection decal to be placed on the vehicle.", "h": "Paper plus something stuck on the vehicle.", "cat": "t3", "ch": "3 \u00b7 Vehicle Inspection Program", "sec": "Vehicle Inspection Program", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Vehicle Inspection Program, PDF p.25"}, {"id": "V14", "q": "The Commercial Guide defines a \u201ccommercial vehicle\u201d as one operated on a highway to provide transportation. Which does it NOT include?", "o": ["A private passenger vehicle", "A taxi or ride for hire vehicle", "A school bus", "A bus with 11 or more seats"], "a": 0, "ex": "A \u201ccommercial vehicle\u201d is a vehicle operated on a highway by or on behalf of a person for the purpose of providing transportation, but does not include a private passenger vehicle.", "h": "Your own family car.", "cat": "t4", "ch": "4 \u00b7 Trip inspections", "sec": "Vehicles that require inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Vehicles that require inspections, PDF p.28"}, {"id": "V15", "q": "The guide's daily walk-around procedure starts:", "o": ["At the front, then down the driver's side from front to back", "At whichever corner is closest to the driver's door, going clockwise", "At the rear, then up the passenger side from back to front", "Inside the vehicle, with the engine running"], "a": 0, "ex": "Starting at the front of the vehicle and going down the driver's side of the vehicle, from the front to the back, check the following.", "h": "Front first, then the driver's side.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V16", "q": "Under the hood (all vehicle types), what must the radiator check confirm?", "o": ["No leaks, adequate coolant level, and a proper fitting cap", "Coolant topped up to the very brim, with the cap removed to vent it", "Warm to the touch after the engine is shut off", "Painted and free of surface rust"], "a": 0, "ex": "Radiator has no leaks, has adequate coolant level, and proper fitting cap.", "h": "Three things you can see at the radiator.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V17", "q": "Under the hood, the engine fan is checked for:", "o": ["No bent, cracked, or missing blades, or loose mountings", "A fresh coat of lubricant on every blade and on the centre hub", "Proper speed with the engine at idle", "A clean, polished finish"], "a": 0, "ex": "Fan has no bent, cracked, missing blades, or loose mountings.", "h": "What could break off a spinning part?", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V18", "q": "During the under-hood check, a loose or slipping belt may cause:", "o": ["An alternator/generator warning light", "An oil pressure warning light and buzzer", "A low air pressure warning light", "A seat belt chime"], "a": 0, "ex": "All belts have correct tension and do not show signs of wear (a loose or slipping belt may cause an alternator/generator warning light).", "h": "Belts drive the part that charges the battery.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V19", "q": "Under the hood, the engine oil level should be:", "o": ["Above the \u201cadd\u201d line on the dipstick, but not over \u201cfull\u201d", "Over the \u201cfull\u201d line, to allow for burn-off on long trips", "Exactly at the \u201cadd\u201d line, so there is room to expand", "Checked only once a week"], "a": 0, "ex": "Oil level is adequate: the level should be above the line on the dipstick indicating \u201cadd\u201d, but not over the line indicating \u201cfull\u201d.", "h": "Between the two marks.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V20", "q": "Which is NOT one of the guide's under-hood battery checks?", "o": ["The battery is discharged and recharged before each trip", "No cracks, excessive corrosion, or leaks on the battery case", "Terminal connections are secure", "The battery is securely mounted"], "a": 0, "ex": "Battery has no cracks, excessive corrosion, or leaks, terminal connections are secure, battery is securely mounted.", "h": "The real checks are all things you can see.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V21", "q": "On the DRIVER'S side of a bus, which item is checked on school buses ONLY?", "o": ["Stop arm is secure and not damaged", "Body has no damage, broken or missing rivets, holes, or weld separations", "Frame and structural supports have no holes, bends, or cracks", "Clearance and marker lights work"], "a": 0, "ex": "Driver's side (Class 2 and 4): stop arm secure and not damaged (school bus only); body, frame and structural supports, retro-reflective tape (school bus only), clearance and marker lights, and suspension.", "h": "Which part only a school bus has?", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "V22", "q": "On the driver's side, checking that retro-reflective tape is clean is listed for:", "o": ["School buses only", "Every commercial vehicle", "Ambulances only", "Taxis and limousines"], "a": 0, "ex": "Retro-reflective tape is clean (school bus only).", "h": "Think yellow buses.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "V23", "q": "During the bus pre-trip, the ammeter continues to show a discharge after the engine is running. What should you do FIRST?", "o": ["Leave the bus parked and report it to your supervisor at once", "Drive the route as planned and report it at the end of the shift", "Rev the engine for a few minutes so the battery can charge back up", "Note it as a minor defect and fix it within the next 30 days"], "a": 0, "ex": "Inside the vehicle (Class 2 and Class 4): if the ammeter continues to show a discharge after the engine is running, do not operate the vehicle, and report the issue immediately to your appropriate supervisor.", "h": "Safety before schedule.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V24", "q": "Inside a bus, the restraints for a wheelchair must:", "o": ["Work and be secured, if equipped", "Be removed and stored when no wheelchair is on board", "Be checked only when a wheelchair passenger is booked", "Be tested by the passenger before the bus moves off"], "a": 0, "ex": "Inside the vehicle (Class 2 and Class 4): restraints for wheelchair work and are secured, if equipped.", "h": "Even an empty spot still gets checked.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V25", "q": "On the passenger side of a bus, the steps must be:", "o": ["Clean, and the step light works, if equipped", "Dry, with a non-slip mat taped over every step", "Painted yellow along each edge, school buses only", "Folded up and locked while the bus is being driven"], "a": 0, "ex": "Passenger side of the vehicle: steps are clean and the step light works, if equipped.", "h": "Two things: tidy, and lit.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V26", "q": "On an ambulance, the drive axle wheel rim check is:", "o": ["No cracks; wheel fasteners secure and not missing", "No rust at all; the hubcap is fitted and polished", "No dents more than 2 mm deep in the rim edge", "No cracks; one missing fastener is acceptable for one trip"], "a": 0, "ex": "Further items for Class 4 vehicles (ambulances), driver's side: drive axle wheel rim has no cracks; wheel fasteners are secure and none are missing.", "h": "Think \"cracks\" and \"fasteners\".", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Further items for Class 4 vehicles (ambulances)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Further items for Class 4 vehicles (ambulances), PDF p.37"}, {"id": "V27", "q": "The guide says the layout and locations of bus components and systems:", "o": ["May vary from one bus to another", "Are the same on every bus built to CSA standards", "Are shown in full in the Commercial Driver's Guide", "Matter only to the mechanic, not to the bus driver"], "a": 0, "ex": "Components and systems of a bus: the layout and locations of vehicle components and systems may vary from one bus to another. Consult your vehicle owner's manual.", "h": "No two are exactly alike.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Special information for buses (Class 2 and Class 4 vehicles)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Special information for buses (Class 2 and Class 4 vehicles), PDF p.41"}, {"id": "V28", "q": "At the REAR of the vehicle, how does the guide suggest checking the brake lights whenever possible?", "o": ["Have another person press the brakes while you watch", "Prop the brake pedal down with a heavy object, then walk back and check", "Look for their reflection in a window behind you", "Skip them if the dash brake warning light is off"], "a": 0, "ex": "Brake lights work, lenses are clean and not cracked (whenever possible, have another person activate the brakes while you check for proper operation).", "h": "You need a helper.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V29", "q": "At the rear of the vehicle, mud flaps must be:", "o": ["Secure, and not rubbing on the tires", "Removed in winter so snow cannot pack behind them", "Touching the road surface to catch all spray", "Any colour, as long as they reflect"], "a": 0, "ex": "Mud flaps are secure and do not rub on the tires.", "h": "Two things: attached, and clear of the tires.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V30", "q": "Which is NOT one of the rear-of-vehicle checks for ALL vehicle types?", "o": ["The fuel tank is full before every trip", "Licence plate is clean, attached securely, and its light works", "Exhaust system is secure with no visible leaks", "Doors or gates work, are closed, and secure"], "a": 0, "ex": "Rear, all vehicle types: turn signals, hazard lights, brake lights, clearance and marker lights and reflectors, licence plate and light, doors or gates, rear windows, mud flaps, and exhaust system.", "h": "Fuel is checked inside, on the gauge.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V31", "q": "At the rear, the licence plate check is that the plate is:", "o": ["Clean, attached securely, and its plate light works", "Covered with a clear tinted protector so it resists road dirt", "Stamped with the carrier's NSC number", "Mounted with tamper-proof screws only"], "a": 0, "ex": "Licence plate is clean, attached securely, licence plate light is secure and works, and the lens is clean.", "h": "Three checks; one involves a light.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V32", "q": "At the REAR of a bus, which item is checked on school buses ONLY?", "o": ["White flashing strobe light works", "Specialized equipment for persons with disabilities is secured", "Spare tire is inflated and secure, jack and tools secured", "Turn signals and hazard lights work"], "a": 0, "ex": "Rear (Class 2 and 4): alternating amber and red flashing lights, white flashing strobe light, and the rear door/emergency buzzer/seal item are school bus only; specialized equipment and spare tire, jack and tools apply to buses if equipped.", "h": "A light only yellow buses carry.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V33", "q": "At the rear of a SCHOOL bus, the rear door check is that it:", "o": ["Opens properly, closes securely, emergency buzzer works, seal not damaged", "Opens from the outside only and stays locked during every trip so no child can open it", "Is checked only once a week by maintenance staff", "Is closed; the buzzer is tested at the annual inspection"], "a": 0, "ex": "Rear door opens properly, closes securely, emergency buzzer works and rear door seal is not damaged (school bus only).", "h": "Think about an emergency exit.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V34", "q": "At the rear of a bus, specialized equipment for transporting persons with disabilities must be:", "o": ["Operating and secured properly, if equipped", "Inspected only by a licensed technician every 6 months, never by the driver", "Removed when not in use on that trip", "Folded and stored on a passenger seat"], "a": 0, "ex": "Specialized equipment for transporting persons with disabilities is operating and is secured properly, if equipped.", "h": "Works, and is tied down.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V35", "q": "In the inside-the-cab check (all vehicle types), the windshield must be clean and:", "o": ["Free of major cracks", "Free of any chip or mark at all, however small", "Tinted along the top edge to cut down glare", "Fitted with a valid inspection sticker in the corner"], "a": 0, "ex": "Inside the vehicle and engine start-up (All Vehicle Types): windshield is clean and free of major cracks.", "h": "Small chips are not the concern.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Inside the vehicle and engine start-up", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Inside the vehicle and engine start-up, PDF p.34"}, {"id": "V36", "q": "If the vehicle has a siren, the inside-the-cab check says it must:", "o": ["Work in all modes", "Be tested at full volume before each trip in traffic", "Work in at least one mode for emergency calls", "Be switched off and sealed unless a supervisor allows it"], "a": 0, "ex": "Inside the vehicle and engine start-up: siren works in all modes (if applicable).", "h": "\"All\", not \"some\".", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Inside the vehicle and engine start-up", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Inside the vehicle and engine start-up, PDF p.34"}, {"id": "V37", "q": "On the pre-trip \"Extra equipment and documentation\" checklist, which set names ONLY documents that checklist lists by name?", "o": ["Registration \u00b7 valid insurance \u00b7 VIP inspection certificate \u00b7 pre-trip inspection form", "Registration \u00b7 valid insurance \u00b7 VIP certificate \u00b7 driver's logbook \u00b7 vehicle warranty card", "Registration \u00b7 valid insurance \u00b7 purchase receipt \u00b7 pre-trip inspection form", "Registration \u00b7 owner's manual \u00b7 VIP certificate \u00b7 pre-trip inspection form"], "a": 0, "ex": "Extra equipment and documentation \u2013 All Vehicle Types: all necessary documentation is in the vehicle, for example vehicle registration and valid insurance, Vehicle Inspection Program inspection certificate, pre-trip inspection form, safety fitness certificate, permits, logbook, and other supporting documents. A warranty card, a purchase receipt, and an owner's manual are not named. (The separate Chapter 4 list, PDF p.56, adds a Bill of Lading if required.)", "h": "One extra or one swapped item ruins a set.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Extra equipment and documentation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Extra equipment and documentation, PDF p.34"}, {"id": "V38", "q": "While driving, what does the guide say about the transmission?", "o": ["An automatic should not \"slip\"; a manual should shift easily and smoothly through the entire range", "A manual should not \"slip\"; an automatic should shift easily and smoothly through the entire range", "An automatic should shift only above 2000 rpm; a manual should stay in direct drive", "Both types may \"slip\" a little when cold, as long as no warning light comes on"], "a": 0, "ex": "Transmission (Monitoring your vehicle while en route): an automatic transmission should not \"slip\" and a manual transmission should shift easily and smoothly through the entire range.", "h": "Which one can \"slip\"?", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Monitoring your vehicle while en route", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Monitoring your vehicle while en route, PDF p.39"}, {"id": "V39", "q": "When monitoring the transmission en route, which question does the guide tell you to ask?", "o": ["Are there any difficulties shifting gears?", "Has the transmission fluid been changed this year?", "Is the transmission warning light working on start-up?", "Does the engine reach 2000 rpm before every shift?"], "a": 0, "ex": "Transmission: Are there any difficulties shifting gears? When engaged in forward or reverse, the vehicle should start out smoothly and the transmission should not produce any odd metallic noises.", "h": "The guide asks about the driver's experience.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Monitoring your vehicle while en route", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Monitoring your vehicle while en route, PDF p.39"}, {"id": "V40", "q": "When changing gears, the guide says to carefully control engine speed so that:", "o": ["The shift is completed without jerking or excessive slippage", "The engine always stays below 1500 rpm in every gear you use", "The clutch is fully released before the gear lever is moved", "The tachometer drops back to idle between each and every gear"], "a": 0, "ex": "Clutch (manual transmission): when changing gears, carefully control the speed of the engine so that the shift may be completed without jerking or excessive slippage.", "h": "Smooth is the goal.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Clutch (manual transmission)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Clutch (manual transmission), PDF p.40"}, {"id": "V41", "q": "The guide says erratic or careless shifting of gears:", "o": ["Wears out the clutch and reduces its service life", "Matters only in an automatic, which can \"slip\" when rushed", "Mainly wears out the brakes, not the clutch or transmission", "Is acceptable once the clutch has been properly adjusted"], "a": 0, "ex": "Clutch (manual transmission): erratic or careless shifting of gears wears out the clutch and reduces service life.", "h": "Which part takes the abuse?", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Clutch (manual transmission)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Clutch (manual transmission), PDF p.40"}, {"id": "V42", "q": "While driving, which does the guide tell you to be aware of from the ENGINE?", "o": ["Unusual noise, vibrations, or lack of normal response", "Only the warning lights, since some noise is normal in a diesel", "The exhaust colour and the smell of oil, checked once an hour", "The fuel gauge only, so you never run the tank below one quarter"], "a": 0, "ex": "Engine: be aware of any unusual engine noise, vibrations, or lack of normal response.", "h": "Use your ears and your feel, not just the dash.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Engine", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Engine, PDF p.40"}, {"id": "V43", "q": "Which question about the steering does the guide tell you to ask while driving?", "o": ["Does it go precisely where you steer it?", "Does the wheel take fewer than two turns from lock to lock?", "Does the power steering fluid need topping up each week?", "Does the steering wheel cover show signs of wear?"], "a": 0, "ex": "Steering: Is it responsive? Is there excessive \"play\" or \"jerking\"? Is the power steering quiet? Does the vehicle steer easily? Does it go precisely where you steer it? Is steering steady in turning and over bumps?", "h": "The guide cares about how it drives.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Steering", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Steering, PDF p.40"}, {"id": "V44", "q": "The guide warns that waiting to do the post-trip inspection can result in problems that are:", "o": ["Frustrating, time consuming, and costly", "Grounds for an NSC audit of the carrier and a fine", "Recorded automatically on your driver's abstract", "A concern only for vehicles over 4,500 kg"], "a": 0, "ex": "Post-trip inspection: waiting to do the inspection can result in problems that are frustrating, time consuming, and costly.", "h": "Think about your time and money.", "cat": "t33", "ch": "7 \u00b7 Cab checks, equipment & en-route checks", "sec": "Post-trip inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Post-trip inspection, PDF p.41"}, {"id": "V45", "q": "In the guide's bus components table, the clutch PEDAL is used to:", "o": ["Disconnect the engine from the transmission when starting or shifting", "Transfer power from the engine to the transmission as a spinning disc", "Control the flow of fuel entering the combustion chamber", "Keep the vehicle motionless when parked"], "a": 0, "ex": "Primary Vehicle Controls: Clutch pedal \u2014 \"This is used to disconnect the engine from the transmission when starting the engine or shifting the gear of a vehicle.\" The clutch itself is the disc that transfers power.", "h": "What happens when you push it in?", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Primary Vehicle Controls", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Primary Vehicle Controls, PDF p.42"}, {"id": "V46", "q": "The accelerator pedal (throttle actuator) controls:", "o": ["The flow of fuel entering the combustion chamber", "The flow of air from the tanks into the brake chambers", "The amount of coolant that reaches the radiator core", "The gear selected, by disconnecting the drive wheels"], "a": 0, "ex": "Primary Vehicle Controls: Accelerator pedal/throttle actuator \u2014 \"This controls the flow of fuel entering the vehicle's combustion chamber, to adjust the speed to the corresponding gear.\"", "h": "What does the engine burn?", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Primary Vehicle Controls", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Primary Vehicle Controls, PDF p.42"}, {"id": "V47", "q": "In the Lubricating System table, the oil filter:", "o": ["Collects dirt, grime, and bits of metal before they cause engine damage", "Indicates the level of oil in the engine so you know when to add more", "Seals the oil system and keeps the oil under pressure while the engine runs", "Cools the oil through heat exchange with the outside air as you drive"], "a": 0, "ex": "Lubricating System: Oil filter \u2014 \"This collects dirt, grime, and bits of metal which must be removed before causing engine damage.\" The dipstick indicates the oil level.", "h": "A filter keeps things out.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Lubricating System", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Lubricating System, PDF p.43"}, {"id": "V48", "q": "Located on top of the filler neck, the radiator cap:", "o": ["Seals the radiator and helps maintain pressure on the coolant", "Regulates the flow of coolant as the engine temperature changes", "Shows the driver the temperature of the coolant in the engine", "Cools the engine through heat exchange as the largest cooling part"], "a": 0, "ex": "Cooling System: Radiator cap \u2014 \"Located on top of the filler neck, this seals the radiator and assists in maintaining the pressure on the coolant.\" The thermostat regulates flow; the water temperature gauge shows temperature; the radiator does the heat exchange.", "h": "A cap closes things.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Cooling System", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Cooling System, PDF p.44"}, {"id": "V49", "q": "In the Suspension System table, the shock absorber:", "o": ["Reduces body motion when a wheel moves over an uneven surface", "Needs an electric or engine-driven air pump or compressor to work", "Is the shaft on which two or more of the wheels revolve", "Spreads the weight of the bus evenly across the frame rails"], "a": 0, "ex": "Suspension System: Shock absorber \u2014 \"This assists in reducing the motion of the vehicle body when the wheel moves over on uneven surface.\" Air suspension needs the pump; the axle is the shaft.", "h": "Think bumpy roads.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Suspension System", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Suspension System, PDF p.44"}, {"id": "V50", "q": "Under the law, a first aid kit must be present on a bus and must be:", "o": ["Easily accessible by the driver", "Locked in a compartment only the driver can open", "Stored at the rear, beside the emergency exit", "Checked and sealed by a mechanic once a year"], "a": 0, "ex": "Auxiliary Equipment: First aid kit on a bus \u2014 \"Under the law, this must be present on a bus and must be located in a way that is easily accessible by the driver.\"", "h": "Who needs to reach it fast?", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Auxiliary Equipment", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Auxiliary Equipment, PDF p.45"}, {"id": "V51", "q": "In the ignition switch table, light controls and adjustments are used to:", "o": ["Turn exterior lights on or off and adjust the beam level", "Turn the signal lights on or off when you change lanes or turn", "Activate the main electrical systems for the whole vehicle", "Control the opening, closing, and locking of the doors"], "a": 0, "ex": "Ignition Switch table: Light controls and adjustments \u2014 \"This is used to turn on or off the exterior lights and to adjust the light beam level.\" Signal control switches turn the signal lights on or off.", "h": "Two jobs: on/off and up/down.", "cat": "t34", "ch": "8 \u00b7 Bus components & systems", "sec": "Components and systems of a bus: Ignition Switch", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Components and systems of a bus: Ignition Switch, PDF p.48"}, {"id": "V52", "q": "The yellow anti-lock brake system (ABS) light comes on WHILE you are driving. It means:", "o": ["The ABS is inoperative", "At least one hydraulic brake system is not working properly", "The wheels are locking, so you should pump the brake pedal", "The park brake is still partly applied and needs releasing"], "a": 0, "ex": "Warning lights: Anti-lock brake system \u2014 Yellow \u2014 \"This is displayed during starting, and then goes off. If warning light comes on while you are driving, it means the ABS is inoperative.\" A problem with a hydraulic brake system is shown by the RED service brake light.", "h": "The light is about the system itself.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Warning lights and indicator symbols", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Warning lights and indicator symbols, PDF p.49"}, {"id": "V53", "q": "With a dual brake system, the red service brake light comes on during hard braking. This could mean:", "o": ["At least one brake hydraulic system is not operating properly", "The ABS is working normally to keep the wheels from locking", "The brake pads are new and still bedding in to the rotors", "The parking brake was left partly applied before you drove"], "a": 0, "ex": "Warning lights: Service brake \u2014 Red \u2014 \"With a dual brake system, if this light comes on during hard braking application, this could indicate that at least one of the brake hydraulic systems is not operating properly.\"", "h": "Dual means two of something.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Warning lights and indicator symbols", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Warning lights and indicator symbols, PDF p.48"}, {"id": "V54", "q": "In the guide's warning-light table, the high-beam indicator is:", "o": ["Blue", "Green", "Yellow", "Red"], "a": 0, "ex": "Warning lights: High beams \u2014 Blue \u2014 \"Displays when high-beam lights are on.\"", "h": "It matches the low coolant light.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Warning lights and indicator symbols", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Warning lights and indicator symbols, PDF p.49"}, {"id": "V55", "q": "The yellow diesel particulate filter light displays when:", "o": ["The particulate trap is plugged or regeneration is disabled", "The diesel exhaust fluid tank is low and needs to be refilled", "The exhaust gas temperature has become hot", "Nitrogen oxide emissions are higher than normal"], "a": 0, "ex": "Warning lights: Diesel particulate filter \u2014 Yellow \u2014 \"Displays when the diesel particulate trap is plugged or when the regeneration operation is disabled.\" Hot exhaust gas has its own yellow light (high exhaust system temperature).", "h": "A filter can get blocked.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Warning lights and indicator symbols", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Warning lights and indicator symbols, PDF p.49"}, {"id": "V56", "q": "In the bus inspection summary, which WINDOW check is listed?", "o": ["The driver's window can be opened on the inside", "All passenger windows can be opened from the outside", "Emergency windows stay sealed shut until they are needed", "Tinted film covers the top 25 mm of the windshield"], "a": 0, "ex": "Summary \u2014 Windows: cracks, discolouration, sharp edges or missing parts; chips in the wiper-swept area not greater than 25 mm; driver's window can be opened on the inside; emergency window(s) operate smoothly and seals are in good condition.", "h": "Think about who might need to open it.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection, PDF p.50"}, {"id": "V57", "q": "For the UNDERBODY, the bus inspection summary says to look for structural damage, deformations, perforations, or:", "o": ["Openings not designed by the manufacturer", "Any dirt or mud build-up under the floor", "Undercoating that is thinner than 25 mm", "Rust spots larger than a two-dollar coin"], "a": 0, "ex": "Summary \u2014 Underbody: \"Structural damage, deformations, perforations, or presence of openings not designed by the manufacturer.\"", "h": "Holes that should not be there.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection, PDF p.50"}, {"id": "V58", "q": "In the bus inspection summary, the power steering drive belt must not be:", "o": ["Missing, cut, frayed, or badly worn", "Tightened more than once in a single shift", "Visible to the driver from the driver's seat", "Older than the bus's last VIP inspection"], "a": 0, "ex": "Summary \u2014 Steering Components: \"The power steering drive belt must not be missing, cut, frayed, or badly worn\"; linkage not loose or damaged; bolts, nuts, clamps not missing or badly worn.", "h": "Look at the belt's condition.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection, PDF p.51"}, {"id": "V59", "q": "If the service door has frost-resistant glass panels, the interior inspection summary says heated air:", "o": ["Does not have to be delivered to the door glass panels", "Must still reach the door glass panels at full heat", "Must reach the door glass panels in winter months only", "Must reach the door glass from a separate door heater"], "a": 0, "ex": "Interior Inspection \u2014 Heating and Defrosting Systems: \"If the service door is equipped with frost-resistant glass panels, heated air does not have to be delivered to door glass panels.\"", "h": "The glass already resists frost.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection: Interior Inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection: Interior Inspection, PDF p.53"}, {"id": "V60", "q": "Per the interior inspection summary, total brake pedal travel under heavy force must not exceed:", "o": ["80% of the total available travel", "50% of the total available travel", "70% of the total available travel", "90% of the total available travel"], "a": 0, "ex": "Interior Inspection \u2014 Brake Pedal: \"Total pedal travel does not exceed 80% of the total available travel when heavy force is applied.\"", "h": "Most of the way, but not nearly all.", "cat": "t35", "ch": "9 \u00b7 Warning lights & bus inspection summary", "sec": "Summary of what to look for during a bus inspection: Interior Inspection", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Summary of what to look for during a bus inspection: Interior Inspection, PDF p.53"}, {"id": "V61", "q": "The guide says stopping a moving vehicle takes three actions. In order, they are:", "o": ["See, Think, Do", "Signal, Brake, Stop", "Think, See, Do", "Look, Listen, React"], "a": 0, "ex": "See \u2013 a hazard; Think \u2013 decide to stop; Do \u2013 place foot on the brake pedal until the vehicle stops.", "h": "Notice it, decide, act.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V62", "q": "Which is NOT one of the four factors the Commercial Guide says affect a commercial vehicle's stopping distance?", "o": ["Engine size", "Brake condition", "Traction", "Weight (GVW)"], "a": 0, "ex": "The four factors are traction, brake condition, weight (GVW), and speed.", "h": "Three are about the vehicle on the road; one is under the hood.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V63", "q": "When does a vehicle have the MOST traction while braking?", "o": ["Just before all the wheels lock up", "When the tires are over-inflated for less road contact", "After all wheels have locked up on dry pavement", "While the wheels are skidding"], "a": 0, "ex": "There is the most traction just before all the wheels lock up. There is less traction when the wheels are skidding.", "h": "Right at the edge, not past it.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V64", "q": "If a vehicle's WEIGHT is doubled, the guide says the force needed to stop it:", "o": ["Doubles, and it takes about twice as long to stop", "Stays the same, because the heavier vehicle has better traction", "Increases four times, and it takes four times as long to stop", "Increases eight times"], "a": 0, "ex": "When the weight is doubled, the amount of force needed to stop the vehicle is doubled, and it will take about twice as long for that vehicle to stop.", "h": "Weight and force rise evenly together.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V65", "q": "If a vehicle's SPEED is doubled, the braking force needed to stop it is:", "o": ["Four times as much", "Twice as much", "Eight times as much", "Three times as much"], "a": 0, "ex": "Doubling the vehicle speed means that four times the braking force is required to bring the vehicle to a stop.", "h": "Speed counts more than weight.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V66", "q": "If BOTH the speed and the weight are doubled, the force required to stop increases by:", "o": ["Eight times", "Four times", "Sixteen times", "Six times"], "a": 0, "ex": "If both the speed and weight are doubled, the amount of force required to stop the vehicle will be increased by eight times.", "h": "Combine the two separate effects.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V67", "q": "If one or more brakes are not properly aligned or maintained, the guide says:", "o": ["The remaining brakes must generate more friction, and it takes longer to stop", "The vehicle stops in a shorter distance, because the remaining good brakes grab harder and sooner", "Nothing changes as long as the pedal feels firm", "Only the front brakes are affected"], "a": 0, "ex": "All the brakes must share the task in the same way. If one or more brakes are not properly aligned or maintained, the remaining brakes will have to generate more friction, so it will take longer to stop the vehicle.", "h": "The good brakes do extra work.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V68", "q": "The Commercial Guide measures TOTAL stopping distance from:", "o": ["When the driver realizes the need to brake until the vehicle fully stops", "When the vehicle first starts to slow down, until it rolls to a complete stop", "When the brake pedal is pressed until the vehicle fully stops", "When the wheels lock until the vehicle stops sliding"], "a": 0, "ex": "The total stopping distance is measured from the time a driver realizes the need to apply the brakes until the vehicle comes to a full stop.", "h": "It starts in your head, before your foot moves.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V69", "q": "Compared with a level road at the same speed, a vehicle travelling DOWNHILL needs:", "o": ["A longer stopping distance, because of gravity", "A shorter stopping distance, because of gravity", "The same stopping distance, if the brakes are adjusted", "A shorter distance, if the driver pumps the brakes"], "a": 0, "ex": "A vehicle travelling down a hill will need a longer stopping distance than one at the same speed on a level surface because of the effect of gravity; uphill stops in a shorter distance.", "h": "Gravity pulls you forward.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V70", "q": "Average reaction time is about three-quarters of a second. The guide says it will be SLOWER if the driver:", "o": ["Is tired, or has been drinking alcohol or using drugs", "Is an experienced driver who knows the route well", "Is driving a bus instead of a passenger car", "Keeps their foot hovering near the brake pedal"], "a": 0, "ex": "Stopping distance \u2014 Reaction time (releasing the gas pedal and applying the brake): about three-quarters of a second on average; \"Reaction time will be slower if the driver is tired or has been drinking alcohol or using drugs.\"", "h": "Think about the driver's condition.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V71", "q": "Compared with a level road at the same speed, a vehicle travelling UPHILL:", "o": ["Stops in a shorter distance, because of the grade", "Needs a longer distance, because the engine is working harder", "Stops in the same distance, since grade matters only downhill", "Needs about twice the distance, because of gravity"], "a": 0, "ex": "Stopping distance: a vehicle going down a hill needs a longer stopping distance because of gravity; \"A vehicle travelling up a hill will stop in a shorter distance than a vehicle travelling the same speed on a level surface, again because of the effect of the grade.\"", "h": "The slope is working with your brakes.", "cat": "t7", "ch": "10 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V72", "q": "Parked on the RIGHT side of the road facing DOWNHILL, with or without a curb, turn the front wheels:", "o": ["To the right", "Left with a curb, right without one", "Straight ahead", "To the left"], "a": 0, "ex": "When parking downhill, with or without a curb, the front wheels should always be turned to the right.", "h": "Downhill: one answer, curb or not.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V73", "q": "Parked on the right side of the road facing UPHILL WITH a curb, turn the front wheels:", "o": ["To the left", "Right, so the tire rests against the curb", "Straight ahead", "To the right"], "a": 0, "ex": "When parking uphill, with a curb, the front wheels should always be turned to the left.", "h": "Let the back of the tire catch the curb.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V74", "q": "Facing UPHILL with NO curb, a SINGLE UNIT vehicle (no articulation point) should have its front wheels turned:", "o": ["To the right", "To the left, as you would with a curb", "Straight ahead", "To the left"], "a": 0, "ex": "When parking uphill without a curb, a single unit vehicle should always have its front wheels turned to the right. Turning them to the left is for parking uphill WITH a curb.", "h": "With no curb, aim for the edge of the road.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "V75", "q": "You park on the LEFT side of a one-way road facing DOWNHILL. Which way do you turn the front wheels?", "o": ["To the left, the opposite of right-side parking", "Straight ahead, since one-way roads have no oncoming traffic", "To the right, the same as right-side parking", "Toward the centre of the road"], "a": 0, "ex": "The hill-parking rules apply to the right-hand side of the road. For vehicles parked on the left-hand side of the road (one-way), turn the front wheels in the opposite direction.", "h": "Flip the right-side rule.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V76", "q": "When parking on a hill with a curb, what should you do before setting the park brake?", "o": ["Let the vehicle roll until the front wheels contact the curb", "Stop at least 30 cm from the curb so the tires are not damaged", "Set the brake first, then turn the wheels", "Back up onto the curb slightly"], "a": 0, "ex": "If there is a curb, allow the vehicle to roll to the point where the front wheels are making contact with the curb before setting the park brake. This helps prevent the vehicle from jumping the curb if it starts to move.", "h": "Let the curb do some of the holding.", "cat": "t8", "ch": "11 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "V77", "q": "The guide warns that speeding increases your ______, putting vulnerable road users at higher risk if you have to make an abrupt stop.", "o": ["Stopping distance", "Following distance", "Perception time", "Turning radius"], "a": 0, "ex": "Note: Speeding increases stopping distance. This may put vulnerable road users such as pedestrians with wheelchairs, children and elderly persons at a higher risk if you have to make an abrupt stop.", "h": "Think about what happens after you hit the brakes.", "cat": "t9", "ch": "12 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V78", "q": "Which group is NOT named in the guide's speeding note as vulnerable road users at higher risk in an abrupt stop?", "o": ["Cyclists riding in a bike lane", "Pedestrians with wheelchairs", "Children", "Elderly persons"], "a": 0, "ex": "The note names pedestrians with wheelchairs, children and elderly persons.", "h": "Three of these are in the note word for word.", "cat": "t9", "ch": "12 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V79", "q": "The guide says to avoid driving BELOW the approved speed limit because it:", "o": ["May cause confusion and create a hazard for you or other drivers", "Is illegal on every Alberta highway at all times", "Is NEVER allowed, even in poor road conditions", "Increases your own stopping distance, even on dry and level roads"], "a": 0, "ex": "Avoid driving below the approved speed limit, as this may cause confusion and create a hazard for you or other drivers.", "h": "Watch for absolute words in the wrong options.", "cat": "t9", "ch": "12 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V80", "q": "When pushing a wheelchair, judge distances by the front of the:", "o": ["Foot pedals", "Seat", "Armrests", "Front wheels"], "a": 0, "ex": "Judge distances by the front of the foot pedals rather than the front of the seat.", "h": "What sticks out furthest at the front?", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V81", "q": "While pushing a wheelchair, watch at least how far ahead?", "o": ["Three metres (10 feet), in front and along the sides", "Three feet (1 metre), in front only", "Ten metres (30 feet), in front and along both sides", "Three metres (10 feet), in front only"], "a": 0, "ex": "Push the wheelchair at a normal walking speed. Watch at least three metres (10 feet) in front of you and along the sides of the wheelchair.", "h": "Check BOTH the distance and its unit, and where you look.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V82", "q": "At what speed does the guide say to push a wheelchair?", "o": ["A normal walking speed", "As fast as is comfortable for you", "A light jog on smooth pavement", "Twice normal walking speed on ramps"], "a": 0, "ex": "Push the wheelchair at a normal walking speed.", "h": "Nothing unusual about it.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V83", "q": "What should you do at LARGE bumps or cracks while pushing a wheelchair?", "o": ["Gently tilt the wheelchair over them", "Push straight over them quickly so the wheels do not catch", "Lift the whole wheelchair over them with the passenger in it", "Speed up slightly so the front wheels roll over"], "a": 0, "ex": "Watch for small cracks or bumps. Keep your pace slow. Gently tilt the wheelchair over large bumps or cracks.", "h": "Slow and gentle.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V84", "q": "Which is NOT one of the guide's general rules for assisting a person with a wheelchair?", "o": ["Release the wheelchair brakes when it is stopped, so it can move quickly", "Ensure the passenger's feet do not slip from the foot rests", "Watch out for loose handle grips or for armrests not locked into place", "Be careful not to bang the wheelchair or handle it roughly"], "a": 0, "ex": "The guide says APPLY the wheelchair brakes when the wheelchair is stopped.", "h": "One option reverses a rule.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V85", "q": "When meeting a client for the FIRST time, the guide says it is important to:", "o": ["Review the process that will be followed to transport them", "Ask them to show a doctor's note describing their disability", "Let them choose the route and speed for the whole trip", "Decide for them how much help they will need on board"], "a": 0, "ex": "\"When meeting a client for the first time, it is important to review the process that will be followed to transport the individual. This way the client will be reassured and understand what is happening.\"", "h": "Reassure them about what happens next.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "Transporting people with disabilities", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting people with disabilities, PDF p.118"}, {"id": "V86", "q": "Before loading or unloading a passenger with a mobility device, which is NOT one of the guide's things to consider?", "o": ["Where to stop so the passenger can manage without the ramp", "Where to stop so that you can be seen by other motorists", "Where to stop if your original stop is not available", "How to properly operate the loading components of the vehicle"], "a": 0, "ex": "Before loading or unloading a passenger with a mobility device, consider: where to stop so loading is faster and easier and leaves enough room for the ramp/lift; where to stop so other motorists can see you; where to stop if your original stop is not available; and how to properly operate the loading and unloading components.", "h": "One option works against the equipment.", "cat": "t10", "ch": "13 \u00b7 Assisting a wheelchair", "sec": "General rules for loading and unloading from a bus", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for loading and unloading from a bus, PDF p.119"}, {"id": "V87", "q": "What is the FIRST step in the guide's procedure for a passenger using a scooter?", "o": ["Ask the passenger to manoeuvre the scooter to a secure spot", "Turn off the scooter power", "Remove the armrest on the side of the scooter closest to the transfer area", "Assist the passenger to the seat of the vehicle"], "a": 0, "ex": "Order: manoeuvre to a secure spot, turn off power, remove armrest (or swivel seat), assist to vehicle seat, secure the scooter.", "h": "Before anything is switched off.", "cat": "t11", "ch": "14 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.118"}, {"id": "V88", "q": "In the scooter procedure, what comes right AFTER turning off the scooter power?", "o": ["Remove the armrest closest to the transfer area, or swivel the scooter seat", "Remove the armrest farthest from the transfer area, or swivel the scooter seat", "Secure the scooter, then assist the passenger", "Ask the passenger to manoeuvre the scooter to a secure spot"], "a": 0, "ex": "After turning off the power: remove the armrest on the side closest to the transfer area, or swivel the seat of the scooter.", "h": "Clear the side the passenger will move toward.", "cat": "t11", "ch": "14 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "C
