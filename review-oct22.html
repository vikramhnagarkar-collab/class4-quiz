stop easily \u00b7 slower still when slippery", "Yield to the left \u00b7 check left and right \u00b7 slow so you can stop easily \u00b7 slower still when slippery", "Yield to the right \u00b7 check to your right only \u00b7 slow so you can stop easily \u00b7 slower still when slippery", "Yield to the right \u00b7 check left and right \u00b7 stop fully every time \u00b7 slower still when slippery"], "a": 0, "ex": "At intersections without signs or signals, yield to a vehicle on your right, check left and right, reduce speed enough to stop easily (view may be blocked by fences, trees, or parked cars), and reduce more when slippery.", "h": "One word changes in each wrong set.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Uncontrolled intersections", "g": "CG", "ref": "Alberta Driver's Guide, Ch.4 Intersections and Turns, Uncontrolled intersections, PDF p.61"}, {"id": "W83", "q": "Right turn on a solid red light. Which ORDER matches the Driver's Guide?", "o": ["No prohibiting sign \u2192 complete stop at the stop line or crosswalk \u2192 yield to traffic \u2192 turn when safe", "Slow down \u2192 check for a prohibiting sign \u2192 yield to traffic \u2192 turn without stopping if the way is clear", "No prohibiting sign \u2192 stop past the crosswalk \u2192 turn \u2192 yield to traffic once in the lane", "Complete stop at the stop line \u2192 turn when clear \u2192 check for a prohibiting sign \u2192 yield"], "a": 0, "ex": "Turning right at a red light is permitted provided there is no sign prohibiting the turn. Before making the turn the vehicle must come to a complete stop before the stop line or crosswalk, then complete the turn when it is safe while yielding to any other traffic.", "h": "The sign decides whether; the stop comes before any turning.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Solid red light", "g": "CG", "ref": "Alberta Driver's Guide, Ch.2 Traffic Control, Solid red light, PDF p.24"}, {"id": "W84", "q": "Which set matches the Commercial Guide's driver-side (left-side) turnaround?", "o": ["Signal left at about 100 m \u00b7 stop, select reverse \u00b7 horn once per bus-length \u00b7 back into closest lane, not across centreline", "Signal left at about 150 metres \u00b7 stop, select reverse \u00b7 horn once per bus-length \u00b7 back into closest lane, not across centreline", "Signal left at about 100 m \u00b7 stop, select reverse \u00b7 horn once before backing \u00b7 back into closest lane, not across centreline", "Signal left at about 100 m \u00b7 stop, select reverse \u00b7 horn once per bus-length \u00b7 back across the centreline into the far lane"], "a": 0, "ex": "Driver-side turnaround: signal left at approximately 100 metres; scan mirrors and shoulder check, turn left when safe; stop and select reverse; sound horn once for every bus-length as you back into the closest lane without crossing the centreline; signal left and proceed when safe.", "h": "Check the distance, the horn, and the lane.", "cat": "t49", "ch": "48 \u00b7 Real-test misses (DG & CG)", "sec": "Driver-side (left-side) turnaround", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Driver-side (left-side) turnaround, PDF p.91"}];const IMG={"dRBentry2": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNDAgMjQwIiB3aWR0aD0iMjQwIiBoZWlnaHQ9IjI0MCI+PHJlY3Qgd2lkdGg9IjI0MCIgaGVpZ2h0PSIyNDAiIGZpbGw9IiM3Y2IzNmIiLz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iNiIgbWFya2VySGVpZ2h0PSI2IiByZWZYPSIzIiByZWZZPSIzIiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wLDAgTDYsMyBMMCw2eiIgZmlsbD0iI2ZmZWIzYiIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB4PSIxMDAiIHk9IjAiIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMjIiIGZpbGw9IiM1NTUiLz48cmVjdCB4PSIwIiB5PSIxMDAiIHdpZHRoPSIyNDAiIGhlaWdodD0iNDAiIGZpbGw9IiM1NTUiLz48Y2lyY2xlIGN4PSIxMjAiIGN5PSIxMjAiIHI9IjcwIiBmaWxsPSIjNTU1Ii8+PGNpcmNsZSBjeD0iMTIwIiBjeT0iMTIwIiByPSIzMCIgZmlsbD0iIzdjYjM2YiIvPjxjaXJjbGUgY3g9IjEyMCIgY3k9IjEyMCIg
