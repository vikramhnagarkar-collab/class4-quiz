<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonight's Review — Commercial Guide topics</title>
<style>
:root{--bg:#070a11;--fg:#e6ebf5;--card:#0f1522;--card2:#141c2c;--line:#1f2a3d;--mut:#8b97ad;--ok:#22c55e;--bad:#ef4444;--acc:#3b82f6;--acc2:#60a5fa;--warn:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#13213d 0%,var(--bg) 60%);color:var(--fg);font:17px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:1040px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 30px #0006;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{display:block;width:100%;min-height:56px;margin:9px 0;padding:12px 14px;font:inherit;font-size:17px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
button:hover{border-color:#2e4466}button:active{transform:scale(.985)}
button.pri{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;text-align:center;font-weight:700;border:0;box-shadow:0 6px 18px #2563eb40}
button.hard{background:linear-gradient(135deg,#b91c1c,#f97316);box-shadow:0 6px 18px #ef444440}
button.ok{border-color:var(--ok);background:#22c55e1f}button.bad{border-color:var(--bad);background:#ef44441f}
.bar{height:6px;background:#1c2638;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#26324a;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sign{text-align:center;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}.sign img{max-height:150px;max-width:80%}.cap{font-size:12px;color:#5b6475}
.fb{font-weight:700;font-size:20px}.ref{font-size:13px;color:var(--mut)}h1{font-size:23px;margin:6px 0 4px}h2{font-size:19px}h3{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 4px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);color:var(--acc2);text-decoration:none;font-weight:600;background:var(--card2)}
nav.top{display:flex;gap:6px;max-width:1040px;margin:8px auto 0;padding:0 12px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-decoration:none;line-height:1.2;transition:all .2s}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 14px #3b82f655}
.hint{background:#3a2f0b;color:#fde68a;border:1px solid #6b5313;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;min-height:48px;padding:8px 16px;font-size:16px}button.elim{opacity:.3;text-decoration:line-through}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.cats button{font-size:14px;min-height:48px}
.grid2{display:grid;gap:10px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
/* dashboard */
.dash{position:relative;background-color:#0b1120;background-image:linear-gradient(#1a2335 1px,transparent 1px),linear-gradient(90deg,#1a2335 1px,transparent 1px);background-size:128px 128px;background-position:-1px -1px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:10px 0;box-shadow:0 10px 40px #000a;animation:fade .45s ease both}
.dtop{display:grid;grid-template-columns:1fr;gap:6px;padding:18px 14px 8px}@media(min-width:760px){.dtop{grid-template-columns:300px 1fr;padding:24px 22px 10px}}
.ringw{display:flex;justify-content:center;align-items:flex-start;padding:6px 0}@media(min-width:760px){.ringw{position:sticky;top:20px;padding-top:30px}}
.ring{position:relative;width:220px;height:220px}.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:#1e3a66;opacity:.55}.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px #3b82f688)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lab{font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase}.ring .pct{font-size:44px;font-weight:800;line-height:1.05;margin:2px 0}.ring .sub{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.tick{position:absolute;left:50%;top:50%;width:0;height:0}.tick i{position:absolute;left:-1.5px;top:-110px;width:3px;height:18px;background:var(--bad);border-radius:2px;box-shadow:0 0 6px var(--bad)}.tick b{position:absolute;left:10px;top:-116px;font-size:10px;color:#f87171;white-space:nowrap;font-weight:600}
.dom h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase;padding-right:52px}
.drow{background:#0f172acc;border:1px solid #1c2740;border-radius:10px;padding:9px 12px 8px 14px;margin:0 0 8px;position:relative;animation:fade .4s ease both}
.drow:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--c)}
.drow .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}.drow .t span:last-child{color:var(--mut);font-weight:500;white-space:nowrap}
.drow .bar{height:3px;margin-top:7px}.drow .bar i{background:var(--c)}
.rbtn{position:absolute;right:14px;top:14px;width:42px;height:42px;min-height:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:#1e293b;border:1px solid #2b3a55;font-size:20px;text-align:center;transition:transform .5s}.rbtn:hover{transform:rotate(180deg)}
.dfoot{font-size:10px;letter-spacing:.1em;color:#5d6b85;text-transform:uppercase;padding:0 18px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0d1424}
.tile{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}.tile:last-child{border-right:0}.tile .k{font-size:10.5px;letter-spacing:.1em;color:#aab6cc;text-transform:uppercase}.tile .v{font-size:22px;font-weight:800;margin-top:2px}
.drow{padding:7px 12px 7px 14px;margin-bottom:6px}@media(min-width:900px){main#app.home{display:flex;flex-direction:column}#app.home>h1{order:-2}#app.home>.hd{order:-1}}
@media(min-width:1000px){.drows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.drow .t{font-size:12.5px}}
.qwrap{animation:fade .3s ease both}
/* ADHD-friendly quiz screen */
.qbar{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:8px 12px 0;background:#070a11f2;border-bottom:1px solid var(--line)}
.qbar .pb{height:8px;background:#1c2638;border-radius:6px;overflow:hidden}.qbar .pb i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
.qbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;font-size:17px;font-weight:700}
.qbar .row #qs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar button{width:auto;min-height:48px;min-width:48px;margin:0;padding:6px 14px;font-size:15px;text-align:center;border-radius:12px}
.qbar #tm{font-size:13px;color:var(--mut);font-weight:500;padding-bottom:6px}
.qtext{font-size:22px;line-height:1.4;font-weight:700;color:#fff;margin:6px 0 4px}
.qtext strong.kw{color:#fde047;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
body.quiz button[id^=o]{min-height:64px;font-size:19px;line-height:1.35;padding:14px 16px;border-width:2px;color:#fff}
body.quiz button.ok{background:#14532d;border-color:#4ade80}body.quiz button.bad{background:#7f1d1d;border-color:#f87171}
body.quiz button.ok:before{content:'✔ ';color:#4ade80}body.quiz button.bad:before{content:'✘ ';color:#fca5a5}
.fb1{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px;line-height:1.4;border:2px solid}.fb1.y{background:#052e16;border-color:#22c55e}.fb1.n{background:#450a0a;border-color:#ef4444}
.fb1 b{font-size:20px;display:block;margin-bottom:2px}.fb1 details{margin-top:8px;font-size:15px;color:#cbd5e1}.fb1 summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--acc2)}
body.quiz .card,body.quiz .qwrap,body.quiz .drow,body.quiz .dash{animation:none!important}body.quiz button{transition:none}
body.focus nav.top,body.focus .qbar #qs,body.focus .qbar .pb,body.focus #tm,body.focus #hb,body.focus .hint,body.focus .cap,body.focus .fb1 details{display:none!important}
body.focus .qbar{background:transparent;border:0}
.r3{counter-reset:r}.r3 li{list-style:none;counter-increment:r;margin:10px 0;padding:12px 14px 12px 50px;position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:17px}
.r3 li:before{content:counter(r);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calm{font-size:18px;color:#cbd5e1}details.more{margin:12px 0}details.more>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--acc2);padding:0 4px}
/* history, weak areas, streak */
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3b1d0a,#1a1206);border:1px solid #9a3412;border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:0 6px 22px #f9731633}.streak .fl{font-size:40px;line-height:1}.streak .sn{font-size:24px;font-weight:800;color:#fdba74}.streak .ss{font-size:14px;color:#fed7aa}
.badge{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;border:1px solid #334155}.badge.rep{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.wk .wtp{display:flex;align-items:center;gap:10px;min-height:56px}.wtp .wn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.wtp .wl{flex:1;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tchip{width:auto;min-height:44px;margin:0;padding:6px 12px;font-size:14px;border-radius:999px}.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.mq{margin:8px 0}.mqh{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:16px}.mqh .mqt{flex:1}.mqh .chev{flex:none;color:var(--acc2);font-weight:800}.mqh[aria-expanded=true]{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.mqb{background:var(--card);border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px 12px;font-size:16px}.mqb .yp{color:#fca5a5}.mqb .cp{color:#86efac;font-weight:700}
.hist .avgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}.avg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.avg b{display:block;font-size:22px}.avg span{font-size:12px;color:var(--mut)}
.hl{list-style:none;padding:0;margin:8px 0 0}.hl li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.hl .hd1{color:var(--mut);font-size:13px}.hl .hm{grid-row:2;font-weight:600}.hl .hs{text-align:right;font-weight:700}.pf{text-align:right;font-size:13px;font-weight:700}.pf.p{color:var(--ok)}.pf.f{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "V1", "q": "A person or company operating a commercial truck or bus is commonly referred to as a:", "o": ["Motor carrier (or \u201ccarrier\u201d)", "Registered commercial fleet operator", "Commercial registrant", "Licensed transport agent"], "a": 0, "ex": "A person or company operating a commercial truck or bus is commonly referred to as a \u201cmotor carrier\u201d, or \u201ccarrier\u201d for short.", "h": "Think of who carries the goods or people.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V2", "q": "Under BOTH federal and provincial NSC law, a commercial passenger vehicle needs a Safety Fitness Certificate when its original manufacturer's seating capacity is:", "o": ["11 or more persons, including the driver", "11 or more persons, NOT including the driver", "15 or more persons, including the driver", "24 or more passengers"], "a": 0, "ex": "Both federal and provincial law cover a commercial passenger vehicle with an original manufacturer's seating capacity of 11 or more persons including the driver.", "h": "Count everyone in the seats.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V3", "q": "How many pieces of NSC legislation (federal or provincial) apply to a carrier at any given time?", "o": ["Only one", "Both, at all times", "Both, whenever the carrier runs buses", "None, if the carrier is a farmer"], "a": 0, "ex": "Only one piece of legislation will apply to a carrier at any given time. (Farmers are exempt under provincial law but NOT the federal regulations.)", "h": "Federal OR provincial, never both at once.", "cat": "t1", "ch": "1 \u00b7 NSC & Safety Fitness Certificate", "sec": "National Safety Code", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, National Safety Code, PDF p.21"}, {"id": "V4", "q": "Under FEDERAL hours of service, Cycle 1 allows a driver to drive until they have accumulated:", "o": ["70 hours of on-duty time in 7 consecutive days", "120 hours of on-duty time in 7 consecutive days", "70 hours of on-duty time in 14 consecutive days", "60 hours of on-duty time in 7 consecutive days"], "a": 0, "ex": "Cycle 1: 70 hours of on-duty time in seven consecutive days.", "h": "Match the cycle number to the number of weeks.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V5", "q": "Under FEDERAL hours of service, Cycle 2 allows a driver to drive until they have accumulated:", "o": ["120 hours of on-duty time in 14 consecutive days", "120 hours of on-duty time in 7 consecutive days, then a reset", "70 hours of on-duty time in 14 consecutive days", "100 hours of on-duty time in 10 days"], "a": 0, "ex": "Cycle 2: 120 hours of on-duty time in 14 consecutive days.", "h": "Match the cycle number to the number of weeks.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V6", "q": "A driver on Cycle 1 may reset accumulated hours back to zero by taking:", "o": ["36 consecutive hours off-duty", "At least 72 consecutive hours", "24 consecutive hours", "48 consecutive hours"], "a": 0, "ex": "A driver operating on cycle 1 may reset their accumulative hours back to zero by taking 36 consecutive hours off-duty.", "h": "A day and a half.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V7", "q": "A driver on Cycle 2 may reset accumulated hours to zero by taking:", "o": ["72 consecutive hours off-duty", "36 consecutive hours off-duty", "24 consecutive hours off-duty, twice in 14 days", "120 consecutive hours"], "a": 0, "ex": "A driver operating on cycle 2 may reset their accumulative hours to zero by taking 72 consecutive hours off-duty.", "h": "Three full days.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V8", "q": "A driver using Cycle 2 must take at least 24 consecutive hours off BEFORE reaching which on-duty hour?", "o": ["The 70th hour", "The 36th hour", "The 120th hour", "The 100th hour"], "a": 0, "ex": "Drivers using cycle 2 are required to take at least 24 consecutive hours off prior to reaching their 70th hour of on-duty time.", "h": "A number borrowed from the other cycle.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V9", "q": "Which statement about switching between Cycle 1 and Cycle 2 is correct?", "o": ["You cannot move from one cycle to the other without taking a reset", "You must switch to Cycle 2 after 70 hours in any week, without a reset", "You may switch at any time if your carrier agrees", "You may switch once per day, at the start of a shift"], "a": 0, "ex": "A driver cannot move from one cycle to the other without taking a reset.", "h": "Clear the hours first.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V10", "q": "Under federal rules, NO driver may drive unless they have taken at least 24 consecutive hours off in the preceding:", "o": ["14 days", "7 days", "30 consecutive days", "10 days"], "a": 0, "ex": "No driver may drive unless they have taken at least 24 consecutive hours off in the preceding 14 days.", "h": "Same span as the longer cycle.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V11", "q": "Where must a driver indicate which cycle (1 or 2) they are operating under?", "o": ["On their daily log", "On the trip inspection report", "On a decal in the windshield", "In the carrier's safety plan only"], "a": 0, "ex": "A carrier must ensure their drivers are following cycle 1 or 2. The driver must then indicate which cycle they are operating under on their daily log.", "h": "The same paper that tracks your hours.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V12", "q": "Under FEDERAL hours of service, during a day a driver cannot drive after:", "o": ["13 hours driving or 14 hours on duty", "13 hours driving or 15 hours on duty", "12 hours driving or 16 hours on duty in a work shift", "10 hours driving or 13 hours on duty"], "a": 0, "ex": "During a day a driver cannot drive after having driven 13 hours, or after being on-duty for 14 hours. (Alberta's work-shift rule is 13 driving or 15 on duty.)", "h": "Federal is stricter than Alberta on on-duty time.", "cat": "t2", "ch": "2 \u00b7 Hours of service (cycles)", "sec": "Hours of service (federal)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Hours of service (federal), PDF p.24"}, {"id": "V13", "q": "A commercial vehicle that passes a Vehicle Inspection Program inspection receives:", "o": ["A Commercial Vehicle Inspection Certificate and decal", "A stamp on the driver's daily log for the inspection date", "A Safety Fitness Certificate for the carrier", "A new licence plate sticker for that year"], "a": 0, "ex": "A vehicle passing inspection will receive a Commercial Vehicle Inspection Certificate, as well as a Commercial Vehicle Inspection decal to be placed on the vehicle.", "h": "Paper plus something stuck on the vehicle.", "cat": "t3", "ch": "3 \u00b7 Vehicle Inspection Program", "sec": "Vehicle Inspection Program", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Vehicle Inspection Program, PDF p.25"}, {"id": "V14", "q": "Which vehicles are exempt from the Vehicle Inspection Program when operating solely within Alberta?", "o": ["Municipal transit buses and farm trucks", "Taxis and limousines with 11 or more seats", "School buses and commercial buses", "Any bus built before 1978"], "a": 0, "ex": "As with the NSC, municipal transit buses and farm trucks are exempt from the Vehicle Inspection Program when operating solely within the borders of Alberta.", "h": "City buses, and one rural vehicle.", "cat": "t3", "ch": "3 \u00b7 Vehicle Inspection Program", "sec": "Vehicle Inspection Program", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Vehicle Inspection Program, PDF p.25"}, {"id": "V15", "q": "The Commercial Guide defines a \u201ccommercial vehicle\u201d as one operated on a highway to provide transportation. Which does it NOT include?", "o": ["A private passenger vehicle", "A taxi or ride for hire vehicle", "A school bus", "A bus with 11 or more seats"], "a": 0, "ex": "A \u201ccommercial vehicle\u201d is a vehicle operated on a highway by or on behalf of a person for the purpose of providing transportation, but does not include a private passenger vehicle.", "h": "Your own family car.", "cat": "t4", "ch": "4 \u00b7 Trip inspections & cargo", "sec": "Vehicles that require inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Vehicles that require inspections, PDF p.28"}, {"id": "V16", "q": "Cargo carried by a commercial vehicle must be secured according to the requirements of:", "o": ["NSC Standard 10", "NSC Standard 13", "The carrier's own safety plan only", "Transport Canada Standard 11"], "a": 0, "ex": "All cargo carried by a commercial vehicle must be properly secured according to NSC Standard 10, adopted in Alberta's Commercial Vehicle Safety Regulation (AR 121/2009). (Standard 13 is the inspection schedules.)", "h": "Not the inspection-schedule standard.", "cat": "t4", "ch": "4 \u00b7 Trip inspections & cargo", "sec": "Cargo securement", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Cargo securement, PDF p.25"}, {"id": "V17", "q": "If cargo is not properly secured, who could face fines and penalties?", "o": ["The driver, carrier, or shipper", "Only the carrier, since the driver follows its safety plan", "Only the driver behind the wheel", "Only the shipper who loaded it"], "a": 0, "ex": "If cargo is not properly secured, the driver, carrier, or shipper could face fines and penalties.", "h": "More than one party.", "cat": "t4", "ch": "4 \u00b7 Trip inspections & cargo", "sec": "Cargo securement", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.2 National Safety Code, Cargo securement, PDF p.26"}, {"id": "V18", "q": "The guide's daily walk-around procedure starts:", "o": ["At the front, then down the driver's side from front to back", "At whichever corner is closest to the driver's door, going clockwise", "At the rear, then up the passenger side from back to front", "Inside the vehicle, with the engine running"], "a": 0, "ex": "Starting at the front of the vehicle and going down the driver's side of the vehicle, from the front to the back, check the following.", "h": "Front first, then the driver's side.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V19", "q": "Under the hood (all vehicle types), what must the radiator check confirm?", "o": ["No leaks, adequate coolant level, and a proper fitting cap", "Coolant topped up to the very brim, with the cap removed to vent it", "Warm to the touch after the engine is shut off", "Painted and free of surface rust"], "a": 0, "ex": "Radiator has no leaks, has adequate coolant level, and proper fitting cap.", "h": "Three things you can see at the radiator.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V20", "q": "Under the hood, the engine fan is checked for:", "o": ["No bent, cracked, or missing blades, or loose mountings", "A fresh coat of lubricant on every blade and on the centre hub", "Proper speed with the engine at idle", "A clean, polished finish"], "a": 0, "ex": "Fan has no bent, cracked, missing blades, or loose mountings.", "h": "What could break off a spinning part?", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V21", "q": "During the under-hood check, a loose or slipping belt may cause:", "o": ["An alternator/generator warning light", "An oil pressure warning light and buzzer", "A low air pressure warning light", "A seat belt chime"], "a": 0, "ex": "All belts have correct tension and do not show signs of wear (a loose or slipping belt may cause an alternator/generator warning light).", "h": "Belts drive the part that charges the battery.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V22", "q": "Under the hood, the engine oil level should be:", "o": ["Above the \u201cadd\u201d line on the dipstick, but not over \u201cfull\u201d", "Over the \u201cfull\u201d line, to allow for burn-off on long trips", "Exactly at the \u201cadd\u201d line, so there is room to expand", "Checked only once a week"], "a": 0, "ex": "Oil level is adequate: the level should be above the line on the dipstick indicating \u201cadd\u201d, but not over the line indicating \u201cfull\u201d.", "h": "Between the two marks.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V23", "q": "Which is NOT one of the guide's under-hood battery checks?", "o": ["The battery is discharged and recharged before each trip", "No cracks, excessive corrosion, or leaks on the battery case", "Terminal connections are secure", "The battery is securely mounted"], "a": 0, "ex": "Battery has no cracks, excessive corrosion, or leaks, terminal connections are secure, battery is securely mounted.", "h": "The real checks are all things you can see.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Daily walk-around procedure", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Daily walk-around procedure, PDF p.32"}, {"id": "V24", "q": "On the DRIVER'S side of a bus, which item is checked on school buses ONLY?", "o": ["Stop arm is secure and not damaged", "Body has no damage, broken or missing rivets, holes, or weld separations", "Frame and structural supports have no holes, bends, or cracks", "Clearance and marker lights work"], "a": 0, "ex": "Driver's side (Class 2 and 4): stop arm secure and not damaged (school bus only); body, frame and structural supports, retro-reflective tape (school bus only), clearance and marker lights, and suspension.", "h": "Which part only a school bus has?", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "V25", "q": "On the driver's side, checking that retro-reflective tape is clean is listed for:", "o": ["School buses only", "Every commercial vehicle", "Ambulances only", "Taxis and limousines"], "a": 0, "ex": "Retro-reflective tape is clean (school bus only).", "h": "Think yellow buses.", "cat": "t5", "ch": "5 \u00b7 Walk-around: under hood & bus", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.36"}, {"id": "V26", "q": "At the REAR of the vehicle, how does the guide suggest checking the brake lights whenever possible?", "o": ["Have another person press the brakes while you watch", "Prop the brake pedal down with a heavy object, then walk back and check", "Look for their reflection in a window behind you", "Skip them if the dash brake warning light is off"], "a": 0, "ex": "Brake lights work, lenses are clean and not cracked (whenever possible, have another person activate the brakes while you check for proper operation).", "h": "You need a helper.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V27", "q": "At the rear of the vehicle, mud flaps must be:", "o": ["Secure, and not rubbing on the tires", "Removed in winter so snow cannot pack behind them", "Touching the road surface to catch all spray", "Any colour, as long as they reflect"], "a": 0, "ex": "Mud flaps are secure and do not rub on the tires.", "h": "Two things: attached, and clear of the tires.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V28", "q": "Which is NOT one of the rear-of-vehicle checks for ALL vehicle types?", "o": ["The fuel tank is full before every trip", "Licence plate is clean, attached securely, and its light works", "Exhaust system is secure with no visible leaks", "Doors or gates work, are closed, and secure"], "a": 0, "ex": "Rear, all vehicle types: turn signals, hazard lights, brake lights, clearance and marker lights and reflectors, licence plate and light, doors or gates, rear windows, mud flaps, and exhaust system.", "h": "Fuel is checked inside, on the gauge.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V29", "q": "At the rear, the licence plate check is that the plate is:", "o": ["Clean, attached securely, and its plate light works", "Covered with a clear tinted protector so it resists road dirt", "Stamped with the carrier's NSC number", "Mounted with tamper-proof screws only"], "a": 0, "ex": "Licence plate is clean, attached securely, licence plate light is secure and works, and the lens is clean.", "h": "Three checks; one involves a light.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Rear of the vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Rear of the vehicle, PDF p.33"}, {"id": "V30", "q": "At the REAR of a bus, which item is checked on school buses ONLY?", "o": ["White flashing strobe light works", "Specialized equipment for persons with disabilities is secured", "Spare tire is inflated and secure, jack and tools secured", "Turn signals and hazard lights work"], "a": 0, "ex": "Rear (Class 2 and 4): alternating amber and red flashing lights, white flashing strobe light, and the rear door/emergency buzzer/seal item are school bus only; specialized equipment and spare tire, jack and tools apply to buses if equipped.", "h": "A light only yellow buses carry.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V31", "q": "At the rear of a SCHOOL bus, the rear door check is that it:", "o": ["Opens properly, closes securely, emergency buzzer works, seal not damaged", "Opens from the outside only and stays locked during every trip so no child can open it", "Is checked only once a week by maintenance staff", "Is closed; the buzzer is tested at the annual inspection"], "a": 0, "ex": "Rear door opens properly, closes securely, emergency buzzer works and rear door seal is not damaged (school bus only).", "h": "Think about an emergency exit.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V32", "q": "At the rear of a bus, specialized equipment for transporting persons with disabilities must be:", "o": ["Operating and secured properly, if equipped", "Inspected only by a licensed technician every 6 months, never by the driver", "Removed when not in use on that trip", "Folded and stored on a passenger seat"], "a": 0, "ex": "Specialized equipment for transporting persons with disabilities is operating and is secured properly, if equipped.", "h": "Works, and is tied down.", "cat": "t6", "ch": "6 \u00b7 Walk-around: rear", "sec": "Additional items for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Additional items for Class 2 and Class 4 vehicles, PDF p.37"}, {"id": "V33", "q": "The guide says stopping a moving vehicle takes three actions. In order, they are:", "o": ["See, Think, Do", "Signal, Brake, Stop", "Think, See, Do", "Look, Listen, React"], "a": 0, "ex": "See \u2013 a hazard; Think \u2013 decide to stop; Do \u2013 place foot on the brake pedal until the vehicle stops.", "h": "Notice it, decide, act.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V34", "q": "Which is NOT one of the four factors the Commercial Guide says affect a commercial vehicle's stopping distance?", "o": ["Engine size", "Brake condition", "Traction", "Weight (GVW)"], "a": 0, "ex": "The four factors are traction, brake condition, weight (GVW), and speed.", "h": "Three are about the vehicle on the road; one is under the hood.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V35", "q": "When does a vehicle have the MOST traction while braking?", "o": ["Just before all the wheels lock up", "When the tires are over-inflated for less road contact", "After all wheels have locked up on dry pavement", "While the wheels are skidding"], "a": 0, "ex": "There is the most traction just before all the wheels lock up. There is less traction when the wheels are skidding.", "h": "Right at the edge, not past it.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V36", "q": "If a vehicle's WEIGHT is doubled, the guide says the force needed to stop it:", "o": ["Doubles, and it takes about twice as long to stop", "Stays the same, because the heavier vehicle has better traction", "Increases four times, and it takes four times as long to stop", "Increases eight times"], "a": 0, "ex": "When the weight is doubled, the amount of force needed to stop the vehicle is doubled, and it will take about twice as long for that vehicle to stop.", "h": "Weight and force rise evenly together.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V37", "q": "If a vehicle's SPEED is doubled, the braking force needed to stop it is:", "o": ["Four times as much", "Twice as much", "Eight times as much", "Three times as much"], "a": 0, "ex": "Doubling the vehicle speed means that four times the braking force is required to bring the vehicle to a stop.", "h": "Speed counts more than weight.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V38", "q": "If BOTH the speed and the weight are doubled, the force required to stop increases by:", "o": ["Eight times", "Four times", "Sixteen times", "Six times"], "a": 0, "ex": "If both the speed and weight are doubled, the amount of force required to stop the vehicle will be increased by eight times.", "h": "Combine the two separate effects.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V39", "q": "If one or more brakes are not properly aligned or maintained, the guide says:", "o": ["The remaining brakes must generate more friction, and it takes longer to stop", "The vehicle stops in a shorter distance, because the remaining good brakes grab harder and sooner", "Nothing changes as long as the pedal feels firm", "Only the front brakes are affected"], "a": 0, "ex": "All the brakes must share the task in the same way. If one or more brakes are not properly aligned or maintained, the remaining brakes will have to generate more friction, so it will take longer to stop the vehicle.", "h": "The good brakes do extra work.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "How long does it take to stop a vehicle?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, How long does it take to stop a vehicle?, PDF p.60"}, {"id": "V40", "q": "The Commercial Guide measures TOTAL stopping distance from:", "o": ["When the driver realizes the need to brake until the vehicle fully stops", "When the air brakes begin to apply, after lag time, until the vehicle comes to a full stop", "When the brake pedal is pressed until the vehicle fully stops", "When the wheels lock until the vehicle stops sliding"], "a": 0, "ex": "The total stopping distance is measured from the time a driver realizes the need to apply the brakes until the vehicle comes to a full stop.", "h": "It starts in your head, before your foot moves.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V41", "q": "Compared with a level road at the same speed, a vehicle travelling DOWNHILL needs:", "o": ["A longer stopping distance, because of gravity", "A shorter stopping distance, because of gravity", "The same stopping distance, if the brakes are adjusted", "A shorter distance, if the driver pumps the brakes"], "a": 0, "ex": "A vehicle travelling down a hill will need a longer stopping distance than one at the same speed on a level surface because of the effect of gravity; uphill stops in a shorter distance.", "h": "Gravity pulls you forward.", "cat": "t7", "ch": "7 \u00b7 Stopping distance", "sec": "Stopping distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Stopping distance, PDF p.61"}, {"id": "V42", "q": "Parked on the RIGHT side of the road facing DOWNHILL, with or without a curb, turn the front wheels:", "o": ["To the right", "Left with a curb, right without one", "Straight ahead", "To the left"], "a": 0, "ex": "When parking downhill, with or without a curb, the front wheels should always be turned to the right.", "h": "Downhill: one answer, curb or not.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V43", "q": "Parked on the right side of the road facing UPHILL WITH a curb, turn the front wheels:", "o": ["To the left", "Right, so the tire rests against the curb", "Straight ahead", "To the right"], "a": 0, "ex": "When parking uphill, with a curb, the front wheels should always be turned to the left.", "h": "Let the back of the tire catch the curb.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V44", "q": "Facing UPHILL with NO curb, a SINGLE UNIT vehicle (no articulation point) should have its front wheels turned:", "o": ["To the right", "To the left, as you would with a curb", "Straight ahead", "To the left"], "a": 0, "ex": "When parking uphill without a curb, a single unit vehicle should always have its front wheels turned to the right. Turning them to the left is for parking uphill WITH a curb.", "h": "With no curb, aim for the edge of the road.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "V45", "q": "You park on the LEFT side of a one-way road facing DOWNHILL. Which way do you turn the front wheels?", "o": ["To the left, the opposite of right-side parking", "Straight ahead, since one-way roads have no oncoming traffic", "To the right, the same as right-side parking", "Toward the centre of the road"], "a": 0, "ex": "The hill-parking rules apply to the right-hand side of the road. For vehicles parked on the left-hand side of the road (one-way), turn the front wheels in the opposite direction.", "h": "Flip the right-side rule.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.86"}, {"id": "V46", "q": "When parking on a hill with a curb, what should you do before setting the park brake?", "o": ["Let the vehicle roll until the front wheels contact the curb", "Stop at least 30 cm from the curb so the tires are not damaged", "Set the brake first, then turn the wheels", "Back up onto the curb slightly"], "a": 0, "ex": "If there is a curb, allow the vehicle to roll to the point where the front wheels are making contact with the curb before setting the park brake. This helps prevent the vehicle from jumping the curb if it starts to move.", "h": "Let the curb do some of the holding.", "cat": "t8", "ch": "8 \u00b7 Hill parking", "sec": "Parking", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Parking, PDF p.87"}, {"id": "V47", "q": "The guide warns that speeding increases your ______, putting vulnerable road users at higher risk if you have to make an abrupt stop.", "o": ["Stopping distance", "Following distance", "Perception time", "Turning radius"], "a": 0, "ex": "Note: Speeding increases stopping distance. This may put vulnerable road users such as pedestrians with wheelchairs, children and elderly persons at a higher risk if you have to make an abrupt stop.", "h": "Think about what happens after you hit the brakes.", "cat": "t9", "ch": "9 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V48", "q": "Which group is NOT named in the guide's speeding note as vulnerable road users at higher risk in an abrupt stop?", "o": ["Cyclists riding in a bike lane", "Pedestrians with wheelchairs", "Children", "Elderly persons"], "a": 0, "ex": "The note names pedestrians with wheelchairs, children and elderly persons.", "h": "Three of these are in the note word for word.", "cat": "t9", "ch": "9 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V49", "q": "The guide says to avoid driving BELOW the approved speed limit because it:", "o": ["May cause confusion and create a hazard for you or other drivers", "Is illegal on every Alberta highway at all times", "Is NEVER allowed, even in poor road conditions", "Increases your own stopping distance, even on dry and level roads"], "a": 0, "ex": "Avoid driving below the approved speed limit, as this may cause confusion and create a hazard for you or other drivers.", "h": "Watch for absolute words in the wrong options.", "cat": "t9", "ch": "9 \u00b7 Speeding & vulnerable road users", "sec": "Passenger safety (driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (driving), PDF p.116"}, {"id": "V50", "q": "When pushing a wheelchair, judge distances by the front of the:", "o": ["Foot pedals", "Seat", "Armrests", "Front wheels"], "a": 0, "ex": "Judge distances by the front of the foot pedals rather than the front of the seat.", "h": "What sticks out furthest at the front?", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V51", "q": "While pushing a wheelchair, watch at least how far ahead?", "o": ["Three metres (10 feet), in front and along the sides", "Three feet (1 metre), in front only", "Ten metres (30 feet), in front and along both sides", "Three metres (10 feet), in front only"], "a": 0, "ex": "Push the wheelchair at a normal walking speed. Watch at least three metres (10 feet) in front of you and along the sides of the wheelchair.", "h": "Check BOTH the distance and its unit, and where you look.", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V52", "q": "At what speed does the guide say to push a wheelchair?", "o": ["A normal walking speed", "As fast as is comfortable for you", "A light jog on smooth pavement", "Twice normal walking speed on ramps"], "a": 0, "ex": "Push the wheelchair at a normal walking speed.", "h": "Nothing unusual about it.", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V53", "q": "What should you do at LARGE bumps or cracks while pushing a wheelchair?", "o": ["Gently tilt the wheelchair over them", "Push straight over them quickly so the wheels do not catch", "Lift the whole wheelchair over them with the passenger in it", "Speed up slightly so the front wheels roll over"], "a": 0, "ex": "Watch for small cracks or bumps. Keep your pace slow. Gently tilt the wheelchair over large bumps or cracks.", "h": "Slow and gentle.", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V54", "q": "Which is NOT one of the guide's general rules for assisting a person with a wheelchair?", "o": ["Release the wheelchair brakes when it is stopped, so it can move quickly", "Ensure the passenger's feet do not slip from the foot rests", "Watch out for loose handle grips or for armrests not locked into place", "Be careful not to bang the wheelchair or handle it roughly"], "a": 0, "ex": "The guide says APPLY the wheelchair brakes when the wheelchair is stopped.", "h": "One option reverses a rule.", "cat": "t10", "ch": "10 \u00b7 Assisting a wheelchair", "sec": "General rules for assisting a person with a wheelchair", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General rules for assisting a person with a wheelchair, PDF p.118"}, {"id": "V55", "q": "What is the FIRST step in the guide's procedure for a passenger using a scooter?", "o": ["Ask the passenger to manoeuvre the scooter to a secure spot", "Turn off the scooter power", "Remove the armrest on the side of the scooter closest to the transfer area", "Assist the passenger to the seat of the vehicle"], "a": 0, "ex": "Order: manoeuvre to a secure spot, turn off power, remove armrest (or swivel seat), assist to vehicle seat, secure the scooter.", "h": "Before anything is switched off.", "cat": "t11", "ch": "11 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.118"}, {"id": "V56", "q": "In the scooter procedure, what comes right AFTER turning off the scooter power?", "o": ["Remove the armrest closest to the transfer area, or swivel the scooter seat", "Remove the armrest farthest from the transfer area, or swivel the scooter seat", "Secure the scooter, then assist the passenger", "Ask the passenger to manoeuvre the scooter to a secure spot"], "a": 0, "ex": "After turning off the power: remove the armrest on the side closest to the transfer area, or swivel the seat of the scooter.", "h": "Clear the side the passenger will move toward.", "cat": "t11", "ch": "11 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "V57", "q": "What is the LAST step in the guide's scooter procedure?", "o": ["Secure the scooter", "Turn off the scooter power", "Assist the passenger to the seat of the vehicle", "Fold the scooter armrests back down"], "a": 0, "ex": "The final step is to secure the scooter, after the passenger is in the vehicle seat.", "h": "The passenger is already seated by then.", "cat": "t11", "ch": "11 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "V58", "q": "Passengers who can transfer from a scooter to a seat are:", "o": ["Encouraged to do so", "Required by law to do so", "NOT allowed to; they must stay on the scooter", "Encouraged to, but only on school buses"], "a": 0, "ex": "Passengers who can transfer to a seat are encouraged to do so.", "h": "A suggestion, not a law.", "cat": "t11", "ch": "11 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.118"}, {"id": "V59", "q": "A child who weighs less than what requires a car seat?", "o": ["18 kilograms (40 pounds)", "18 pounds (40 kilograms)", "40 kilograms (88 pounds)", "16 kilograms (36 pounds)"], "a": 0, "ex": "A child that weighs less than 18 kilograms or 40 pounds will require a car seat.", "h": "Check which number goes with which unit.", "cat": "t12", "ch": "12 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V60", "q": "It is the driver's responsibility to ensure all passengers under what AGE are properly restrained in a seat belt or car seat?", "o": ["16", "18", "14", "12"], "a": 0, "ex": "It is the driver's responsibility to ensure that all passengers under the age of 16 are properly restrained in a seat belt or a car seat.", "h": "Not the same number as the car-seat weight.", "cat": "t12", "ch": "12 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V61", "q": "The law requires the driver to ensure all of the following EXCEPT:", "o": ["A parent signs a car-seat waiver", "A child under 18 kg has a car seat", "The car seat is properly installed", "The child is properly secured in the car seat"], "a": 0, "ex": "The driver must ensure: a child under 18 kg/40 lb has a car seat, the car seat is properly installed, and the child is properly secured in it.", "h": "The guide has three duties, all on the driver.", "cat": "t12", "ch": "12 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V62", "q": "How many hazard classes of dangerous goods are there?", "o": ["Nine", "Eight", "Seven", "Six"], "a": 0, "ex": "There are nine hazard classes. The class numbers refer to classes of dangerous goods, not classes of driver's licence.", "h": "Count up to the \"miscellaneous\" class.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.121"}, {"id": "V63", "q": "Class 2 division 2.2 is:", "o": ["A non-flammable, non-toxic compressed gas", "A non-flammable, toxic compressed gas", "A flammable compressed gas", "A non-flammable, non-toxic compressed liquid"], "a": 0, "ex": "2.1 flammable compressed gas; 2.2 non-flammable, non-toxic compressed gas; 2.3 toxic compressed gas.", "h": "Two \"non\" words.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.121"}, {"id": "V64", "q": "Class 3 flammable liquids are liquids with a:", "o": ["Closed-cup flash point of less than 60.5 \u00b0C", "Open-cup flash point of less than 60.5 \u00b0C", "Closed-cup flash point of less than 65.0 \u00b0C", "Closed-cup flash point of greater than 60.5 \u00b0C"], "a": 0, "ex": "Flammable liquids: a liquid with a closed-cup flash point of less than 60.5 degrees Celsius.", "h": "Three details: cup type, direction, number.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.122"}, {"id": "V65", "q": "Division 9.2 is:", "o": ["An environmentally hazardous substance", "A dangerous waste", "Miscellaneous dangerous goods", "An infectious or toxic biological substance"], "a": 0, "ex": "9.1 miscellaneous dangerous goods; 9.2 environmentally hazardous substance; 9.3 dangerous waste.", "h": "The middle one of class 9.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "What is a dangerous good?", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), What is a dangerous good?, PDF p.123"}, {"id": "V66", "q": "A driver of dangerous goods must produce a certificate of training if asked by:", "o": ["A dangerous goods inspector", "The shipper's receiving clerk", "Any member of the public at a fuel stop", "The registry agent at licence renewal"], "a": 0, "ex": "A driver of dangerous goods is required by law to produce a certificate of training, if asked to do so by a dangerous goods inspector.", "h": "An official whose job is dangerous goods.", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "Training requirements", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), Training requirements, PDF p.121"}, {"id": "V67", "q": "A carrier hires an outside company to train its dangerous goods drivers. Who must be satisfied with the training and sign the certificate?", "o": ["The employer", "The outside training company", "The driver", "Natural Resources Canada"], "a": 0, "ex": "Carriers can provide their own training or hire someone. In all cases, the employer must be satisfied with the training and sign the certificate.", "h": "Who is responsible no matter who trains?", "cat": "t13", "ch": "13 \u00b7 Dangerous goods (basics)", "sec": "Training requirements", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.8 Transporting Dangerous Goods (Class 1 and Class 3 Vehicles), Training requirements, PDF p.121"}, {"id": "V68", "q": "When should an ambulance use its headlights during an emergency response?", "o": ["Always, along with the emergency overhead lights", "Only at night, along with the overhead lights", "Never, because they wash out the emergency overhead lights", "Only when the siren is turned off"], "a": 0, "ex": "Always use headlights along with the emergency overhead lights.", "h": "Watch for limiting words.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Defensive driving factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Defensive driving factors, PDF p.110"}, {"id": "V69", "q": "When an ambulance is operating during an emergency, the law requires:", "o": ["Sirens, since red flashing overhead lights alone are not sufficient", "Red flashing overhead lights; the siren is optional in light traffic", "Either the siren or the red flashing lights, but not both at once", "Red flashing lights, since the siren is only for night calls"], "a": 0, "ex": "Sirens are required by law when an ambulance is operating during an emergency. Using the red flashing overhead lights alone is not sufficient.", "h": "Lights alone are not enough.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Lights and sirens", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Lights and sirens, PDF p.110"}, {"id": "V70", "q": "On a four-lane highway with lights and siren activated, the guide says to:", "o": ["Stay in the left lane if possible", "Stay in the right lane if possible", "Drive on the right shoulder", "Change lanes often to find gaps"], "a": 0, "ex": "If you are driving on a four-lane highway with the lights and siren activated, stay in the left lane if possible.", "h": "Drivers ahead pull over to their right.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V71", "q": "Lack of awareness of the unit size can lead an ambulance into sideswipes on the:", "o": ["Blind right side", "Blind left side", "Rear bumper while reversing", "Front corners when turning"], "a": 0, "ex": "Lack of awareness of the unit size can lead to sideswipes on the blind right side.", "h": "The side farther from the driver.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V72", "q": "Which is NOT listed as a driving movement that can contribute to emergency-vehicle collisions?", "o": ["Using headlights with the overhead lights", "Reversing", "Poor road position", "Changing lanes"], "a": 0, "ex": "Listed: reversing, poor road position, turning, changing lanes, lack of awareness of unit size, driving too fast for conditions.", "h": "One option is something the guide tells you to do.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V73", "q": "At the scene of a collision, the ambulance driver should:", "o": ["Park to protect the injured and the attendant; keep flashing lights on and turn on the headlights", "Park to protect the injured; turn the flashing lights off so they do not dazzle passing drivers", "Park well past the scene, so traffic can flow; keep the headlights off", "Park behind the scene, then turn off all lights except the hazard lights"], "a": 0, "ex": "Park the vehicle so it protects the injured person(s) and the attendant. Keep the flashing lights activated and turn on the headlights.", "h": "More lights, not fewer.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V74", "q": "Where reasonable and safe, an emergency vehicle may be PARKED contrary to the rules ONLY while its:", "o": ["Flashing lights are operating", "Siren is operating", "Siren and flashing lights are both operating", "Hazard warning lights are operating"], "a": 0, "ex": "When parking an emergency vehicle, the law says it may, while its flashing lights are operating, be parked contrary to any provision of the Act, regulations or a municipal bylaw. No siren is needed to park.", "h": "A parked vehicle is seen, not heard.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.110"}, {"id": "V75", "q": "An emergency vehicle may exceed the speed limit and go past a stop sign without stopping ONLY while its:", "o": ["Siren is operating", "Flashing lights are operating", "Headlights and hazard lights are on", "Red flashing lights are on, with no siren"], "a": 0, "ex": "While the siren is operating, where reasonable and safe, the driver may exceed the speed limit and proceed past a stop signal or stop sign. Red flashing lights alone do not exempt the driver.", "h": "Moving exemptions need the warning everyone can hear.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V76", "q": "Which statement about emergency vehicles is NOT correct?", "o": ["It may be parked contrary to the rules ONLY while its siren is operating", "Red flashing lights alone do not exempt the driver from the Traffic Safety Act", "While its siren is operating, it has the right-of-way over all other vehicles", "Its siren shall be used only in response to an emergency, emergency call, or alarm"], "a": 0, "ex": "Parking contrary to the rules needs the flashing lights operating, not the siren. The other three statements are from the guide.", "h": "One statement mixes up parking and moving.", "cat": "t14", "ch": "14 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V77", "q": "As a taxi, limousine or ride for hire driver, your first and most important concern is:", "o": ["Safety", "Getting there by the most direct route", "Customer comfort", "Fare accuracy"], "a": 0, "ex": "Your first and most important concern is safety.", "h": "Everything else comes after this.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.110"}, {"id": "V78", "q": "You may refuse to transport a customer if:", "o": ["Your vehicle already carries the maximum allowed number of passengers", "The trip is shorter than the minimum fare distance set by your company", "The passenger has a service animal", "The passenger asks for the most direct route"], "a": 0, "ex": "You may refuse if the vehicle already carries the maximum allowed number of passengers, or a passenger is offensive or dangerous.", "h": "Only two reasons in the guide.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "V79", "q": "Which is a reason to refuse a customer, according to the guide?", "o": ["The passenger is offensive or dangerous to you or others", "The passenger speaks a language you do not", "The passenger uses a wheelchair", "The passenger wants to pay the fare with a large bill at the end of the trip"], "a": 0, "ex": "You may refuse if a passenger is offensive or dangerous to you or others.", "h": "Think about your safety and others'.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "V80", "q": "If a passenger's words or actions make you uncomfortable transporting them, the guide says to:", "o": ["Follow your employer's policies or guidelines when refusing to transport them", "Refuse, and leave them wherever you happen to be right away, without discussion", "Keep driving and say nothing until the trip ends", "Refuse only after the trip has started"], "a": 0, "ex": "If you feel uncomfortable transporting a passenger as a result of their words or actions, follow your employer's policies or guidelines when refusing.", "h": "Someone else has already set the rules.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Difficult passengers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Difficult passengers, PDF p.115"}, {"id": "V81", "q": "The requirements for a taxi permit:", "o": ["Differ by municipality, so check with yours", "Are the same everywhere in Alberta", "Are set by the federal National Safety Code", "Come with your Class 4 licence"], "a": 0, "ex": "Municipalities have different requirements for issuing a taxi permit. Check with your municipality.", "h": "Local, not provincial.", "cat": "t15", "ch": "15 \u00b7 Taxi safety & refusals", "sec": "Taxi or limousine permits", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Taxi or limousine permits, PDF p.111"}, {"id": "V82", "q": "\u201cFor hire\u201d means the vehicle owner or operator, or the operator's employer:", "o": ["Is being paid for the service the vehicle is being used to provide", "Holds a Class 4 licence and has commercial registration for the vehicle", "Carries more than 10 passengers at a time", "Has commercial plates on the vehicle"], "a": 0, "ex": "\u201cFor hire\u201d means the vehicle owner or operator, or the operator's employer, is being paid for the service the vehicle is being used to provide.", "h": "Follow the money.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V83", "q": "For the not-for-hire exception, a private passenger vehicle must carry passengers on:", "o": ["An incidental or occasional basis", "A regular, scheduled basis", "A daily basis for one employer", "An incidental basis, if paid by the hour"], "a": 0, "ex": "Not for hire when the operator drives a private passenger vehicle on an incidental or occasional basis and is compensated only in listed forms.", "h": "Now and then.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V84", "q": "Per-kilometre payment keeps a trip \"not for hire\" only if it does not exceed the tax-exempt allowance in:", "o": ["Section 7306 of the Income Tax Regulations", "Section 7036 of the Income Tax Regulations of Canada", "Section 7306 of the Traffic Safety Act", "Section 23 of the Income Tax Regulations"], "a": 0, "ex": "As payment for kilometres travelled at a rate not exceeding the tax-exempt allowance prescribed in section 7306 of the Income Tax Regulations of Canada.", "h": "Check the digits AND the law named.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V85", "q": "Which is NOT a listed out-of-pocket expense for straight reimbursement?", "o": ["An hourly wage for the driver", "Gas", "Gate passes", "Tolls"], "a": 0, "ex": "Straight reimbursement for out-of-pocket expenses directly related to the transportation, including gas, parking, gate passes and tolls.", "h": "Reimbursement, not earnings.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V86", "q": "The not-for-hire exception applies to which sections of the regulation?", "o": ["Section 23 (Class 3) and section 25 (Class 5)", "Section 25 (Class 3) and section 23 (Class 5)", "Section 23 (Class 4 licence) and section 25 (Class 5)", "Section 32 (Class 3) and section 52 (Class 5)"], "a": 0, "ex": "For the purposes of sections 23 (Class 3 licence) and 25 (Class 5 licence).", "h": "Match each number to its class.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V87", "q": "The family agreement exception covers transporting ONLY:", "o": ["The operator's family, household members, or persons the operator is legal guardian for", "The operator's family, household members, and coworkers from the same workplace", "Any friend who pays only for gas", "The operator's family members, but not legal wards"], "a": 0, "ex": "Where the operator provides transportation only to the operator's family members, members of the household, or persons for whom the operator is a legal guardian.", "h": "Three groups, all at home.", "cat": "t16", "ch": "16 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V88", "q": "Before loading your passenger(s), the guide says to park:", "o": ["At a designated space", "At any legal spot within 10 m of the door", "Double-parked with hazards on, if it is quick", "In the nearest bus stop"], "a": 0, "ex": "Park vehicle at a designated space before loading your passenger(s).", "h": "A space meant for it.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "V89", "q": "What must you ensure BEFORE closing the door on a passenger?", "o": ["The passenger is securely seated", "The meter is running", "The doors are locked", "The GPS route is entered"], "a": 0, "ex": "Ensure the passenger is securely seated before closing the door.", "h": "About the person, not the vehicle.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V90", "q": "When does the guide say to enter information in the GPS navigation system?", "o": ["Before starting the journey", "At the first red light", "While moving slowly in a parking lot", "Once the passenger says the first turn"], "a": 0, "ex": "Enter information in the GPS navigation system before starting the journey.", "h": "The vehicle is not moving yet.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V91", "q": "When should you lock the doors?", "o": ["Before you begin your journey", "After the first block", "Only at night", "Only when carrying children"], "a": 0, "ex": "Lock the doors before you begin your journey.", "h": "Same time for every trip.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V92", "q": "Which is NOT one of the guide's pre-driving procedures?", "o": ["Start driving, then tell passengers the journey has begun", "Conduct a circle check around your vehicle", "Ensure passenger seat belts are working properly", "Let your passengers know that you are about to begin the journey"], "a": 0, "ex": "Pre-driving: circle check, seat belts work, park at a designated space, passenger seated before closing door, GPS before starting, tell passengers you are ABOUT to begin, lock doors.", "h": "Two options sound alike; check the timing.", "cat": "t17", "ch": "17 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "V93", "q": "The guide's advice about HANDS-FREE cellular phones while driving is:", "o": ["Do not use them either; stop in a safe and legal place to call or text", "Use them for calls only, and stop in a safe and legal place to text", "Use them only when mounted on the dash and set up before driving", "Use them only for short calls on roads with light traffic"], "a": 0, "ex": "Using a cellular phone to make or receive a call, or receive or send a text, is a distraction. This applies to hands-free cellular telephones as well. Stop in a safe and legal place.", "h": "The guide says \"as well\".", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V94", "q": "You need to answer an urgent call from dispatch on your cell phone. The guide says to:", "o": ["Stop in a safe and legal place first", "Slow down below 50 km/h and answer", "Pull over anywhere, even where stopping is not legal", "Use speaker mode and keep both hands on the wheel"], "a": 0, "ex": "If you want to make or receive a call, or receive or send a text message, stop in a safe and legal place.", "h": "Two conditions for where you stop.", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V95", "q": "Which is NOT on the Traffic Safety Act list of distractions that carry fines?", "o": ["Talking with a passenger", "Personal grooming", "Programming portable audio players", "Reading printed materials in the vehicle"], "a": 0, "ex": "Fines list: hand-held cell phone; texting or emailing; electronic devices (laptops, video games, cameras, video entertainment displays); programming portable audio players; entering info on GPS units; reading printed materials; writing, printing or sketching; personal grooming.", "h": "Three are on the list word for word.", "cat": "t18", "ch": "18 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V96", "q": "Which of these is on the Traffic Safety Act list of f
