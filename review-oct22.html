ommercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "V89", "q": "What is the LAST step in the guide's scooter procedure?", "o": ["Secure the scooter", "Turn off the scooter power", "Assist the passenger to the seat of the vehicle", "Fold the scooter armrests back down"], "a": 0, "ex": "The final step is to secure the scooter, after the passenger is in the vehicle seat.", "h": "The passenger is already seated by then.", "cat": "t11", "ch": "14 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.119"}, {"id": "V90", "q": "Passengers who can transfer from a scooter to a seat are:", "o": ["Encouraged to do so", "Required by law to do so", "NOT allowed to; they must stay on the scooter", "Encouraged to, but only on school buses"], "a": 0, "ex": "Passengers who can transfer to a seat are encouraged to do so.", "h": "A suggestion, not a law.", "cat": "t11", "ch": "14 \u00b7 Scooter transfer", "sec": "General procedure for assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), General procedure for assisting a person with a scooter, PDF p.118"}, {"id": "V91", "q": "According to the Commercial Driver's Guide, a child who weighs less than what requires a car seat?", "o": ["18 kilograms (40 pounds)", "18 pounds (40 kilograms)", "40 kilograms (88 pounds)", "16 kilograms (36 pounds)"], "a": 0, "ex": "A child that weighs less than 18 kilograms or 40 pounds will require a car seat.", "h": "Check which number goes with which unit.", "cat": "t12", "ch": "15 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V92", "q": "It is the driver's responsibility to ensure all passengers under what AGE are properly restrained in a seat belt or car seat?", "o": ["16", "18", "14", "12"], "a": 0, "ex": "It is the driver's responsibility to ensure that all passengers under the age of 16 are properly restrained in a seat belt or a car seat.", "h": "Not the same number as the car-seat weight.", "cat": "t12", "ch": "15 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V93", "q": "According to the Commercial Driver's Guide, the law requires the driver to ensure all of the following EXCEPT:", "o": ["A parent signs a car-seat waiver", "A child under 18 kg has a car seat", "The car seat is properly installed", "The child is properly secured in the car seat"], "a": 0, "ex": "The driver must ensure: a child under 18 kg/40 lb has a car seat, the car seat is properly installed, and the child is properly secured in it.", "h": "The guide has three duties, all on the driver.", "cat": "t12", "ch": "15 \u00b7 Children & car seats", "sec": "Transporting children", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Transporting children, PDF p.119"}, {"id": "V94", "q": "When should an ambulance use its headlights during an emergency response?", "o": ["Always, along with the emergency overhead lights", "Only at night, along with the overhead lights", "Never, because they wash out the emergency overhead lights", "Only when the siren is turned off"], "a": 0, "ex": "Always use headlights along with the emergency overhead lights.", "h": "Watch for limiting words.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Defensive driving factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Defensive driving factors, PDF p.110"}, {"id": "V95", "q": "When an ambulance is operating during an emergency, the law requires:", "o": ["Sirens, since red flashing overhead lights alone are not sufficient", "Red flashing overhead lights; the siren is optional in light traffic", "Either the siren or the red flashing lights, but not both at once", "Red flashing lights, since the siren is only for night calls"], "a": 0, "ex": "Sirens are required by law when an ambulance is operating during an emergency. Using the red flashing overhead lights alone is not sufficient.", "h": "Lights alone are not enough.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Lights and sirens", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Lights and sirens, PDF p.110"}, {"id": "V96", "q": "On a four-lane highway with lights and siren activated, the guide says to:", "o": ["Stay in the left lane if possible", "Stay in the right lane if possible", "Drive on the right shoulder", "Change lanes often to find gaps"], "a": 0, "ex": "If you are driving on a four-lane highway with the lights and siren activated, stay in the left lane if possible.", "h": "Drivers ahead pull over to their right.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V97", "q": "Lack of awareness of the unit size can lead an ambulance into sideswipes on the:", "o": ["Blind right side", "Blind left side", "Rear bumper while reversing", "Front corners when turning"], "a": 0, "ex": "Lack of awareness of the unit size can lead to sideswipes on the blind right side.", "h": "The side farther from the driver.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V98", "q": "Which is NOT listed as a driving movement that can contribute to emergency-vehicle collisions?", "o": ["Using headlights with the overhead lights", "Reversing", "Poor road position", "Changing lanes"], "a": 0, "ex": "Listed: reversing, poor road position, turning, changing lanes, lack of awareness of unit size, driving too fast for conditions.", "h": "One option is something the guide tells you to do.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V99", "q": "At the scene of a collision, the ambulance driver should:", "o": ["Park to protect the injured and the attendant; keep flashing lights on and turn on the headlights", "Park to protect the injured; turn the flashing lights off so they do not dazzle passing drivers", "Park well past the scene, so traffic can flow; keep the headlights off", "Park behind the scene, then turn off all lights except the hazard lights"], "a": 0, "ex": "Park the vehicle so it protects the injured person(s) and the attendant. Keep the flashing lights activated and turn on the headlights.", "h": "More lights, not fewer.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Other factors", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Other factors, PDF p.110"}, {"id": "V100", "q": "Where reasonable and safe, an emergency vehicle may be PARKED contrary to the rules ONLY while its:", "o": ["Flashing lights are operating", "Siren is operating", "Siren and flashing lights are both operating", "Hazard warning lights are operating"], "a": 0, "ex": "When parking an emergency vehicle, the law says it may, while its flashing lights are operating, be parked contrary to any provision of the Act, regulations or a municipal bylaw. No siren is needed to park.", "h": "A parked vehicle is seen, not heard.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.110"}, {"id": "V101", "q": "An emergency vehicle may exceed the speed limit and go past a stop sign without stopping ONLY while its:", "o": ["Siren is operating", "Flashing lights are operating", "Headlights and hazard lights are on", "Red flashing lights are on, with no siren"], "a": 0, "ex": "While the siren is operating, where reasonable and safe, the driver may exceed the speed limit and proceed past a stop signal or stop sign. Red flashing lights alone do not exempt the driver.", "h": "Moving exemptions need the warning everyone can hear.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V102", "q": "Which statement about emergency vehicles is NOT correct?", "o": ["It may be parked contrary to the rules ONLY while its siren is operating", "Red flashing lights alone do not exempt the driver from the Traffic Safety Act", "While its siren is operating, it has the right-of-way over all other vehicles", "Its siren shall be used only in response to an emergency, emergency call, or alarm"], "a": 0, "ex": "Parking contrary to the rules needs the flashing lights operating, not the siren. The other three statements are from the guide.", "h": "One statement mixes up parking and moving.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Legal aspects of emergency vehicle operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Legal aspects of emergency vehicle operation, PDF p.109"}, {"id": "V103", "q": "Even during the most serious emergency, the guide says an emergency medical operator must:", "o": ["Consider the safety of others", "Keep the siren on until the patient reaches the hospital doors", "Drive at the speed limit so the exemptions are not needed", "Use the red flashing lights alone in residential areas"], "a": 0, "ex": "Legal aspects of emergency vehicle operation: \"Even during the most serious emergency, an emergency medical operator must consider the safety of others.\"", "h": "Urgency does not cancel this.", "cat": "t14", "ch": "16 \u00b7 Ambulance driving", "sec": "Emergency vehicles: Legal aspects", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Emergency vehicles: Legal aspects, PDF p.110"}, {"id": "V104", "q": "As a taxi, limousine or ride for hire driver, your first and most important concern is:", "o": ["Safety", "Getting there by the most direct route", "Customer comfort", "Fare accuracy"], "a": 0, "ex": "Your first and most important concern is safety.", "h": "Everything else comes after this.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.110"}, {"id": "V105", "q": "You may refuse to transport a customer if:", "o": ["Your vehicle already carries the maximum allowed number of passengers", "The trip is shorter than the minimum fare distance set by your company", "The passenger has a service animal", "The passenger asks for the most direct route"], "a": 0, "ex": "You may refuse if the vehicle already carries the maximum allowed number of passengers, or a passenger is offensive or dangerous.", "h": "Only two reasons in the guide.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "V106", "q": "Which is a reason to refuse a customer, according to the guide?", "o": ["The passenger is offensive or dangerous to you or others", "The passenger speaks a language you do not", "The passenger uses a wheelchair", "The passenger wants to pay the fare with a large bill at the end of the trip"], "a": 0, "ex": "You may refuse if a passenger is offensive or dangerous to you or others.", "h": "Think about your safety and others'.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111"}, {"id": "V107", "q": "If a passenger's words or actions make you uncomfortable transporting them, the guide says to:", "o": ["Follow your employer's policies or guidelines when refusing to transport them", "Refuse, and leave them wherever you happen to be right away, without discussion", "Keep driving and say nothing until the trip ends", "Refuse only after the trip has started"], "a": 0, "ex": "If you feel uncomfortable transporting a passenger as a result of their words or actions, follow your employer's policies or guidelines when refusing.", "h": "Someone else has already set the rules.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Difficult passengers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Difficult passengers, PDF p.115"}, {"id": "V108", "q": "The requirements for a taxi permit:", "o": ["Differ by municipality, so check with yours", "Are the same everywhere in Alberta", "Are set by the federal National Safety Code", "Come with your Class 4 licence"], "a": 0, "ex": "Municipalities have different requirements for issuing a taxi permit. Check with your municipality.", "h": "Local, not provincial.", "cat": "t15", "ch": "17 \u00b7 Taxi safety & refusals", "sec": "Taxi or limousine permits", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Taxi or limousine permits, PDF p.111"}, {"id": "V109", "q": "\u201cFor hire\u201d means the vehicle owner or operator, or the operator's employer:", "o": ["Is being paid for the service the vehicle is being used to provide", "Holds a Class 4 licence and has commercial registration for the vehicle", "Carries more than 10 passengers at a time", "Has commercial plates on the vehicle"], "a": 0, "ex": "\u201cFor hire\u201d means the vehicle owner or operator, or the operator's employer, is being paid for the service the vehicle is being used to provide.", "h": "Follow the money.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V110", "q": "For the not-for-hire exception, a private passenger vehicle must carry passengers on:", "o": ["An incidental or occasional basis", "A regular, scheduled basis", "A daily basis for one employer", "An incidental basis, if paid by the hour"], "a": 0, "ex": "Not for hire when the operator drives a private passenger vehicle on an incidental or occasional basis and is compensated only in listed forms.", "h": "Now and then.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V111", "q": "Per-kilometre payment keeps a trip \"not for hire\" only if it does not exceed the tax-exempt allowance in:", "o": ["Section 7306 of the Income Tax Regulations", "Section 7036 of the Income Tax Regulations of Canada", "Section 7306 of the Traffic Safety Act", "Section 23 of the Income Tax Regulations"], "a": 0, "ex": "As payment for kilometres travelled at a rate not exceeding the tax-exempt allowance prescribed in section 7306 of the Income Tax Regulations of Canada.", "h": "Check the digits AND the law named.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V112", "q": "Which is NOT a listed out-of-pocket expense for straight reimbursement?", "o": ["An hourly wage for the driver", "Gas", "Gate passes", "Tolls"], "a": 0, "ex": "Straight reimbursement for out-of-pocket expenses directly related to the transportation, including gas, parking, gate passes and tolls.", "h": "Reimbursement, not earnings.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V113", "q": "The family agreement exception covers transporting ONLY:", "o": ["The operator's family, household members, or persons the operator is legal guardian for", "The operator's family, household members, and coworkers from the same workplace", "Any friend who pays only for gas", "The operator's family members, but not legal wards"], "a": 0, "ex": "Where the operator provides transportation only to the operator's family members, members of the household, or persons for whom the operator is a legal guardian.", "h": "Three groups, all at home.", "cat": "t16", "ch": "18 \u00b7 Not for hire", "sec": "For hire", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, For hire, PDF p.111"}, {"id": "V114", "q": "Before loading your passenger(s), the guide says to park:", "o": ["At a designated space", "At any legal spot within 10 m of the door", "Double-parked with hazards on, if it is quick", "In the nearest bus stop"], "a": 0, "ex": "Park vehicle at a designated space before loading your passenger(s).", "h": "A space meant for it.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "V115", "q": "What must you ensure BEFORE closing the door on a passenger?", "o": ["The passenger is securely seated", "The meter is running", "The doors are locked", "The GPS route is entered"], "a": 0, "ex": "Ensure the passenger is securely seated before closing the door.", "h": "About the person, not the vehicle.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V116", "q": "When does the guide say to enter information in the GPS navigation system?", "o": ["Before starting the journey", "At the first red light", "While moving slowly in a parking lot", "Once the passenger says the first turn"], "a": 0, "ex": "Enter information in the GPS navigation system before starting the journey.", "h": "The vehicle is not moving yet.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V117", "q": "When should you lock the doors?", "o": ["Before you begin your journey", "After the first block", "Only at night", "Only when carrying children"], "a": 0, "ex": "Lock the doors before you begin your journey.", "h": "Same time for every trip.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.116"}, {"id": "V118", "q": "Which is NOT one of the guide's pre-driving procedures?", "o": ["Start driving, then tell passengers the journey has begun", "Conduct a circle check around your vehicle", "Ensure passenger seat belts are working properly", "Let your passengers know that you are about to begin the journey"], "a": 0, "ex": "Pre-driving: circle check, seat belts work, park at a designated space, passenger seated before closing door, GPS before starting, tell passengers you are ABOUT to begin, lock doors.", "h": "Two options sound alike; check the timing.", "cat": "t17", "ch": "19 \u00b7 Taxi pre-driving", "sec": "Passenger safety (pre-driving)", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4 Vehicles), Passenger safety (pre-driving), PDF p.115"}, {"id": "V119", "q": "The guide's advice about HANDS-FREE cellular phones while driving is:", "o": ["Do not use them either; stop in a safe and legal place to call or text", "Use them for calls only, and stop in a safe and legal place to text", "Use them only when mounted on the dash and set up before driving", "Use them only for short calls on roads with light traffic"], "a": 0, "ex": "Using a cellular phone to make or receive a call, or receive or send a text, is a distraction. This applies to hands-free cellular telephones as well. Stop in a safe and legal place.", "h": "The guide says \"as well\".", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V120", "q": "You need to answer an urgent call from dispatch on your cell phone. The guide says to:", "o": ["Stop in a safe and legal place first", "Slow down below 50 km/h and answer", "Pull over anywhere, even where stopping is not legal", "Use speaker mode and keep both hands on the wheel"], "a": 0, "ex": "If you want to make or receive a call, or receive or send a text message, stop in a safe and legal place.", "h": "Two conditions for where you stop.", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V121", "q": "Which is NOT on the Traffic Safety Act list of distractions that carry fines?", "o": ["Talking with a passenger", "Personal grooming", "Programming portable audio players", "Reading printed materials in the vehicle"], "a": 0, "ex": "Fines list: hand-held cell phone; texting or emailing; electronic devices (laptops, video games, cameras, video entertainment displays); programming portable audio players; entering info on GPS units; reading printed materials; writing, printing or sketching; personal grooming.", "h": "Three are on the list word for word.", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V122", "q": "Which of these is on the Traffic Safety Act list of fined distractions?", "o": ["Entering information on GPS units", "Using a dispatch system for transporting passengers", "Reading a gauge about the vehicle's systems", "Using a CB radio while escorting an oversized vehicle"], "a": 0, "ex": "Entering information on GPS units is on the fines list. Dispatch systems, vehicle-system gauges and CB radios when escorting oversized vehicles are allowed.", "h": "Three of these are on the \"allowed\" list.", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V123", "q": "The distracted driving law applies to:", "o": ["All vehicles as defined in the Traffic Safety Act, including bicycles and farm vehicles", "Only commercial vehicles that are defined in the Traffic Safety Act", "All motor vehicles defined in the Traffic Safety Act, but not bicycles", "Cars, trucks and motorcycles, but not farm vehicles or motor homes"], "a": 0, "ex": "It applies to all vehicles as defined in the TSA: cars, motorcycles, motor homes, truck tractors, farm vehicles, and bicycles.", "h": "Wider than you might think.", "cat": "t18", "ch": "20 \u00b7 Distracted driving", "sec": "Distracted driving laws for commercial vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws for commercial vehicles, PDF p.57"}, {"id": "V124", "q": "Two-way or hand-held (CB) radios are NOT specifically restricted when:", "o": ["Escorting oversized vehicles, contacting your employer, or in search, rescue and emergency management", "Escorting oversized vehicles, contacting your family, or in search, rescue and emergency management", "Contacting your employer, chatting with other drivers, or in search, rescue and emergency management", "Escorting any vehicle, contacting your employer, or reporting traffic to a radio station"], "a": 0, "ex": "Allowed: two-way or hand-held radios (CB) when escorting oversized vehicles, to contact one's employer, or in search, rescue, and emergency management situations.", "h": "Each wrong option swaps one part.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V125", "q": "A GPS navigation system is a permitted display screen as long as it is:", "o": ["Affixed to the vehicle and programmed before you begin driving, or voice activated", "Held in your hand and programmed before you begin driving, or voice activated", "Affixed to the vehicle and programmed only at red lights, or voice activated", "Affixed to the vehicle and programmed while moving slowly, or voice activated"], "a": 0, "ex": "GPS: as long as it is affixed to the vehicle and programmed before you begin driving or is voice activated. You cannot hold the unit or manually enter information while driving.", "h": "Where it is, and when it is set up.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V126", "q": "Dispatch computers, like those used in taxicabs, can be:", "o": ["Installed and activated, but drivers should not type into them while driving", "Installed and activated, and used to type short messages at low speed", "Installed, but they must stay switched off while the taxi is in service", "Used only by a passenger, never by the driver, while the taxi is in motion"], "a": 0, "ex": "Drivers using dispatch systems can still have mobile data computers installed and activated. Drivers should not type information into these devices while driving.", "h": "Present is fine; typing is the problem.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "V127", "q": "Tour bus drivers who want to give information to passengers should:", "o": ["Use hands-free units or other technology that complies with the law", "Hold a microphone, but only on straight and level roads", "Ignore the law, since tour buses are exempt from it", "Use any device, as long as the bus moves at a slow speed"], "a": 0, "ex": "Tour bus drivers must comply with the law and must not drive distracted. Hands-free units are available to ensure compliance.", "h": "Tour buses are NOT exempt.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.58"}, {"id": "V128", "q": "Which is NOT a permitted display screen for commercial drivers?", "o": ["A video entertainment display visible to the driver", "A gauge or system with information about the vehicle's systems", "A dispatch system for transporting passengers", "A logistics tracking system that tracks driver status"], "a": 0, "ex": "Permitted: GPS (affixed and programmed or voice activated), vehicle system/location gauges, passenger dispatch systems, logistical tracking systems. Video entertainment displays are on the fines list.", "h": "One of these is from the fines list.", "cat": "t19", "ch": "21 \u00b7 Radios & screens allowed", "sec": "Activities allowed for commercial drivers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Activities allowed for commercial drivers, PDF p.57"}, {"id": "V129", "q": "According to the guide, drowsy driving is:", "o": ["As dangerous as impaired driving", "Less dangerous than impaired driving", "Dangerous only between 2 and 6 a.m.", "Only dangerous for teenage drivers"], "a": 0, "ex": "Drowsy driving is as dangerous as impaired driving because it slows reaction time, decreases awareness and can impair judgement.", "h": "Compare it with alcohol or drugs.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V130", "q": "Which does the guide call one of the MOST common causes of drowsy driving (not just an \"other contributing factor\")?", "o": ["Lack of sleep", "Driving alone", "Driving through the night", "Taking medication that increases sleepiness"], "a": 0, "ex": "Lack of sleep is one of the most common causes. Other contributing factors: driving alone, long distances without breaks, driving through the night, medication, alcohol.", "h": "The others are listed after \"Other contributing factors\".", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V131", "q": "Most fatigue-related collisions happen between:", "o": ["1\u20134 p.m. and 2\u20136 a.m.", "2\u20136 p.m. and 1\u20134 a.m.", "1\u20134 a.m. and 2\u20136 p.m.", "12\u20133 p.m. and 3\u20136 a.m."], "a": 0, "ex": "Most fatigue-related collisions happen between 1 - 4 p.m. and early in the morning between 2 - 6 a.m.", "h": "The afternoon window is the shorter one.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V132", "q": "To prevent fatigue, schedule a break every:", "o": ["Two hours or every 160 km", "Two hours or every 200 km", "Three hours or every 160 km", "Four hours or every 100 km"], "a": 0, "ex": "Schedule a break every two hours or every 160 km. Stretch or take a walk.", "h": "Check both the time and the distance.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V133", "q": "The guide suggests a nap of how long, and when?", "o": ["20\u201340 minutes, mid-afternoon", "40\u201360 minutes, mid-afternoon", "20\u201340 minutes, after midnight", "10\u201320 minutes, mid-morning"], "a": 0, "ex": "Take a mid-afternoon break. Have a 20-40 minute nap.", "h": "Check both the length and the time of day.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V134", "q": "Which helps reduce fatigue ONLY for a short period of time?", "o": ["Drinking coffee", "Getting plenty of sleep the night before a long trip", "Travelling with an awake and alert passenger", "Scheduling a break every two hours"], "a": 0, "ex": "Turning up the radio, opening a window, drinking coffee, chewing gum, or eating help only for short periods; the other actions help prevent fatigue.", "h": "A quick fix, not prevention.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V135", "q": "Which is NOT one of the guide's warning signs of driver fatigue?", "o": ["Feeling hungry before a meal break", "Yawning", "Drifting between lanes, tailgating or missing traffic signs", "A vehicle in the mirror that seemed to appear out of nowhere"], "a": 0, "ex": "Warning signs: yawning; eyes/head; wandering thoughts; not remembering the last kilometres; drifting, tailgating, missing signs; a vehicle appearing out of nowhere in the mirror.", "h": "Three are signs your body or attention is fading.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.74"}, {"id": "V136", "q": "Which group is NOT named as most at risk of falling asleep at the wheel?", "o": ["Retired drivers over 65", "Shift workers", "Commercial drivers", "People with untreated sleep disorders"], "a": 0, "ex": "Most at risk: shift workers, commercial drivers, people with untreated sleep disorders, teenagers, and young adults.", "h": "The guide talks about young drivers, not older ones.", "cat": "t20", "ch": "22 \u00b7 Fatigue", "sec": "Preventing fatigue", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Preventing fatigue, PDF p.73"}, {"id": "V137", "q": "If there is a STOP sign at a railway crossing, stop the vehicle:", "o": ["No closer than 5 m and no further than 15 m from the nearest rail", "No closer than 15 m and no further than 50 m from the nearest rail", "No closer than 5 m and no further than 50 m from the nearest rail", "No closer than 3 m and no further than 15 m from the nearest rail"], "a": 0, "ex": "If there is a stop sign, stop no closer than five metres and no further than 15 metres (about 49 feet) from the nearest rail.", "h": "Five and fifteen.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V138", "q": "When a train is approaching a crossing, all drivers must stop no closer than ______ from the nearest rail.", "o": ["5 metres (about 16 feet)", "15 metres (about 49 feet)", "5 feet (about 1.5 metres)", "50 metres (about 164 feet)"], "a": 0, "ex": "Stop the vehicle no closer than five metres back (about 16 feet) from the nearest rail.", "h": "Check the unit.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V139", "q": "If a train is seen within what distance of the crossing, you must stop even if no signal is activated?", "o": ["500 metres", "50 metres", "150 metres", "1,000 metres"], "a": 0, "ex": "If a train is observed within 500 metres of the crossing, regardless of whether a signal is activated, the vehicle must be stopped.", "h": "Half a kilometre.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V140", "q": "Which vehicle is NOT required by law to stop at every uncontrolled railway crossing?", "o": ["A taxi carrying four passengers", "A school bus", "A vehicle carrying explosive substances as cargo", "A vehicle used for carrying flammable liquids and gas"], "a": 0, "ex": "At uncontrolled crossings the law requires a school bus, a vehicle carrying explosives, or one used for flammable liquids and gas to stop 5\u201315 m from the nearest rail.", "h": "Passengers alone do not trigger it; school children do.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V141", "q": "Which reason is NOT given for why crossings are especially hazardous for commercial vehicles?", "o": ["Heavier vehicles are less likely to be pushed off the tracks", "Longer vehicles need more time to clear a crossing", "Heavier vehicles need more time and room to stop", "Larger vehicles are more likely to derail a train"], "a": 0, "ex": "Longer vehicles need more time to clear; heavier ones need more time and room to stop; larger ones are more likely to derail a train.", "h": "One option turns weight into an advantage.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V142", "q": "While crossing railway tracks, shifting gears is:", "o": ["Prohibited, so use a gear you will not need to change", "Allowed, if the engine is about to stall on the tracks", "Required, to gain speed so you clear the tracks faster", "Allowed, as long as you do it before the second rail"], "a": 0, "ex": "Drive across in a gear that will not need to be changed. Shifting gears is prohibited while crossing the tracks.", "h": "It is against the law.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V143", "q": "You have started across and the crossing lights begin to flash. You should:", "o": ["Keep going, because it is safer than backing up", "Stop on the tracks and wait for the train to pass", "Back up, because it is safer than continuing", "Stop, then reverse once the gate starts lowering"], "a": 0, "ex": "If the crossing lights begin to flash after starting, keep going. It is safer to continue than to back up.", "h": "You are already committed.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.95"}, {"id": "V144", "q": "At night, at an uncontrolled RURAL crossing, a train crossing in front of you may appear as:", "o": ["A black, dark object against the dark road", "A row of bright lights against the dark road", "A flashing amber light low to the ground", "A grey shadow, but only in fog or smoke"], "a": 0, "ex": "A train may appear like a black, dark object against the background of a dark road.", "h": "You may not see lights at all.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V145", "q": "Which is NOT a reason to pay extra attention at RURAL railway crossings?", "o": ["Approach grades tend to be flatter", "Snow banks may be higher", "Brush and trees may be more common", "There tend to be fewer automated warning systems"], "a": 0, "ex": "Rural: approach grades may be steeper, snow banks higher, brush and trees more common, fewer automated warnings, rough or uneven crossings.", "h": "One option flips a word.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V146", "q": "Your vehicle stalls on a crossing and a train is coming. After getting out, move away from the track:", "o": ["Toward the oncoming train", "Away from the oncoming train", "Straight back the way you came", "Ahead, the way you were going"], "a": 0, "ex": "Move away from the track toward the oncoming train. This reduces the chance of being struck by flying debris.", "h": "Debris flies the way the train is moving.", "cat": "t21", "ch": "23 \u00b7 Railway crossings", "sec": "Railway crossings", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Railway crossings, PDF p.97"}, {"id": "V147", "q": "A fire starts on your bus. Get the passengers off and to a safe spot at least:", "o": ["35 metres (115 feet) from the vehicle", "30 metres (100 feet) from the vehicle", "35 feet (11 metres) from the vehicle", "50 metres (164 feet) from the vehicle"], "a": 0, "ex": "Get your passengers off the bus and to a safe spot at least 35 metres (115 feet) from the vehicle.", "h": "Not the warning-device distance.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V148", "q": "Depending on its type and size, a fire extinguisher gives only about how much chemical discharge?", "o": ["Eight to ten seconds", "Eighteen to twenty seconds", "Thirty to forty seconds", "Two to three minutes"], "a": 0, "ex": "You will have only eight to ten seconds of chemical discharge.", "h": "Very short.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V149", "q": "In PASS, the \"A\" means:", "o": ["Aim low, at the base of the fire", "Aim high, at the top of the flames", "Aim at the middle of the fire", "Aim at the thickest smoke"], "a": 0, "ex": "Aim low and direct the extinguisher at the base of the fire.", "h": "Fuel is at the bottom.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V150", "q": "In PASS, how do you \"Sweep\"?", "o": ["Side to side, starting at one side of the fire", "Side to side, starting in the middle of the fire", "Up and down, starting at the base of the fire", "In circles, starting at the outer edge of the fire"], "a": 0, "ex": "Sweep from side-to-side. Start at one side of the fire and slowly work to the other side. Do not start in the middle.", "h": "The guide says where NOT to start.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V151", "q": "When using a fire extinguisher, approach the fire:", "o": ["From upwind, if possible", "From downwind, if possible", "From whichever side is closest", "From the side with the most smoke"], "a": 0, "ex": "Approach the fire from upwind if possible.", "h": "Keep the smoke and heat blowing away from you.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V152", "q": "To prevent sparks from static electricity when refuelling:", "o": ["Touch the fuel nozzle to the filler pipe before filling", "Touch the fuel nozzle to the filler pipe after filling", "Touch the vehicle body with your hand before filling", "Keep the engine running while you fill the tank"], "a": 0, "ex": "Touch the fuel hose nozzle against the filler pipe of the vehicle tank before filling to ground it.", "h": "Before or after?", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V153", "q": "Why does the guide say all brakes must be fully released while moving?", "o": ["Dragging brakes can ignite grease in the hubs when the vehicle stops", "Dragging brakes can ignite fuel in the tank while the vehicle moves", "Dragging brakes make soft tires build heat and burst into flames", "Dragging brakes only wear the pads; they are not a fire risk"], "a": 0, "ex": "Dragging brakes generate heat that can ignite grease in the hubs when the vehicle stops.", "h": "Which part has grease?", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V154", "q": "Which is NOT one of the guide's fire prevention tips?", "o": ["Keep the engine running when refuelling, to avoid a restart spark", "Never start a vehicle with a fuel leak", "Check your tire pressure often, as soft tires build heat", "Do not smoke near the fuelling areas"], "a": 0, "ex": "Tips: never start with a fuel leak; shut off the engine when refuelling; ground the nozzle; no smoking; check tire pressure; brakes fully released.", "h": "One option reverses a tip.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V155", "q": "After using a fire extinguisher, you should:", "o": ["Replace the pin, store it, note it on the post-trip inspection, and recharge or replace it immediately", "Replace the pin, store it, note it on the post-trip inspection, and recharge it at the next annual check", "Store it, note it on the pre-trip inspection, and recharge or replace it immediately", "Throw it away, note it on the post-trip inspection, and buy a new one within 30 days"], "a": 0, "ex": "Replace the safety pin, return it to storage, note on the post-trip inspection that it was used, and have it recharged immediately or replaced.", "h": "When, and which inspection report?", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V156", "q": "In most commercial vehicles, portable fire extinguishers are carried:", "o": ["In the driver's compartment", "At the rear emergency exit", "In the luggage compartment", "Under the front passenger seat"], "a": 0, "ex": "Portable fire extinguishers are carried in the driver's compartment in most commercial vehicles.", "h": "Within reach of the driver.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire and fire extinguishers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire and fire extinguishers, PDF p.126"}, {"id": "V157", "q": "The guide says NOT to try to put out a fire that is:", "o": ["Beyond your capability or the extinguisher's", "Already spreading toward the fuel tank of the bus", "Burning at the base rather than at the flames on top", "Located on the passenger side of the vehicle"], "a": 0, "ex": "Fire extinguisher operation: \"Do not try to put out a fire that is beyond your capability or that of the fire extinguisher.\" You may have only eight to ten seconds of discharge.", "h": "Know your limits.", "cat": "t22", "ch": "24 \u00b7 Fire & extinguishers", "sec": "Fire extinguisher operation", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Fire extinguisher operation, PDF p.126"}, {"id": "V158", "q": "Who can refuel a propane vehicle or container?", "o": ["Only people with the proper certification or training", "Any driver holding a Class 4 or higher licence", "Any fuel station attendant on duty", "The driver, as long as no passengers are on board"], "a": 0, "ex": "Only people with the proper certification or training can refuel a propane vehicle or container.", "h": "A special qualification.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V159", "q": "When refuelling propane, ensure nothing that could ignite is within:", "o": ["Three metres (10 feet) of the dispenser or container", "Ten metres (30 feet) of the dispenser or container", "Three feet (1 metre) of the dispenser or container", "Thirty metres (100 feet) of the dispenser or container"], "a": 0, "ex": "Ensure there is nothing that could ignite within three metres (10 feet) of the dispenser or container being filled.", "h": "Check the unit.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V160", "q": "After properly attaching the filling hose to a propane tank, you open the:", "o": ["Fixed-liquid level gauge (bleeder valve)", "Magnetic float gauge (bleeder valve)", "Fixed-liquid level gauge (pressure relief valve)", "Fill-line shut-off (bleeder valve)"], "a": 0, "ex": "Properly attach the filling hose, then open the fixed-liquid level gauge (bleeder valve).", "h": "Two gauges are named; only one is opened.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V161", "q": "While fuelling propane, you know fuelling should END when:", "o": ["Liquid propane mist discharges from the liquid level gauge", "Propane vapour hisses from the pressure relief valve", "The magnetic float gauge first starts to move", "The dispenser pump clicks off on its own"], "a": 0, "ex": "When the fuel level reaches the maximum permitted, liquid propane in the form of a mist will be discharged from the liquid level gauge. Fuelling should now end.", "h": "Watch the valve you opened.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V162", "q": "When the propane tank is filled to capacity, the total capacity of the tank is approximately:", "o": ["80 per cent", "90 per cent", "100 per cent", "60 per cent"], "a": 0, "ex": "The magnetic float gauge should show the tank is filled to capacity. The total capacity of the tank is approximately 80 per cent.", "h": "Room is left for expansion.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V163", "q": "Which is NOT a step in the guide's propane fuelling procedure?", "o": ["Keep electrical accessories on so the float gauge can be read", "Wear protective gloves and clothing, such as long sleeve shirts", "Properly attach the filling hose to the vehicle's fuel tank", "Shut off the fixed level gauge and disconnect the fill-line"], "a": 0, "ex": "Engine and electrical accessories must be switched off during propane fuelling.", "h": "One option reverses a rule.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Propane", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Propane, PDF p.138"}, {"id": "V164", "q": "Why should you NOT repeatedly enter and exit the vehicle while fuelling?", "o": ["It can cause static build-up and a spark at the fuel nozzle", "It lets fuel vapour build up inside the cab and the cargo area", "It resets the pump and the fuel may overflow from the tank", "It drains the battery while the electrical accessories are off"], "a": 0, "ex": "Repeatedly entering and exiting can cause static build-up that can cause a static spark when handling the fuel nozzle.", "h": "Think about sliding across a seat.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Fuelling a vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuelling a vehicle, PDF p.138"}, {"id": "V165", "q": "Buses, school buses and taxis should be fuelled:", "o": ["Only when no passengers are on board", "With passengers on board, if the engine is off", "Only by a station attendant, never the driver", "With passengers on board, if no one is smoking"], "a": 0, "ex": "Vehicles such as a bus, school bus, or taxi should not be fuelled when passengers are on board. Have enough fuel before picking them up.", "h": "Plan ahead before pick-up.", "cat": "t23", "ch": "25 \u00b7 Fuelling & propane", "sec": "Fuelling a vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuelling a vehicle, PDF p.138"}, {"id": "V166", "q": "Nearly what share of all greenhouse gas emissions in Canada come from the road transportation sector?", "o": ["30 per cent", "13 per cent", "50 per cent", "3 per cent"], "a": 0, "ex": "Nearly 30 per cent of all greenhouse gas emissions in Canada are produced by the road transportation sector.", "h": "About a third.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.138"}, {"id": "V167", "q": "Driving on snow-covered roads can increase fuel consumption by:", "o": ["15 to 20 per cent", "4 to 11 per cent", "25 to 35 per cent", "5 to 10 per cent"], "a": 0, "ex": "Driving on snow-covered roads can increase fuel consumption by 15 to 20 per cent.", "h": "Two of the wrong ranges are route comparisons.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.139"}, {"id": "V168", "q": "How much fuel is wasted by tire under-inflation?", "o": ["One per cent for each 10 psi of under-inflation", "Ten per cent for each 1 psi of under-inflation", "One per cent for each 1 psi of under-inflation", "Five per cent for each 10 psi of under-inflation"], "a": 0, "ex": "One per cent of fuel is wasted for each 10 pounds per square inch of under inflation.", "h": "Small loss, big pressure drop.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V169", "q": "For warm-up, the guide says:", "o": ["About five minutes of idling is adequate; do not increase engine speed", "About five minutes of idling is adequate, at a raised engine speed", "About fifteen minutes of idling is needed; do not increase engine speed", "No idling is needed; drive off right away at full throttle"], "a": 0, "ex": "When warming up do not increase the engine speed. Five minutes of idling is generally adequate.", "h": "Short and gentle.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V170", "q": "During a trip, check gauges, tires, and cargo every:", "o": ["Three hours", "Two hours or every 160 km", "Four hours", "Hour"], "a": 0, "ex": "Continually monitor your vehicle's condition: check gauges, tires, and cargo every three hours.", "h": "Not the fatigue-break rule.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V171", "q": "When planning a route, which pairing does the guide say is MORE fuel efficient?", "o": ["Flat routes over mountainous; highway driving over inner-city driving", "Mountainous routes over flat ones; highway driving over inner-city driving", "Flat routes over mountainous; inner-city driving over highway driving", "Mountainous routes over flat; inner-city driving over highway driving"], "a": 0, "ex": "\"Plan your route carefully. Flat routes are more fuel efficient than mountainous routes. Highway driving is more fuel efficient than 'inner city' driving.\"", "h": "Two separate comparisons: terrain, then type of road. Check each half.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.139"}, {"id": "V172", "q": "Under \"Caring for your vehicle\", why does the guide say to do a pre-trip inspection before you hit the road?", "o": ["It is the law, and it can help you avoid unwelcome breakdowns", "It is only a recommendation, but it can help you avoid unwelcome breakdowns", "It is the law, but only for vehicles carrying 11 or more passengers", "It is the law, and it lowers fuel use by about one per cent per trip"], "a": 0, "ex": "\"Before you hit the road, make sure you have performed a pre-trip inspection. Not only is it the law, but it can also help you avoid unwelcome breakdowns during your travels.\"", "h": "Two parts: is it required, and what does it help you avoid?", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V173", "q": "The guide says to perform a POST-trip inspection in order to:", "o": ["Spot problems that could delay you next time", "Replace the pre-trip inspection that is required by law", "Reset the restriction indicator before you park overnight", "Record fuel used so the carrier can file its fuel report"], "a": 0, "ex": "\"Perform a post-trip inspection to spot problems that could delay you next time.\" It does not replace the pre-trip inspection, which is the law.", "h": "It looks ahead to your next trip.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V174", "q": "Which statement about fluid levels matches the guide?", "o": ["Under-filling and over-filling can both damage your vehicle", "Only under-filling can damage it; extra fluid is harmless to the engine", "Only over-filling can damage it; low levels only waste a little fuel", "Fluid levels matter only at the regularly scheduled maintenance visits"], "a": 0, "ex": "\"Ensure all fluid levels are correct. Under-filling and over-filling can both damage your vehicle.\"", "h": "Too little and too much: what does the guide say about each?", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V175", "q": "The guide says to monitor your restriction indicator for signs of:", "o": ["The air filter becoming plugged or contaminated", "The fuel filter becoming plugged or gelled in winter", "The oil filter becoming plugged or contaminated by dirt", "Tire pressure dropping 10 psi below the recommendation"], "a": 0, "ex": "\"Monitor your restriction indicator for signs of the air filter becoming plugged or contaminated.\"", "h": "It measures how freely the engine breathes.", "cat": "t24", "ch": "26 \u00b7 Fuel efficiency", "sec": "Fuel efficiency", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuel efficiency, PDF p.140"}, {"id": "V176", "q": "Generally, how much more fuel do you use when driving faster?", "o": ["10 per cent more for every 10 km/h over 90 km/h", "10 per cent more for every 10 km/h over 100 km/h", "5 per cent more for every 10 km/h over 90 km/h", "10 per cent more for every 20 km/h over 90 km/h"], "a": 0, "ex": "Generally, for every 10 km/h over 90 km/h you use 10 per cent more fuel.", "h": "Check the baseline speed.", "cat": "t25", "ch": "27 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V177", "q": "Driving at 70 km/h requires a stopping distance of about:", "o": ["300 feet (90 metres)", "300 metres (900 feet)", "90 feet (30 metres)", "200 feet (60 metres)"], "a": 0, "ex": "Driving at 70 km/h requires a stopping distance of about 300 feet (90 metres).", "h": "Watch feet vs metres.", "cat": "t25", "ch": "27 \u00b7 Shifting, speed & stopping", "sec": "Safe stopping", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Safe stopping, PDF p.142"}, {"id": "V178", "q": "For light conditions, the guide says to:", "o": ["Wear sunglasses in bright conditions and reduce speed in poor light", "Wear sunglasses in poor light and reduce speed in bright conditions", "Use high beams in bright conditions and reduce speed in poor light", "Keep your normal speed in poor light but use your four-way flashers"], "a": 0, "ex": "Light: adjust your driving based on visibility. Wear sunglasses in bright conditions and reduce speed in poor light conditions.", "h": "One option swaps the two halves.", "cat": "t25", "ch": "27 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V179", "q": "The guide's posture tip says to adjust your seat for comfort, alertness, visibility, and:", "o": ["Access to controls", "Maximum leg room only", "Easy entry and exit", "Mirror placement only"], "a": 0, "ex": "Posture: keep your seat adjusted to the correct position for comfort, alertness, visibility, and access to controls.", "h": "Reaching what you need.", "cat": "t25", "ch": "27 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V180", "q": "For traffic, the guide says to:", "o": ["Travel at the same speed as other traffic, staying within the speed limit", "Travel at the same speed as other traffic, even above the speed limit", "Travel well below the speed of other traffic to save fuel", "Pass slower traffic whenever possible to keep a constant speed"], "a": 0, "ex": "Traffic: try to travel at the same speed as other traffic, staying within the speed limit. Be considerate and give way to other drivers.", "h": "Match the flow, but within the rules.", "cat": "t25", "ch": "27 \u00b7 Shifting, speed & stopping", "sec": "Smart driving practices", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Smart driving practices, PDF p.141"}, {"id": "V181", "q": "Your bus is stopped on the highway after a collision, just around a curve where traffic cannot see it from 300 m. What is the BEST action?", "o": ["Evacuate passengers to a safe location away from the bus", "Keep passengers seated on the bus and wait for the police", "Keep passengers on the bus and turn on the hazard lights", "Let each passenger decide whether to stay on or get off"], "a": 0, "ex": "A stopped position without 300 m of visibility, such as just over a hill or around a curve, is a sufficient reason to evacuate. Passengers go to a safe location away from the bus.", "h": "Ask where the danger is: on the bus or off it.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V182", "q": "After a breakdown, which stopping position is NOT, by itself, a listed reason to evacuate the bus?", "o": ["On a straight, level shoulder visible from 500 m", "Just over the crest of a hill, out of sight of traffic", "Immediately next to railroad tracks, out of a train's path", "Near a body of water, where the bus could still move"], "a": 0, "ex": "The guide lists: in the path of a train or next to railroad tracks; a position that may change (near water or a precipice); and a position not visible for 300 m (over a hill, around a curve).", "h": "Which spot is easy for traffic to see?", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V183", "q": "When passengers must be evacuated, the guide's objective is to get them off the vehicle:", "o": ["Safely, in the shortest time possible, in an orderly fashion", "Quickly, back rows first, so the aisle clears from the rear", "Only after police or fire crews arrive to direct the evacuation", "As fast as possible, even if passengers push past each other"], "a": 0, "ex": "Always evacuate starting with those nearest the door. The objective is to get passengers off safely, in the shortest time possible, in an orderly fashion.", "h": "Speed matters, but so do two other things.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V184", "q": "Your bus has stopped after a collision and you must decide how to get passengers off. Per the guide, what determines the TYPE of evacuation performed?", "o": ["Your assessment of the emergency", "The number of passengers who are seated on the bus at the time", "The first police officer or firefighter to arrive at the scene", "A show of hands from the passengers on board the bus"], "a": 0, "ex": "\"Your assessment of the emergency will determine the type of evacuation to be performed.\" The employer's evacuation guideline tells you the procedures, but you judge the emergency.", "h": "Think about whose job it is to judge the situation and decide how to evacuate.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V185", "q": "Your bus comes to rest near a precipice and could still move. You decide to evacuate. The guide says you must be certain the evacuation is carried out:", "o": ["In a manner which affords maximum safety for the passengers", "Only after a tow truck has arrived to stabilize the bus at the edge", "Starting with the passengers seated at the very back of the bus", "As fast as possible, with all passengers using the rear door only"], "a": 0, "ex": "If a bus rests near a body of water or precipice it could still move, so it should be evacuated, and you must be certain the evacuation is carried out in a manner which affords maximum safety for the passengers. Always start with those nearest the door.", "h": "Think about the passengers, not the clock or the bus.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Additional information about collisions for Class 2 and Class 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Additional information about collisions for Class 2 and Class 4 vehicles, PDF p.133"}, {"id": "V186", "q": "According to the guide, additional SCHOOL bus evacuation techniques are covered:", "o": ["In the S-endorsement course", "In the vehicle's owner's manual", "On the back of the trip inspection report", "In the Driver's Guide road test chapter"], "a": 0, "ex": "Front door evacuation \u2014 Note: \"Additional school bus evacuation techniques are covered in the S-endorsement course.\"", "h": "A school bus needs its own endorsement.", "cat": "t26", "ch": "28 \u00b7 Bus stopped after an incident: evacuate?", "sec": "Front door evacuation procedures", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Front door evacuation procedures, PDF p.134"}, {"id": "V187", "q": "Another vehicle is passing you on a highway and the pass appears safe. What should you do with your lane position?", "o": ["Keep to the centre of your lane or slightly to the right", "Move partly onto the shoulder to give the passer more room", "Move to the left side of your lane so you stay visible", "Move right of the solid white line until the pass is done"], "a": 0, "ex": "Maintain your lane position, either in the centre of the lane or slightly to the right, to give the passing vehicle extra clearance. The Driver's Guide (printed p.72) also says to stay in your lane and move to the right side of it on a two-lane highway.", "h": "Stay in your lane.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V188", "q": "While a safe pass is being made around you, what should you do with your speed?", "o": ["Maintain or reduce it, and avoid accelerating", "Speed up slightly to close the gap behind the passer", "Brake hard right away so the passer can cut in sooner", "Hold your speed, but accelerate if the passer is slow"], "a": 0, "ex": "Maintain or reduce your speed; avoid a tendency to accelerate.", "h": "Don't make the pass longer.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V189", "q": "A vehicle passing you gives up the pass and tries to get back in line BEHIND you. What do you do FIRST?", "o": ["Accelerate quickly so they can pull back in", "Brake hard so they can pull back in ahead of you", "Hold your speed and let them sort out the gap", "Move onto the shoulder so they can get past you"], "a": 0, "ex": "If the passing vehicle tries to abort the pass and get back in line behind you, accelerate quickly to let them pull back into the lane safely.", "h": "They need space behind you, not in front.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V190", "q": "The vehicle that just passed you cuts back in too quickly. What is the BEST response?", "o": ["Slow down for a safe following distance, braking if needed", "Speed up to stay close so others don't cut in", "Sound the horn and keep driving at the same speed", "Move to the left of your lane and pass them back"], "a": 0, "ex": "If the passing vehicle cuts in too quickly, slow down to keep a safe following distance. Depending on the situation, braking may be needed.", "h": "Rebuild your space cushion.", "cat": "t27", "ch": "29 \u00b7 Being passed on a highway", "sec": "Avoiding collision with a vehicle passing you", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Avoiding collision with a vehicle passing you, PDF p.130"}, {"id": "V191", "q": "In a vehicle WITHOUT ABS, pressing firmly on the brake pedal to the point just before the wheels lock is called:", "o": ["Threshold braking", "Controlled pumping", "Cadence braking", "Lock-up braking"], "a": 0, "ex": "Press firmly on the brake pedal to the point just before the wheels lock. This is called threshold braking.", "h": "\"Threshold\" means right at the edge.", "cat": "t28", "ch": "30 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V192", "q": "You are threshold braking WITHOUT ABS and the wheels lock. What do you do FIRST?", "o": ["Release the brake pedal slightly to regain steering", "Release the brake pedal fully and coast to a stop", "Press harder on the pedal to stop more quickly", "Pump the brake pedal rapidly until you stop"], "a": 0, "ex": "If the wheels lock, release the brake pedal slightly to regain steering control, then press firmly again without locking the wheels.", "h": "Ease off a little, not all the way.", "cat": "t28", "ch": "30 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V193", "q": "Emergency braking in a vehicle WITH ABS. Which is correct?", "o": ["Apply steady, firm pressure; do not pump or release", "Press to just before lock-up, then release slightly", "Pump the pedal rapidly to stop the wheels locking", "Slam the pedal to lock the wheels, then steer"], "a": 0, "ex": "With ABS: apply steady firm pressure to the brake pedal, do not pump or release it, and look and steer where you want to go. A vibration in the pedal is ABS working.", "h": "Let the system do the cycling.", "cat": "t28", "ch": "30 \u00b7 Threshold braking (ABS vs no ABS)", "sec": "Emergency braking", "g": "CG", "ref": "Alberta Driver's Guide, Ch.6 Emergency Situations and Challenging Conditions, Emergency braking, PDF p.80"}, {"id": "V194", "q": "You are in the acceleration lane, entering a busy highway. What is the BEST action?", "o": ["Choose a safe gap and merge at or near the speed of traffic", "Stop at the end of the merge lane and wait for a clear gap", "Adjust your speed, then get in wherever there is room", "Stop at the beginning of the merge lane until traffic clears"], "a": 0, "ex": "Signal, check mirrors and direct view, keep glancing at the gap you chose, and move into it at or near the speed of other vehicles. Avoid reducing speed abruptly or stopping when merging.", "h": "Adjusting speed is only part of it.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V195", "q": "When a vehicle merges onto a highway, who has the right-of-way?", "o": ["Neither; merging is a shared responsibility", "The vehicles already on the highway, always", "The merging vehicle, once it has signalled", "Whichever vehicle is the larger and heavier one"], "a": 0, "ex": "Merging is a shared responsibility between vehicles joining the roadway and vehicles already on it. Neither has the right-of-way.", "h": "Both sides must cooperate.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V196", "q": "When it is safe and legal, you move into your chosen gap:", "o": ["After you are past the solid white line of the acceleration lane", "As soon as you enter the acceleration lane, before the white line", "In the middle of the merge lane, after stopping to check traffic", "Only once the acceleration lane is about to end, wherever possible"], "a": 0, "ex": "When it is safe and legal to merge, move into the gap after you are past the solid white line of the acceleration lane.", "h": "Look for the painted line.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V197", "q": "You are driving on the main roadway and traffic is merging from the right. What should you do?", "o": ["Move left to the next lane, if it is safe", "Speed up so merging vehicles must fit in behind you", "Brake hard to let every merging vehicle in ahead", "Stay in the right lane, since you have the right-of-way"], "a": 0, "ex": "If you are on the main roadway and traffic is merging, move left to the next lane if it is safe. This leaves the right lane clear for merging vehicles.", "h": "Make room without braking.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting a major roadway: merging", "g": "CG", "ref": "Alberta Driver's Guide, Ch.5 Highways and Freeways, Entering and exiting a major roadway: merging, PDF p.75"}, {"id": "V198", "q": "You are in the acceleration lane and have just passed the solid white line. What should you do NEXT?", "o": ["Move into the gap you chose, once it is safe", "Move over right away, since the line is now behind you", "Slow down and wait for a highway driver to wave you in", "Stop and wait until the whole right lane is clear of traffic"], "a": 0, "ex": "Passing the solid white line only makes the merge legal. Keep glancing at your chosen gap, and move into it when it is safe and legal, at or near the speed of traffic. Avoid slowing abruptly or stopping.", "h": "The line makes it legal; what makes it safe?", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V199", "q": "Which BEST describes what decides the moment you move from the acceleration lane into traffic?", "o": ["A safe gap you have picked and timed your speed to", "Reaching the end of the solid white line, gap or no gap", "Highway drivers moving over or braking to let you in first", "The acceleration lane running out, whatever the traffic does"], "a": 0, "ex": "Signal, check mirrors and direct view, and keep glancing at the gap you chose so you can adjust speed and timing. Neither side has the right-of-way, so you merge into a safe gap; you cannot count on others yielding.", "h": "Neither side has the right-of-way.", "cat": "t29", "ch": "31 \u00b7 Merging onto a highway", "sec": "Entering and exiting roadways: merging", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.5 Basic Commercial Vehicle Operations, Entering and exiting roadways: merging, PDF p.79"}, {"id": "V200", "q": "When must a school bus driver turn on the alternately flashing AMBER lights?", "o": ["When beginning to slow down to stop to load or unload", "Once the bus is stopped and secured, before the door opens", "Only while passengers are actually getting on or off the bus", "Whenever extra visibility is wanted, such as in fog or smoke"], "a": 0, "ex": "Activate the alternately flashing amber lights when you begin to slow down the school bus to stop to load and unload passengers. Red lights and the stop arm are for loading and unloading; a strobe is for fog, blizzard and smoke.", "h": "Amber is a warning that comes early.", "cat": "t30", "ch": "32 \u00b7 Stopped school bus: loading & unloading", "sec": "Passenger loading and unloading (Class 2 and Class 4 vehicles)", "g": "CG",
