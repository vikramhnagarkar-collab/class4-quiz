h.3 Trip Inspections, Trip inspection legislation, PDF p.30", "h": "You need both the checklist and the record."}, {"id": "G89", "q": "When weather, road or traffic conditions are poor, your following distance should be:", "o": ["Doubled", "Kept the same", "Increased by one second", "Halved, to keep pace"], "a": 0, "ex": "Double your following distance in poor conditions.", "ch": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip", "sec": "Following distance", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Following distance, PDF p.66", "h": "Poor conditions call for a simple multiplier of your normal gap."}, {"id": "G90", "q": "Which is NOT one of the guide's pre-driving passenger safety steps?", "o": ["Start the meter before the passenger is seated", "Conduct a circle check around the vehicle", "Ensure passenger seat belts work properly", "Park at a designated space before loading"], "a": 0, "ex": "Pre-driving steps include a circle check, checking seat belts, parking at a designated space before loading, securing the passenger before closing the door, entering GPS info, announcing the start, and locking doors.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Passenger safety", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Passenger safety, PDF p.115", "h": "All the real steps happen before the trip, for safety. Which option is about money?"}, {"id": "G91", "q": "Your passenger is seated and belted. Which should you do FIRST of these, before pulling away?", "o": ["Enter the destination in the GPS", "Program the GPS at the first red light", "Unlock the doors so they can exit fast", "Pull out, then tell them you're starting"], "a": 0, "ex": "Enter GPS information before starting the journey, let passengers know you are starting, and lock the doors before you begin.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Passenger safety", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Passenger safety, PDF p.116", "h": "Which task would be distracting once you're moving?"}, {"id": "G92", "q": "A passenger brings a service animal. Under the Traffic Safety Act, you must ensure the animal:", "o": ["Does not impede the vehicle's controls or cause a distraction", "Rides in a crate in the trunk", "Is refused unless booked in advance", "Stays on the passenger's lap or on the floor at all times during the trip"], "a": 0, "ex": "You must ensure the animal does not impede or interrupt the use of wheels and other equipment, or cause a distraction.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Passenger safety", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Passenger safety, PDF p.116", "h": "The rule is about the animal not interfering with driving."}, {"id": "G93", "q": "'Commentary driving' means:", "o": ["Saying out loud what you observe and predict while driving", "Chatting with passengers to stay alert", "Listening to traffic reports on the radio", "Writing a detailed trip log after every shift to review your errors"], "a": 0, "ex": "You verbalize your observations, e.g. 'stale green, oncoming car signalling left'.", "ch": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip", "sec": "Commentary driving", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Commentary driving, PDF p.72", "h": "The name says it: describing what you see."}, {"id": "G94", "q": "Another driver gets out and threatens you at a light. The guide says:", "o": ["Stay in the vehicle, lock the doors, call police if you can", "Get out and calmly explain yourself", "Get out of the vehicle and calmly explain yourself to the other driver", "Follow them to get their plate"], "a": 0, "ex": "If physically threatened, stay in the vehicle, secure the doors, and call the police.", "ch": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip", "sec": "Avoiding road rage", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Avoiding road rage, PDF p.73", "h": "Your vehicle is your protection."}, {"id": "G95", "q": "Traffic is light and you're running late with a passenger. BEST practice per the guide:", "o": ["Adjust speed within the legal limit for the passenger's comfort", "Drive 10 km/h over to keep the schedule", "Drive well below the limit to be extra safe and keep them comfortable", "Brake firmly at each stop to save time"], "a": 0, "ex": "Adjust your speed within the legal limit for comfort. Driving well below the limit can also confuse others and create a hazard.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Passenger safety", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Passenger safety, PDF p.116", "h": "Comfort and legality both matter."}, {"id": "G96", "q": "An ambulance driver uses ONLY the red flashing lights, no siren. Are they exempt from traffic laws?", "o": ["No; red lights alone don't exempt them", "Yes, red lights give full exemption", "Yes, on highways only", "Only at stop signs, not red lights"], "a": 0, "ex": "Using red flashing lights alone does not exempt the driver from the Traffic Safety Act.", "ch": "Commercial Driver's Guide (2025), Ch.6 Information for Class 4 Vehicles", "sec": "Emergency vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Information for Class 4 Vehicles, Emergency vehicles, PDF p.109", "h": "Ambulances need more than lights to be exempt."}, {"id": "G97", "q": "A passenger speaks little English. The guide suggests:", "o": ["Use plain language and speak slowly and clearly", "Speak louder so they understand", "Use a translation app while driving", "Use a translation app on your phone while you are driving"], "a": 0, "ex": "Use plain language, talk slowly and clearly, and use technology only when it's safe (not while driving).", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People", "sec": "Transporting people with language barriers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People, Transporting people with language barriers, PDF p.119", "h": "Make your words easier to understand, not louder."}, {"id": "G98", "q": "A passenger who uses a wheelchair is with an attendant. Who do you talk to first?", "o": ["The passenger directly", "The attendant", "Whoever booked the trip", "Your dispatcher"], "a": 0, "ex": "Whenever possible, communicate directly with the person with the disability before addressing an attendant.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People", "sec": "General rules for communicating", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People, General rules for communicating, PDF p.117", "h": "Respect the passenger's independence."}, {"id": "G99", "q": "At a dual right-turn intersection, the light is red and no sign prohibits turning. May the OUTER lane turn right?", "o": ["Yes, after a complete stop, if it can be done safely", "No; only the curb lane may turn on red", "Yes, without stopping first, as long as the way is clear", "No; dual turn lanes may only turn on green"], "a": 0, "ex": "Unless a sign prohibits it, right on red is allowed from a dual right-turn lane after a complete stop.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Dual lane turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Dual lane turns, PDF p.68", "img": "dG99", "cap": "Diagram (not to scale), based on the guide text", "h": "Dual right-turn lanes follow the normal right-on-red rule."}, {"id": "G100", "q": "When dropping off a parent with young children, the guide suggests you:", "o": ["Offer to open the doors so the children exit safely", "Let the children open the doors themselves", "Unlock the doors while still rolling to a stop so they're ready", "Stay seated so you can watch traffic"], "a": 0, "ex": "Post-driving: tell passengers when they can safely get out, and offer to open doors for passengers with children.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Post-driving procedures", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Post-driving procedures, PDF p.116", "h": "Children may not judge traffic well when getting out."}, {"id": "G101", "q": "A passenger uses a mobility scooter and can transfer to a seat. The guide recommends:", "o": ["Encourage them to transfer, then secure the scooter", "Keep them on the scooter unsecured", "Lift the scooter in with them on it", "Lift the scooter into the vehicle with the passenger still seated on it"], "a": 0, "ex": "Passengers who can transfer are encouraged to. Turn off the scooter, assist the transfer, and secure the scooter.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People", "sec": "Assisting a person with a scooter", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People, Assisting a person with a scooter, PDF pp.118\u2013119", "h": "Transfer to a vehicle seat is safer when possible."}, {"id": "G102", "q": "After a collision, when should passengers be evacuated?", "o": ["If the vehicle is on or next to railway tracks", "Always, after any collision", "Only if a passenger asks to leave", "Only once police arrive and tell you it is safe to leave"], "a": 0, "ex": "Evacuate if on or next to railway tracks, if the vehicle may move, or if it's at risk of being hit (not visible from 300 m).", "ch": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations", "sec": "Collisions for Class 2 and 4 vehicles", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.9 Emergency Situations, Collisions for Class 2 and 4 vehicles, PDF p.133", "h": "Evacuate only when staying is more dangerous."}, {"id": "G103", "q": "A passenger becomes argumentative. What should your FIRST step be?", "o": ["De-escalate with calm, positive or neutral language", "Stop and order them out of the vehicle", "Tell them firmly, \"Listen to me.\"", "Ignore their questions and comments until they calm down"], "a": 0, "ex": "First, de-escalate through effective communication. Avoid phrases like \"Listen to me\" and don't ignore their points. Follow employer policy if you must refuse.", "ch": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4)", "sec": "Difficult passengers", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting People (Class 2 and Class 4), Difficult passengers, PDF p.115", "h": "Start with calm communication before anything stronger."}, {"id": "G104", "q": "May you refuel a taxi with passengers on board?", "o": ["No; fuel before picking up passengers", "Yes, if the engine is off", "Yes, if they agree", "Only at full-service stations"], "a": 0, "ex": "Buses, school buses or taxis should not be fuelled with passengers aboard.", "ch": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency", "sec": "Fuelling a vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.10 Fuelling and Fuel Efficiency, Fuelling a vehicle, PDF p.138", "h": "Fuelling with passengers adds risk."}, {"id": "G105", "q": "A Class 4 licence is required to drive a vehicle \"for hire\". \"For hire\" means:", "o": ["Someone is being paid for the transportation the vehicle provides", "The vehicle carries more than seven passengers at a time", "The vehicle has a municipal taxi plate", "The driver works for a licensed company"], "a": 0, "ex": "\"For hire\" means the owner, operator or employer is being paid for the service the vehicle provides (AR 320/2002).", "ch": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.111", "h": "'For hire' is about payment for the service."}, {"id": "D1", "q": "At night, an oncoming car is 400 m away and closing. You must switch to low beams once it is within:", "o": ["300 metres", "150 metres", "500 metres", "200 metres"], "a": 0, "ex": "Use low beams within 300 m of oncoming vehicles. 150 m is the rule for FOLLOWING a vehicle.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Driving at night", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Driving at night, PDF p.84", "h": "There are two night distances: one for oncoming cars, one for following. This is oncoming."}, {"id": "D2", "q": "You are FOLLOWING another vehicle at night. Low beams are required within:", "o": ["150 metres (one and a half city blocks)", "300 metres (three city blocks)", "100 metres (one city block)", "50 metres (half a city block)"], "a": 0, "ex": "Use low beams when following within 150 m. 300 m applies to oncoming vehicles.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Driving at night", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Driving at night, PDF p.84", "h": "There are two night distances: one for oncoming cars, one for following. This is following."}, {"id": "D3", "q": "Outside an urban area, near the crest of a hill, a U-turn is NOT permitted if other drivers can't see you within:", "o": ["150 metres from either direction", "50 metres from either direction", "300 metres from either direction", "150 metres, but only from behind"], "a": 0, "ex": "Rural: no U-turn on a curve or near a crest where another driver within 150 m from either direction cannot see you.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "U-turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, U-turns, PDF p.69", "img": "ab_nouturn", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "The rural U-turn sight distance is the same number as the emergency-vehicle following gap."}, {"id": "D4", "q": "Unless posted otherwise, the maximum speed on a local road outside an urban area (e.g. a range road) is:", "o": ["80 km/h", "100 km/h", "60 km/h", "90 km/h"], "a": 0, "ex": "80 km/h on a roadway outside an urban area. 100 km/h is for provincial highways outside urban areas.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Speed limit signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Speed limit signs, PDF p.29", "img": "ab_80", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Outside urban areas, local roads are slower than provincial highways."}, {"id": "D5", "q": "A slow-moving vehicle sign goes on vehicles that travel slower than:", "o": ["40 km/h", "30 km/h", "50 km/h", "60 km/h"], "a": 0, "ex": "Slow-moving vehicle signs go on vehicles travelling under 40 km/h, such as farm tractors.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Other signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Other signs, PDF p.39", "img": "ab_smv", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Farm tractors and similar vehicles fall below a set speed."}, {"id": "D6", "q": "Your head restraint tilts. Ideally, the gap between it and the back of your head is:", "o": ["Less than 10 cm (4 inches)", "Less than 20 cm (8 inches)", "About 15 cm (6 inches)", "At least 10 cm (4 inches)"], "a": 0, "ex": "Less than 10 cm is ideal. \"At least 10 cm\" is the near-miss trap.", "ch": "Driver's Guide (Spring 2026), Ch.3 The Basics of Driving", "sec": "Adjust your head restraint", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.3 The Basics of Driving, Adjust your head restraint, PDF p.47", "h": "Closer is better for a head restraint. Watch 'less than' vs 'at least'."}, {"id": "D7", "q": "Traffic in an Alberta roundabout ALWAYS circulates:", "o": ["Counterclockwise around the centre island", "Clockwise around the centre island", "In whichever direction the signs show", "Clockwise in one-lane, counterclockwise in two-lane"], "a": 0, "ex": "Traffic always circulates counterclockwise.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Traffic circles and roundabouts", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Traffic circles and roundabouts, PDF p.63", "img": "dG16", "cap": "Diagram (not to scale), based on the guide text", "h": "Alberta drives on the right. Which direction keeps the island on your left?"}, {"id": "D8", "q": "On a multi-lane highway, slower traffic should use which lane, unless turning left?", "o": ["The lane furthest to the right", "The lane furthest to the left", "Any lane, at the posted speed", "The centre lane on three-lane highways"], "a": 0, "ex": "Slower traffic keeps right, leaving the left lane for passing.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Passing on a multi-lane highway", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Passing on a multi-lane highway, PDF p.73", "img": "dHwy3", "cap": "Diagram (not to scale), based on the guide text", "h": "Keep the passing lane free."}, {"id": "D9", "q": "A passing lane is added ahead (sign shown). Slower vehicles should:", "o": ["Move into the right lane so others pass on the left", "Stay in the left lane and let faster cars pass on the right", "Pull onto the shoulder to let others by", "Speed up so no one needs to pass"], "a": 0, "ex": "Slower vehicles move into the passing lane on the right; others pass on the left.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Passing lanes", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Passing lanes, PDF p.73", "img": "Rb-030", "cap": "Canadian sign design. Image: Wikimedia Commons (public domain)", "h": "A passing lane is added on one side for slower traffic."}, {"id": "D10", "q": "In an acceleration lane, when do you move into your gap?", "o": ["After you're past the solid white line, when safe", "As soon as you see a gap, even over the solid line", "Only after coming to a stop at the end", "When the vehicle beside you flashes its lights"], "a": 0, "ex": "Move into the gap after you are past the solid white line of the acceleration lane.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Merging", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Merging, PDF p.75", "img": "dMerge", "cap": "Diagram (not to scale), based on the guide text", "h": "The solid line in an acceleration lane means 'not yet'."}, {"id": "D11", "q": "A 'weave zone' is where:", "o": ["A highway entrance and exit share the same lane", "Two highways merge into one lane", "A passing lane ends on a hill", "Lanes shift sideways in construction"], "a": 0, "ex": "In a weave zone, the entrance and exit use the same lane, so vehicles cross paths.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Weave zones", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Weave zones, PDF p.76", "img": "dWeave", "cap": "Diagram (not to scale), based on the guide text", "h": "In a 'weave', cars cross paths. Why would they?"}, {"id": "D12", "q": "Without ABS, braking firmly to just before the wheels lock is called:", "o": ["Threshold braking", "Cadence braking", "Engine braking", "Trail braking"], "a": 0, "ex": "That's threshold braking. If the wheels lock, release slightly, then press firmly again.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Emergency braking", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Emergency braking, PDF p.80", "h": "Braking at the threshold of lock-up."}, {"id": "D13", "q": "Why AREN'T daytime running lights enough at night?", "o": ["They're too dim, and the tail lights stay off", "They drain the battery too quickly", "They are bright enough to blind oncoming drivers at night", "They are illegal on highways at night"], "a": 0, "ex": "DRLs aren't bright enough, and the tail lights and instrument lights won't be on.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Driving at night", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Driving at night, PDF p.83", "h": "DRLs light only part of what's needed at night."}, {"id": "D14", "q": "Which surfaces tend to become slippery FIRST?", "o": ["Bridge decks and overpasses", "Uphill grades in the sun", "Gravel shoulders", "Freshly paved roads"], "a": 0, "ex": "Bridges and overpasses form slippery patches more readily.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Road surface conditions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Road surface conditions, PDF p.84", "h": "Surfaces with cold air above AND below freeze first."}, {"id": "D15", "q": "You're first to arrive at a collision. Where should you stop?", "o": ["Away from the collision, in a safe location", "Right beside the crashed vehicles to shield them from traffic", "In the live lane behind them to block it", "Directly in front of the first vehicle"], "a": 0, "ex": "Stop away from the collision in a safe location, then protect the scene with hazards and triangles.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Collisions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Collisions, PDF p.86", "h": "Don't become a second hazard at the scene."}, {"id": "D16", "q": "How long before driving should a block heater timer switch on?", "o": ["2 hours", "30 minutes", "6 hours", "Overnight"], "a": 0, "ex": "Set the timer for two hours before you drive. Leaving it on overnight wastes the savings.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Improving fuel efficiency", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Improving fuel efficiency, PDF p.95", "h": "Long enough to warm the engine, but not overnight."}, {"id": "D17", "q": "In a residential area, you must not drive in a way that disturbs residents between:", "o": ["10 p.m. and 7 a.m.", "11 p.m. and 6 a.m.", "Midnight and 5 a.m.", "9 p.m. and 8 a.m."], "a": 0, "ex": "Between 10 p.m. and 7 a.m.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Traffic laws", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Traffic laws, PDF p.97", "h": "The quiet hours run from late evening to early morning."}, {"id": "D18", "q": "A friend wants to ride in the open box of your pickup for a short, slow trip. This is:", "o": ["Illegal; both of you can be charged", "Legal under 50 km/h", "Legal on private roads only", "Legal if they stay seated"], "a": 0, "ex": "No one may ride on the outside of a vehicle, including an open pickup box. Both can be charged.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Traffic laws", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Traffic laws, PDF p.97", "h": "Riding outside the cab is a legal issue, not a speed issue."}, {"id": "D19", "q": "In an emergency, an LRT train may need up to how far to stop?", "o": ["100 metres (330 feet)", "30 metres (100 feet)", "500 metres (1,650 feet)", "50 metres (165 feet)"], "a": 0, "ex": "Due to its weight and speed, up to 100 metres. 500 m is the train-stopping rule at railway crossings.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Light rail transit", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Light rail transit, PDF p.107", "h": "An LRT is very heavy. Think about how far it needs to stop."}];const IMG={"schoolbus": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAD6CAYAAACI7Fo9AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAABy2SURBVHja7d15eFTVwQbw995Zs5MQg4ACoiJLWRWtVT+3KsgiKGBF+aqCIuC+gBWr1NY91rqgbbUitmLVT1kKKggoYgVElBCWsEpASEISsk9muXPv+f4YJplJJsnMZMjM3Hnf58nDk5lJuDn3/u455957zpHA6DpiV3ZXRRHjhSSNloB+AE498VaxECiQZHxqkqWl0oCyEpaWfiOxCHQKfGd6luI2z4WEWQCS2vi4XUiYbxbKs9Kg6kqWHqEzcRDn9pxBklCXAVKvEA+GIwIYbx5U/gNLkdCZGI6SlzNCyNonAFK8r+3+ScWiFQ6s26zg5xINANCjq4zLhpsx5VoL+vQy+P4Km6TJE0xDSlexNBkmFpFvz7ralZ9td+VnC1d+tqja3FlMm2AVBhkCCPxlkCHumGQV1d93Ft6fc+VnOx3bsseyRFmjMzGIXAh5GQArABw7ruHaWTXYWuAO6ueH9jPiP2+ko0tn2fuSSxOYaB1cvpylS+hMDCIvrdAw4vZq7NyvhvR7+vQyYPXbGeh6CrETOhO3yDNSJZw7wAghgB92uVFTJ4idYeKtT35kXZYYcJYhYF982gSrqPyusR9esamzmHq9NeBn+/QyiENrs9hnZ5h4Qn7vlCRftH5fc6YlETub7ky8N9fvnZKEF+ektPr7fv+KDS+8bWczntAZvSIndkJnEgQ5sRM6kyDIiZ3QmQRBTuyEziQIcmIndCZBkBM7oTMJgpzY9RWZRZA4yIUAHvmzDfc9UwdNC25bnrovBXOmNZ+3Ym+hiqumVaO4rOEXmWUJH/OhGtboTBSRqxpw1x/rsGCxAwBw81gL3vpjGowG1uyEzugCuVsFpj9Ri/eWO/1enzTSgoXPpMFkJHZCZ+IaudMlcPOcWvznS1fA96+5xIwPXkpDkkUidkJn4hG5zS4w8b4arN2ktPq5S841Yclr6UhPJXZCZ+IKeWWNwLi7qrFpW3AzzAzrb8SKv6Uju5NM7ITOxAPyY8c1jJ5Rg/w97pC2p9+ZBqx80w8psRM6E4vIfy7WMOKOauw/rIa1Xb26G7DqrXSccZqB2HUU3kfXEfK9hSouvaUqbOQAUHhUxWW3VGPXgeB+B++zEzrTgch3HfDAOlKitXsbi8s0XD2tGtt2u4md0JlYQb5lhxtX3lblC6rdKa3QcNW0amzMU4id0JloI//6ewUj7qjG8SoR8W2uqhUYdWcN1mwkdkJnoob8069dGDurBrU2cdK23WYXuO6eGixd4yJ2Qmc6GvlHK5244YEaOJzipP8NTpfA5Idr8K//OImd0JmOQv6Pjx347e9qobg77m9RNeD2x2sxf5Gd2OMwvI8eZ8hff9+OB5+3QYgoHTAS8MwDKXjo1qSgPs/77IRO5CEiz11gx2Mv22Lib5w9NQlP38+ppAmdyCOGXAhgzos2vPIve0z9rTN+Y8XLj6ZClomd0Im8XchV function hint(){const q=S.qs[S.i];if(S.done||S.hinted[S.i])return;S.hinted[S.i]=1;const w=S.ord.filter(k=>k!=q.a);const e=w[Math.random()*w.length|0];$('o'+e).classList.add('elim');$('o'+e).disabled=true;$('hb').outerHTML=`<div class=hint>💡 ${hintText(q)}</div>`}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function balPos(n){for(let t=0;t<500;t++){const c=[0,1,2,3].map(i=>Math.floor(n/4)+(i<n%4?1:0));const p=[];let ok=true;for(let i=0;i<n;i++){let ch=[0,1,2,3].filter(k=>c[k]>0&&!(i>=2&&p[i-1]==k&&p[i-2]==k));if(!ch.length){ok=false;break}const tot=ch.reduce((a,k)=>a+c[k],0);let r=Math.random()*tot,k=ch[0];for(const x of ch){r-=c[x];if(r<0){k=x;break}}p.push(k);c[k]--}if(ok)return p}return Array.from({length:n},(_,i)=>i%4)}
function home(){const best=localStorage.getItem(CFG.key)||'–';
$('app').innerHTML=`<h1>${CFG.title}</h1><div class=card><b>${Q.length}</b> questions in the bank.<br>${CFG.intro}<br>Real test: ${Math.min(CFG.n,Q.length)} random, stops at ${CFG.wrong} wrong, pass = ${CFG.pass}/${Math.min(CFG.n,Q.length)}.<div class=stats><span>Best real-test score: ${best}</span></div></div>
<button class=pri onclick="start('real')">▶ Real test (${Math.min(CFG.n,Q.length)})</button><button class=pri onclick="start('all')">📚 Practice all (${Q.length})</button><button class=pri onclick="start('weak')">🎯 Weak spots (${Math.min(CFG.n,Q.length)})</button><div class=card style="font-size:14px">${weakInfo()}<br><label><input type=checkbox ${tmOn()?'checked':''} onchange="localStorage.setItem('timer',this.checked?'1':'0')"> ⏱ Show timer and pace per question</label></div>${CFG.links}`}
function pickReal(){const sk='seen_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(Q).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,Q.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
const MK='miss_'+CFG.key;function getM(){try{return JSON.parse(localStorage.getItem(MK)||'{"q":{},"t":{}}')}catch(e){return {q:{},t:{}}}}
function tkey(q){return (q.ch||'')+(q.sec?' · '+q.sec:'')}
function recM(q,ok){const m=getM();if(ok){if(m.q[q.id])m.q[q.id]=Math.max(0,m.q[q.id]-1)}else{m.q[q.id]=(m.q[q.id]||0)+1;m.t[tkey(q)]=(m.t[tkey(q)]||0)+1;const c=(q.ch||'');m.t['CH:'+c]=(m.t['CH:'+c]||0)+1}localStorage.setItem(MK,JSON.stringify(m))}
function pickWeak(){const m=getM();const sc=q=>(m.q[q.id]||0)*4+(m.t[tkey(q)]||0)*2+(m.t['CH:'+(q.ch||'')]||0)*0.5+Math.random()*0.3;return Q.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,Math.min(CFG.n,Q.length))}
function weakInfo(){const m=getM();const t=Object.entries(m.t).filter(([k])=>!k.startsWith('CH:')).sort((a,b)=>b[1]-a[1]).slice(0,3);return t.length?'Top weak spots: '+t.map(([k,v])=>k.replace(/^.*?, /,'')+' ('+v+')').join('; '):'No misses recorded yet. Take a test first.'}
let TM=null;function tmOn(){return localStorage.getItem('timer')=='1'}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){const e=$('tm');if(!e||!S)return;const el=(Date.now()-S.t0)/1000,n=Math.max(1,S.i+(S.done?1:0));e.textContent='⏱ '+fmt(el)+' · pace '+fmt(el/n)+'/q'}
function start(mode,list){const qs=list||(mode=='real'?pickReal():mode=='weak'?shuf(pickWeak()):shuf(Q));clearInterval(TM);if(tmOn())TM=setInterval(tick,1000);S={t0:Date.now(),mode,qs,i:0,ok:0,bad:0,missed:[],hinted:{},hints:0,pos:balPos(qs.length)};show()}
function head(){const n=S.qs.length,p=S.i/n*100;return (tmOn()?`<div class=stats><span id=tm>⏱ ${fmt((Date.now()-S.t0)/1000)}</span></div>`:'')+`<div class=stats><span>Q ${Math.min(S.i+1,n)}/${n}</span><span>✅ ${S.ok} ❌ ${S.bad}</span></div><div class=bar><i style="width:${p}%"></i></div>`+(S.mode=='real'?`<div class="stats strikes" style="justify-content:flex-start;gap:4px">Wrong: ${S.bad}/${CFG.wrong} ${'<span class=on></span>'.repeat(S.bad)}${'<span></span>'.repeat(Math.max(0,CFG.wrong-S.bad))}</div>`:'')}
function show(){const q=S.qs[S.i];
$('app').innerHTML=head()+`<div class=card>${q.img?`<div class=sign><img alt="road sign" src="${IMG[q.img]}">${q.cap?`<div class=cap>${q.cap}</div>`:''}</div>`:''}<p><b>${q.q}</b></p><button class=hb id=hb onclick="hint()">💡 Hint</button></div>`+(S.ord=(()=>{const d=shuf([0,1,2,3].filter(k=>k!=q.a));d.splice(S.pos[S.i],0,q.a);return d})()).map((k,p)=>`<button id=o${k} onclick="pick(${k})">${'ABCD'[p]}. ${q.o[k]}</button>`).join('')+`<div id=fb></div>`}
function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;recM(q,r);if(S.hinted[S.i])S.hints++;r?S.ok++:(S.bad++,S.missed.push({q,k,h:!!S.hinted[S.i]}));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=S.mode=='real'&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class=card><div class=fb style="color:var(${r?'--ok':'--bad'})">${r?'✅ Correct':'❌ Wrong, answer '+'ABCD'[S.ord.indexOf(q.a)]}</div><p>${q.ex}</p><div class=ref>${q.ref}</div></div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);$('fb').scrollIntoView({behavior:'smooth'})}
function topics(){const g={};S.missed.forEach(({q})=>{const c=q.ch||q.ref;(g[c]=g[c]||[]).push(q)});
return `<h2>Review these topics</h2><div class=card>`+Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([c,qs])=>`<p><b>${c}</b> (${qs.length} missed)<br><span class=ref>${[...new Set(qs.map(q=>q.sec||''))].filter(Boolean).join(' · ')}</span></p>`).join('')+`</div>`}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){clearInterval(TM);const n=S.qs.length,real=S.mode=='real';const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(CFG.key)||0;if(S.ok>b)localStorage.setItem(CFG.key,S.ok)}
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'❌ FAIL'}</h1><div class=card>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}<p>⏱ Time: ${fmt((Date.now()-S.t0)/1000)} · pace ${fmt((Date.now()-S.t0)/1000/Math.max(1,Math.min(S.i,n)))} per question</p><p>💡 Hints used: ${S.hints} of ${Math.min(S.i,n)} answered${S.hints?' (on '+(S.hints-S.missed.filter(m=>m.h).length)+' you got right, '+S.missed.filter(m=>m.h).length+' missed)':''}</p></div>`+
(S.missed.length?`<button class=pri onclick="start('missed',shuf(S.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`+topics()+`<h2>Missed questions (${S.missed.length})</h2>`+S.missed.map(({q,k,h})=>`<div class=card><b>${q.q}</b>${h?'<p class=hint>💡 You used a hint on this one</p>':''}<p style="color:var(--bad)">✘ Your answer: ${q.o[k]}</p><p style="color:var(--ok)">✔ Correct: ${q.o[q.a]}</p><p>${q.ex}</p><div class=ref>📖 Review: ${q.ref}</div></div>`).join(''):'<div class=card>No missed questions. 🎯</div>')+`<button onclick="home()">🏠 Home</button>`;scrollTo(0,0)}
home();
</script></body></html>
