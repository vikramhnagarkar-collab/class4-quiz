<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberta Mock Knowledge Test</title>
<style>
:root{--bg:#f6f7f9;--fg:#111;--card:#fff;--mut:#666;--ok:#1a8f3c;--bad:#c62828;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eee;--card:#1d2228;--mut:#9aa;--acc:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0003}
button{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 14px;font-size:18px;text-align:left;border-radius:12px;border:2px solid #8884;background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;text-align:center;font-weight:700;border:0}
button.ok{border-color:var(--ok);background:#1a8f3c22}button.bad{border-color:var(--bad);background:#c6282822}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:flex;justify-content:space-between;font-size:15px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8884;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad)}
.sign{text-align:center}.sign img{max-height:150px;max-width:70%}.cap{font-size:13px;color:var(--mut)}
.fb{font-weight:700;font-size:20px}.ref{font-size:14px;color:var(--mut)}h1{font-size:24px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #8884;color:var(--acc);text-decoration:none;font-weight:600}</style></head><body><main id="app"></main>
<script>
const Q=[{"id": "R2", "q": "Headlamps must be on at night and whenever objects on the highway can't be clearly seen at a distance of at least:", "o": ["60 m", "100 m", "150 m", "200 m"], "a": 2, "ex": "Answer: 150 m.", "ref": "AR 304/2002 s.55(1)"}, {"id": "R3", "q": "You must switch to low beams when an oncoming vehicle is within:", "o": ["150 m", "300 m", "500 m", "1 km"], "a": 1, "ex": "Answer: 300 m.", "ref": "AR 304/2002 s.56(2)(a)"}, {"id": "R4", "q": "You must use low beams when following another vehicle within:", "o": ["150 m", "200 m", "300 m", "100 m"], "a": 0, "ex": "Answer: 150 m.", "ref": "AR 304/2002 s.56(2)(b)"}, {"id": "R7", "q": "You're passing a stopped vehicle that has its flashing lamps on, and there's another lane going your direction further away from it. You must:", "o": ["Only slow down to 60 km/h or less while staying in your lane", "Move out of its lane and the lane next to it, if you can move over safely", "Stop behind it and wait until its flashing lamps are turned off", "Keep your lane and speed but sound the horn as you go past"], "a": 1, "ex": "Answer: Not drive in its lane or the lane next to it, if you can move over safely.", "ref": "AR 304/2002 s.22.1(1)"}, {"id": "R8", "q": "On a two-lane road you may not pass when you're within how far of a level railway crossing?", "o": ["30 m", "60 m", "100 m", "150 m"], "a": 0, "ex": "Passing uphill or on a curve is also banned.", "ref": "AR 304/2002 s.19(1)(c)", "img": "nopass", "cap": ""}, {"id": "R9", "q": "Where practicable, how far before an intersection must you be in the correct position for a right turn?", "o": ["5 m", "15 m", "30 m", "50 m"], "a": 1, "ex": "Answer: 15 m.", "ref": "AR 304/2002 s.25(4)"}, {"id": "R10", "q": "Same question for a LEFT turn:", "o": ["15 m", "30 m", "50 m", "5 m"], "a": 0, "ex": "Answer: 15 m.", "ref": "AR 304/2002 s.26(5)"}, {"id": "R11", "q": "You may not U-turn on a curve or near the crest of a hill if drivers approaching from either direction within how far can't see you?", "o": ["100 m", "150 m", "300 m", "500 m"], "a": 1, "ex": "Answer: 150 m.", "ref": "AR 304/2002 s.29(2)"}, {"id": "R12", "q": "Coming out of a driveway or alley onto a highway with no yield or merge sign, you must stop no further back from the roadway than:", "o": ["1 m", "3 m", "5 m", "10 m"], "a": 1, "ex": "Answer: 3 m.", "ref": "AR 304/2002 s.36(2)(c)"}, {"id": "R13", "q": "Two vehicles enter an intersection from different roads at about the same time. Who yields?", "o": ["The driver on the right", "The driver on the left", "The slower driver", "Whoever is on the busier road"], "a": 1, "ex": "The vehicle on the left yields to the one on the right.", "ref": "AR 304/2002 s.34(1)"}, {"id": "R14", "q": "A train is approaching a crossing that has no stop sign. You must stop no closer to the nearest rail than:", "o": ["3 m", "5 m", "10 m", "15 m"], "a": 1, "ex": "Answer: 5 m.", "ref": "AR 304/2002 s.42(2)(a)", "img": "rail", "cap": ""}, {"id": "R16", "q": "Outside an urban area, you can't park within how far of a railway crossing controlled by a traffic control device?", "o": ["15 m", "30 m", "50 m", "100 m"], "a": 2, "ex": "Answer: 50 m.", "ref": "AR 304/2002 s.42(9)", "img": "rail", "cap": ""}, {"id": "R17", "q": "At a crossing with no traffic control signal, a school bus or a vehicle hauling explosives or flammable cargo must:", "o": ["Slow to 30 km/h, look both ways, and cross without stopping", "Stop 5 to 15 m from the nearest rail, look and listen", "Sound the horn twice and cross if no gates are lowered", "Stop only if a train is visible or the signal lights flash"], "a": 1, "ex": "A school bus must also open its front door.", "ref": "AR 304/2002 s.42(5)", "img": "rail", "cap": ""}, {"id": "R18", "q": "If you must park on a rural roadway, the parked vehicle must be clearly visible along the road in both directions for:", "o": ["30 m", "60 m", "150 m", "100 m"], "a": 1, "ex": "Answer: 60 m.", "ref": "AR 304/2002 s.43(4)(b)"}, {"id": "R20", "q": "You can't park at an intersection nearer than how far to the projection of the corner property line (unless a meter or sign permits)?", "o": ["3 m", "5 m", "10 m", "15 m"], "a": 1, "ex": "Answer: 5 m.", "ref": "AR 304/2002 s.44(g)"}, {"id": "R22", "q": "At night, a commercial vehicle stopped on a rural highway must have warning triangles placed about how far in front of and behind it?", "o": ["30 m", "75 m", "150 m", "50 m"], "a": 0, "ex": "Answer: 30 m.", "ref": "AR 304/2002 s.49.1(2)(b)"}, {"id": "R23", "q": "In poor visibility, when objects can't be seen at 150 m, those triangles go out to about:", "o": ["50 m", "75 m", "100 m", "150 m"], "a": 1, "ex": "Answer: 75 m.", "ref": "AR 304/2002 s.49.1(3)(b)"}, {"id": "R24", "q": "Flashing yellow lights with a school zone, playground zone or pedestrian crossing sign: maximum speed going past?", "o": ["30 km/h", "40 km/h", "50 km/h", "20 km/h"], "a": 0, "ex": "Also yield to pedestrians.", "ref": "AR 304/2002 s.54(5)", "img": "school", "cap": "Calgary school zone sign (Calgary posts its own times)"}, {"id": "R25", "q": "A school bus is showing alternately flashing AMBER lights (not red). You must:", "o": ["Stop", "Slow down and pass cautiously if you pass", "Carry on at normal speed", "Stop and wait for the driver to wave you on"], "a": 1, "ex": "Red lights mean stop.", "ref": "AR 304/2002 s.71, s.72", "img": "schoolbus", "cap": ""}, {"id": "H1", "q": "You reach a T-intersection with no signs or signals. You're on the road that goes straight through, and another car is coming from the side road on your right. Who has the right-of-way?", "o": ["You, because you're on the through road", "The car on your right", "Whoever is going faster", "Whoever arrived second"], "a": 1, "ex": "With no signs or signals, the driver on the right has the right-of-way, even at a T.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H2", "q": "At a four-way stop, you and a car on your left arrive at exactly the same time. Who goes first?", "o": ["You", "The car on your left", "Whoever signals first", "Whoever is turning left"], "a": 0, "ex": "When two arrive together, courtesy lets the vehicle on the right go first, and that's you.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "stop", "cap": ""}, {"id": "H3", "q": "In a one-lane roundabout you plan to take the third exit. When do you turn on your right signal?", "o": ["As you enter the roundabout, and keep it on", "Right after you pass the exit before yours", "Only once your car is already leaving the circle", "Before you enter, then switch to the left signal"], "a": 1, "ex": "Signal right after passing the exit just before the one you want.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H4", "q": "In a roundabout you plan to take the FIRST exit. When do you signal?", "o": ["Signal right as you approach and keep it on until you've exited", "Signal left as you enter, then right as you exit", "No signal is needed for the first exit at all", "Signal right only once you are inside the roundabout"], "a": 0, "ex": "For the first exit, signal right on approach and leave it on until you're out.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H5", "q": "You're on a yield sign approach with no traffic and no pedestrians. Do you have to stop completely?", "o": ["Yes, always come to a full stop at a yield sign", "No, you may go through without a full stop", "Only at night, when it is harder to see traffic", "Only if a pedestrian is waiting near the crosswalk"], "a": 1, "ex": "If nobody needs to be yielded to, you can proceed without stopping.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "yield", "cap": "Canadian yield sign (older design)"}, {"id": "H6", "q": "School zone times, unless posted otherwise. Which is right?", "o": ["Every day: 8 to 9:30 a.m., 11:30 to 1:30, and 3 to 4:30", "School days only: 8 to 9:30 a.m., 11:30 to 1:30, and 3 to 4:30", "School days only: 7:30 to 9 a.m., 11 to 1, and 3 to 5 p.m.", "School days only: 8 a.m. to 5 p.m., one continuous block"], "a": 1, "ex": "School days only, in those three time blocks.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H7", "q": "Playground zone times, unless posted otherwise?", "o": ["School days only, 8:30 a.m. to one hour after sunset", "Every day, 8:30 a.m. to one hour after sunset", "Every day, 7 a.m. to 9 p.m., all year round", "Every day, 8:30 a.m. until sunset (not after)"], "a": 1, "ex": "Every day, 8:30 a.m. to one hour after sunset.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "playground", "cap": ""}, {"id": "H8", "q": "You're passing a tow truck stopped on the shoulder with its lights flashing. The posted limit is 50. You're in the lane right next to it. How fast can you go?", "o": ["60", "50", "30", "40"], "a": 1, "ex": "Slow to 60 or the posted speed, whichever is lower. Here that's 50.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H11", "q": "You're on a highway divided by a median. A school bus coming toward you, on the other side of the median, has its red lights flashing. What do you do?", "o": ["Stop 20 metres away", "Proceed with caution and watch for pedestrians", "Stop until the lights go off", "Stop and wait for the bus driver to wave you on"], "a": 1, "ex": "On a divided highway, oncoming traffic may proceed with caution.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "schoolbus", "cap": ""}, {"id": "H12", "q": "Same divided highway, but now the school bus is ahead of you, in your direction, with red lights flashing. What do you do?", "o": ["Stop", "Pass slowly on the left", "Proceed with caution", "Pass slowly on the right"], "a": 0, "ex": "Vehicles behind the bus must stop.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "schoolbus", "cap": ""}, {"id": "H13", "q": "On a four-lane undivided highway, a school bus stops with red lights flashing. Who must stop?", "o": ["Only the lanes going the bus's way", "All four lanes", "Only the lane right behind the bus", "Only the lanes going the opposite way"], "a": 1, "ex": "On an undivided highway, all lanes in both directions stop.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "schoolbus", "cap": ""}, {"id": "H14", "q": "A train is visible and approaching. Within what distance of the crossing must you stop?", "o": ["100 metres, about one city block", "500 metres, about five city blocks", "1 kilometre, about ten city blocks", "200 metres, about two city blocks"], "a": 1, "ex": "Stop when a train is approaching within 500 metres.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "railahead", "cap": ""}, {"id": "H15", "q": "At a railway crossing with a stop sign, where do you stop?", "o": ["Right at the rail, so you can see down the track", "Between 5 and 15 metres from the nearest rail", "At least 30 metres back from the nearest rail", "Between 1 and 5 metres from the nearest rail"], "a": 1, "ex": "Between 5 and 15 metres from the nearest rail.", "ref": "Alberta Driver's Guide (Class 5 hard set)", "img": "rail", "cap": ""}, {"id": "H16", "q": "Parking: which distance is correct for a fire hydrant, a marked crosswalk, and a stop or yield sign?", "o": ["3 metres each", "5 metres each", "10 metres each", "2 metres each"], "a": 1, "ex": "5 metres, about 16 feet, for all three.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H19", "q": "You're passing a cyclist. What does the guide tell you to do?", "o": ["Give one short honk, then pass close and slowly", "Change lanes, the same way you would to pass another vehicle", "Stay in your lane and pass slowly with your hazards on", "Pass at least half a metre away within your own lane"], "a": 1, "ex": "Change lanes as you would for any other vehicle.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "H20", "q": "You're driving behind an ambulance that has its lights or siren on. What's the minimum following distance?", "o": ["50 metres", "150 metres", "300 metres", "100 metres"], "a": 1, "ex": "At least 150 metres, about 500 feet.", "ref": "Alberta Driver's Guide (Class 5 hard set)"}, {"id": "N1", "q": "Under Alberta rules you must disclose a medical condition that could affect safe driving (e.g. diabetes, seizures, sleep disorder). Which form do you submit?", "o": ["Driver Medical Intake Form", "Vehicle Inspection Report", "Collision Report", "Driver Abstract Request"], "a": 0, "ex": "Disclose the condition and submit a Driver Medical Intake Form.", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19"}, {"id": "N2", "q": "Who must complete the Driver Medical Intake Form?", "o": ["A doctor or nurse practitioner", "Any registry agent clerk", "You, signed by a witness", "A driving instructor"], "a": 0, "ex": "The form must be completed by a doctor or nurse practitioner.", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19"}, {"id": "N3", "q": "Where can a completed Driver Medical Intake Form be returned?", "o": ["A registry agent office, or emailed to the Driver Medical Fitness Program", "Only by mail to the federal transport office in Ottawa", "Your insurance company, which forwards it to the province", "Your local police service, in person, with photo ID"], "a": 0, "ex": "Return it to a registry agent or email the Driver Medical Fitness Program (driver.fitness@gov.ab.ca).", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19"}, {"id": "N4", "q": "At what age must drivers renewing a Class 7, 6, 5 or 3 licence provide a Driver Medical Intake Form and have vision assessed?", "o": ["65 or older", "70 or older", "75 or older", "80 or older"], "a": 2, "ex": "Drivers aged 75 or older: medical intake form plus vision check at a registry.", "ref": "Driver's Guide, Spring 2026, Ch.1 Additional requirements for drivers aged 75 or older, PDF p.19"}, {"id": "N5", "q": "If you don't submit a required Driver Medical Intake Form, what can happen?", "o": ["Nothing happens unless you are later in a collision", "Your renewal or application can be denied, or licence suspended until you provide it", "You receive a $50 fine but your licence stays valid", "Your insurance is cancelled, but your licence is unaffected"], "a": 1, "ex": "Renewal/application can be denied; existing licence may be suspended until medical documentation is provided.", "ref": "Driver's Guide, Spring 2026, Ch.1 Key Repercussions of Non-Compliance, PDF p.19"}, {"id": "N6", "q": "A Class 7 learner is NOT permitted to drive during which hours?", "o": ["10 p.m. to 6 a.m.", "Midnight to 5 a.m.", "11 p.m. to 5 a.m.", "1 a.m. to 6 a.m."], "a": 1, "ex": "Learners may not drive from midnight to 5 a.m.", "ref": "Driver's Guide, Spring 2026, Ch.1 Graduated driver licensing, PDF p.12"}, {"id": "N7", "q": "Can a Class 5-GDL (probationary) driver apply for a Class 4 licence?", "o": ["Yes, as soon as you are 16 and pass the knowledge test", "Yes, after one year in the probationary stage", "No. Probationary drivers may not apply; minimum age is 18", "Yes, if a fully licensed supervisor rides along"], "a": 2, "ex": "Class 4 minimum learning/licensing age is 18 and you may not apply as a probationary driver.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13"}, {"id": "N8", "q": "A Class 4 licence lets you drive a bus with a seating capacity of not more than how many, excluding the operator?", "o": ["15", "20", "24", "30"], "a": 2, "ex": "Up to 24 seats excluding the operator (S-endorsement needed for a school bus), plus ambulance or taxi.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13"}, {"id": "N9", "q": "As a taxi or ride-for-hire driver, when may you refuse to transport a customer?", "o": ["Whenever the trip is too short to be worth the fare", "If you are already at the maximum passengers, or the passenger is offensive or dangerous", "If they want to pay by card instead of cash", "Never; a licensed driver must take every customer"], "a": 1, "ex": "You may refuse if already at the maximum passengers or if a passenger is offensive or dangerous.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi, limousine, or ride for hire vehicle, PDF p.110"}, {"id": "N10", "q": "A first-time offender found guilty of impaired driving under the Traffic Safety Act is disqualified for:", "o": ["30 days", "90 days", "6 months", "One year"], "a": 3, "ex": "Disqualified for one year from the day of the finding of guilt (first offence). Commercial drivers also face zero tolerance for any alcohol or drugs.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114"}];const IMG={"rail": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAD6CAQAAAAi5ZK2AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAACYktHRAD/h4/MvwAAGldJREFUeNrt3WuYFcWZB/BiuAsCCqigWfHCzSBrVkXBeIkSNaJBM47GKCz7qLMqSjQos9FNiC4+suvz6KAxOoJZcVdBdHFFVg1eV1YURUCjooICKjd1uKowM8z574dzZqaruu5d3af7nOrzCaZnzun6nequeuutKkLcHpWknswnXYk/3BxdyXxSTyrT/BGrSBMBAVnk2R2RLyIgIE2kKu3knt0teYrZq0gTQXvMwDDP7pB8GGagfUrZLySNBO0xG8BXONqzRz06k4UEBEOwCcBcdAAB2Ut+lVJyeHbH5EglO0Pu2V2Tp4+dQ+7ZXZOni11A7tldk6eHXULu2V2Tp4NdQe7ZXZMXn12D3LO7Ji8uuya5Z3dNXjx2IXkjxmOpZ4+VvDjsEvLzQdATb3r2WMmTZ1eQE8/ukHwjnsajWIzGorJrkHt2N+RrMRbtCuXZB7XIFYldk9yzRyd/C32YEr2IU9/jZzcg9+zRyN/B/pwSPQd7EmY3JPfsrsmTZ7cg9+x25EvRS1ieQ/FVYk06A/JBqGDYfb/dTS0nGIwNiXXgDMhHYgceCrH72m5fy8/AlehfqOXJxeQNyQF4dkfkFXgAALANoxTkbtktyD27K/KZrT/bic2JReksyT179Gd5O/wJ5kd09gjkADArxP5OebNLa3lPYS0XHdtxs/NwjQH5iRxyHvsh2Fq+7I5r+Xac4LzfbtQvHyjsSrDst5TreLs04Gpey7dhROHs853VduNQjJj9Tua8skyzkJBvwEERyN2xW0XfROx7sS9142ooP3bp4OkVDPksQ3I37JYBVxF7I7pRF9VUbklVUvI9VJUguNeCPDq7UYv9Kg3231FnHFVuuXSKrJhVTGTdjjwau2EnLYdrFex3Mj+fVl4plMpEqPeo0hlhTW7PbtEvz2GihP3O0M92lVPmrEbu2w50pB5+rxiR94zMbhmKWc55tn8GIIfbmf8/AKvKKWFaM93xHGXcsuVgFS5EPUZFYreOvt3AudF0x89wVIj8fc1QYkmwa2e4LkdnTfZPcDBF3gRgR4j9Iu1cOmvyJqaXKXodgL8aRJAzz26U1PyIxigFy17V2gsKs8/QislHiLEvjIE88+zGeewPGbJXUR3fnQz7AdxuMc1emV8r5hGrYZVfBn66j5D8f $('app').innerHTML=head()+`<div class=card>${q.img?`<div class=sign><img alt="road sign" src="${IMG[q.img]}">${q.cap?`<div class=cap>${q.cap}</div>`:''}</div>`:''}<p><b>${q.q}</b></p></div>`+(S.ord=(()=>{const d=shuf([0,1,2,3].filter(k=>k!=q.a));d.splice(S.pos[S.i],0,q.a);return d})()).map((k,p)=>`<button id=o${k} onclick="pick(${k})">${'ABCD'[p]}. ${q.o[k]}</button>`).join('')+`<div id=fb></div>`}
function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;r?S.ok++:(S.bad++,S.missed.push(q));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=S.mode=='real'&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class=card><div class=fb style="color:var(${r?'--ok':'--bad'})">${r?'✅ Correct':'❌ Wrong, answer '+'ABCD'[S.ord.indexOf(q.a)]}</div><p>${q.ex}</p><div class=ref>${q.ref}</div></div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);$('fb').scrollIntoView({behavior:'smooth'})}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){const n=S.qs.length,real=S.mode=='real';const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(CFG.key)||0;if(S.ok>b)localStorage.setItem(CFG.key,S.ok)}
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'❌ FAIL'}</h1><div class=card>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}</div>`+
(S.missed.length?`<button class=pri onclick="start('missed',shuf(S.missed))">🔁 Retry missed only (${S.missed.length})</button><h2>Review missed</h2>`+S.missed.map(q=>`<div class=card><b>${q.q}</b><p>✔ ${q.o[q.a]}</p><p>${q.ex}</p><div class=ref>${q.ref}</div></div>`).join(''):'')+`<button onclick="home()">🏠 Home</button>`;scrollTo(0,0)}
home();
</script></body></html>
