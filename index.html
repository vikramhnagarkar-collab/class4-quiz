<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 4 Knowledge Test (Written) - 150 Question Bank</title>
<style>
:root{--bg:#f6f7f9;--fg:#111;--card:#fff;--mut:#666;--ok:#1a8f3c;--bad:#c62828;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eee;--card:#1d2228;--mut:#9aa;--acc:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0003}
button{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 14px;font-size:18px;text-align:left;border-radius:12px;border:2px solid #8884;background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;text-align:center;font-weight:700;border:0}
button.ok{border-color:var(--ok);background:#1a8f3c22}button.bad{border-color:var(--bad);background:#c6282822}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:flex;justify-content:space-between;font-size:15px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8884;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad)}
.sign{text-align:center}.sign img{max-height:150px;max-width:70%}.cap{font-size:13px;color:var(--mut)}
.fb{font-weight:700;font-size:20px}.ref{font-size:14px;color:var(--mut)}h1{font-size:24px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #8884;color:var(--acc);text-decoration:none;font-weight:600}nav.top{display:flex;gap:4px;margin:4px 0 10px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid #8886;color:inherit;text-decoration:none;line-height:1.2}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.hint{background:#fff3c4;color:#5a4500;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;padding:8px 14px;font-size:14px}button.elim{opacity:.35;text-decoration:line-through}</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "H1", "q": "You reach a T-intersection with no signs or signals. You're on the road that goes straight through, and another car is coming from the side road on your right. Who has the right-of-way?", "o": ["You, because you're on the through road", "The car on your right", "Whoever is going faster", "Whoever arrived second"], "a": 1, "ex": "With no signs or signals, the driver on the right has the right-of-way, even at a T.", "ref": "Driver's Guide (Spring 2026), Ch.4 Uncontrolled intersections, PDF p.61", "ch": "Driver's Guide (Spring 2026), Ch.4", "g": "DG", "sec": "Uncontrolled intersections", "h": "No signs at all, so the default rule applies. Being on the 'through' road doesn't change it."}, {"id": "H2", "q": "At a four-way stop, you and a car on your left arrive at exactly the same time. Who goes first?", "o": ["You", "The car on your left", "Whoever signals first", "Whoever is turning left"], "a": 0, "ex": "When two arrive together, courtesy lets the vehicle on the right go first, and that's you.", "ref": "Driver's Guide (Spring 2026), Ch.4 Three- and four-way stops, PDF p.61", "img": "ab_stop", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "ch": "Driver's Guide (Spring 2026), Ch.4", "g": "DG", "sec": "Three- and four-way stops", "h": "Same arrival time: the rule favours one side. Where is the other car compared with you?"}, {"id": "H3", "q": "In a one-lane roundabout you plan to take the third exit. When do you turn on your right signal?", "o": ["As you enter the roundabout, and keep it on", "Right after you pass the exit before yours", "Only once your car is already leaving the circle", "Before you enter, then switch to the left signal"], "a": 1, "ex": "Signal right after passing the exit just before the one you want.", "ref": "Driver's Guide (Spring 2026), Ch.4 Single-lane roundabouts, PDF p.63", "ch": "Driver's Guide (Spring 2026), Ch.4", "g": "DG", "img": "dRB1third", "cap": "Diagram (not to scale), based on the guide text", "sec": "Single-lane roundabouts", "h": "Signal to leave only once your exit is the next one."}, {"id": "H4", "q": "In a roundabout you plan to take the FIRST exit. When do you signal?", "o": ["Signal right as you approach and keep it on until you've exited", "Signal left as you enter, then right as you exit", "No signal is needed for the first exit at all", "Signal right only once you are inside the roundabout, then cancel it"], "a": 0, "ex": "For the first exit, signal right on approach and leave it on until you're out.", "ref": "Driver's Guide (Spring 2026), Ch.4 Exiting circular intersections, PDF p.65", "ch": "Driver's Guide (Spring 2026), Ch.4", "g": "DG", "img": "dRB1first", "cap": "Diagram (not to scale), based on the guide text", "sec": "Exiting circular intersections", "h": "For the first exit, you're turning right almost immediately. When should others know?"}, {"id": "H5", "q": "You're on a yield sign approach with no traffic and no pedestrians. Do you have to stop completely?", "o": ["Yes, always come to a full stop at a yield sign", "No, you may go through without a full stop", "Only at night, when it is harder to see traffic", "Only if a pedestrian is waiting near the crosswalk"], "a": 1, "ex": "If nobody needs to be yielded to, you can proceed without stopping.", "ref": "Driver's Guide (Spring 2026), Ch.4 Yield signs, PDF p.61", "img": "ab_yield", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "ch": "Driver's Guide (Spring 2026), Ch.4", "g": "DG", "sec": "Yield signs", "h": "Yield means slow and be ready to stop. Is there anyone to yield to?"}, {"id": "H6", "q": "School zone times, unless posted otherwise. Which is right?", "o": ["Every day: 8 to 9:30 a.m., 11:30 to 1:30, and 3 to 4:30", "School days only: 8 to 9:30 a.m., 11:30 to 1:30, and 3 to 4:30", "School days only: 7:30 to 9 a.m., 11 to 1, and 3 to 5 p.m.", "School days only: 8 a.m. to 5 p.m., one continuous block"], "a": 1, "ex": "School days only, in those three time blocks.", "ref": "Driver's Guide (Spring 2026), Ch.2 School zones, PDF p.32", "ch": "Driver's Guide (Spring 2026), Ch.2", "g": "DG", "img": "ab_school", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "sec": "School zones", "h": "Default school zones have three periods and a specific type of day."}, {"id": "H7", "q": "Playground zone times, unless posted otherwise?", "o": ["School days only, 8:30 a.m. to one hour after sunset", "Every day, 8:30 a.m. to one hour after sunset", "Every day, 7 a.m. to 9 p.m., all year round", "Every day, 8:30 a.m. until sunset (not after)"], "a": 1, "ex": "Every day, 8:30 a.m. to one hour after sunset.", "ref": "Driver's Guide (Spring 2026), Ch.2 Playground zones, PDF p.33", "img": "ab_playground", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "ch": "Driver's Guide (Spring 2026), Ch.2", "g": "DG", "sec": "Playground zones", "h": "Playgrounds are used every day, and the zone ends a set time after dark begins."}, {"id": "H8", "q": "You're passing a tow truck stopped on the shoulder with its lights flashing. The posted limit is 50. You're in the lane right next to it. How fast can you go?", "o": ["60", "50", "30", "40"], "a": 1, "ex": "Slow to 60 or the posted speed, whichever is lower. Here that's 50.", "ref": "Driver's Guide (Spring 2026), Ch.6 Tow trucks and other roadside workers, PDF p.87", "ch": "Driver's Guide (Spring 2026), Ch.6", "g": "DG", "img": "dTow", "cap": "Diagram (not to scale), based on the guide text", "sec": "Tow trucks and other roadside workers", "h": "The tow-truck rule gives a maximum speed, but a lower posted limit still counts."}, {"id": "H11", "q": "You're on a highway divided by a median. A school bus coming toward you, on the other side of the median, has its red lights flashing. What do you do?", "o": ["Stop 20 metres away", "Proceed with caution and watch for pedestrians", "Stop until the lights go off", "Stop and wait for the bus driver to wave you on"], "a": 1, "ex": "On a divided highway, oncoming traffic may proceed with caution.", "ref": "Driver's Guide (Spring 2026), Ch.8 School buses, PDF p.103\u2013104", "img": "schoolbus", "cap": "", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "sec": "School buses", "h": "A median separates you from the bus. Does the stop rule cross it?"}, {"id": "H12", "q": "Same divided highway, but now the school bus is ahead of you, in your direction, with red lights flashing. What do you do?", "o": ["Stop", "Pass slowly on the left", "Proceed with caution", "Pass slowly on the right"], "a": 0, "ex": "Vehicles behind the bus must stop.", "ref": "Driver's Guide (Spring 2026), Ch.8 School buses, PDF p.103\u2013104", "img": "schoolbus", "cap": "", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "sec": "School buses", "h": "The bus is on YOUR side of the median."}, {"id": "H13", "q": "On a four-lane undivided highway, a school bus stops with red lights flashing. Who must stop?", "o": ["Only the lanes going the bus's way", "All four lanes", "Only the lane right behind the bus", "Only the lanes going the opposite way"], "a": 1, "ex": "On an undivided highway, all lanes in both directions stop.", "ref": "Driver's Guide (Spring 2026), Ch.8 School buses, PDF p.103", "img": "schoolbus", "cap": "", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "sec": "School buses", "h": "No median: think about who can safely ignore a stopped bus on a shared roadway."}, {"id": "H14", "q": "A train is visible and approaching. Within what distance of the crossing must you stop?", "o": ["100 metres, about one city block", "500 metres, about five city blocks", "1 kilometre, about ten city blocks", "200 metres, about two city blocks"], "a": 1, "ex": "Stop when a train is approaching within 500 metres.", "ref": "Driver's Guide (Spring 2026), Ch.8 Railway crossings, PDF p.105", "img": "ab_railahead", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "sec": "Railway crossings", "h": "The guide converts this distance into city blocks."}, {"id": "H15", "q": "At a railway crossing with a stop sign, where do you stop?", "o": ["Right at the rail, so you can see down the track", "Between 5 and 15 metres from the nearest rail", "At least 30 metres back from the nearest rail", "Between 1 and 5 metres from the nearest rail"], "a": 1, "ex": "Between 5 and 15 metres from the nearest rail.", "ref": "Driver's Guide (Spring 2026), Ch.8 Railway crossings, PDF p.105", "img": "ab_rail", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "sec": "Railway crossings", "h": "With a stop sign at a crossing, the guide gives a minimum and a maximum distance from the rail."}, {"id": "H16", "q": "Parking: which distance is correct for a fire hydrant, a marked crosswalk, and a stop or yield sign?", "o": ["3 metres each", "5 metres each", "10 metres each", "2 metres each"], "a": 1, "ex": "5 metres, about 16 feet, for all three.", "ref": "Driver's Guide (Spring 2026), Ch.3 Do not park here, PDF p.58", "ch": "Driver's Guide (Spring 2026), Ch.3", "g": "DG", "img": "dNoPark", "cap": "Diagram (not to scale), based on the guide text", "sec": "Do not park here", "h": "These three parking rules share one number."}, {"id": "H19", "q": "You're passing a cyclist. What does the guide tell you to do?", "o": ["Give one short honk, then pass close and slowly", "Change lanes, the same way you would to pass another vehicle", "Stay in your lane and pass slowly with your hazards on", "Pass at least half a metre away within your own lane"], "a": 1, "ex": "Change lanes as you would for any other vehicle.", "ref": "Driver's Guide (Spring 2026), Ch.8 Bicycles, PDF p.100", "ch": "Driver's Guide (Spring 2026), Ch.8", "g": "DG", "img": "dBike", "cap": "Diagram (not to scale), based on the guide text", "sec": "Bicycles", "h": "Treat a cyclist like any other vehicle you overtake."}, {"id": "H20", "q": "You're driving behind an ambulance that has its lights or siren on. What's the minimum following distance?", "o": ["50 metres", "150 metres", "300 metres", "100 metres"], "a": 1, "ex": "At least 150 metres, about 500 feet.", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency vehicles, PDF p.87", "ch": "Driver's Guide (Spring 2026), Ch.6", "g": "DG", "img": "dAmb", "cap": "Diagram (not to scale), based on the guide text", "sec": "Emergency vehicles", "h": "Emergency vehicles need a big buffer, about one and a half city blocks."}, {"id": "N1", "q": "Under Alberta rules you must disclose a medical condition that could affect safe driving (e.g. diabetes, seizures, sleep disorder). Which form do you submit?", "o": ["Driver Medical Intake Form", "Vehicle Inspection Report", "Collision Report", "Driver Abstract Request"], "a": 0, "ex": "Disclose the condition and submit a Driver Medical Intake Form.", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "The form's name describes who it's about and what it takes in."}, {"id": "N2", "q": "Who must complete the Driver Medical Intake Form?", "o": ["A doctor or nurse practitioner", "Any registry agent clerk", "You, signed by a witness", "A driving instructor"], "a": 0, "ex": "The form must be completed by a doctor or nurse practitioner.", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "The form needs a medical professional's assessment."}, {"id": "N3", "q": "Where can a completed Driver Medical Intake Form be returned?", "o": ["A registry agent office, or emailed to the Driver Medical Fitness Program", "Only by mail to the federal transport office in Ottawa", "Your insurance company, which then forwards it to the provincial program", "Your local police service, in person, with photo ID"], "a": 0, "ex": "Return it to a registry agent or email the Driver Medical Fitness Program (driver.fitness@gov.ab.ca).", "ref": "Driver's Guide, Spring 2026, Ch.1 Medical requirements, PDF p.19", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "Think of the offices that handle licensing, plus the province's medical program."}, {"id": "N4", "q": "At what age must drivers renewing a Class 7, 6, 5 or 3 licence provide a Driver Medical Intake Form and have vision assessed?", "o": ["65 or older", "70 or older", "75 or older", "80 or older"], "a": 2, "ex": "Drivers aged 75 or older: medical intake form plus vision check at a registry.", "ref": "Driver's Guide, Spring 2026, Ch.1 Additional requirements for drivers aged 75 or older, PDF p.19", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "The renewal medical rule starts at an older age milestone."}, {"id": "N5", "q": "If you don't submit a required Driver Medical Intake Form, what can happen?", "o": ["Nothing happens unless you are later in a collision", "Your renewal or application can be denied, or licence suspended until you provide it", "You receive a $50 fine but your licence stays valid", "Your insurance is cancelled, but your licence is unaffected"], "a": 1, "ex": "Renewal/application can be denied; existing licence may be suspended until medical documentation is provided.", "ref": "Driver's Guide, Spring 2026, Ch.1 Key Repercussions of Non-Compliance, PDF p.20", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "Licensing can't go ahead without required medical information."}, {"id": "N6", "q": "A Class 7 learner is NOT permitted to drive during which hours?", "o": ["10 p.m. to 6 a.m.", "Midnight to 5 a.m.", "11 p.m. to 5 a.m.", "1 a.m. to 6 a.m."], "a": 1, "ex": "Learners may not drive from midnight to 5 a.m.", "ref": "Driver's Guide, Spring 2026, Ch.1 Graduated driver licensing, PDF p.12", "ch": "Driver's Guide (Spring 2026) Ch.1", "g": "DG", "h": "Learners face a curfew covering the early-morning hours."}, {"id": "N7", "q": "Can a Class 5-GDL (probationary) driver apply for a Class 4 licence?", "o": ["Yes, as soon as you are 16 and pass the knowledge test", "Yes, after one year in the probationary stage", "No. Probationary drivers may not apply; minimum age is 18", "Yes, if a fully licensed supervisor rides along"], "a": 2, "ex": "Class 4 minimum learning/licensing age is 18 and you may not apply as a probationary driver.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13", "ch": "Commercial Driver's Guide (2025) Ch.1", "g": "CG", "h": "A Class 4 involves paid passengers. Think about the stage of the licence and the minimum age."}, {"id": "N8", "q": "A Class 4 licence lets you drive a bus with a seating capacity of not more than how many, excluding the operator?", "o": ["15", "20", "24", "30"], "a": 2, "ex": "Up to 24 seats excluding the operator (S-endorsement needed for a school bus), plus ambulance or taxi.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13", "ch": "Commercial Driver's Guide (2025) Ch.1", "g": "CG", "h": "A Class 4 covers small buses, but under a certain seat count."}, {"id": "N9", "q": "As a taxi or ride-for-hire driver, when may you refuse to transport a customer?", "o": ["Whenever the trip is too short to be worth the fare", "If you are already at the maximum passengers, or the passenger is offensive or dangerous", "If they want to pay by card instead of cash", "Never; a licensed driver must take every customer"], "a": 1, "ex": "You may refuse if already at the maximum passengers or if a passenger is offensive or dangerous.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi, limousine, or ride for hire vehicle, PDF pp.110\u2013111", "ch": "Commercial Driver's Guide (2025) Ch.6", "g": "CG", "h": "The guide allows refusal for capacity or safety reasons only."}, {"id": "N10", "q": "A first-time offender found guilty of impaired driving under the Traffic Safety Act is disqualified for:", "o": ["30 days", "90 days", "6 months", "One year"], "a": 3, "ex": "Disqualified for one year from the day of the finding of guilt (first offence). Commercial drivers also face zero tolerance for any alcohol or drugs.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114", "ch": "Commercial Driver's Guide (2025) Ch.7", "g": "CG", "h": "First impaired-driving disqualification under the TSA is a whole-calendar period."}, {"id": "G1", "q": "Unless posted otherwise, what is the maximum speed on a provincial highway outside an urban area?", "o": ["100 km/h", "90 km/h", "110 km/h", "80 km/h"], "a": 0, "ex": "100 km/h is the default maximum on a provincial highway outside an urban area.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Speed limit signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Speed limit signs, PDF p.29", "img": "ab_100", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Highways outside towns have the highest default limit."}, {"id": "G2", "q": "Unless posted otherwise, what is the maximum speed on a provincial highway inside a city's limits?", "o": ["80 km/h", "70 km/h", "60 km/h", "100 km/h"], "a": 0, "ex": "80 km/h on a provincial highway inside a city's corporate limits.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Speed limit signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Speed limit signs, PDF p.29", "img": "ab_80", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "A highway running through a city gets a middle value between rural and urban."}, {"id": "G3", "q": "Unless posted otherwise, the maximum speed on a roadway within an urban area is:", "o": ["50 km/h", "40 km/h", "60 km/h", "30 km/h"], "a": 0, "ex": "50 km/h in urban areas unless posted (municipal bylaws may differ).", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Speed limit signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Speed limit signs, PDF p.29", "img": "ab_50", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "The default inside towns and cities is the familiar city limit."}, {"id": "G4", "q": "According to the guide, what does a posted speed limit mean?", "o": ["The maximum allowed in ideal conditions; any unsafe speed is illegal", "The speed you should always drive at when traffic is light", "A target speed; up to 10 km/h over is tolerated", "The minimum speed allowed whenever road and weather conditions are good"], "a": 0, "ex": "Limits are the maximum permitted in ideal conditions. Any speed unsafe for current conditions is illegal.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Speed limit signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Speed limit signs, PDF p.29", "h": "A limit is a ceiling, not a target. What if conditions are bad?"}, {"id": "G5", "q": "A construction zone has no workers or equipment today. The posted construction speed limit:", "o": ["Still must be obeyed at all times", "Applies only when workers are present", "Applies only during daylight hours", "Becomes an advisory speed only"], "a": 0, "ex": "The limit applies at all times because hazards like bumps or loose gravel remain. Fines double only when workers are present.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Construction zones", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Construction zones, PDF p.39", "img": "ab_worker", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "The sign is still posted. Does it switch off when no one's working?"}, {"id": "G6", "q": "A 'Prepare to stop at traffic lights when flashing' sign has its yellow lights flashing. This means:", "o": ["The signal ahead is changing to or already red; prepare to stop", "The signal ahead is broken; treat it as a four-way stop", "A school zone is starting; slow to 30 km/h", "The signal ahead is about to turn green, so keep your current speed steady"], "a": 0, "ex": "Flashing lights on this advance sign mean the light ahead is turning or is red. Prepare to stop.", "ch": "Driver's Guide (Spring 2026), Ch.2 Traffic Control", "sec": "Traffic regulation signs", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.2 Traffic Control, Traffic regulation signs, PDF p.35", "img": "ab_preparestop", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Flashing yellow on this sign warns about what's happening at the signal ahead."}, {"id": "G7", "q": "Which is NOT part of the daily trip inspection program described in the Commercial Guide?", "o": ["The carrier signs every report before the vehicle may leave", "The driver inspects the vehicle using a schedule of listed components", "The driver completes and signs a report", "The driver reports defects to the carrier"], "a": 0, "ex": "The driver inspects with a schedule, completes and signs the report, records defects and reports them to the carrier. The guide doesn't require the carrier to sign each report.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Purpose of daily vehicle inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Purpose of daily vehicle inspections, PDF p.28", "h": "The program is driver-centred. Which option adds a step that isn't listed?"}, {"id": "G8", "q": "You're parked on the LEFT side of a one-way road and want to pull out. Which signal do you use?", "o": ["Right turn signal", "Left turn signal", "Hazard lights only", "No signal, just a shoulder check"], "a": 0, "ex": "From the left side of a one-way road, use your right signal.", "ch": "Driver's Guide (Spring 2026), Ch.3 The Basics of Driving", "sec": "Moving into traffic", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.3 The Basics of Driving, Moving into traffic, PDF p.47", "img": "dG8", "cap": "Diagram (not to scale), based on the guide text", "h": "You're on the LEFT side of the road. Which way are you moving to join traffic?"}, {"id": "G9", "q": "A police officer is directing traffic through an intersection with a green light. You must:", "o": ["Follow the officer's directions over the signal", "Follow the signal, since it is the legal control", "Follow whichever is more cautious", "Stop and wait for the officer to wave every car"], "a": 0, "ex": "Directions from a peace officer or police officer must be followed over signs or signals.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Right-of-way", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Right-of-way, PDF p.60", "h": "There's a ranking of controls. People directing traffic come first."}, {"id": "G10", "q": "At a stop sign with no stop line and no marked crosswalk, you must stop within how far of the intersecting roadway?", "o": ["3 metres (10 feet)", "5 metres (16 feet)", "1 metre (3 feet)", "6 metres (20 feet)"], "a": 0, "ex": "Stop within three metres of the intersecting roadway where there's no stop line or crosswalk.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Rules for stopping at intersections", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Rules for stopping at intersections, PDF p.61", "img": "ab_stop", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "No line and no crosswalk: the guide gives a short distance from the cross road."}, {"id": "G11", "q": "At a 'courtesy corner' (four-way stop), who goes first?", "o": ["The vehicle that arrived first", "The vehicle going straight through", "The largest vehicle", "The vehicle on the left"], "a": 0, "ex": "Courtesy lets the vehicle that arrived first proceed first.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Three- and four-way stops", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Three- and four-way stops, PDF p.61", "img": "ab_stop", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Courtesy corners run on order of arrival."}, {"id": "G12", "q": "Going too fast in a turn, your car slides sideways. Which is NOT correct?", "o": ["Brake hard to stop the slide", "Take your foot off the accelerator", "Look where you want to go", "Steer where you want to go"], "a": 0, "ex": "Cornering skid: off the gas, do not use the brakes, look and steer where you want to go. Braking hard is good for an ABS stop, but not in this skid.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Cornering skid", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Cornering skid, PDF p.81", "h": "In a cornering skid, avoid both pedals. Which option breaks that?"}, {"id": "G13", "q": "The car in the next lane has stopped at an unmarked crosswalk. You should:", "o": ["Not pass it; it may be stopped for a pedestrian", "Pass carefully, since the crosswalk is unmarked", "Pass only if you're turning right", "Sound your horn and then pass slowly"], "a": 0, "ex": "All intersections have crosswalks, marked or unmarked. You must not pass a vehicle stopped for a pedestrian.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Intersection reminders", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Intersection reminders, PDF p.62", "img": "crosswalk", "h": "Why might a car stop at a crosswalk with no signal?"}, {"id": "G14", "q": "Your light is green but traffic is backed up beyond the intersection. You should:", "o": ["Wait until you can clear the intersection and far crosswalk", "Enter and wait in the intersection so you keep your turn", "Enter and wait in the middle of the intersection so you keep your turn", "Go only if the car behind you honks"], "a": 0, "ex": "Don't enter until you can completely clear the intersection and the crosswalk on the other side.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Keep intersections clear", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Keep intersections clear, PDF p.62", "img": "dG14", "cap": "Diagram (not to scale), based on the guide text", "h": "Think about blocking cross traffic if your light changes."}, {"id": "G15", "q": "In a two-lane roundabout you plan to go past the first exit. Which lane should you use to enter?", "o": ["The left lane", "The right lane", "Either lane, then switch in the circle", "The right lane, then move left inside"], "a": 0, "ex": "Drivers planning to travel past the first exit should enter and exit using the left lane.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Two-lane roundabouts", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Two-lane roundabouts, PDF p.64", "img": "dG15", "cap": "Diagram (not to scale), based on the guide text", "h": "Lane choice depends on whether you take the first exit or a later one."}, {"id": "G16", "q": "Inside a two-lane roundabout, who must yield?", "o": ["Drivers in the right lane yield to drivers in the left lane", "Drivers in the left lane yield to the right lane", "Whoever is exiting yields to whoever is staying", "Whoever is exiting the roundabout yields to whoever is staying in it"], "a": 0, "ex": "While in the circle, drivers on the right yield to drivers on the left.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Two-lane roundabouts", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Two-lane roundabouts, PDF p.64", "img": "dG16", "cap": "Diagram (not to scale), based on the guide text", "h": "In a two-lane roundabout, which lane has to cross the other to leave?"}, {"id": "G17", "q": "You're in the left lane of a two-lane roundabout and can't exit safely. What should you do?", "o": ["Stay in your lane and go around the circle again", "Stop in the circle until the right lane clears", "Cut across the right lane quickly to make the exit", "Exit using the right lane at the next opening"], "a": 0, "ex": "If you can't exit safely, stay in your lane and travel around again.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Exiting circular intersections", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Exiting circular intersections, PDF p.65", "img": "dG17", "cap": "Diagram (not to scale), based on the guide text", "h": "Never force an exit. What does a circle let you do that a normal intersection doesn't?"}, {"id": "G18", "q": "Turning right from one two-way road onto another, stay how close to the curb?", "o": ["Not more than 1 metre (3 feet)", "Not more than 2 metres (6 feet)", "At least 1 metre (3 feet)", "Not more than 50 cm (20 inches)"], "a": 0, "ex": "Stay centred in the turning lane, not more than one metre from the curb or edge.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Right turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Right turns, PDF p.66", "img": "dG18", "cap": "Diagram (not to scale), based on the guide text", "h": "Stay close to the curb on a right turn, about an arm's length plus."}, {"id": "G19", "q": "Turning right, a car is parked close to the corner in the curb lane you'd enter. You should:", "o": ["Turn into the first available lane left of the parked car", "Turn wide into two lanes, then move right", "Wait until the parked car leaves", "Turn into the curb lane and stop behind the parked car until it moves"], "a": 0, "ex": "If an obstruction is close to the corner, turn into the first available lane to its left. Never turn wide into two lanes.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Right turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Right turns, PDF p.66", "img": "dG19", "cap": "Diagram (not to scale), based on the guide text", "h": "A parked car blocks the curb lane. Where's the nearest open lane?"}, {"id": "G20", "q": "When making a dual-lane turn, you should:", "o": ["Turn into the corresponding lane and never swing wide", "Turn into whichever lane is clearer", "Swing wide to give the other turning car room", "Change lanes in the middle of the turn if the other lane looks empty"], "a": 0, "ex": "Approach in a marked lane and turn into the corresponding lane. Never swing wide or change lanes.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Dual lane turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Dual lane turns, PDF p.68", "img": "dG20", "cap": "Diagram (not to scale), based on the guide text", "h": "Dual turns work like lanes on a curve. Keep your position."}, {"id": "G21", "q": "Turning left from a one-way street onto a two-way street, you turn into:", "o": ["The lane just right of the yellow centre line", "The curb lane on the far right", "Any lane, as long as you signal", "The lane just left of the yellow line"], "a": 0, "ex": "Turn into the nearest lane to the right of the yellow line.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Turning left", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Turning left, PDF p.68", "img": "dG21", "cap": "Diagram (not to scale), based on the guide text", "h": "Turning left onto a two-way road, you end up next to the centre line."}, {"id": "G22", "q": "Entering a two-way left-turn lane in the centre of the road, you may:", "o": ["Cross the solid yellow line, entering close to your turn", "Never cross a solid yellow line, even to turn", "Never cross a solid yellow line, even to turn left into a driveway", "Enter it a full block ahead to be safe"], "a": 0, "ex": "It's permissible to cross the solid yellow to enter the shared turn lane. Enter only close to where you'll turn.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "Two-way left turn lanes", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, Two-way left turn lanes, PDF p.69", "img": "dG22", "cap": "Diagram (not to scale), based on the guide text", "h": "The centre turn lane is reached by crossing its edge line. When should you enter?"}, {"id": "G23", "q": "In an urban area, where are U-turns NOT permitted?", "o": ["On a roadway between intersections", "At any uncontrolled residential intersection", "On any one-way street", "Anywhere within 50 m of a school"], "a": 0, "ex": "In urban areas, no U-turns between intersections, at alley intersections, or at intersections with a parking-lot access.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "U-turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, U-turns, PDF p.69", "img": "ab_nouturn", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Urban U-turns are banned in several places. Think about mid-block."}, {"id": "G24", "q": "May you make a U-turn at an intersection controlled by traffic lights?", "o": ["No, unless a traffic control device permits it", "Yes, on a green light if it's safe", "Yes, on a green left-turn arrow", "No, unless there are no other cars or pedestrians in sight"], "a": 0, "ex": "U-turns are not permitted at signalized intersections unless a device permits it.", "ch": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns", "sec": "U-turns", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.4 Intersections and Turns, U-turns, PDF p.69", "img": "ab_nouturn", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Signals change this unless something specifically allows it."}, {"id": "G25", "q": "Which order does the guide give for a lane change?", "o": ["Mirrors, shoulder check, signal, then move if safe", "Signal, move over, then shoulder check", "Shoulder check, move over, then signal", "Shoulder check, move over into the lane, then turn on your signal"], "a": 0, "ex": "Check mirrors, shoulder check, turn on the signal, change lanes if safe, then cancel the signal.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Changing lanes", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Changing lanes, PDF p.73", "img": "dLaneChg", "cap": "Diagram (not to scale), based on the guide text", "h": "Check before you signal, and check your blind spot before moving."}, {"id": "G26", "q": "Traffic is slow. May you use the emergency stopping lane to pass?", "o": ["No, never drive or pass in it", "Yes, if you keep under 50 km/h", "Yes, if you signal and it's empty", "Only to reach an exit just ahead"], "a": 0, "ex": "Do not drive in the emergency stopping lane, and do not pass or help others pass using it.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Emergency stopping lanes", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Emergency stopping lanes, PDF p.75", "img": "dShoulder", "cap": "Diagram (not to scale), based on the guide text", "h": "That lane is reserved for one purpose only."}, {"id": "G27", "q": "When merging onto a highway, who has the right-of-way?", "o": ["Neither; merging is a shared responsibility", "The vehicles already on the highway", "The merging vehicle", "Whoever is travelling faster"], "a": 0, "ex": "Neither the merging vehicle nor highway traffic has the right-of-way.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Merging", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Merging, PDF p.75", "img": "dMerge", "cap": "Diagram (not to scale), based on the guide text", "h": "Merging works when both sides adjust."}, {"id": "G28", "q": "When do you reduce your speed for a curve?", "o": ["Before entering the curve", "In the middle of the curve", "As you exit the curve", "Only if you feel the tires slip"], "a": 0, "ex": "Slow down before entering the curve, then keep a safe, steady speed.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Curves", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Curves, PDF p.77", "img": "dCurve", "cap": "Diagram (not to scale), based on the guide text", "h": "Braking mid-curve can upset the car. When is the safer time to slow?"}, {"id": "G29", "q": "You start to skid in a curve. The guide says to:", "o": ["Stay off the brake and accelerator and steer where you want to go", "Brake firmly and steer toward the shoulder", "Brake firmly and steer toward the shoulder until the vehicle stops sliding", "Steer sharply the opposite way of the skid"], "a": 0, "ex": "Stay off the brake and accelerator, look where you want to go, and make small steering adjustments.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Curves", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Curves, PDF p.77", "h": "In a skid, avoid sudden inputs on both pedals and look where you want to go."}, {"id": "G30", "q": "Approaching the top of a hill on a two-lane highway, you should:", "o": ["Move to the right in your lane", "Move to the centre to see over the crest", "Speed up to clear the crest quickly", "Pass slower vehicles before the crest"], "a": 0, "ex": "Move right in your lane near the top of a hill, in case an oncoming vehicle is over the centre line.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Hills", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Hills, PDF p.78", "img": "ab_nopass", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "An oncoming car could appear at the crest. How do you get more room?"}, {"id": "G31", "q": "Emergency stop in a car with ABS. You should:", "o": ["Apply steady, firm pressure and don't pump the brake", "Pump the brake rapidly to avoid locking the wheels", "Pump the brake rapidly so the wheels never get a chance to lock up", "Apply the park brake together with the pedal"], "a": 0, "ex": "With ABS: steady firm pressure, don't pump or release, steer where you want to go. The pedal will vibrate.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Emergency braking (ABS)", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Emergency braking (ABS), PDF p.80", "h": "ABS does the pulsing for you."}, {"id": "G32", "q": "Your wheels spin from accelerating too hard on ice. First step:", "o": ["Take your foot off the gas pedal", "Brake firmly until the wheels grip", "Steer sharply to the right", "Shift into neutral and brake"], "a": 0, "ex": "Power skid: foot off the gas to stop the wheel spin, then make small steering corrections.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Power skid", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Power skid, PDF p.81", "h": "Spinning means too much power. What's the first thing to reduce?"}, {"id": "G33", "q": "Your right wheels drop off the pavement onto gravel. You should:", "o": ["Not steer back immediately; ease off the gas", "Steer back onto the road right away", "Brake hard to stop on the shoulder", "Speed up and steer sharply to climb back onto the pavement quickly"], "a": 0, "ex": "Grip the wheel, don't steer back immediately, ease off the gas, avoid braking, then return gradually.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Off-road recovery", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Off-road recovery, PDF p.81", "img": "dOffRoad", "cap": "Diagram (not to scale), based on the guide text", "h": "Jerking back onto pavement can cause a loss of control."}, {"id": "G34", "q": "Broken down on a highway, place reflective triangles behind your vehicle about how far apart?", "o": ["10 to 20 metres (33 to 66 feet)", "2 to 5 metres (6 to 16 feet)", "50 to 75 metres (165 to 250 feet)", "30 to 40 metres (100 to 130 feet)"], "a": 0, "ex": "Place triangles to the rear about 10 to 20 metres apart.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Vehicle mechanical problems", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Vehicle mechanical problems, PDF p.82", "img": "dTri", "cap": "Diagram (not to scale), based on the guide text", "h": "Triangles are spaced at intervals of a few car lengths."}, {"id": "G35", "q": "Your brakes fail completely and your wheels are straight. You can:", "o": ["Carefully use the park brake to slow down", "Turn off the engine to slow down", "Shift into park while moving", "Steer onto grass and brake hard"], "a": 0, "ex": "If brakes fail and the wheels aren't turned, carefully use the park brake. You may also shift to a lower gear.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Brake failure", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Brake failure, PDF p.82", "h": "There's a second, separate braking system in the car."}, {"id": "G36", "q": "A front tire blows out at highway speed. First reaction:", "o": ["Don't brake; ease off the gas and hold the wheel firmly", "Brake hard immediately to stop quickly", "Steer firmly toward the flat tire's side", "Steer firmly toward the flat tire's side and brake to a stop at once"], "a": 0, "ex": "Resist braking, take your foot off the gas, hold firmly, then brake gently once under control.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Tire failure", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Tire failure, PDF p.83", "h": "Braking hard on a blowout pulls the car. Keep it straight first."}, {"id": "G37", "q": "In thick fog you should use:", "o": ["Low beam headlights", "High beam headlights", "Hazard lights while moving", "Parking lights only"], "a": 0, "ex": "Use low beams in smoke and fog; high beams reflect back and cause glare.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Smoke and fog", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Smoke and fog, PDF p.84", "h": "High beams reflect off fog back at you."}, {"id": "G38", "q": "Black ice is most likely where the asphalt looks:", "o": ["Shiny and black instead of grey-white", "Dull grey and dry", "White and frosty", "Wet with standing puddles"], "a": 0, "ex": "If the asphalt looks shiny and black, be cautious and slow down without braking.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Road surface conditions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Road surface conditions, PDF p.84", "h": "Black ice looks different from normal dry pavement. Which colour?"}, {"id": "G39", "q": "You must report a collision to police if the overall damage exceeds:", "o": ["$5,000", "$2,000", "$1,000", "$10,000"], "a": 0, "ex": "Report if anyone is injured or killed, damage exceeds $5,000, or public property is damaged.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Collisions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Collisions, PDF p.86", "h": "The collision reporting threshold is a round dollar figure in the thousands."}, {"id": "G40", "q": "A deer suddenly appears in front of you. The guide says:", "o": ["Brake hard; choose an escape route away from oncoming traffic", "Swerve into the oncoming lane to avoid it", "Swerve into the oncoming lane to get around it as fast as you can", "Honk and keep a steady speed"], "a": 0, "ex": "Brake hard and prepare to take evasive action, choosing an escape route away from oncoming traffic.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Animals", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Animals, PDF p.86", "img": "ab_deer", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Swerving into oncoming traffic is worse than hitting the animal."}, {"id": "G41", "q": "On a ONE-WAY street, an ambulance approaches with its siren on. You should:", "o": ["Move to the nearest curb, left or right, and stop", "Always move to the right curb and stop", "Speed up to the next intersection", "Stop exactly where you are"], "a": 0, "ex": "On one-way streets, move right or left to the nearest curb and stop until it has passed.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Emergency vehicles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Emergency vehicles, PDF p.87", "img": "dG41", "cap": "Diagram (not to scale), based on the guide text", "h": "On a one-way, there's no oncoming lane. Either curb is available."}, {"id": "G42", "q": "A pickup truck approaches with FLASHING GREEN lights. This is likely:", "o": ["A volunteer firefighter; yield as to an emergency vehicle", "A funeral escort; let it pass at the next turn", "A road-maintenance truck; slow to 60 km/h", "A road-maintenance truck; slow to 60 km/h while passing it"], "a": 0, "ex": "Treat flashing green lights like any other emergency vehicle. Volunteer firefighters use them.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Emergency vehicles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Emergency vehicles, PDF p.87", "h": "Flashing green on a private vehicle usually means a volunteer responder."}, {"id": "G43", "q": "A trip inspection was done at 7 a.m. Monday. Without a new inspection, the vehicle may be driven until:", "o": ["7 a.m. Tuesday", "Midnight Monday", "The end of the driver's shift", "7 p.m. Monday"], "a": 0, "ex": "The inspection and report are valid for 24 hours.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Purpose of daily vehicle inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Purpose of daily vehicle inspections, PDF p.28", "h": "Count the inspection's validity period forward from 7 a.m. Monday."}, {"id": "G44", "q": "You're on the highway and a car is merging from the on-ramp. If it's safe, you should:", "o": ["Move left one lane to give it room", "Speed up so it merges behind you", "Hold your lane and speed; you have priority", "Brake hard to let it in ahead of you"], "a": 0, "ex": "If you are on the main roadway and it's safe, move left to leave the right lane clear for merging traffic.", "ch": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways", "sec": "Merging", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.5 Highways and Freeways, Merging, PDF p.75", "img": "dMerge", "cap": "Diagram (not to scale), based on the guide text", "h": "On the main road, you can help a merging car if it's safe."}, {"id": "G45", "q": "Entering an address into a GPS while driving can bring a fine and how many demerits?", "o": ["3 demerits", "2 demerits", "4 demerits", "No demerits"], "a": 0, "ex": "The listed distractions, including entering information on GPS units, carry fines and three demerits.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Cellular phones and distractions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Cellular phones and distractions, PDF p.93", "h": "Distracted-driving demerits are a small number."}, {"id": "G46", "q": "A 17-year-old passenger isn't wearing a seat belt. Who can be fined?", "o": ["The passenger, since they are 16 or older", "Only the driver, always", "Nobody, if they sit in the back", "Only the vehicle's registered owner"], "a": 0, "ex": "Passengers 16 and older can be fined. The driver is responsible for passengers under 16.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Securing passengers", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Securing passengers, PDF p.93", "h": "At a certain age, passengers are responsible for their own belts."}, {"id": "G47", "q": "How often should you check your rear view mirrors?", "o": ["Every 8 to 12 seconds", "Every 12 to 15 seconds", "Every 2 to 4 seconds", "Every 30 seconds"], "a": 0, "ex": "Check your mirrors every 8 to 12 seconds. 12 to 15 seconds is how far ahead to look in the city, not how often to check mirrors.", "ch": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving", "sec": "Scan all around your vehicle", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.7 Responsible Driving, Scan all around your vehicle, PDF p.91", "h": "Mirror checks are frequent, about every block in the city."}, {"id": "G48", "q": "The day-shift driver did the trip inspection 6 hours ago. You take the same bus for the evening shift. BEST answer:", "o": ["You may rely on it, unless you know or ought to know of a defect", "You must always do a brand-new inspection yourself before every shift", "Only a mechanic's inspection can be shared", "You may rely on it for up to 48 hours"], "a": 0, "ex": "An inspection completed within 24 hours may be used by another person, unless you have reason to doubt it or know of a defect.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Inspection required", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Inspection required, PDF p.29", "h": "Another person's inspection can be used if it's recent and you have no reason to doubt it."}, {"id": "G49", "q": "A MAJOR defect listed on the schedule must be reported to the carrier:", "o": ["Without delay", "By the next daily trip inspection", "At the end of the trip or day", "Within 24 hours"], "a": 0, "ex": "Major defects are reported without delay; other defects in a timely manner, no later than the next daily trip inspection. \"Next inspection\" is true for minor defects, not major ones.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Reporting defects", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Reporting defects, PDF p.29", "img": "dLoad", "cap": "Diagram (not to scale), based on the guide text", "h": "Major defects can't wait for the next inspection."}, {"id": "G50", "q": "In an urban area, how does a pedestrian show they intend to cross?", "o": ["Raising an arm and pointing to the opposite curb", "Waving both hands overhead", "Stepping off the curb with one foot", "Stepping off the curb with one foot while looking at traffic"], "a": 0, "ex": "Pedestrians may raise an arm at a right angle and point to the opposite curb. You must stop and let them cross.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Pedestrian safety", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Pedestrian safety, PDF p.99", "img": "Wc-007", "cap": "Canadian sign design. Image: Wikimedia Commons (public domain)", "h": "Pedestrians use a hand signal toward where they're going."}, {"id": "G51", "q": "When stopping for a pedestrian at a crosswalk, how far back should you stop?", "o": ["About 2 to 3 car lengths", "Right at the edge of the crosswalk", "About half a car length", "About 6 car lengths"], "a": 0, "ex": "Stop about two to three car lengths back so other lanes can see the pedestrian.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Pedestrian safety", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Pedestrian safety, PDF p.99", "img": "crosswalk", "h": "Stop well back so other drivers can see the pedestrian too."}, {"id": "G52", "q": "There's plenty of room beside a motorcycle in its lane. Which is ALWAYS true?", "o": ["You must not share its lane; it needs the whole lane", "You may pass within the lane if you signal", "You may share it at low speeds", "You may share it if the rider waves you by"], "a": 0, "ex": "Never share a lane with a motorcycle rider; it needs the full lane to manoeuvre.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Motorcycles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Motorcycles, PDF p.101", "h": "Motorcycles need room to manoeuvre within the lane."}, {"id": "G53", "q": "Parked at the curb, you're about to open your door into the bike lane. Whose responsibility is safety?", "o": ["Yours, as the driver: wait until it's safe", "The cyclist's: they must watch for doors", "Shared equally by both", "The city's, for the lane design"], "a": 0, "ex": "It's the driver's responsibility to check for cyclists and wait until it's safe to open the door.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Bicycles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Bicycles, PDF p.100", "img": "dDoor", "cap": "Diagram (not to scale), based on the guide text", "h": "The person opening the door controls the risk."}, {"id": "G54", "q": "A motorcycle rides in the left part of its lane. This most likely means:", "o": ["The rider is staying visible, not signalling a left turn", "The rider is about to turn left", "The rider wants you to pass on the right", "The rider wants you to pass on the right side of the motorcycle"], "a": 0, "ex": "Riders often use the left portion to be seen. It doesn't mean they'll turn left.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Motorcycles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Motorcycles, PDF p.100", "img": "dMoto", "cap": "Diagram (not to scale), based on the guide text", "h": "Riders choose lane position to be seen."}, {"id": "G55", "q": "Behind a large truck, you can't see either of its side mirrors. This means:", "o": ["You're too close; the driver can't see you", "You're at the ideal following distance", "The truck's mirrors need adjusting", "You should pass it right away"], "a": 0, "ex": "If you can't see both side mirrors, you're too close.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Commercial vehicles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Commercial vehicles, PDF p.101", "img": "dTruck", "cap": "Diagram (not to scale), based on the guide text", "h": "If you can't see the mirrors, think about what the truck driver can see."}, {"id": "G56", "q": "Your car is having trouble. Where should you NOT stop?", "o": ["On a bridge or in a tunnel", "Well off the road on the right", "On the shoulder, hazards on", "At a safe spot past a curve"], "a": 0, "ex": "Do not stop on a bridge or in a tunnel. Get as far off the road as possible and use your hazards.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Vehicle mechanical problems", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Vehicle mechanical problems, PDF p.82", "h": "Some places leave no escape route or shoulder."}, {"id": "G57", "q": "A large truck ahead is turning right. You should:", "o": ["Stay well back, not in the space to its right", "Pass it on the right while it swings left", "Pass it on the right while it swings left to make the turn", "Honk so it knows you're there"], "a": 0, "ex": "Stay well back and don't drive into the space on its right. You could be squeezed against the curb.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Commercial vehicles", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Commercial vehicles, PDF p.101", "img": "dG57", "cap": "Diagram (not to scale), based on the guide text", "h": "Large trucks swing wide to turn right. Where's the danger zone?"}, {"id": "G58", "q": "On an undivided highway, a school bus has red lights flashing. Stop about how far away?", "o": ["About 20 metres (4 to 5 car lengths)", "About 5 metres (1 car length)", "About 50 metres (10 car lengths)", "About 10 metres (2 car lengths)"], "a": 0, "ex": "Come to a full stop about 20 metres from the school bus.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "School buses", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, School buses, PDF p.103", "img": "schoolbus", "h": "The school-bus stopping distance is a few car lengths."}, {"id": "G59", "q": "As a taxi or ride-for-hire driver, what does the guide call your FIRST and most important concern?", "o": ["Safety", "Customer satisfaction", "Taking the most direct route", "Arriving on schedule"], "a": 0, "ex": "\"Your first and most important concern is safety.\" The direct route is part of good service, but it isn't first.", "ch": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Operating a taxi, limousine, or ride for hire vehicle, PDF p.110", "h": "The guide names one priority above all the others."}, {"id": "G60", "q": "The speed tab under a railway advance warning sign is:", "o": ["The recommended speed, lower than the posted limit", "The new maximum speed limit by law", "The train's speed at the crossing", "A minimum speed to clear the tracks"], "a": 0, "ex": "It's the recommended speed for the crossing, less than the posted road speed.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Railway crossings", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Railway crossings, PDF p.105", "img": "ab_railahead", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "The tab is advice for the crossing, not a new legal limit."}, {"id": "G61", "q": "An LRT train has just passed and the gates are still down. You should:", "o": ["Wait; another train may come from the other direction", "Drive around the gates carefully", "Cross once the bells stop", "Cross if no train is in sight in either direction down the tracks"], "a": 0, "ex": "Never drive around the gates. Another train may be coming. An LRT can take up to 100 m to stop.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Light rail transit", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Light rail transit, PDF p.107", "img": "ab_rail", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "One train passing doesn't mean the tracks are clear."}, {"id": "G62", "q": "A funeral procession is going through a green light ahead of you. You should:", "o": ["Yield and not pass through it until it has passed", "Pass through gaps in the procession whenever traffic allows it", "Join the end of the procession", "Honk to signal you're cutting in"], "a": 0, "ex": "Don't pass through a funeral procession. Yield until it has passed.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "Funeral processions", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, Funeral processions, PDF p.107", "h": "Processions keep together through intersections."}, {"id": "G63", "q": "Who sets the requirements for a taxi or limousine permit?", "o": ["Your municipality", "Alberta Registries", "Your insurance company", "The federal government"], "a": 0, "ex": "Municipalities have different requirements for taxi permits. Always check municipal laws on taxi operation.", "ch": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "Taxi or limousine permits", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.6 Additional Operations for Specific Vehicle Classes, Taxi or limousine permits, PDF p.111", "h": "Taxi permits are a local matter."}, {"id": "G64", "q": "A fully licensed driver's privileges are automatically suspended at how many demerits within two years?", "o": ["15 or more", "8 or more", "12 or more", "20 or more"], "a": 0, "ex": "Fully licensed: a letter at 8 to 14, suspension at 15 or more.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Demerit points", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Demerit points, PDF p.110", "h": "The fully licensed suspension threshold is in the teens."}, {"id": "G65", "q": "How many demerits for failing to remain at the scene of a collision?", "o": ["7", "4", "5", "6"], "a": 0, "ex": "Failing to remain at the scene of a collision: 7 points.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Demerit point penalties", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Demerit point penalties, PDF p.111", "h": "Leaving the scene is one of the most serious demerit offences."}, {"id": "G66", "q": "Careless driving carries how many demerits?", "o": ["6", "3", "4", "7"], "a": 0, "ex": "Careless driving: 6 points (as do failing to stop for a school bus, racing, and speeding 51+ over).", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Demerit point penalties", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Demerit point penalties, PDF p.111", "h": "Careless driving is a serious offence, just below the top demerit level."}, {"id": "G67", "q": "Speeding 31 to 50 km/h over the limit carries:", "o": ["4 demerits", "3 demerits", "5 demerits", "6 demerits"], "a": 0, "ex": "31 to 50 over: 4 points. 16 to 30: 3. Up to 15: 2. 51+: 6.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Demerit point penalties", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Demerit point penalties, PDF p.111", "h": "Higher speed bands carry more points. This one is in the middle."}, {"id": "G68", "q": "Both headlights fail at night. Put these in the guide's order:", "o": ["Hazards on, try the headlight switch, then pull off safely", "Pull off the road first, then hazards on, then try the headlight switch", "Try the switch, pull off, then hazards on", "Brake hard, hazards on, then call for help"], "a": 0, "ex": "Turn on your hazards, switch the headlight control off and on, then pull off safely if they're still out.", "ch": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations", "sec": "Headlight failure", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.6 Emergency Situations, Headlight failure, PDF p.83", "h": "First make yourself visible, then try to fix the lights."}, {"id": "G69", "q": "Completing an approved defensive driving course (before reaching 15 points) gives:", "o": ["A 3-point credit for two years", "Removal of all current points", "A 5-point credit for one year", "A 2-point credit for three years"], "a": 0, "ex": "A three-point credit is applied for two years.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Demerit points", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Demerit points, PDF p.112", "h": "The course credit is a small number of points for a limited time."}, {"id": "G70", "q": "A Class 7 or GDL driver caught with any alcohol gets an immediate:", "o": ["30-day suspension, 7-day vehicle seizure, $200 fine", "3-day suspension and $300 fine", "90-day suspension and 30-day seizure", "24-hour suspension only"], "a": 0, "ex": "IRS ZERO Novice: 30-day suspension, seven-day seizure, $200 plus 20% surcharge.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "IRS ZERO: Novice", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, IRS ZERO: Novice, PDF p.114", "h": "Novice zero-tolerance sanctions combine a suspension, a vehicle seizure and a fine."}, {"id": "G71", "q": "A commercial driver's FIRST IRS ZERO: Commercial occurrence brings:", "o": ["3-day suspension and $300 fine", "30-day suspension and $1,200 fine", "15-day suspension and $600 fine", "24-hour suspension and no fine"], "a": 0, "ex": "First: 3 days and $300. Second: 15 days and $600. Third: 30 days and $1,200 (each plus 20% surcharge).", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "IRS ZERO: Commercial", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, IRS ZERO: Commercial, PDF p.114", "h": "The first commercial zero-tolerance occurrence is a short suspension plus a fine."}, {"id": "G72", "q": "You find a MAJOR defect and record it right away. May you keep driving?", "o": ["No; a vehicle with a major defect must not be driven", "Yes, once it is recorded and reported", "Yes, but only to finish the current trip and then report it", "Yes, if the carrier gives permission"], "a": 0, "ex": "Recording and reporting lets you continue with a MINOR defect only. No one may drive with a major defect present.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Vehicle not to be operated with a major defect", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Vehicle not to be operated with a major defect, PDF p.29", "h": "Major and minor defects have different rules."}, {"id": "G73", "q": "Which of these does the trip inspection report NOT have to include?", "o": ["The driver's home address", "The odometer or hubometer reading", "The plate, vehicle ID or unit number", "The time and date the report was made"], "a": 0, "ex": "Required items include plate/unit number, odometer reading, carrier name, location, inspector name and signed statement, defects, and date and time. A home address is not listed.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Trip inspection report", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Trip inspection report, PDF p.30", "h": "The report identifies the vehicle and the inspection, not the driver's personal details."}, {"id": "G74", "q": "You drive while suspended. The vehicle you're driving will be:", "o": ["Seized and impounded for 30 days", "Ticketed but not seized", "Seized for 7 days", "Seized only if you own it"], "a": 0, "ex": "The vehicle is impounded for 30 days, regardless of who owns it.", "ch": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law", "sec": "Driving while suspended", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.9 Driving within the Law, Driving while suspended, PDF p.117", "h": "Driving while suspended leads to a long impoundment."}, {"id": "G75", "q": "A 'bus' is a commercial vehicle designed to carry at least how many people, including the driver?", "o": ["11", "7", "15", "24"], "a": 0, "ex": "A bus is designed for 11 or more persons including the driver.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Definitions", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Definitions, PDF p.11", "h": "The 'bus' threshold counts the driver."}, {"id": "G76", "q": "Do you need an air brake Q-endorsement for an 'air actuated hydraulic' brake system?", "o": ["No; all its foundation brakes are hydraulic", "Yes, any vehicle with an air compressor", "Yes, only for vehicles over 24 seats", "No, only with a Class 1 licence"], "a": 0, "ex": "Air actuated hydraulic (air-assisted, all hydraulic foundation brakes) does NOT require a Q-endorsement.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Definitions", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Definitions, PDF p.11", "h": "The air brake endorsement depends on what the foundation brakes are."}, {"id": "G77", "q": "A Class 4 driver under 45 must give a new medical report every:", "o": ["5 years", "3 years", "1 year", "10 years"], "a": 0, "ex": "Every five years until 45, every three years from 45 to 65, and every year after 65.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16", "h": "Younger commercial drivers report least often."}, {"id": "G78", "q": "A Class 4 driver aged 50 must give a medical report every:", "o": ["3 years", "5 years", "1 year", "2 years"], "a": 0, "ex": "Every three years between 45 and 65.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16", "h": "Medical reports get more frequent with age bands."}, {"id": "G79", "q": "A Class 4 driver aged 66 must give a medical report:", "o": ["Every year", "Every 2 years", "Every 3 years", "Every 5 years"], "a": 0, "ex": "Every year after age 65.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16", "h": "Over 65, medical reports are required most often."}, {"id": "G80", "q": "You develop a condition that may affect your driving. You must report it to:", "o": ["Transportation and Economic Corridors or a registry agent", "Your employer only", "Your insurance company only", "Your insurance company only, at the time of your next renewal"], "a": 0, "ex": "You're legally required to report it to Transportation and Economic Corridors or an Alberta Registry Agent.", "ch": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements", "sec": "Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.1 Commercial Driver's Licence Requirements, Medical fitness, PDF p.16", "h": "Report to the authority that issues licences."}, {"id": "G81", "q": "A completed trip inspection report is valid for:", "o": ["24 hours", "12 hours", "48 hours", "One week"], "a": 0, "ex": "The inspection and report are valid for 24 hours.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Purpose of daily vehicle inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Purpose of daily vehicle inspections, PDF p.28", "h": "Inspection validity is measured in hours, not days or weeks."}, {"id": "G82", "q": "Provincially regulated carriers must do trip inspections on passenger vehicles with a designed seating capacity of:", "o": ["11 or more, including the driver", "15 or more, including the driver", "7 or more, excluding the driver", "24 or more, excluding the driver"], "a": 0, "ex": "Commercial passenger vehicles seating 11 or more including the driver.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Vehicles that require inspections", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Vehicles that require inspections, PDF p.28", "h": "The passenger-vehicle threshold matches the 'bus' definition."}, {"id": "G83", "q": "You find a MINOR listed defect. May you keep driving?", "o": ["Yes, if you record it right away and report it to the carrier", "No, never drive with any defect", "Yes, without recording it until the end of the trip or shift", "Only after a mechanic signs off on the defect"], "a": 0, "ex": "You may continue with a minor defect if it's entered on the report and reported to the carrier. Never drive with a major defect.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Driving with defects", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Driving with defects, PDF p.29", "h": "Minor defects can be driven with if documented and passed on."}, {"id": "G84", "q": "Per the Commercial Guide, a phone call while driving should be made:", "o": ["After stopping in a safe and legal place", "Hands-free only, at any speed", "Only on highways, not in the city", "Only at red lights"], "a": 0, "ex": "Calls and texts, even hands-free, are a distraction. Stop in a safe and legal place first.", "ch": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip", "sec": "Distracted driving laws", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws, PDF p.57", "h": "The Commercial Guide's safest option involves not driving at all."}, {"id": "G85", "q": "Which GPS use is permitted for a commercial driver?", "o": ["Mounted unit, programmed before driving or voice-activated", "Hand-held unit used only at low speeds", "A hand-held unit, as long as you use it only at low speeds", "Phone GPS held in your lap"], "a": 0, "ex": "A GPS must be affixed and programmed before you drive, or voice-activated.", "ch": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip", "sec": "Distracted driving laws", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.4 Having a Safe Trip, Distracted driving laws, PDF p.57", "h": "Hand-held use and typing are the problem."}, {"id": "G86", "q": "Which inspection schedule is used for a bus?", "o": ["Schedule 2", "Schedule 1", "Schedule 3", "Schedule 4"], "a": 0, "ex": "A truck, tractor and trailer use Schedule 1. A bus uses Schedule 2.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Trip inspection schedule", "g": "CG", "ref": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections, Trip inspection schedule, PDF p.30", "h": "Trucks use the first schedule. Buses use another."}, {"id": "G87", "q": "A school bus ahead has its AMBER lights flashing. BEST action:", "o": ["Prepare to stop; its red lights will soon flash", "Pass quickly before the red lights start", "Stop now and stay until the bus leaves", "Proceed normally; amber is only a caution"], "a": 0, "ex": "Alternating amber lights warn that the bus is about to stop and flash red. Get ready to stop.", "ch": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road", "sec": "School buses", "g": "DG", "ref": "Driver's Guide (Spring 2026), Ch.8 Sharing the Road, School buses, PDF p.103", "img": "schoolbus", "h": "Amber is the warning before red."}, {"id": "G88", "q": "A peace officer demands your trip inspection paperwork. You must produce:", "o": ["The inspection schedule and the written trip inspection report", "Only the report from the last 7 days", "Only the carrier's written maintenance program and repair records", "Nothing, until the carrier is present"], "a": 0, "ex": "On demand of a peace officer, a driver must produce the inspection schedule and the written trip inspection report.", "ch": "Commercial Driver's Guide (2025), Ch.3 Trip Inspections", "sec": "Trip inspection legislation", "g": "CG", "ref": "Commercial Driver's Guide (2025), C
