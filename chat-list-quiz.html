<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat-List Quiz: 40 questions (Class 4)</title>
<style>
:root{--bg:#070a11;--fg:#e6ebf5;--card:#0f1522;--card2:#141c2c;--line:#1f2a3d;--mut:#8b97ad;--ok:#22c55e;--bad:#ef4444;--acc:#3b82f6;--acc2:#60a5fa;--warn:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#13213d 0%,var(--bg) 60%);color:var(--fg);font:17px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:1040px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 30px #0006;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{display:block;width:100%;min-height:56px;margin:9px 0;padding:12px 14px;font:inherit;font-size:17px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
button:hover{border-color:#2e4466}button:active{transform:scale(.985)}
button.pri{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;text-align:center;font-weight:700;border:0;box-shadow:0 6px 18px #2563eb40}
button.hard{background:linear-gradient(135deg,#b91c1c,#f97316);box-shadow:0 6px 18px #ef444440}
button.ok{border-color:var(--ok);background:#22c55e1f}button.bad{border-color:var(--bad);background:#ef44441f}
.bar{height:6px;background:#1c2638;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#26324a;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sign{text-align:center;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}.sign img{max-height:150px;max-width:80%}.cap{font-size:12px;color:#5b6475}
.fb{font-weight:700;font-size:20px}.ref{font-size:13px;color:var(--mut)}h1{font-size:23px;margin:6px 0 4px}h2{font-size:19px}h3{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 4px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);color:var(--acc2);text-decoration:none;font-weight:600;background:var(--card2)}
nav.top{display:flex;gap:6px;max-width:1040px;margin:8px auto 0;padding:0 12px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-decoration:none;line-height:1.2;transition:all .2s}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 14px #3b82f655}
.hint{background:#3a2f0b;color:#fde68a;border:1px solid #6b5313;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;min-height:48px;padding:8px 16px;font-size:16px}button.elim{opacity:.3;text-decoration:line-through}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.cats button{font-size:14px;min-height:48px}
.grid2{display:grid;gap:10px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
/* dashboard */
.dash{position:relative;background-color:#0b1120;background-image:linear-gradient(#1a2335 1px,transparent 1px),linear-gradient(90deg,#1a2335 1px,transparent 1px);background-size:128px 128px;background-position:-1px -1px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:10px 0;box-shadow:0 10px 40px #000a;animation:fade .45s ease both}
.dtop{display:grid;grid-template-columns:1fr;gap:6px;padding:18px 14px 8px}@media(min-width:760px){.dtop{grid-template-columns:300px 1fr;padding:24px 22px 10px}}
.ringw{display:flex;justify-content:center;align-items:flex-start;padding:6px 0}@media(min-width:760px){.ringw{position:sticky;top:20px;padding-top:30px}}
.ring{position:relative;width:220px;height:220px}.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:#1e3a66;opacity:.55}.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px #3b82f688)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lab{font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase}.ring .pct{font-size:44px;font-weight:800;line-height:1.05;margin:2px 0}.ring .sub{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.tick{position:absolute;left:50%;top:50%;width:0;height:0}.tick i{position:absolute;left:-1.5px;top:-110px;width:3px;height:18px;background:var(--bad);border-radius:2px;box-shadow:0 0 6px var(--bad)}.tick b{position:absolute;left:10px;top:-116px;font-size:10px;color:#f87171;white-space:nowrap;font-weight:600}
.dom h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase;padding-right:52px}
.drow{background:#0f172acc;border:1px solid #1c2740;border-radius:10px;padding:9px 12px 8px 14px;margin:0 0 8px;position:relative;animation:fade .4s ease both}
.drow:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--c)}
.drow .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}.drow .t span:last-child{color:var(--mut);font-weight:500;white-space:nowrap}
.drow .bar{height:3px;margin-top:7px}.drow .bar i{background:var(--c)}
.rbtn{position:absolute;right:14px;top:14px;width:42px;height:42px;min-height:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:#1e293b;border:1px solid #2b3a55;font-size:20px;text-align:center;transition:transform .5s}.rbtn:hover{transform:rotate(180deg)}
.dfoot{font-size:10px;letter-spacing:.1em;color:#5d6b85;text-transform:uppercase;padding:0 18px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0d1424}
.tile{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}.tile:last-child{border-right:0}.tile .k{font-size:10.5px;letter-spacing:.1em;color:#aab6cc;text-transform:uppercase}.tile .v{font-size:22px;font-weight:800;margin-top:2px}
.drow{padding:7px 12px 7px 14px;margin-bottom:6px}@media(min-width:900px){main#app.home{display:flex;flex-direction:column}#app.home>h1{order:-2}#app.home>.hd{order:-1}}
@media(min-width:1000px){.drows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.drow .t{font-size:12.5px}}
.qwrap{animation:fade .3s ease both}
/* ADHD-friendly quiz screen */
.qbar{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:8px 12px 0;background:#070a11f2;border-bottom:1px solid var(--line)}
.qbar .pb{height:8px;background:#1c2638;border-radius:6px;overflow:hidden}.qbar .pb i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
.qbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;font-size:17px;font-weight:700}
.qbar .row #qs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar button{width:auto;min-height:48px;min-width:48px;margin:0;padding:6px 14px;font-size:15px;text-align:center;border-radius:12px}
.qbar #tm{font-size:13px;color:var(--mut);font-weight:500;padding-bottom:6px}
.qtext{font-size:22px;line-height:1.4;font-weight:700;color:#fff;margin:6px 0 4px}
.qtext strong.kw{color:#fde047;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
body.quiz button[id^=o]{min-height:64px;font-size:19px;line-height:1.35;padding:14px 16px;border-width:2px;color:#fff}
body.quiz button.ok{background:#14532d;border-color:#4ade80}body.quiz button.bad{background:#7f1d1d;border-color:#f87171}
body.quiz button.ok:before{content:'✔ ';color:#4ade80}body.quiz button.bad:before{content:'✘ ';color:#fca5a5}
.fb1{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px;line-height:1.4;border:2px solid}.fb1.y{background:#052e16;border-color:#22c55e}.fb1.n{background:#450a0a;border-color:#ef4444}
.fb1 b{font-size:20px;display:block;margin-bottom:2px}.fb1 details{margin-top:8px;font-size:15px;color:#cbd5e1}.fb1 summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--acc2)}
body.quiz .card,body.quiz .qwrap,body.quiz .drow,body.quiz .dash{animation:none!important}body.quiz button{transition:none}
body.focus nav.top,body.focus .qbar #qs,body.focus .qbar .pb,body.focus #tm,body.focus #hb,body.focus .hint,body.focus .cap,body.focus .fb1 details{display:none!important}
body.focus .qbar{background:transparent;border:0}
.r3{counter-reset:r}.r3 li{list-style:none;counter-increment:r;margin:10px 0;padding:12px 14px 12px 50px;position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:17px}
.r3 li:before{content:counter(r);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calm{font-size:18px;color:#cbd5e1}details.more{margin:12px 0}details.more>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--acc2);padding:0 4px}
/* history, weak areas, streak */
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3b1d0a,#1a1206);border:1px solid #9a3412;border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:0 6px 22px #f9731633}.streak .fl{font-size:40px;line-height:1}.streak .sn{font-size:24px;font-weight:800;color:#fdba74}.streak .ss{font-size:14px;color:#fed7aa}
.badge{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;border:1px solid #334155}.badge.rep{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.wk .wtp{display:flex;align-items:center;gap:10px;min-height:56px}.wtp .wn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.wtp .wl{flex:1;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tchip{width:auto;min-height:44px;margin:0;padding:6px 12px;font-size:14px;border-radius:999px}.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.mq{margin:8px 0}.mqh{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:16px}.mqh .mqt{flex:1}.mqh .chev{flex:none;color:var(--acc2);font-weight:800}.mqh[aria-expanded=true]{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.mqb{background:var(--card);border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px 12px;font-size:16px}.mqb .yp{color:#fca5a5}.mqb .cp{color:#86efac;font-weight:700}
.hist .avgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}.avg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.avg b{display:block;font-size:22px}.avg span{font-size:12px;color:var(--mut)}
.hl{list-style:none;padding:0;margin:8px 0 0}.hl li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.hl .hd1{color:var(--mut);font-size:13px}.hl .hm{grid-row:2;font-weight:600}.hl .hs{text-align:right;font-weight:700}.pf{text-align:right;font-size:13px;font-weight:700}.pf.p{color:var(--ok)}.pf.f{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sign img{max-height:260px;max-width:95%}</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "CL1", "q": "Your bus is stopped on the highway after a breakdown. There is NO fire. When should you move passengers off the bus?", "o": ["Only if the bus is stopped in a dangerous spot; otherwise keep them on", "Always, right away, and walk them at least 35 metres away from the bus", "Never; everyone must stay seated until police or a tow truck arrives on scene", "Only after you set out warning devices and your dispatcher gives you permission"], "a": 0, "ex": "If the bus is in a dangerous location, get passengers off; if there is no danger, it's usually safer for them to stay on. Fire is the exception: always evacuate, at least 35 m away (CDG p.124). After a collision, evacuate if in a train's path, the bus could still move, or it can't be seen from 300 m (CDG p.131).", "h": "If nothing is wrong with the spot, where are passengers usually safer?", "ch": "Commercial Driver's Guide Ch.9 Emergency Situations", "sec": "#1 \u00b7 Bus stopped after an incident", "g": "CG", "ref": "Commercial Driver's Guide, Ch.9, printed p.125 (PDF p.127)"}, {"id": "CL2", "q": "Your ambulance is stopped at an emergency scene. Which lights should be on?", "o": ["The flashing lights and the headlights", "Only the headlights, so you don't distract drivers passing the scene", "Only the hazard lights, with the flashing lights switched off once parked", "Only the flashing lights, with the headlights off so they don't blind anyone"], "a": 0, "ex": "Keep the flashing lights activated and turn on the headlights. The siren is used ONLY when responding to an emergency, an emergency call or an alarm (CDG p.107; AR 304 s.62).", "h": "Two sets of lights, not one.", "ch": "Commercial Driver's Guide Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "#2 \u00b7 Stopped ambulance: lights", "g": "CG", "ref": "Commercial Driver's Guide, Ch.6, printed p.108 (PDF p.110)"}, {"id": "CL3", "q": "A vehicle is passing you on a two-lane highway. What is BEST?", "o": ["Stay in your lane, move to the right side of it, and don't speed up", "Speed up a little so the passing driver can get around you faster and more safely", "Brake hard and pull fully onto the shoulder until the passing vehicle is gone", "Move toward the centre line so the passing driver has to finish the pass quickly"], "a": 0, "ex": "Help the driver passing you by staying in your lane and moving to the right side of it. The law says you must not increase your speed until you've been passed (AR 304 s.21(2)).", "h": "Help them get by. Don't race them.", "ch": "Driver's Guide Ch.5 Highways and Freeways", "sec": "#3 \u00b7 Being passed", "g": "DG", "ref": "Driver's Guide, Ch.5, printed p.72 (PDF p.74)", "img": "passing", "cap": "Passing on a two-lane highway (Driver's Guide p.72)"}, {"id": "CL4", "q": "What is threshold braking?", "o": ["Braking as hard as you can without locking the wheels", "Pumping the brake pedal quickly so the wheels lock and unlock over and over", "Locking the wheels fully so the tires grip and stop you in the shortest distance", "Braking gently, then releasing the pedal completely before a skid can start"], "a": 0, "ex": "Press firmly on the brake pedal to the point just before the wheels lock. That's threshold braking.", "h": "The 'threshold' is the point just before something happens.", "ch": "Driver's Guide Ch.6 Emergency Situations", "sec": "#4 \u00b7 Threshold braking", "g": "DG", "ref": "Driver's Guide, Ch.6, printed p.78 (PDF p.80)"}, {"id": "CL5", "q": "You're merging onto a highway from an entrance ramp. What is BEST?", "o": ["Choose a safe gap and match the speed of highway traffic", "Stop at the end of the ramp and wait until the right lane is completely empty", "Merge below traffic speed, since highway drivers must always make room for you", "Speed up well past the limit so you end up ahead of every vehicle in the lane"], "a": 0, "ex": "Choose your gap and accelerate to the speed of traffic on the main road. Neither the merging vehicle nor the vehicles already on the highway have the right-of-way.", "h": "Neither side has the right-of-way. Blend in.", "ch": "Driver's Guide Ch.5 Highways and Freeways", "sec": "#5 \u00b7 Merging onto a highway", "g": "DG", "ref": "Driver's Guide, Ch.5, printed p.73 (PDF p.75)"}, {"id": "CL6", "q": "You're stopping a school bus to load students. What is the correct order?", "o": ["Amber lights while slowing, stop and set the parking brake, then red lights and stop arm", "Red lights and stop arm while slowing, then switch to amber lights once the bus is fully stopped", "Stop and set the parking brake FIRST, then amber lights, then red lights once students start walking", "Amber and red lights together while slowing, then put out the stop arm after the door has opened"], "a": 0, "ex": "Turn on the alternately flashing amber lights when you begin to slow down. Once stopped, secure the bus (parking brake, foot on the brake). Then turn on the alternately flashing red lights and stop arm (AR 304 s.73).", "h": "Warning first, then stop, then the 'do not pass' signal.", "ch": "Commercial Driver's Guide Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "#6 \u00b7 School bus stop: order of steps", "g": "CG", "ref": "Commercial Driver's Guide, Ch.6, printed p.105\u2013106 (PDF pp.107\u2013108)"}, {"id": "CL7", "q": "You're approaching a roundabout in the left lane and want to take the second exit (a left-side exit). What do you do?", "o": ["Signal left on approach, yield to traffic in the circle, stay in the left lane, signal right after passing the exit before yours, and exit from the left lane", "Signal right the whole way, from the approach to the exit, so other drivers always know you'll be leaving the circle soon after you enter it", "Signal left and enter right away without yielding, since traffic already in the circle must slow down and make room for you to get in", "Signal left, yield, stay in the left lane, then exit without signalling right at all, since you never changed lanes while you were in the circle"], "a": 0, "ex": "Do not change lanes in the circle: left lane in, left lane out. Drivers going past the first exit use the left lane to enter and exit, and signal right after passing the exit before theirs. Watch for right-lane traffic as you exit.", "h": "Left lane in, left lane out. You still tell people when you're leaving.", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#7 \u00b7 Roundabout: left lane, later exit", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.62 (PDF p.64)", "img": "roundabout2", "cap": "Two-lane roundabout (Driver's Guide p.62)"}, {"id": "CL8", "q": "You're braking hard in a vehicle WITHOUT ABS and the wheels lock. What should you do FIRST?", "o": ["Ease off the brake slightly, then press firmly again without locking the wheels", "Push the pedal down even harder so the locked tires dig in and stop you sooner", "Take your foot off the brake completely and steer onto the shoulder to coast", "Shift into neutral and pull the parking brake hard to stop the skid quickly"], "a": 0, "ex": "If the wheels lock, release the brake pedal slightly, then press it firmly again without locking the wheels.", "h": "Locked wheels can't steer. Let them roll for a moment.", "ch": "Driver's Guide Ch.6 Emergency Situations", "sec": "#8 \u00b7 Wheels lock without ABS", "g": "DG", "ref": "Driver's Guide, Ch.6, printed p.78 (PDF p.80)"}, {"id": "CL9", "q": "Two vehicles reach an uncontrolled intersection at about the same time. Who must yield?", "o": ["You must yield to the vehicle on your right", "The vehicle on the right must yield to the vehicle on its left", "The smaller vehicle yields, since the bigger one needs more room to stop", "Anyone turning yields, and the vehicle going straight always goes FIRST"], "a": 0, "ex": "At an uncontrolled intersection you must yield to the vehicle on your right (AR 304 s.34(1)). At a four-way stop, courtesy lets the first to arrive go first; if two arrive together, the one on the right goes first.", "h": "Look right.", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#9 \u00b7 Uncontrolled intersection right-of-way", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.59 (PDF p.61)"}, {"id": "CL10", "q": "To make a smooth stop at a red light, what should you do just BEFORE the vehicle stops?", "o": ["Ease off the brake slightly, then press again gently", "Press the brake harder so the vehicle stops quickly right at the line", "Shift into neutral and let the vehicle roll the last few metres to the line", "Pump the brake quickly a few times so passengers can feel the stop coming"], "a": 0, "ex": "Just before you come to a stop, release pressure on the brake pedal slightly and then reapply it. This gives a smooth stop.", "h": "Think about avoiding the jerk at the very end.", "ch": "Driver's Guide Ch.3 The Basics of Driving", "sec": "#10 \u00b7 Smooth stop", "g": "DG", "ref": "Driver's Guide, Ch.3, printed p.50 (PDF p.52)"}, {"id": "CL11", "q": "When can you turn left on a red light?", "o": ["After a full stop, and only from a one-way street onto a one-way street", "Any time after a full stop, as long as no cross traffic is coming toward you", "Without stopping, from a one-way street onto a two-way street if the way is clear", "After a full stop, from any street at all onto a one-way street, once you've yielded"], "a": 0, "ex": "Unless a sign prohibits it, the only left turn allowed on a red light is onto a one-way street from a one-way street, after a complete stop and after yielding (AR 304 s.54(3); also DG p.66).", "h": "Both streets matter, not just the one you're turning onto.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#11 \u00b7 Left turn on red", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.22 (PDF p.24)"}, {"id": "CL12", "q": "Your vehicle has ABS. In an emergency stop, you should NOT:", "o": ["Pump the brakes to stop the wheels from locking", "Press the brake pedal down hard and keep it pressed", "Steer around the hazard while you keep braking", "Keep firm, steady pressure even if the pedal vibrates"], "a": 0, "ex": "With ABS, keep firm pressure on the pedal. Do not pump or release the brake pedal; a vibrating pedal is normal.", "h": "ABS already does the 'pumping' for you.", "ch": "Driver's Guide Ch.6 Emergency Situations", "sec": "#12 \u00b7 ABS emergency stop", "g": "DG", "ref": "Driver's Guide, Ch.6, printed p.78 (PDF p.80)"}, {"id": "CL13", "q": "At a crash scene, where should the ambulance park?", "o": ["Positioned to protect the injured person and attendant, with flashing lights and headlights on", "Well past the scene, with all lights off so other drivers aren't distracted while they drive by", "On the opposite shoulder, facing oncoming traffic, with just the headlights on so it can be seen", "Directly in front of the crash, with only the flashing lights and the siren on until help arrives"], "a": 0, "ex": "Park the vehicle so it protects the injured person(s) and the attendant. Keep the flashing lights on and turn on the headlights.", "h": "Who is the ambulance there to protect?", "ch": "Commercial Driver's Guide Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "#13 \u00b7 Ambulance at a crash scene", "g": "CG", "ref": "Commercial Driver's Guide, Ch.6, printed p.108 (PDF p.110)"}, {"id": "CL14", "q": "You must reverse a bus on a road or turnaround. What's correct?", "o": ["Horn and hazards first. On a left turnaround, honk once per bus length. Never back onto or across a highway, or into a city intersection or crosswalk", "Hazards only, no horn. Reversing across a highway is fine if traffic is light and you can clearly see a long way in both directions before you back up", "Horn once before you start, then back up. You may back into a city intersection or crosswalk as long as no pedestrians are crossing at that moment", "No signals are needed on a turnaround, as long as a passenger stands at the back of the bus and checks behind it for you while you reverse slowly"], "a": 0, "ex": "Sound the horn, turn on the hazard lights, then reverse. On a driver-side turnaround, sound the horn once for every bus length you back up. Never back onto or across a highway, and never back into an intersection or crosswalk in an urban area (AR 304 s.33).", "h": "Warn everyone, and some places are always off-limits for backing.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#14 \u00b7 Reversing a bus", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.88\u201389 (PDF pp.90\u201391)"}, {"id": "CL15", "q": "Before you get out of the bus with the engine running, you should:", "o": ["Shift to neutral if it's a manual, set the parking brake, and use fast idle", "Leave it in gear with the parking brake off, so the engine idles smoothly and the bus won't stall", "Shift into reverse, set the parking brake, and let the engine idle slowly so it uses less fuel", "Shift to neutral, release the parking brake, and turn the heater to high for the passengers"], "a": 0, "ex": "If the engine stays running while parked: neutral (manual transmission), parking brake set, and fast idle engaged.", "h": "The bus must not be able to move, and the engine must not stall.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#15 \u00b7 Leaving the bus with the engine running", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.85 (PDF p.87)"}, {"id": "CL16", "q": "What does an uncontrolled intersection NOT have?", "o": ["Signs or lights", "Traffic", "Lanes", "A road surface"], "a": 0, "ex": "An uncontrolled intersection has no traffic signs and no traffic signal lights.", "h": "What 'controls' an intersection?", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#16 \u00b7 Uncontrolled intersection", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.59 (PDF p.61)"}, {"id": "CL17", "q": "An ambulance with lights and siren is coming. What do you do?", "o": ["On a two-way road, pull right and stop. On a one-way road, pull to the nearest side", "Speed up to clear the way ahead of it, then pull over at the next intersection you reach", "Stop right where you are, even if that means stopping in the middle of an intersection", "Pull to the left and stop on any road, so the ambulance can get past you on the right side"], "a": 0, "ex": "Move as close as possible to the right curb on a two-way road, or to the nearest curb on a one-way street, and stop until it passes. Stay out of intersections, and don't follow within 150 m.", "h": "Two-way and one-way roads have different 'nearest' sides.", "ch": "Driver's Guide Ch.6 Emergency Situations", "sec": "#17 \u00b7 Ambulance approaching", "g": "DG", "ref": "Driver's Guide, Ch.6, printed p.85 (PDF p.87)"}, {"id": "CL18", "q": "A passenger boards with a mobility scooter. What should happen?", "o": ["The passenger drives it to the secure spot, turns the power off, moves to a seat, then the scooter is secured", "The driver lifts the scooter in with the passenger still sitting on it, then secures the passenger to the floor", "The scooter is left parked at the stop, since buses aren't allowed to carry mobility scooters on board", "The passenger stays on the scooter with the power on, in case the bus ever needs to be emptied quickly"], "a": 0, "ex": "Manoeuvre the scooter to a secure spot, turn off the scooter power, help the passenger to a seat, then secure the scooter.", "h": "Scooter and passenger end up in different places.", "ch": "Commercial Driver's Guide Ch.7 Transporting People", "sec": "#18 \u00b7 Mobility scooter", "g": "CG", "ref": "Commercial Driver's Guide, Ch.7, printed p.116\u2013117 (PDF pp.118\u2013119)"}, {"id": "CL19", "q": "How close to the curb must you park?", "o": ["No more than 50 centimetres from the curb", "Within 1 metre of the curb, measured from your front wheels", "At least 30 centimetres away, so your tires don't scrape the curb", "With the front tire resting right against the curb, so the vehicle can't roll away"], "a": 0, "ex": "Park within 50 cm of the curb (DG p.53; CDG p.84; AR 304 s.45: not more than 500 mm).", "h": "Half a metre.", "ch": "Driver's Guide Ch.3 The Basics of Driving", "sec": "#19 \u00b7 Parking distance from the curb", "g": "DG", "ref": "Driver's Guide, Ch.3, printed p.53 (PDF p.55)"}, {"id": "CL20", "q": "When can a school bus reverse on school grounds?", "o": ["Only when a responsible person at the rear is directing", "Any time, as long as the hazard lights are on and flashing", "Only before or after school hours, when no students are around", "Never, under any conditions whatsoever, even with a helper outside"], "a": 0, "ex": "Reversing on or next to school grounds is illegal unless a responsible person is outside at the rear of the bus giving direction (AR 304 s.74).", "h": "Someone you can trust has to be standing behind the bus.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#20 \u00b7 Reversing on school grounds", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.88 (PDF p.90)"}, {"id": "CL21", "q": "As a driver, how close to a marked crosswalk are you allowed to park?", "o": ["No closer than 5 metres from the nearest side of the crosswalk", "No closer than 1 metre from the nearest side of the crosswalk", "No closer than 3 metres, the same as the distance for a stop line", "No closer than 10 metres, so pedestrians can see past your vehicle"], "a": 0, "ex": "Don't park within 5 m of the nearest side of a marked crosswalk (AR 304 s.44(k)). For stopping, you stop before the crosswalk.", "h": "Parking rule, not stopping rule. It's more than the stop-sign number.", "ch": "Driver's Guide Ch.3 The Basics of Driving", "sec": "#21 \u00b7 Parking near a crosswalk", "g": "DG", "ref": "Driver's Guide, Ch.3, printed p.56 (PDF p.58)"}, {"id": "CL22", "q": "At a stop sign with NO stop line and NO crosswalk, where do you stop?", "o": ["Within 3 metres of the intersecting road", "Right beside the stop sign post, no matter how far back it is", "About 10 metres back, so cross traffic can see you clearly", "Past the edge of the intersecting road, where you can see both ways"], "a": 0, "ex": "If there is no stop line or marked crosswalk, stop within 3 m (10 feet) of the intersecting roadway (AR 304 s.37(a)).", "h": "Close to the road you're crossing, but not in it.", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#22 \u00b7 Stop sign with no line", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.59 (PDF p.61)", "img": "stop", "cap": "Stop sign"}, {"id": "CL23", "q": "You're approaching an ambulance stopped beside the road with its lights flashing. What is BEST?", "o": ["Move over if it's safe; if not, slow to 60 km/h or the posted limit, whichever is lower", "Slow to 30 km/h in every lane, including lanes on the other side, until you are well past it", "Keep your current speed, since you only have to slow down if you're in the lane right beside it", "Always slow to exactly 60 km/h, even on a city street where the posted limit is lower than that"], "a": 0, "ex": "Move over to the far lane if it's safe. If you can't, slow to 60 km/h or the posted speed, whichever is lower, in the lane next to the stopped vehicle. Fines are doubled (DG p.85; AR 304 s.22.1).", "h": "Two choices: give it space, or give it a slower speed.", "ch": "Driver's Guide Ch.6 Emergency Situations", "sec": "#23 \u00b7 Passing a stopped ambulance", "g": "DG", "ref": "Driver's Guide, Ch.6, printed p.85 (PDF p.87)"}, {"id": "CL24", "q": "Who is responsible for making sure a commercial driver is medically fit to drive?", "o": ["The driver, who must self-assess fitness before every trip", "ONLY the employer, through yearly medical checks on all of its drivers", "ONLY the doctor who signed the driver's most recent medical report form", "The registry agent who issued the licence, at the time of the road test"], "a": 0, "ex": "The driver must be medically fit to drive and self-assess fitness before a trip (CDG p.20, p.111). You must disclose any condition that could affect safe driving (DG p.17).", "h": "Who is behind the wheel?", "ch": "Commercial Driver's Guide Ch.2 National Safety Code", "sec": "#24 \u00b7 Medical fitness", "g": "CG", "ref": "Commercial Driver's Guide, Ch.2, printed p.20 (PDF p.22)"}, {"id": "CL25", "q": "When you drive around a curve, which way does centrifugal force push your vehicle?", "o": ["Outward, toward the outside of the curve", "Inward, toward the centre of the curve you're turning", "Straight down, pressing the tires harder onto the road", "Backward, slowing the vehicle as it goes into the curve"], "a": 0, "ex": "Centrifugal force pushes the vehicle toward the outside of the curve. Slow down before the curve.", "h": "Think of riding a fast merry-go-round.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#25 \u00b7 Centrifugal force", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.82 (PDF p.84)"}, {"id": "CL27", "q": "You're stopped behind another vehicle in traffic. How much space should you leave?", "o": ["Enough to pull into another lane without having to reverse", "As little as possible, so the line of traffic behind you stays short", "About 30 centimetres, so no other vehicle can cut in front of you", "Just enough room for a pedestrian to squeeze between the two vehicles"], "a": 0, "ex": "Leave enough space that you could move into another lane without having to reverse.", "h": "If the car ahead stalls, can you get out?", "ch": "Driver's Guide Ch.7 Responsible Driving", "sec": "#27 \u00b7 Space when stopped in traffic", "g": "DG", "ref": "Driver's Guide, Ch.7, printed p.90 (PDF p.92)"}, {"id": "CL28", "q": "About how far ahead should you signal a turn?", "o": ["About 30 m in the city and about 100 m on rural roads", "About 100 m in the city and about 30 m on rural roads", "About 15 m everywhere, right when you start braking", "About 50 m everywhere, whether in the city or rural"], "a": 0, "ex": "Signal approximately 30 m from the turn in urban areas and approximately 100 m in rural areas (CDG p.80). The law itself only says to give reasonable warning (AR 304 s.24).", "h": "Faster roads need more warning.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#28 \u00b7 Signalling distance", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.80 (PDF p.82)"}, {"id": "CL29", "q": "Once your school bus is stopped to load or unload, which is NOT something you should do?", "o": ["Keep the right-turn signal on while passengers get on or off", "Put it in neutral or park, set the parking brake, and keep pressure on the brake pedal", "Turn on the flashing red lights once the bus has been secured", "Wait to close the door until every passenger has safely exited"], "a": 0, "ex": "Once the bus is stopped, cancel the right-turn signal and secure the bus. Activate the flashing red lights once the bus is secured.", "h": "The signal did its job while you were moving over.", "ch": "Commercial Driver's Guide Ch.6 Additional Operations for Specific Vehicle Classes", "sec": "#29 \u00b7 School bus stopped: NOT", "g": "CG", "ref": "Commercial Driver's Guide, Ch.6, printed p.106 (PDF p.108)"}, {"id": "CL30", "q": "You're in the city with a double solid yellow line and a slow car ahead. Can you pass?", "o": ["No, a double solid yellow means no passing anywhere, because the city rule for single yellows doesn't apply to doubles", "Yes, the city lets you cross any solid yellow line, single or double, as long as it's safe and the lane ahead is clear", "Yes, as long as you signal first, check your blind spot, and stay under the posted speed limit for the whole pass", "Only if the car ahead is going under 30 km/h, since very slow vehicles may be passed on any city street at all"], "a": 0, "ex": "Passing across a single solid yellow is allowed in an urban area. In all other cases, single or double solid yellow lines mean no passing (AR 304 s.15(1)(a)).", "h": "Two lines, zero passing.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#30 \u00b7 City: double solid yellow", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.38 (PDF p.40)", "img": "yl_double", "cap": "Double solid yellow line (Driver's Guide p.38)"}, {"id": "CL31", "q": "Outside the city, a double solid yellow. Can you cross it to turn left into a driveway or private road?", "o": ["Yes, when needed and safe, and no sign forbids it", "No, a double solid line can never be crossed for any reason", "Only to pass a slow farm vehicle in front of you", "Only if the driveway has its own stop sign posted"], "a": 0, "ex": "Outside an urban area you may cross a double solid line when necessary to turn left onto a road, private road or driveway, if it's safe and no sign prohibits it (AR 304 s.15(3)(a), s.15(4)).", "h": "Outside the city: you can turn across two lines, but never pass.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#31 \u00b7 Rural: double solid yellow, left turn", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.38 (PDF p.40)", "img": "yl_double", "cap": "Double solid yellow line (Driver's Guide p.38)"}, {"id": "CL32", "q": "In the city, you see a single solid yellow centre line. Can you cross it?", "o": ["Yes, to pass when it's safe, or to turn left when it's needed and safe and no sign forbids it", "No, a solid yellow line always means no crossing in either direction, for any reason, in the city or out of it", "Yes, but ONLY to turn right into a driveway or side street, and never to pass or turn left across it", "Only to pass a slow car when it's safe, but never to turn left across it into a driveway or a side street"], "a": 0, "ex": "Passing safely is permitted across single solid yellow lines within an urban area (DG p.38), and you may cross to turn left when needed and safe (AR 304 s.15).", "h": "The city is the one place a single solid yellow is more relaxed.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#32 \u00b7 City: single solid yellow", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.38 (PDF p.40)"}, {"id": "CL33", "q": "Outside an urban area, you see a single solid yellow line on your side. What are you allowed to do?", "o": ["Turn left when it's needed and safe and no sign forbids it, but not pass", "Pass when it's safe, the same as you would on a city street", "Neither pass nor turn left, since a solid line can't be crossed", "Pass only if the road ahead is clear and straight for a long way"], "a": 0, "ex": "Outside urban areas you can't cross a single solid line to pass (AR 304 s.15(1)(c)); don't pass when a solid yellow line is on your side (DG p.72). Left turns are allowed when needed and safe (s.15(3)).", "h": "Outside the city: turning is OK, passing isn't.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#33 \u00b7 Rural: single solid yellow", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.38 (PDF p.40)", "img": "yl_solidbroken", "cap": "Solid yellow line with a broken line (Driver's Guide p.38)"}, {"id": "CL34", "q": "For a driver-side turnaround, when should you signal left?", "o": ["About 100 metres before, to show you're turning into the next road up ahead", "About 30 metres before, the same as you would for any turn in an urban area", "About 50 metres before, halfway between the city and the rural distances", "About 150 metres before, because a bus needs a lot of extra room to slow down"], "a": 0, "ex": "Signal left at approximately 100 metres before a driver-side turnaround.", "h": "Turnarounds are on rural roads, so use the rural number.", "ch": "Commercial Driver's Guide Ch.5 Basic Commercial Vehicle Operations", "sec": "#34 \u00b7 Driver-side turnaround signal", "g": "CG", "ref": "Commercial Driver's Guide, Ch.5, printed p.89 (PDF p.91)"}, {"id": "CL35", "q": "You drive out of a mall parking lot onto a street, crossing a sidewalk. You must:", "o": ["Stop before the sidewalk, stop before the street, and yield to pedestrians", "Stop ONLY at the edge of the street, since the sidewalk counts as part of the lot", "Yield to pedestrians on the sidewalk, but a full stop isn't required anywhere", "Stop ONLY if a stop sign is posted at the parking lot exit, otherwise roll out"], "a": 0, "ex": "When leaving a lane, driveway or parking lot: stop before any sidewalk crossing, stop before entering the street, and yield to pedestrians (AR 304 s.36(3)(a)).", "h": "Count the places you need to stop.", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#35 \u00b7 Driving out of a parking lot", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.60 (PDF p.62)"}, {"id": "CL36", "q": "Which is the Commercial Guide's basic collision prevention formula, in order?", "o": ["Recognize the hazard, understand the defence, act in time", "Act in time, recognize the hazard, understand the defence", "Understand the defence, act in time, recognize the hazard", "Act in time, understand the defence, recognize the hazard"], "a": 0, "ex": "The formula is: Recognize the hazard; Understand the defence; Act in time.", "h": "You can't defend against something you haven't spotted yet.", "ch": "Commercial Driver's Guide Ch.4 Having a Safe Trip", "sec": "#36 \u00b7 Collision prevention formula", "g": "CG", "ref": "Commercial Driver's Guide, Ch.4, printed p.69 (PDF p.71)"}, {"id": "CL37", "q": "Total stopping distance equals:", "o": ["Perception distance plus reaction distance plus braking distance", "Reaction distance plus braking distance only, starting from the moment you react", "Perception distance plus braking distance only, since reaction time is counted in perception", "Perception distance plus reaction distance only, not counting the braking distance"], "a": 0, "ex": "Perception distance + reaction distance + braking distance = total stopping distance.", "h": "See it, react to it, then stop. Three parts.", "ch": "Driver's Guide Ch.3 The Basics of Driving", "sec": "#37 \u00b7 Total stopping distance", "g": "DG", "ref": "Driver's Guide, Ch.3, printed p.50 (PDF p.52)"}, {"id": "CL38", "q": "According to the Commercial Driver's Guide, how often should you check your mirrors?", "o": ["Every 5 to 10 seconds", "Every 2 to 3 seconds", "Every 30 seconds", "Every minute"], "a": 0, "ex": "The CDG says check mirrors every five to ten seconds. The Driver's Guide says every 8 to 12 seconds, so for a CDG question pick 5 to 10.", "h": "The CDG number is a bit shorter than the Driver's Guide's 8 to 12 seconds.", "ch": "Commercial Driver's Guide Ch.4 Having a Safe Trip", "sec": "#38 \u00b7 Mirror checks (CDG)", "g": "CG", "ref": "Commercial Driver's Guide, Ch.4, printed p.67 (PDF p.69)"}, {"id": "CL39", "q": "You're approaching a roundabout in the right lane and want to take the first exit. What do you do?", "o": ["Signal right on approach, yield to traffic in the circle, and take the first exit from the right lane", "Signal left on approach, then switch over to your right signal once you are inside the circle and near the exit", "Enter without signalling at all, since you're only going one exit and you're already in the right lane", "Yield, enter, then move over to the left lane and stop inside the circle to check the exit before leaving"], "a": 0, "ex": "For the first exit, use your right signal as you approach and leave it on until you've exited (DG p.61). Right lane in, right lane out; don't change lanes in the circle (DG p.62).", "h": "First exit: right signal from the start, and stay in your lane.", "ch": "Driver's Guide Ch.4 Intersections and Turns", "sec": "#39 \u00b7 Roundabout: right lane, first exit", "g": "DG", "ref": "Driver's Guide, Ch.4, printed p.61\u201362 (PDF pp.63\u201364)", "img": "roundabout2", "cap": "Two-lane roundabout (Driver's Guide p.62)"}, {"id": "CL40", "q": "What does this yellow warning sign mean?", "o": ["Divided highway begins", "Divided highway ends", "Two-way traffic ahead", "Right lane ends, merge left"], "a": 0, "ex": "Divided highway begins: the block (median) is at the top, ahead of you, and the arrows split apart around it. Block at the bottom means the median is behind you, so the divided highway ends.", "h": "The black block is the median. Block on top means the median is still ahead of you, so it's coming.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#40 \u00b7 Sign: divided highway begins", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.35 (PDF p.37)", "img": "div_begins"}, {"id": "CL41", "q": "What does this yellow warning sign mean?", "o": ["Divided highway ends", "Divided highway begins", "Road narrows ahead", "Merging traffic from the left"], "a": 0, "ex": "Divided highway ends: the block (median) is at the bottom, behind you, and the arrows come together. Block on top means the median is ahead, so the divided highway begins.", "h": "The black block is the median. Block on the bottom means you've already passed it, so it's gone.", "ch": "Driver's Guide Ch.2 Traffic Control", "sec": "#41 \u00b7 Sign: divided highway ends", "g": "DG", "ref": "Driver's Guide, Ch.2, printed p.35 (PDF p.37)", "img": "div_ends"}];const QH=[];const IMG={"passing": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcIAAAHlCAIAAADp02ucAABu9UlEQVR4nO29eXxbV5n//9yrXbJly/u+xLHi1IkTO0uzlKRrutDSdVqWKS1bp9ApDAMDA8x3gIGZYf0xUFpKWYZSCpQpFAp0SWmbQJc0bdOsTeLEiXc7XuNFlm3d5ffHdRRZuufcc2Vd6Up63n/05UpX0rEif3Sec87n83Dwq38CJClcFCq5KVSrepfL6bj7vTdH3Xiso/Pp3a8YPy7E7NRVVdy44+KoG1949Y0DR9tJD3nG1rfT1m/ssJBz8KkeQBaxSSgm3eWvV5HXox2dBo4GSR/OjIzG3thQU0V5yJZQiWHDQaJBGU0SHtlaIbtJ96r+Saj+8SBZSHB2bnhsPOrG2soyq9VCeogXbOWSy+BxIQugjCaJVqGAdJfVaqmtLIu6cXhsPDg7Z/CgkLTh0PGO2BurykopD2kQcw0bDrIIlNEkQanoVf8YVP9skKyld/BM7I11leWUh1A+ckhiQRlNBvSKfmVDXeyNqn82SNYyOj4RmAlG3djavILjONJDKmS3R7YaPC4EAGU0OawQvaS7OI5ripHRwExwdHzC2DEh6Ub76e7YG8uLCykPoSwlIQkEZTQZbBSKSHep/hmo/sEgWU776a7YG6srolfVI8G6PjmgjBqOXeb9Uh7pXtWjTqp/MEiWMzCscnJjTVMj5SFY1ycHlFHDaZBoG6b++prYG1X/YJAsR5blrr7BqBs9blehj/glDV function pickWeak(){const st=hstats();if(!Object.keys(st.qm).length)return legacyWeak();const N=Math.min(CFG.n,ALLQ.size),pool=[...ALLQ.values()];

function weakInfo(){const st=hstats(),t=topWeak(st,3);if(t.length)return 'Top weak spots (all attempts): '+t.map(([k,v])=>esc(k)+' ('+v+'×)').join('; ');const m=getM();const t2=Object.entries(m.t).filter(([k])=>!k.startsWith('CH:')).sort((a,b)=>b[1]-a[1]).slice(0,3);return t2.length?'Top weak spots: '+t2.map(([k,v])=>k.replace(/^.*?, /,'')+' ('+v+')').join('; '):'No misses recorded yet. Take a test first.'}
const pctA=a=>a.n?a.ok/a.n*100:0;
function histHTML(lim){const h=getH();if(!h.length)return `<div class="card hist"><h2>📈 Score history</h2><p class=ref>No completed attempts yet. Finish any quiz and it shows up here.</p></div>`;
const avg=l=>l.length?Math.round(l.reduce((s,a)=>s+pctA(a),0)/l.length)+'%':'–';const modes=[...new Set(h.map(a=>a.mode))];
const fmtD=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
return `<div class="card hist"><h2>📈 Score history</h2><div class=avgs><div class=avg><b>${avg(h)}</b><span>Average · all ${h.length}</span></div>${modes.map(m=>{const l=h.filter(a=>a.mode==m);return `<div class=avg><b>${avg(l)}</b><span>${MODEN[m]||m} · ${l.length}</span></div>`}).join('')}</div>
<ul class=hl>${h.slice(-lim).reverse().map(a=>`<li><span class=hd1>${fmtD(a.t)}</span><span class=hm>${MODEN[a.mode]||a.mode}</span><span class=hs>${a.ok}/${a.n} · ${Math.round(pctA(a))}%</span><span class="pf ${a.pass?'p':'f'}">${a.pass?'PASS':'not yet'}</span></li>`).join('')}</ul></div>`}
let TP=[];
function tpIdx(t){let i=TP.indexOf(t);if(i<0){TP.push(t);i=TP.length-1}return i}
function weakHTML(st){const t=topWeak(st,3);if(!t.length)return `<div class="card wk"><h2>🧠 Your top weak areas</h2><p class=ref>No misses recorded across your attempts. 🎯</p></div>`;
const att=t=>new Set(st.h.filter(a=>a.items.some(i=>i.tp==t&&!i.ok)).map(a=>a.t)).size;
return `<div class="card wk"><h2>🧠 Your top weak areas</h2><p class=ref>Across all ${st.h.length} attempt${st.h.length==1?'':'s'} on this page. Tap a topic to see its questions.</p>${t.map(([k,v],i)=>`<button class=wtp onclick="ftp(${tpIdx(k)})"><span class=wn>${i+1}</span><span class=wl>${esc(k)}</span><span class=badge>${v} miss${v==1?'':'es'}${att(k)>1?' · '+att(k)+' attempts':''}</span></button>`).join('')}<button class=pri id=pws onclick="start('weak')">🎯 Practice my weak spots (${weakCount()})</button></div>`}
function mrow(q,k,hinted,st){const c=st.qm[q.id]||0,ti=tpIdx(tpc(q)),reason=first1(q.ex);return `<div class=mq data-tp=${ti}><button class=mqh aria-expanded=false onclick="tgl(this)"><span class=mqt>${kw(q.q)}</span>${c>=2?`<span class="badge rep">missed ${c}x</span>`:''}<span class=chev>▸</span></button><div class=mqb hidden>${k!=null&&q.o[k]!=null?`<p class=yp>✘ Your pick: ${q.o[k]}</p>`:''}<p class=cp>✔ Correct: ${q.o[q.a]}</p><p class=rs><b>Why:</b> ${reason}</p>${q.h?`<p class=hint>💡 Hint: ${q.h}</p>`:''}${hinted?'<p class=ref>You used a hint on this one.</p>':''}<div class=ref>📖 ${q.ref||''} · <span class=tpl>${esc(tpc(q))}</span></div></div></div>`}
function tgl(b){const d=b.nextElementSibling,o=d.hidden;d.hidden=!o;b.setAttribute('aria-expanded',o);b.querySelector('.chev').textContent=o?'▾':'▸'}
function ftp(i){const t=TP[i],box=$('mlist');if(!box)return;document.querySelectorAll('.tchip').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
const st=hstats(),have=new Set([...box.querySelectorAll('.mq')].map(e=>e.dataset.id));
const qs=[...ALLQ.values()].filter(q=>tpc(q)==t);const missedEver=qs.filter(q=>st.qm[q.id]).sort((a,b)=>st.qm[b.id]-st.qm[a.id]);
$('mlist').innerHTML=`<p class=ref>Topic: <b>${esc(t)}</b> · ${qs.length} question${qs.length==1?'':'s'} in the bank · ${missedEver.length} missed before</p>`+(missedEver.length?missedEver.map(q=>mrow(q,st.lastk[q.id],0,st)).join(''):'<p class=ref>None missed yet in this topic.</p>')+`<button class=pri onclick="start('topic',shuf(${JSON.stringify(qs.map(q=>q.id)).replace(/"/g,"'")}.map(id=>ALLQ.get(id))))">📚 Practice this topic (${qs.length})</button><button onclick="ftpAll()">↩ Show this attempt's misses</button>`;
$('mlist').scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'})}
function ftpAll(){document.querySelectorAll('.tchip').forEach(c=>c.classList.toggle('on',c.dataset.i==='-1'));const st=hstats();$('mlist').innerHTML=S0.missed.map(({q,k,h})=>mrow(q,k,h,st)).join('')||'<p class=ref>No missed questions this attempt. 🎯</p>'}
let S0=null;
function resultExtras(){S0=S;const st=hstats();const tps=[...new Set(S.missed.map(m=>tpc(m.q)))];
const chips=S.missed.length?`<div class=chips><button class="tchip on" data-i=-1 onclick="ftpAll()">All (${S.missed.length})</button>${tps.map(t=>`<button class=tchip data-i=${tpIdx(t)} onclick="ftp(${tpIdx(t)})">${esc(t)} (${S.missed.filter(m=>tpc(m.q)==t).length})</button>`).join('')}</div>`:'';
return weakHTML(st)+(S.missed.length?`<h2>Missed this attempt (${S.missed.length})</h2><p class=ref>Tap a question to see your pick, the right answer, the reason and the hint.</p>${chips}<div id=mlist>${S.missed.map(({q,k,h})=>mrow(q,k,h,st)).join('')}</div><button onclick="start('missed',shuf(S0.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`:'<div class=card>No missed questions this attempt. 🎯</div>')+histHTML(8)}
home();
</script></body></html>
