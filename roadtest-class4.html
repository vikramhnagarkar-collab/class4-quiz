<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 4 Taxi/Rideshare Scenarios (Practice - no Class 4 road test in Alberta)</title>
<style>
:root{--bg:#f6f7f9;--fg:#111;--card:#fff;--mut:#666;--ok:#1a8f3c;--bad:#c62828;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eee;--card:#1d2228;--mut:#9aa;--acc:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0003}
button{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 14px;font-size:18px;text-align:left;border-radius:12px;border:2px solid #8884;background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;text-align:center;font-weight:700;border:0}
button.ok{border-color:var(--ok);background:#1a8f3c22}button.bad{border-color:var(--bad);background:#c6282822}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:flex;justify-content:space-between;font-size:15px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8884;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad)}
.sign{text-align:center}.sign img{max-height:150px;max-width:70%}.cap{font-size:13px;color:var(--mut)}
.fb{font-weight:700;font-size:20px}.ref{font-size:14px;color:var(--mut)}h1{font-size:24px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #8884;color:var(--acc);text-decoration:none;font-weight:600}nav.top{display:flex;gap:4px;margin:4px 0 10px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid #8886;color:inherit;text-decoration:none;line-height:1.2}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.hint{background:#fff3c4;color:#5a4500;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;padding:8px 14px;font-size:14px}button.elim{opacity:.35;text-decoration:line-through}</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "T1", "q": "Rider: \"Take me to the airport.\" When may a for-hire driver refuse a trip, per the Commercial Guide?", "o": ["When the fare is too short to be worth your time and fuel, or the trip ends outside the city", "When you're already at the maximum passengers, or the passenger is offensive or dangerous", "When the rider wants to pay by card", "Never; a licensed driver must take every customer"], "a": 1, "ex": "Refuse only if the vehicle is already at maximum passengers or a passenger is offensive or dangerous.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi, limousine, or ride for hire vehicle, PDF p.110", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Operating a taxi, limousine, or ride for hire vehicle"}, {"id": "T2", "q": "Which pre-driving step is listed BEFORE loading passengers?", "o": ["Enter the GPS destination while pulling away", "Park at a designated space before loading", "Unlock all doors and keep them unlocked", "Start moving, then confirm seat belts at the first light"], "a": 1, "ex": "Pre-driving: circle check, working seat belts, park at a designated space before loading, passenger seated before closing the door, GPS entered before starting, tell passengers you're starting, lock the doors.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.115", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety"}, {"id": "T3", "q": "When should you enter the destination in the GPS?", "o": ["At the first red light", "Before starting the journey", "While driving, if it's voice-controlled", "After the passenger confirms the route mid-trip"], "a": 1, "ex": "Enter information in the GPS before starting the journey.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety"}, {"id": "T4", "q": "Right before pulling away, the guide says to:", "o": ["Turn the music down and adjust the mirrors", "Tell passengers you're about to begin, and lock the doors", "Ask passengers to rate the trip in advance", "Leave the doors unlocked for a quick exit"], "a": 1, "ex": "Let passengers know you're about to begin the journey, and lock the doors.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety"}, {"id": "T5", "q": "A passenger has a service dog. Under the Traffic Safety Act you must make sure the animal:", "o": ["Rides in the front seat with the passenger", "Doesn't impede your use of the steering wheel, brakes and controls, or cause a distraction", "Is crated in the trunk", "Is refused unless you're notified in advance by the dispatcher when the trip is booked"], "a": 1, "ex": "Animals must not impede your access to the steering wheel, brakes and other equipment. Give service animals a safe space.", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting vulnerable people, PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Transporting vulnerable people"}, {"id": "T6", "q": "Dropping off at a busy curb, what do you do before a passenger opens the door?", "o": ["Pop the trunk and unlock all the doors at once so everyone can get out as fast as possible", "Use your mirrors to make sure no pedestrians, cyclists or cars are close to the doors", "Tell them to exit on the traffic side if it's faster", "Keep rolling slowly so you don't block traffic"], "a": 1, "ex": "Post-driving: scan with mirrors for anyone unsafely close to the doors before they open or close.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)"}, {"id": "T7", "q": "After the passenger leaves, the guide's last listed check is:", "o": ["Reset the meter and log the trip details", "Scan the back seat for items left behind", "Wipe down the door handles", "Rate the passenger"], "a": 1, "ex": "Scan the back seat to make sure nothing was left behind.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)"}, {"id": "T8", "q": "A passenger uses a wheelchair. The guide's first principle is:", "o": ["Assume they need full lifting help", "Never assume their needs; ask first", "Have them transfer to the front seat", "Leave the wheelchair unsecured for a quick unload"], "a": 1, "ex": "Never assume you know a person's needs without first asking. Properly secure wheelchairs and mobility devices.", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting vulnerable people, PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Transporting vulnerable people"}, {"id": "T9", "q": "A rider is getting angry about the route. Best first step:", "o": ["Raise your voice so they know who's in charge", "De-escalate with positive or neutral language and a normal tone", "End the trip immediately in the lane", "Ignore the comments and keep driving"], "a": 1, "ex": "First de-escalate through effective communication: normal tone, acknowledge their point, respond politely.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.115", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management"}, {"id": "T10", "q": "Which is listed as a sign of INEFFECTIVE communication?", "o": ["Speaking clearly and audibly", "Not making eye contact", "Showing empathy", "Adjusting your tone to the passenger"], "a": 1, "ex": "Ineffective: not listening, being argumentative, indifferent body language, no eye contact.", "ref": "Commercial Driver's Guide (2025), Ch.7 Effective communication, PDF p.113", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Effective communication"}, {"id": "T11", "q": "Alcohol rules for a commercial (for-hire) driver at the roadside:", "o": ["Under 0.05 BAC is fine", "Under 0.08 BAC is fine", "Zero tolerance: any alcohol or drugs brings an immediate roadside sanction", "Only drugs are zero tolerance"], "a": 2, "ex": "Commercial drivers face immediate roadside sanction zero (zero tolerance) for any alcohol or drugs while operating.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management"}, {"id": "T12", "q": "First-time impaired driving conviction under the Traffic Safety Act. Disqualification:", "o": ["30 days", "90 days from the date you were charged", "6 months", "One year from the finding of guilt"], "a": 3, "ex": "One year from the day of the finding of guilt, for a first-time offender.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management"}, {"id": "T13", "q": "Which statement about getting a Class 4 is correct (since Feb 1, 2023)?", "o": ["You need a road test in a taxi with a government examiner, plus a vision screening test", "No road test, but you must meet vision requirements and provide a driver medical report", "No test of any kind; just pay the fee", "A road test only if you're over 65"], "a": 1, "ex": "No Class 4 road test since Feb 1, 2023, but vision and a driver medical report are required.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4 Road Test, PDF p.17", "ch": "Commercial Driver's Guide (2025), Ch.1", "sec": "Class 4 Road Test"}, {"id": "T14", "q": "A Class 4 lets you drive a bus seating up to how many, excluding the operator?", "o": ["15", "20", "24", "30"], "a": 2, "ex": "Up to 24 (S-endorsement for school buses), plus ambulance or taxi.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13", "ch": "Commercial Driver's Guide (2025), Ch.1", "sec": "Class 4"}, {"id": "T15", "q": "Who needs a Class 4 rather than a Class 5?", "o": ["Anyone who carries passengers in a minivan or SUV, whether or not they are paid for it", "A driver operating a vehicle 'for hire' (paid for the transport service)", "Only drivers with more than 4 passengers", "Only ambulance drivers"], "a": 1, "ex": "A Class 4 is required when operating a vehicle for hire, meaning the owner, operator or employer is being paid for the service.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi... (for hire), PDF p.111", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Operating a taxi... (for hire)"}, {"id": "T16", "q": "Your passengers include a parent with a young child. At drop-off you should:", "o": ["Let the child hop out on the street side", "Offer to open the doors so they don't exit unsafely", "Unlock doors and stay seated", "Unlock the doors and stay seated so you can keep watching the traffic"], "a": 1, "ex": "For passengers with children, offer to open the doors to avoid unsafe exits.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)"}, {"id": "T17", "q": "Traffic is flowing at the limit. Driving well BELOW the speed limit with passengers is:", "o": ["Safest; always drive slower with passengers", "Discouraged; it can confuse others and create a hazard", "Required in school zones only", "Required in bad weather only"], "a": 1, "ex": "Avoid driving below the approved speed limit: it can cause confusion and a hazard. Adjust within the limit for comfort.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety"}, {"id": "T18", "q": "Smooth driving with passengers means avoiding:", "o": ["Using the turn signals too early before lane changes, turns and stops at the curb", "Accelerations, stops and manoeuvres that push passengers forward, back or sideways", "Checking mirrors too often", "Talking to passengers"], "a": 1, "ex": "Avoid harsh acceleration, stops and manoeuvres that throw passengers around.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety"}, {"id": "T19", "q": "Where do you check the rules for a taxi or limousine permit?", "o": ["Alberta registry agents set them provincially", "Your municipality (requirements vary)", "Transport Canada", "Your insurance company"], "a": 1, "ex": "Municipalities have different requirements. Always check municipal laws on taxi operation.", "ref": "Commercial Driver's Guide (2025), Ch.6 Taxi or limousine permits, PDF p.111", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Taxi or limousine permits"}, {"id": "T20", "q": "Calgary rideshare licence (TNDL): your Class 1, 2 or 4 must have no more than how many demerits?", "o": ["4", "7", "9", "12"], "a": 2, "ex": "Calgary requires a valid Class 1, 2 or 4 in good standing with no more than nine demerit points.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)"}, {"id": "T21", "q": "Calgary TNDL: the vehicle inspection (ELVIS or provincial) must be dated within:", "o": ["7 days", "30 days", "60 days", "1 year"], "a": 1, "ex": "Provide an Alberta inspection record or ELVIS dated within 30 days of application.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)"}, {"id": "T22", "q": "Calgary TNDL: the Police Information Check with vulnerable sector check must be dated within:", "o": ["14 days", "30 days", "60 days", "6 months"], "a": 2, "ex": "The police check (with vulnerable sector check for new applications) must be dated within 60 days.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)"}, {"id": "T23", "q": "Examiner: \"Turn right at the lights.\" Calgary, 17 Ave & Richmond Rd SW. Your light is solid red AND the extra red arrow below it is lit (the bike signal is on). What do you do?", "o": ["Stop, then turn right once pedestrians and traffic are clear", "Stay stopped; no right turn while the red arrow is lit", "Turn right without stopping, since the arrow points right", "Stop, then turn right only if no cyclist is in sight"], "a": 1, "ex": "The City's board says: green, YES (yield to pedestrians); red, YES (stop, then yield); red arrow, NO. The red arrow lights when cyclists have the right of way.", "ref": "CityNews Calgary, Aug 25, 2025 (photo: CityNews/Phoenix Phillips), calgary.citynews.ca/2025/08/25/calgary-traffic-sign-red-light-right-turn/", "img": "calgary17ave", "cap": "Trap: solid red alone = stop, then turn OK. Red ARROW lit = no right turn. Photo: CityNews Calgary"}];const IMG={"school": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAGPCAYAAAB1dM37AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAAGFFSURBVHja7V11fBTH+37u4i4QiJIEKQ4hEDRAIcFLcSvFCoVCsQJtqdBCv1iBFgkFCkVbnCDBJXhwp7gGSSAkAeI+vz/2d9vb2727vbu9y10yz+czn+R2Z2dn5dl5551XZKAoyXAC0Lpcead+tnbyxjk5BZ7p7/OcAcDFzTbD3t46NS+n6ExSUuZmALEAsugtK5mQ0VtQIlHX28f517dvsyPr1LdHyw7ZViENi1C2PFC2PFMh+TVTrl2Q4/g+h8KbV3Lg7m5/8PWrzMkAbtJbSIlOYb5w9SrvtDw/L6/n5xOLrPoMK4S7p7gD36UAG5ZbYdUCeYGtre3WpNeZIwCk01tKiU5hXqjt4Wl/IuIj4j55Tq5MLMGFCD9jkh05vl/29m1qTksA/9JbS4lOYR5o6uJmc/Sn+QV23T4lkjS4ba0MMyZa56an5bcCcJbeYkp0iuJFMxdXm6Pz/863/bCDtA0f2wdMGGiTn56W/yGAM/RWU6JTFNdI7mpz7Le1+batO2mumJQI/HuF+SuTAV7eQK1QoJyP5uNOHQLGfmKTn56W3wbACXrLKShMT/Lc5TtAHuYJl/s5IL+tBalZD0QmAwG4RSYDqRUKMv9vpq66dlbvAXFxtckD0JLedgoKMyL5iYcMiVXJra7UaQBy8hElOwWFxZB8+xmQMuXEk1xRypQD2XFWFNk/pI+BgqIYSb7rPIi7p+4kVxQXN5Do05TsFBRmS/LoOBBXd/1Jriiu7oxUQMleckC17pZDco3a9esXgSGdgLR3wvttbIGP+wL1mzK/L54G9mwB8vOE67u6A2v2AXUaCO9X0sa3BXCcPiIKimIeycv7guy5zD9u90VmHx3ZKSgsfE7u5Q1y8Ib644/c1kx2OmenoLBwklOy0zk6hZnPyW9dBQZ1AN6lCu/38gb+OQRUqibuhE8fAv0jgdcJwvtd3IA1e4G6DemcnRKdwiJJTslOiU5RSkhOyV6yIae3wGzQrLhJDgBBlYH1R4DyvsL7098DgzsB1y8I72/eFli0Id/G function hint(){const q=S.qs[S.i];if(S.done||S.hinted[S.i])return;S.hinted[S.i]=1;const w=S.ord.filter(k=>k!=q.a);const e=w[Math.random()*w.length|0];$('o'+e).classList.add('elim');$('o'+e).disabled=true;$('hb').outerHTML=`<div class=hint>💡 ${hintText(q)}</div>`}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function balPos(n){for(let t=0;t<500;t++){const c=[0,1,2,3].map(i=>Math.floor(n/4)+(i<n%4?1:0));const p=[];let ok=true;for(let i=0;i<n;i++){let ch=[0,1,2,3].filter(k=>c[k]>0&&!(i>=2&&p[i-1]==k&&p[i-2]==k));if(!ch.length){ok=false;break}const tot=ch.reduce((a,k)=>a+c[k],0);let r=Math.random()*tot,k=ch[0];for(const x of ch){r-=c[x];if(r<0){k=x;break}}p.push(k);c[k]--}if(ok)return p}return Array.from({length:n},(_,i)=>i%4)}
function home(){const best=localStorage.getItem(CFG.key)||'–';
$('app').innerHTML=`<h1>${CFG.title}</h1><div class=card><b>${Q.length}</b> questions in the bank.<br>${CFG.intro}<br>Real test: ${Math.min(CFG.n,Q.length)} random, stops at ${CFG.wrong} wrong, pass = ${CFG.pass}/${Math.min(CFG.n,Q.length)}.<div class=stats><span>Best real-test score: ${best}</span></div></div>
<button class=pri onclick="start('real')">▶ Real test (${Math.min(CFG.n,Q.length)})</button><button class=pri onclick="start('all')">📚 Practice all (${Q.length})</button><button class=pri onclick="start('weak')">🎯 Weak spots (${Math.min(CFG.n,Q.length)})</button><div class=card style="font-size:14px">${weakInfo()}<br><label><input type=checkbox ${tmOn()?'checked':''} onchange="localStorage.setItem('timer',this.checked?'1':'0')"> ⏱ Show timer and pace per question</label></div>${CFG.links}`}
function pickReal(){const sk='seen_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(Q).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,Q.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
const MK='miss_'+CFG.key;function getM(){try{return JSON.parse(localStorage.getItem(MK)||'{"q":{},"t":{}}')}catch(e){return {q:{},t:{}}}}
function tkey(q){return (q.ch||'')+(q.sec?' · '+q.sec:'')}
function recM(q,ok){const m=getM();if(ok){if(m.q[q.id])m.q[q.id]=Math.max(0,m.q[q.id]-1)}else{m.q[q.id]=(m.q[q.id]||0)+1;m.t[tkey(q)]=(m.t[tkey(q)]||0)+1;const c=(q.ch||'');m.t['CH:'+c]=(m.t['CH:'+c]||0)+1}localStorage.setItem(MK,JSON.stringify(m))}
function pickWeak(){const m=getM();const sc=q=>(m.q[q.id]||0)*4+(m.t[tkey(q)]||0)*2+(m.t['CH:'+(q.ch||'')]||0)*0.5+Math.random()*0.3;return Q.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,Math.min(CFG.n,Q.length))}
function weakInfo(){const m=getM();const t=Object.entries(m.t).filter(([k])=>!k.startsWith('CH:')).sort((a,b)=>b[1]-a[1]).slice(0,3);return t.length?'Top weak spots: '+t.map(([k,v])=>k.replace(/^.*?, /,'')+' ('+v+')').join('; '):'No misses recorded yet. Take a test first.'}
let TM=null;function tmOn(){return localStorage.getItem('timer')=='1'}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){const e=$('tm');if(!e||!S)return;const el=(Date.now()-S.t0)/1000,n=Math.max(1,S.i+(S.done?1:0));e.textContent='⏱ '+fmt(el)+' · pace '+fmt(el/n)+'/q'}
function start(mode,list){const qs=list||(mode=='real'?pickReal():mode=='weak'?shuf(pickWeak()):shuf(Q));clearInterval(TM);if(tmOn())TM=setInterval(tick,1000);S={t0:Date.now(),mode,qs,i:0,ok:0,bad:0,missed:[],hinted:{},hints:0,pos:balPos(qs.length)};show()}
function head(){const n=S.qs.length,p=S.i/n*100;return (tmOn()?`<div class=stats><span id=tm>⏱ ${fmt((Date.now()-S.t0)/1000)}</span></div>`:'')+`<div class=stats><span>Q ${Math.min(S.i+1,n)}/${n}</span><span>✅ ${S.ok} ❌ ${S.bad}</span></div><div class=bar><i style="width:${p}%"></i></div>`+(S.mode=='real'?`<div class="stats strikes" style="justify-content:flex-start;gap:4px">Wrong: ${S.bad}/${CFG.wrong} ${'<span class=on></span>'.repeat(S.bad)}${'<span></span>'.repeat(Math.max(0,CFG.wrong-S.bad))}</div>`:'')}
function show(){const q=S.qs[S.i];
$('app').innerHTML=head()+`<div class=card>${q.img?`<div class=sign><img alt="road sign" src="${IMG[q.img]}">${q.cap?`<div class=cap>${q.cap}</div>`:''}</div>`:''}<p><b>${q.q}</b></p><button class=hb id=hb onclick="hint()">💡 Hint</button></div>`+(S.ord=(()=>{const d=shuf([0,1,2,3].filter(k=>k!=q.a));d.splice(S.pos[S.i],0,q.a);return d})()).map((k,p)=>`<button id=o${k} onclick="pick(${k})">${'ABCD'[p]}. ${q.o[k]}</button>`).join('')+`<div id=fb></div>`}
function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;recM(q,r);if(S.hinted[S.i])S.hints++;r?S.ok++:(S.bad++,S.missed.push({q,k,h:!!S.hinted[S.i]}));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=S.mode=='real'&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class=card><div class=fb style="color:var(${r?'--ok':'--bad'})">${r?'✅ Correct':'❌ Wrong, answer '+'ABCD'[S.ord.indexOf(q.a)]}</div><p>${q.ex}</p><div class=ref>${q.ref}</div></div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);$('fb').scrollIntoView({behavior:'smooth'})}
function topics(){const g={};S.missed.forEach(({q})=>{const c=q.ch||q.ref;(g[c]=g[c]||[]).push(q)});
return `<h2>Review these topics</h2><div class=card>`+Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([c,qs])=>`<p><b>${c}</b> (${qs.length} missed)<br><span class=ref>${[...new Set(qs.map(q=>q.sec||''))].filter(Boolean).join(' · ')}</span></p>`).join('')+`</div>`}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){clearInterval(TM);const n=S.qs.length,real=S.mode=='real';const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(CFG.key)||0;if(S.ok>b)localStorage.setItem(CFG.key,S.ok)}
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'❌ FAIL'}</h1><div class=card>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}<p>⏱ Time: ${fmt((Date.now()-S.t0)/1000)} · pace ${fmt((Date.now()-S.t0)/1000/Math.max(1,Math.min(S.i,n)))} per question</p><p>💡 Hints used: ${S.hints} of ${Math.min(S.i,n)} answered${S.hints?' (on '+(S.hints-S.missed.filter(m=>m.h).length)+' you got right, '+S.missed.filter(m=>m.h).length+' missed)':''}</p></div>`+
(S.missed.length?`<button class=pri onclick="start('missed',shuf(S.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`+topics()+`<h2>Missed questions (${S.missed.length})</h2>`+S.missed.map(({q,k,h})=>`<div class=card><b>${q.q}</b>${h?'<p class=hint>💡 You used a hint on this one</p>':''}<p style="color:var(--bad)">✘ Your answer: ${q.o[k]}</p><p style="color:var(--ok)">✔ Correct: ${q.o[q.a]}</p><p>${q.ex}</p><div class=ref>📖 Review: ${q.ref}</div></div>`).join(''):'<div class=card>No missed questions. 🎯</div>')+`<button onclick="home()">🏠 Home</button>`;scrollTo(0,0)}
home();
</script></body></html>
