<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 4 Taxi/Rideshare Scenarios (Practice - no Class 4 road test in Alberta)</title>
<style>
:root{--bg:#070a11;--fg:#e6ebf5;--card:#0f1522;--card2:#141c2c;--line:#1f2a3d;--mut:#8b97ad;--ok:#22c55e;--bad:#ef4444;--acc:#3b82f6;--acc2:#60a5fa;--warn:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#13213d 0%,var(--bg) 60%);color:var(--fg);font:17px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:1040px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 30px #0006;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{display:block;width:100%;min-height:56px;margin:9px 0;padding:12px 14px;font:inherit;font-size:17px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
button:hover{border-color:#2e4466}button:active{transform:scale(.985)}
button.pri{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;text-align:center;font-weight:700;border:0;box-shadow:0 6px 18px #2563eb40}
button.hard{background:linear-gradient(135deg,#b91c1c,#f97316);box-shadow:0 6px 18px #ef444440}
button.ok{border-color:var(--ok);background:#22c55e1f}button.bad{border-color:var(--bad);background:#ef44441f}
.bar{height:6px;background:#1c2638;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#26324a;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sign{text-align:center;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}.sign img{max-height:150px;max-width:80%}.cap{font-size:12px;color:#5b6475}
.fb{font-weight:700;font-size:20px}.ref{font-size:13px;color:var(--mut)}h1{font-size:23px;margin:6px 0 4px}h2{font-size:19px}h3{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 4px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);color:var(--acc2);text-decoration:none;font-weight:600;background:var(--card2)}
nav.top{display:flex;gap:6px;max-width:1040px;margin:8px auto 0;padding:0 12px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-decoration:none;line-height:1.2;transition:all .2s}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 14px #3b82f655}
.hint{background:#3a2f0b;color:#fde68a;border:1px solid #6b5313;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;min-height:48px;padding:8px 16px;font-size:16px}button.elim{opacity:.3;text-decoration:line-through}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.cats button{font-size:14px;min-height:48px}
.grid2{display:grid;gap:10px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
/* dashboard */
.dash{position:relative;background-color:#0b1120;background-image:linear-gradient(#1a2335 1px,transparent 1px),linear-gradient(90deg,#1a2335 1px,transparent 1px);background-size:128px 128px;background-position:-1px -1px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:10px 0;box-shadow:0 10px 40px #000a;animation:fade .45s ease both}
.dtop{display:grid;grid-template-columns:1fr;gap:6px;padding:18px 14px 8px}@media(min-width:760px){.dtop{grid-template-columns:300px 1fr;padding:24px 22px 10px}}
.ringw{display:flex;justify-content:center;align-items:flex-start;padding:6px 0}@media(min-width:760px){.ringw{position:sticky;top:20px;padding-top:30px}}
.ring{position:relative;width:220px;height:220px}.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:#1e3a66;opacity:.55}.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px #3b82f688)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lab{font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase}.ring .pct{font-size:44px;font-weight:800;line-height:1.05;margin:2px 0}.ring .sub{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.tick{position:absolute;left:50%;top:50%;width:0;height:0}.tick i{position:absolute;left:-1.5px;top:-110px;width:3px;height:18px;background:var(--bad);border-radius:2px;box-shadow:0 0 6px var(--bad)}.tick b{position:absolute;left:10px;top:-116px;font-size:10px;color:#f87171;white-space:nowrap;font-weight:600}
.dom h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#aab6cc;text-transform:uppercase;padding-right:52px}
.drow{background:#0f172acc;border:1px solid #1c2740;border-radius:10px;padding:9px 12px 8px 14px;margin:0 0 8px;position:relative;animation:fade .4s ease both}
.drow:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--c)}
.drow .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}.drow .t span:last-child{color:var(--mut);font-weight:500;white-space:nowrap}
.drow .bar{height:3px;margin-top:7px}.drow .bar i{background:var(--c)}
.rbtn{position:absolute;right:14px;top:14px;width:42px;height:42px;min-height:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;background:#1e293b;border:1px solid #2b3a55;font-size:20px;text-align:center;transition:transform .5s}.rbtn:hover{transform:rotate(180deg)}
.dfoot{font-size:10px;letter-spacing:.1em;color:#5d6b85;text-transform:uppercase;padding:0 18px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0d1424}
.tile{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}.tile:last-child{border-right:0}.tile .k{font-size:10.5px;letter-spacing:.1em;color:#aab6cc;text-transform:uppercase}.tile .v{font-size:22px;font-weight:800;margin-top:2px}
.drow{padding:7px 12px 7px 14px;margin-bottom:6px}@media(min-width:900px){main#app.home{display:flex;flex-direction:column}#app.home>h1{order:-2}#app.home>.hd{order:-1}}
@media(min-width:1000px){.drows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.drow .t{font-size:12.5px}}
.qwrap{animation:fade .3s ease both}
/* ADHD-friendly quiz screen */
.qbar{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:8px 12px 0;background:#070a11f2;border-bottom:1px solid var(--line)}
.qbar .pb{height:8px;background:#1c2638;border-radius:6px;overflow:hidden}.qbar .pb i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
.qbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;font-size:17px;font-weight:700}
.qbar .row #qs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar button{width:auto;min-height:48px;min-width:48px;margin:0;padding:6px 14px;font-size:15px;text-align:center;border-radius:12px}
.qbar #tm{font-size:13px;color:var(--mut);font-weight:500;padding-bottom:6px}
.qtext{font-size:22px;line-height:1.4;font-weight:700;color:#fff;margin:6px 0 4px}
.qtext strong.kw{color:#fde047;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
body.quiz button[id^=o]{min-height:64px;font-size:19px;line-height:1.35;padding:14px 16px;border-width:2px;color:#fff}
body.quiz button.ok{background:#14532d;border-color:#4ade80}body.quiz button.bad{background:#7f1d1d;border-color:#f87171}
body.quiz button.ok:before{content:'✔ ';color:#4ade80}body.quiz button.bad:before{content:'✘ ';color:#fca5a5}
.fb1{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px;line-height:1.4;border:2px solid}.fb1.y{background:#052e16;border-color:#22c55e}.fb1.n{background:#450a0a;border-color:#ef4444}
.fb1 b{font-size:20px;display:block;margin-bottom:2px}.fb1 details{margin-top:8px;font-size:15px;color:#cbd5e1}.fb1 summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--acc2)}
body.quiz .card,body.quiz .qwrap,body.quiz .drow,body.quiz .dash{animation:none!important}body.quiz button{transition:none}
body.focus nav.top,body.focus .qbar #qs,body.focus .qbar .pb,body.focus #tm,body.focus #hb,body.focus .hint,body.focus .cap,body.focus .fb1 details{display:none!important}
body.focus .qbar{background:transparent;border:0}
.r3{counter-reset:r}.r3 li{list-style:none;counter-increment:r;margin:10px 0;padding:12px 14px 12px 50px;position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:17px}
.r3 li:before{content:counter(r);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calm{font-size:18px;color:#cbd5e1}details.more{margin:12px 0}details.more>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--acc2);padding:0 4px}
/* history, weak areas, streak */
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3b1d0a,#1a1206);border:1px solid #9a3412;border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:0 6px 22px #f9731633}.streak .fl{font-size:40px;line-height:1}.streak .sn{font-size:24px;font-weight:800;color:#fdba74}.streak .ss{font-size:14px;color:#fed7aa}
.badge{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;border:1px solid #334155}.badge.rep{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.wk .wtp{display:flex;align-items:center;gap:10px;min-height:56px}.wtp .wn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.wtp .wl{flex:1;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tchip{width:auto;min-height:44px;margin:0;padding:6px 12px;font-size:14px;border-radius:999px}.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.mq{margin:8px 0}.mqh{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:16px}.mqh .mqt{flex:1}.mqh .chev{flex:none;color:var(--acc2);font-weight:800}.mqh[aria-expanded=true]{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.mqb{background:var(--card);border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px 12px;font-size:16px}.mqb .yp{color:#fca5a5}.mqb .cp{color:#86efac;font-weight:700}
.hist .avgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}.avg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.avg b{display:block;font-size:22px}.avg span{font-size:12px;color:var(--mut)}
.hl{list-style:none;padding:0;margin:8px 0 0}.hl li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.hl .hd1{color:var(--mut);font-size:13px}.hl .hm{grid-row:2;font-weight:600}.hl .hs{text-align:right;font-weight:700}.pf{text-align:right;font-size:13px;font-weight:700}.pf.p{color:var(--ok)}.pf.f{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "T1", "q": "Rider: \"Take me to the airport.\" When may a for-hire driver refuse a trip, per the Commercial Guide?", "o": ["When the fare is too short to be worth your time and fuel, or the trip ends outside the city", "When you're already at the maximum passengers, or the passenger is offensive or dangerous", "When the rider wants to pay by card", "Never; a licensed driver must take every customer"], "a": 1, "ex": "Refuse only if the vehicle is already at maximum passengers or a passenger is offensive or dangerous.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi, limousine, or ride for hire vehicle, PDF p.110", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Operating a taxi, limousine, or ride for hire vehicle", "h": "The guide allows refusal for only two kinds of reasons: capacity and safety."}, {"id": "T2", "q": "Which pre-driving step is listed BEFORE loading passengers?", "o": ["Enter the GPS destination while pulling away", "Park at a designated space before loading", "Unlock all doors and keep them unlocked", "Start moving, then confirm seat belts at the first light"], "a": 1, "ex": "Pre-driving: circle check, working seat belts, park at a designated space before loading, passenger seated before closing the door, GPS entered before starting, tell passengers you're starting, lock the doors.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.115", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety", "img": "dC4Load", "cap": "Diagram (not to scale), based on the guide text", "h": "Loading happens somewhere specific, not wherever you stop."}, {"id": "T3", "q": "When should you enter the destination in the GPS?", "o": ["At the first red light", "Before starting the journey", "While driving, at low speed in city traffic", "After the passenger confirms the route mid-trip"], "a": 1, "ex": "Enter information in the GPS before starting the journey.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety", "h": "Programming navigation is a distraction. When is it safe to do?"}, {"id": "T4", "q": "Right before pulling away, the guide says to:", "o": ["Turn the music down and adjust your mirrors one last time before moving", "Tell passengers you're about to begin, and lock the doors", "Ask passengers to rate the trip in advance", "Leave the doors unlocked for a quick exit"], "a": 1, "ex": "Let passengers know you're about to begin the journey, and lock the doors.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety", "h": "Two last steps: one tells the passenger, one secures the vehicle."}, {"id": "T5", "q": "A passenger has a service dog. Under the Traffic Safety Act you must make sure the animal:", "o": ["Rides in the front seat with the passenger", "Doesn't impede your use of the steering wheel, brakes and controls, or cause a distraction", "Is crated in the trunk", "Is refused unless you're notified in advance by the dispatcher when the trip is first booked by the passenger"], "a": 1, "ex": "Animals must not impede your access to the steering wheel, brakes and other equipment. Give service animals a safe space.", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting vulnerable people, PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Transporting vulnerable people", "h": "The Traffic Safety Act rule is about the animal not interfering with your driving."}, {"id": "T6", "q": "Dropping off at a busy curb, what do you do before a passenger opens the door?", "o": ["Pop the trunk and unlock all the doors at once so everyone can get out as fast as possible", "Use your mirrors to make sure no pedestrians, cyclists or cars are close to the doors", "Tell them to exit on the traffic side if it's faster", "Keep rolling slowly so you don't block traffic"], "a": 1, "ex": "Post-driving: scan with mirrors for anyone unsafely close to the doors before they open or close.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)", "img": "dC4Door", "cap": "Diagram (not to scale), based on the guide text", "h": "Look at who could be beside the door when it opens."}, {"id": "T7", "q": "After the passenger leaves, the guide's last listed check is:", "o": ["Reset the meter and log the trip details for the shift", "Scan the back seat for items left behind", "Wipe down the door handles", "Rate the passenger"], "a": 1, "ex": "Scan the back seat to make sure nothing was left behind.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)", "h": "After drop-off, think about what passengers often leave behind."}, {"id": "T8", "q": "A passenger uses a wheelchair. The guide's first principle is:", "o": ["Assume they need full lifting help", "Never assume their needs; ask first", "Have them transfer to the front seat", "Leave the wheelchair unsecured for a quick unload"], "a": 1, "ex": "Never assume you know a person's needs without first asking. Properly secure wheelchairs and mobility devices.", "ref": "Commercial Driver's Guide (2025), Ch.7 Transporting vulnerable people, PDF p.117", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Transporting vulnerable people", "h": "Don't decide for the passenger what help they need."}, {"id": "T9", "q": "A rider is getting angry about the route. Best first step:", "o": ["Raise your voice so they know who's in charge", "De-escalate with positive or neutral language and a normal tone", "End the trip immediately in the lane", "Ignore the comments and keep driving"], "a": 1, "ex": "First de-escalate through effective communication: normal tone, acknowledge their point, respond politely.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.115", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management", "h": "Lower the temperature of the conversation first."}, {"id": "T10", "q": "Which is listed as a sign of INEFFECTIVE communication?", "o": ["Speaking clearly and audibly", "Not making eye contact", "Showing empathy", "Adjusting your tone to the passenger"], "a": 1, "ex": "Ineffective: not listening, being argumentative, indifferent body language, no eye contact.", "ref": "Commercial Driver's Guide (2025), Ch.7 Effective communication, PDF p.113", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Effective communication", "h": "Ineffective communication shows in body language and attention."}, {"id": "T11", "q": "Alcohol rules for a commercial (for-hire) driver at the roadside:", "o": ["Under 0.05 BAC is fine", "Under 0.08 BAC is fine", "Zero tolerance: any alcohol or drugs brings an immediate roadside sanction", "Only drugs are zero tolerance"], "a": 2, "ex": "Commercial drivers face immediate roadside sanction zero (zero tolerance) for any alcohol or drugs while operating.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management", "h": "Commercial drivers working in a commercial capacity face the strictest alcohol rule."}, {"id": "T12", "q": "First-time impaired driving conviction under the Traffic Safety Act. Disqualification:", "o": ["30 days", "90 days from the date you were charged", "6 months", "One year from the finding of guilt"], "a": 3, "ex": "One year from the day of the finding of guilt, for a first-time offender.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger management, PDF p.114", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger management", "h": "The first-offence disqualification under the TSA is a full calendar period."}, {"id": "T13", "q": "Which statement about getting a Class 4 is correct (since Feb 1, 2023)?", "o": ["You need a road test in a taxi with a government examiner, plus a separate vision screening test", "No road test, but you must meet vision requirements and provide a driver medical report", "No test of any kind; just pay the fee", "A road test only if you're over 65"], "a": 1, "ex": "No Class 4 road test since Feb 1, 2023, but vision and a driver medical report are required.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4 Road Test, PDF p.17", "ch": "Commercial Driver's Guide (2025), Ch.1", "sec": "Class 4 Road Test", "h": "Since 2023, the Class 4 upgrade dropped the practical test but kept medical checks."}, {"id": "T14", "q": "A Class 4 lets you drive a bus seating up to how many, excluding the operator?", "o": ["15", "20", "24", "30"], "a": 2, "ex": "Up to 24 (S-endorsement for school buses), plus ambulance or taxi.", "ref": "Commercial Driver's Guide (2025), Ch.1 Class 4, PDF p.13", "ch": "Commercial Driver's Guide (2025), Ch.1", "sec": "Class 4", "img": "dC4Bus", "cap": "Diagram (not to scale), based on the guide text", "h": "A Class 4 covers small buses, below a certain seat count, not counting the driver."}, {"id": "T15", "q": "Who needs a Class 4 rather than a Class 5?", "o": ["Anyone who carries passengers in a minivan or SUV, whether or not they are paid for it", "A driver operating a vehicle 'for hire' (paid for the transport service)", "Only drivers with more than 4 passengers", "Only ambulance drivers"], "a": 1, "ex": "A Class 4 is required when operating a vehicle for hire, meaning the owner, operator or employer is being paid for the service.", "ref": "Commercial Driver's Guide (2025), Ch.6 Operating a taxi... (for hire), PDF p.111", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Operating a taxi... (for hire)", "h": "The key test is whether someone is paid for the ride."}, {"id": "T16", "q": "Your passengers include a parent with a young child. At drop-off you should:", "o": ["Let the child hop out on the street side", "Offer to open the doors so they don't exit unsafely", "Unlock doors and stay seated", "Tell them to exit on the traffic side if it is faster"], "a": 1, "ex": "For passengers with children, offer to open the doors to avoid unsafe exits.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety (post-driving), PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety (post-driving)", "img": "dC4Kids", "cap": "Diagram (not to scale), based on the guide text", "h": "Children may not judge traffic well when getting out."}, {"id": "T17", "q": "Traffic is flowing at the limit. Driving well BELOW the speed limit with passengers is:", "o": ["Safest; always drive well below the limit whenever passengers are aboard", "Discouraged; it can confuse others and create a hazard", "Required in school zones only", "Required in bad weather only"], "a": 1, "ex": "Avoid driving below the approved speed limit: it can cause confusion and a hazard. Adjust within the limit for comfort.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety", "img": "dC4Slow", "cap": "Diagram (not to scale), based on the guide text", "h": "Going much slower than the flow surprises other drivers."}, {"id": "T18", "q": "Smooth driving with passengers means avoiding:", "o": ["Using the turn signals too early before lane changes, turns, and every stop at the curb", "Accelerations, stops and manoeuvres that push passengers forward, back or sideways", "Checking mirrors too often", "Talking to passengers"], "a": 1, "ex": "Avoid harsh acceleration, stops and manoeuvres that throw passengers around.", "ref": "Commercial Driver's Guide (2025), Ch.7 Passenger safety, PDF p.116", "ch": "Commercial Driver's Guide (2025), Ch.7", "sec": "Passenger safety", "h": "Passengers feel every sudden change in speed or direction."}, {"id": "T19", "q": "Where do you check the rules for a taxi or limousine permit?", "o": ["Alberta registry agents set them provincially", "Your municipality (requirements vary)", "Transport Canada", "Your insurance company"], "a": 1, "ex": "Municipalities have different requirements. Always check municipal laws on taxi operation.", "ref": "Commercial Driver's Guide (2025), Ch.6 Taxi or limousine permits, PDF p.111", "ch": "Commercial Driver's Guide (2025), Ch.6", "sec": "Taxi or limousine permits", "h": "Taxi permits are a local matter, and rules differ by city."}, {"id": "T20", "q": "Calgary rideshare licence (TNDL): your Class 1, 2 or 4 must have no more than how many demerits?", "o": ["4", "7", "9", "12"], "a": 2, "ex": "Calgary requires a valid Class 1, 2 or 4 in good standing with no more than nine demerit points.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)", "h": "Calgary's limit is just under the number that would suspend a fully licensed driver's licence in many cases."}, {"id": "T21", "q": "Calgary TNDL: the vehicle inspection (ELVIS or provincial) must be dated within:", "o": ["7 days", "30 days", "60 days", "1 year"], "a": 1, "ex": "Provide an Alberta inspection record or ELVIS dated within 30 days of application.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)", "h": "The inspection has to be recent, about a month."}, {"id": "T22", "q": "Calgary TNDL: the Police Information Check with vulnerable sector check must be dated within:", "o": ["14 days", "30 days", "60 days", "6 months"], "a": 2, "ex": "The police check (with vulnerable sector check for new applications) must be dated within 60 days.", "ref": "City of Calgary, Becoming a TNC driver (calgary.ca/taxis-ride-share/drivers-licence-application.html)", "h": "The police check can be a little older than the inspection: about two months."}, {"id": "T23", "q": "Examiner: \"Turn right at the lights.\" Calgary, 17 Ave & Richmond Rd SW. Your light is solid red AND the extra red arrow below it is lit (the bike signal is on). What do you do?", "o": ["Stop, then turn right once pedestrians and traffic are clear", "Stay stopped; no right turn while the red arrow is lit", "Turn right without stopping, since the arrow points right", "Stop, then turn right only if no cyclist is in sight"], "a": 1, "ex": "The City's board says: green, YES (yield to pedestrians); red, YES (stop, then yield); red arrow, NO. The red arrow lights when cyclists have the right of way.", "ref": "CityNews Calgary, Aug 25, 2025 (photo: CityNews/Phoenix Phillips), calgary.citynews.ca/2025/08/25/calgary-traffic-sign-red-light-right-turn/", "img": "calgary17ave", "cap": "Trap: solid red alone = stop, then turn OK. Red ARROW lit = no right turn. Photo: CityNews Calgary", "h": "This intersection has an extra signal for cyclists. What does a RED ARROW forbid?"}];const IMG={"calgary17ave": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAG6AggDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDzqbSxJasY2KuBg470+CCeK28tXONvrWjvKoDFE7qzBSwGRmtj/hHNVe33JauVcZBI7UIi5wtrYSC4Usdpz1reRJAfmKkD9a1E0C9iB3xEsB <button class=pri onclick="start('real')">▶ Real test (${Math.min(CFG.n,Q.length)})</button><button class=pri onclick="start('quick',pickQuick())">⚡ Quick drill (10 questions)</button><button class=pri onclick="start('all')">📚 Practice all (${Q.length})</button>${QHx.length?`<button class="pri hard" onclick="start('hard')">🔥 Hard mode (difficulty 9) · ${Math.min(CFG.n,QHx.length)} of ${QHx.length}</button>`:''}<button class=pri onclick="start('weak')">🎯 Weak spots (${weakCount()})</button>${CFG.cats?'<h3>Practice by category</h3><div class=cats>'+CFG.cats.map(([k,t])=>`<button onclick="start('cat',shuf(Q.filter(q=>q.cat=='${k}')))">${t} (${Q.filter(q=>q.cat==k).length})</button>`).join('')+'</div>':''}<div class=card style="font-size:14px">${weakInfo()}<br><label><input type=checkbox ${tmOn()?'checked':''} onchange="localStorage.setItem('timer',this.checked?'1':'0')"> ⏱ Show timer and pace per question</label></div>${CFG.links}`;const _c=[...$('app').querySelectorAll('.card')].find(e=>e.innerHTML.includes('weak spots')||e.querySelector('input'));(_c||$('app').lastElementChild).insertAdjacentHTML('beforebegin','<div class=hd>'+homeDash()+'</div>');$('app').querySelector('h1').insertAdjacentHTML('afterend',streakHTML());{const L=$('app').querySelector('.links');L?L.insertAdjacentHTML('beforebegin',histHTML(6)):$('app').insertAdjacentHTML('beforeend',histHTML(6))}animDash();scrollTo(0,0)}
function pickHard(){const sk='seen_hard_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(QHx).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,QHx.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
function pickQuick(){let seen={};try{seen=JSON.parse(localStorage.getItem('seen_'+CFG.key)||'{}')}catch(e){}const m=jget(MSK,{});return shuf(shuf(Q).sort((a,b)=>((seen[a.id]||0)-(m[a.id]===0?99:0))-((seen[b.id]||0)-(m[b.id]===0?99:0))).slice(0,Math.min(10,Q.length)))}
function pickReal(){const sk='seen_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(Q).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,Q.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
const MK='miss_'+CFG.key;function getM(){try{return JSON.parse(localStorage.getItem(MK)||'{"q":{},"t":{}}')}catch(e){return {q:{},t:{}}}}
function tkey(q){return (q.ch||'')+(q.sec?' · '+q.sec:'')}
function recM(q,ok){const m=getM();if(ok){if(m.q[q.id])m.q[q.id]=Math.max(0,m.q[q.id]-1)}else{m.q[q.id]=(m.q[q.id]||0)+1;m.t[tkey(q)]=(m.t[tkey(q)]||0)+1;const c=(q.ch||'');m.t['CH:'+c]=(m.t['CH:'+c]||0)+1}localStorage.setItem(MK,JSON.stringify(m))}
let TM=null;function tmOn(){return localStorage.getItem('timer')=='1'}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){const e=$('tm');if(!e||!S)return;const el=(Date.now()-S.t0)/1000,n=Math.max(1,S.i+(S.done?1:0));e.textContent='⏱ '+fmt(el)+' · pace '+fmt(el/n)+'/q'}
function start(mode,list){$('app').classList.remove('home');document.body.classList.add('quiz');document.body.classList.toggle('focus',localStorage.getItem('focus')=='1');const qs=list||(mode=='real'?pickReal():mode=='hard'?pickHard():mode=='weak'?pickWeak():shuf(Q));clearInterval(TM);if(tmOn())TM=setInterval(tick,1000);S={t0:Date.now(),res:{},ans:{},mode,qs,i:0,ok:0,bad:0,missed:[],hinted:{},hints:0,pos:balPos(qs.length)};show()}
function head(){const n=S.qs.length,f=document.body.classList.contains('focus');return `<div class=qbar role=status aria-live=polite><div class=pb aria-hidden=true><i id=pbi style="width:${S.i/n*100}%"></i></div><div class=row><span id=qs>${barTxt()}</span><button id=fz class=fz aria-pressed=${f} onclick="focusT()">${f?'👁 Show all':'🎯 Focus'}</button></div>`+(tmOn()?`<div id=tm>⏱ ${fmt((Date.now()-S.t0)/1000)}</div>`:'')+`</div>`}
function show(){const q=S.qs[S.i];
$('app').innerHTML=head()+`<div class=card>${q.img?`<div class=sign><img alt="road sign" src="${IMG[q.img]}">${q.cap?`<div class=cap>${q.cap}</div>`:''}</div>`:''}<p class=qtext>${kw(q.q)}</p><button class=hb id=hb onclick="hint()">💡 Hint</button></div>`+(S.ord=(()=>{const d=shuf([0,1,2,3].filter(k=>k!=q.a));d.splice(S.pos[S.i],0,q.a);return d})()).map((k,p)=>`<button id=o${k} onclick="pick(${k})">${'ABCD'[p]}. ${q.o[k]}</button>`).join('')+`<div id=fb></div>`;S.groups=groupBy(S.qs,dom).sort(CFG.cats?()=>0:dsort)}
function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;recM(q,r);recDash(q,r);S.res[q.id]=r;S.ans[q.id]=k;if(S.hinted[S.i])S.hints++;r?S.ok++:(S.bad++,S.missed.push({q,k,h:!!S.hinted[S.i]}));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=isR(S.mode)&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class="fb1 ${r?'y':'n'}" role=status><b>${r?'✔ Right':'✘ Not quite, the answer is '+'ABCD'[S.ord.indexOf(q.a)]}</b>${first1(q.ex)}${q.ex.length>first1(q.ex).length+2||q.ref?`<details><summary>Why · source</summary><p>${q.ex}</p><div class=ref>${q.ref}</div></details>`:''}</div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);updBar();$('fb').scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'})}
function topics(){const g={};S.missed.forEach(({q})=>{const c=q.ch||q.ref;(g[c]=g[c]||[]).push(q)});
return `<h2>Review these topics</h2><div class=card>`+Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([c,qs])=>`<p><b>${c}</b> (${qs.length} missed)<br><span class=ref>${[...new Set(qs.map(q=>q.sec||''))].filter(Boolean).join(' · ')}</span></p>`).join('')+`</div>`}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){clearInterval(TM);const n=S.qs.length,real=isR(S.mode),BK=CFG.key+(S.mode=='hard'?'_hard':'');const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(BK)||0;if(S.ok>b)localStorage.setItem(BK,S.ok)}saveAttempt(pass);
const top3=(()=>{const g={};S.missed.forEach(({q})=>{const c=(q.sec||'')+'|'+(q.ch||q.ref);(g[c]=g[c]||[]).push(q)});return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).slice(0,3).map(([c,qs])=>{const [sec,ch]=c.split('|');return `<li><b>${sec||ch}</b><br><span class=ref>${sec?ch+' · ':''}${qs.length} missed · ${qs[0].ref.match(/PDF pp?\.[^,]*/)?.[0]||''}</span></li>`}).join('')})();
document.body.classList.remove('quiz','focus');
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'🌱 Not a pass yet'}</h1><div class=card><p class=calm>${pass?'Nice, steady work. You cleared the bar.':'Good effort. You are closer than it feels: a few focused reviews will get you there.'}</p>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}<p>⏱ Time: ${fmt((Date.now()-S.t0)/1000)} · pace ${fmt((Date.now()-S.t0)/1000/Math.max(1,Math.min(S.i,n)))} per question</p><p>💡 Hints used: ${S.hints} of ${Math.min(S.i,n)} answered${S.hints?' (on '+(S.hints-S.missed.filter(m=>m.h).length)+' you got right, '+S.missed.filter(m=>m.h).length+' missed)':''}</p></div>`+
streakHTML()+resultExtras()+'<div id=rdash></div>'+`<button onclick="home()">🏠 Home</button>`;$('rdash').outerHTML=quizDash();animDash();scrollTo(0,0)}
/* ===== Score history, repeat-miss detection, weak-spot practice, daily streak ===== */
const HK='hist_'+CFG.key,DK='days_'+CFG.key,STK=['index.html','signs-class4.html'].includes(CFG.page);
const MODEN={real:'Real test',hard:'Hard mode',quick:'Quick drill',all:'Practice all',weak:'Weak spots',missed:'Retry missed',cat:'Category',topic:'Topic practice'};
const ALLQ=(()=>{const m=new Map();[...Q,...QHx].forEach(q=>{if(!m.has(q.id))m.set(q.id,q)});return m})();
const tpc=q=>q.sec||q.ch||'General';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getH(){return jget(HK,[])}
function ldate(t){return new Date(t).toLocaleDateString('en-CA')}
function dnum(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5}
function saveAttempt(pass){const items=S.qs.filter(q=>q.id in S.res).map(q=>({id:q.id,ok:S.res[q.id]?1:0,k:S.ans[q.id],tp:tpc(q)}));if(!items.length||S.saved)return;S.saved=1;
const h=getH();h.push({t:Date.now(),mode:S.mode,ok:S.ok,n:S.qs.length,an:items.length,pass:pass?1:0,items});while(h.length>200)h.shift();
try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){try{localStorage.setItem(HK,JSON.stringify(h.slice(-40)))}catch(e2){}}
const d=jget(DK,[]),td=ldate(Date.now());if(!d.includes(td)){d.push(td);while(d.length>2000)d.shift();localStorage.setItem(DK,JSON.stringify(d))}}
function streak(){const d=[...new Set(jget(DK,[]))].map(dnum).sort((a,b)=>a-b);if(!d.length)return {cur:0,best:0,today:false};let best=1,run=1;for(let i=1;i<d.length;i++){run=d[i]-d[i-1]==1?run+1:1;if(run>best)best=run}
const today=dnum(ldate(Date.now())),last=d[d.length-1];let cur=0;if(today-last<=1){cur=1;for(let i=d.length-1;i>0&&d[i]-d[i-1]==1;i--)cur++}return {cur,best,today:last==today}}
function streakHTML(){if(!STK)return '';const s=streak();return `<div class=streak role=status><div class=fl>🔥</div><div><div class=sn>${s.cur}-day streak</div><div class=ss>Best: ${s.best} day${s.best==1?'':'s'} · ${s.today?'✅ Done for today':s.cur?'Finish one quiz today to keep it going':'Finish any quiz today to start a streak'}</div></div></div>`}
function hstats(){const h=getH(),qm={},qn={},tm={},tn={},lastk={};h.forEach(a=>a.items.forEach(it=>{qn[it.id]=(qn[it.id]||0)+1;tn[it.tp]=(tn[it.tp]||0)+1;if(!it.ok){qm[it.id]=(qm[it.id]||0)+1;tm[it.tp]=(tm[it.tp]||0)+1;lastk[it.id]=it.k}}));return {h,qm,qn,tm,tn,lastk}}
function topWeak(st,n){return Object.entries(st.tm).sort((a,b)=>b[1]-a[1]||b[1]/st.tn[b[0]]-a[1]/st.tn[a[0]]).slice(0,n)}
function legacyWeak(){const m=getM();const sc=q=>(m.q[q.id]||0)*4+(m.t[tkey(q)]||0)*2+(m.t['CH:'+(q.ch||'')]||0)*0.5+Math.random()*0.3;return shuf(Q.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,Math.min(CFG.n,Q.length)))}
function pickWeak(){const st=hstats();if(!Object.keys(st.qm).length)return legacyWeak();const N=Math.min(CFG.n,ALLQ.size),pool=[...ALLQ.values()];
const rep=shuf(pool.filter(q=>(st.qm[q.id]||0)>=2)).sort((a,b)=>st.qm[b.id]-st.qm[a.id]);
const wt=topWeak(st,3).map(x=>x[0]),inW=q=>wt.includes(tpc(q)),byW=(a,b)=>wt.indexOf(tpc(a))-wt.indexOf(tpc(b));
const once=shuf(pool.filter(q=>st.qm[q.id]==1)),onceW=once.filter(inW),onceO=once.filter(q=>!inW(q));
const tq=shuf(pool.filter(q=>!st.qm[q.id]&&inW(q))).sort(byW);
const more=topWeak(st,8).slice(3).map(x=>x[0]),tq2=shuf(pool.filter(q=>!st.qm[q.id]&&more.includes(tpc(q))));
const out=[],seen=new Set();for(const q of [...rep,...onceW,...tq,...onceO,...tq2]){if(out.length>=N)break;if(!seen.has(q.id)){seen.add(q.id);out.push(q)}}return out}
function weakCount(){const st=hstats();return Object.keys(st.qm).length?pickWeak().length:Math.min(CFG.n,Q.length)}
function weakInfo(){const st=hstats(),t=topWeak(st,3);if(t.length)return 'Top weak spots (all attempts): '+t.map(([k,v])=>esc(k)+' ('+v+'×)').join('; ');const m=getM();const t2=Object.entries(m.t).filter(([k])=>!k.startsWith('CH:')).sort((a,b)=>b[1]-a[1]).slice(0,3);return t2.length?'Top weak spots: '+t2.map(([k,v])=>k.replace(/^.*?, /,'')+' ('+v+')').join('; '):'No misses recorded yet. Take a test first.'}
const pctA=a=>a.n?a.ok/a.n*100:0;
function histHTML(lim){const h=getH();if(!h.length)return `<div class="card hist"><h2>📈 Score history</h2><p class=ref>No completed attempts yet. Finish any quiz and it shows up here.</p></div>`;
const avg=l=>l.length?Math.round(l.reduce((s,a)=>s+pctA(a),0)/l.length)+'%':'–';const modes=[...new Set(h.map(a=>a.mode))];
const fmtD=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
return `<div class="card hist"><h2>📈 Score history</h2><div class=avgs><div class=avg><b>${avg(h)}</b><span>Average · all ${h.length}</span></div>${modes.map(m=>{const l=h.filter(a=>a.mode==m);return `<div class=avg><b>${avg(l)}</b><span>${MODEN[m]||m} · ${l.length}</span></div>`}).join('')}</div>
<ul class=hl>${h.slice(-lim).reverse().map(a=>`<li><span class=hd1>${fmtD(a.t)}</span><span class=hm>${MODEN[a.mode]||a.mode}</span><span class=hs>${a.ok}/${a.n} · ${Math.round(pctA(a))}%</span><span class="pf ${a.pass?'p':'f'}">${a.pass?'PASS':'not yet'}</span></li>`).join('')}</ul></div>`}
let TP=[];
function tpIdx(t){let i=TP.indexOf(t);if(i<0){TP.push(t);i=TP.length-1}return i}
function weakHTML(st){const t=topWeak(st,3);if(!t.length)return `<div class="card wk"><h2>🧠 Your top weak areas</h2><p class=ref>No misses recorded across your attempts. 🎯</p></div>`;
const att=t=>new Set(st.h.filter(a=>a.items.some(i=>i.tp==t&&!i.ok)).map(a=>a.t)).size;
return `<div class="card wk"><h2>🧠 Your top weak areas</h2><p class=ref>Across all ${st.h.length} attempt${st.h.length==1?'':'s'} on this page. Tap a topic to see its questions.</p>${t.map(([k,v],i)=>`<button class=wtp onclick="ftp(${tpIdx(k)})"><span class=wn>${i+1}</span><span class=wl>${esc(k)}</span><span class=badge>${v} miss${v==1?'':'es'}${att(k)>1?' · '+att(k)+' attempts':''}</span></button>`).join('')}<button class=pri id=pws onclick="start('weak')">🎯 Practice my weak spots (${weakCount()})</button></div>`}
function mrow(q,k,hinted,st){const c=st.qm[q.id]||0,ti=tpIdx(tpc(q)),reason=first1(q.ex);return `<div class=mq data-tp=${ti}><button class=mqh aria-expanded=false onclick="tgl(this)"><span class=mqt>${kw(q.q)}</span>${c>=2?`<span class="badge rep">missed ${c}x</span>`:''}<span class=chev>▸</span></button><div class=mqb hidden>${k!=null&&q.o[k]!=null?`<p class=yp>✘ Your pick: ${q.o[k]}</p>`:''}<p class=cp>✔ Correct: ${q.o[q.a]}</p><p class=rs><b>Why:</b> ${reason}</p>${q.h?`<p class=hint>💡 Hint: ${q.h}</p>`:''}${hinted?'<p class=ref>You used a hint on this one.</p>':''}<div class=ref>📖 ${q.ref||''} · <span class=tpl>${esc(tpc(q))}</span></div></div></div>`}
function tgl(b){const d=b.nextElementSibling,o=d.hidden;d.hidden=!o;b.setAttribute('aria-expanded',o);b.querySelector('.chev').textContent=o?'▾':'▸'}
function ftp(i){const t=TP[i],box=$('mlist');if(!box)return;document.querySelectorAll('.tchip').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
const st=hstats(),have=new Set([...box.querySelectorAll('.mq')].map(e=>e.dataset.id));
const qs=[...ALLQ.values()].filter(q=>tpc(q)==t);const missedEver=qs.filter(q=>st.qm[q.id]).sort((a,b)=>st.qm[b.id]-st.qm[a.id]);
$('mlist').innerHTML=`<p class=ref>Topic: <b>${esc(t)}</b> · ${qs.length} question${qs.length==1?'':'s'} in the bank · ${missedEver.length} missed before</p>`+(missedEver.length?missedEver.map(q=>mrow(q,st.lastk[q.id],0,st)).join(''):'<p class=ref>None missed yet in this topic.</p>')+`<button class=pri onclick="start('topic',shuf(${JSON.stringify(qs.map(q=>q.id)).replace(/"/g,"'")}.map(id=>ALLQ.get(id))))">📚 Practice this topic (${qs.length})</button><button onclick="ftpAll()">↩ Show this attempt's misses</button>`;
$('mlist').scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'})}
function ftpAll(){document.querySelectorAll('.tchip').forEach(c=>c.classList.toggle('on',c.dataset.i==='-1'));const st=hstats();$('mlist').innerHTML=S0.missed.map(({q,k,h})=>mrow(q,k,h,st)).join('')||'<p class=ref>No missed questions this attempt. 🎯</p>'}
let S0=null;
function resultExtras(){S0=S;const st=hstats();const tps=[...new Set(S.missed.map(m=>tpc(m.q)))];
const chips=S.missed.length?`<div class=chips><button class="tchip on" data-i=-1 onclick="ftpAll()">All (${S.missed.length})</button>${tps.map(t=>`<button class=tchip data-i=${tpIdx(t)} onclick="ftp(${tpIdx(t)})">${esc(t)} (${S.missed.filter(m=>tpc(m.q)==t).length})</button>`).join('')}</div>`:'';
return weakHTML(st)+(S.missed.length?`<h2>Missed this attempt (${S.missed.length})</h2><p class=ref>Tap a question to see your pick, the right answer, the reason and the hint.</p>${chips}<div id=mlist>${S.missed.map(({q,k,h})=>mrow(q,k,h,st)).join('')}</div><button onclick="start('missed',shuf(S0.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`:'<div class=card>No missed questions this attempt. 🎯</div>')+histHTML(8)}
home();
</script></body></html>
