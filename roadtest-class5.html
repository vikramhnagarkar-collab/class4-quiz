<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 5 Road Test Practice</title>
<style>
:root{--bg:#f6f7f9;--fg:#111;--card:#fff;--mut:#666;--ok:#1a8f3c;--bad:#c62828;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eee;--card:#1d2228;--mut:#9aa;--acc:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0003}
button{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 14px;font-size:18px;text-align:left;border-radius:12px;border:2px solid #8884;background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;text-align:center;font-weight:700;border:0}
button.ok{border-color:var(--ok);background:#1a8f3c22}button.bad{border-color:var(--bad);background:#c6282822}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:flex;justify-content:space-between;font-size:15px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8884;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad)}
.sign{text-align:center}.sign img{max-height:150px;max-width:70%}.cap{font-size:13px;color:var(--mut)}
.fb{font-weight:700;font-size:20px}.ref{font-size:14px;color:var(--mut)}h1{font-size:24px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #8884;color:var(--acc);text-decoration:none;font-weight:600}</style></head><body><main id="app"></main>
<script>
const Q=[{"id": "T1", "q": "Examiner: \"At the lights, turn right.\" The light is solid red, there's no sign, and the crosswalk is clear. What does the examiner expect?", "o": ["Stop completely before the stop line or crosswalk, then turn when safe, yielding to traffic", "Slow to a crawl at the stop line, then turn right if no traffic is coming", "Wait for the light to turn green, since turning on red is a test fail", "Stop past the crosswalk where you can see better, then turn when clear"], "a": 0, "ex": "Right on red is allowed with no prohibiting sign, but only after a complete stop before the stop line or crosswalk. Rolling it is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.2 Traffic control signals: solid red light, PDF p.24"}, {"id": "T2", "q": "Which of these is NOT listed as an automatic road test failure?", "o": ["Rolling through a right turn on red without stopping completely", "Driving too fast for the conditions, even under the limit", "Climbing over the curb while parking", "Leaving your signal on a little too long after a lane change"], "a": 3, "ex": "The guide lists speeding/too fast, failing to stop fully (stop sign or right on red), failing to yield, obstructing traffic, climbing the curb or failing to park in three attempts, and poor observation at uncontrolled intersections. A late signal cancel costs points but isn't on that list.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing the road test, PDF p.15"}, {"id": "T3", "q": "Examiner: \"Parallel park behind the blue car.\" How many tries do you get before it's an automatic fail?", "o": ["One attempt only", "Two attempts", "Three attempts", "Unlimited, but each costs points"], "a": 2, "ex": "Being unable to park legally in three attempts is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15"}, {"id": "T4", "q": "You finish the parallel park. The law says your wheels can be at most how far from the curb?", "o": ["30 centimetres", "50 centimetres", "75 centimetres", "1 metre"], "a": 1, "ex": "Wheels must not be more than 50 cm from the curb.", "ref": "Driver's Guide, Spring 2026, Ch.4 Parallel parking, PDF p.54"}, {"id": "T5", "q": "Starting the parallel park, where do you first stop beside the parked car (vehicle B)?", "o": ["Front bumpers lined up, about half a metre apart", "Rear bumpers lined up, about one metre (3 ft) apart", "Your rear bumper at its front bumper, 2 metres apart", "Your front bumper at its rear bumper, 1 metre apart"], "a": 1, "ex": "Stop when your rear bumper lines up with vehicle B's rear bumper, parallel, about 1 m apart.", "ref": "Driver's Guide, Spring 2026, Ch.4 Parallel parking, PDF p.54"}, {"id": "T6", "q": "Examiner: \"Park facing uphill here.\" There IS a curb on your right. Which way do you turn the front wheels?", "o": ["Right, toward the curb, then roll forward to touch it", "Left, toward the centre, and roll back until the right front tire touches the curb", "Straight ahead, with the park brake set firmly", "Right, toward the curb, and roll back to touch it"], "a": 1, "ex": "Uphill with a curb: wheels left, roll back gently so the right front tire rests on the curb.", "ref": "Driver's Guide, Spring 2026, Ch.4 Hill parking, PDF p.57"}, {"id": "T7", "q": "Same hill, but now there's NO curb. Facing uphill, you turn the wheels:", "o": ["Left, toward the centre of the road", "Right, toward the edge of the road", "Straight, since there's no curb to catch you", "Left, then roll back until the car stops"], "a": 1, "ex": "Uphill without a curb: wheels right, so a rolling car goes off the road, not into traffic.", "ref": "Driver's Guide, Spring 2026, Ch.4 Hill parking, PDF p.57"}, {"id": "T8", "q": "Parking facing DOWNHILL on the right side, with or without a curb, you turn the wheels:", "o": ["Left, toward the centre", "Right, toward the curb or edge", "Left with a curb, right without", "Straight, with the park brake set"], "a": 1, "ex": "Facing downhill, always turn the front wheels to the right.", "ref": "Driver's Guide, Spring 2026, Ch.4 Hill parking, PDF p.57"}, {"id": "T9", "q": "Quiet residential intersection, no signs or signals. The examiner is watching for:", "o": ["You keeping your speed so you don't obstruct traffic", "You slowing and looking, ready to yield to drivers on your right", "You honking lightly to warn cross traffic", "You stopping fully, as at a four-way stop"], "a": 1, "ex": "Failing to slow or look properly at an uncontrolled intersection is an automatic fail; be ready to yield to the right.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15"}, {"id": "T10", "q": "Your light is a FLASHING GREEN. What may you do?", "o": ["Go straight only; turns need a green arrow", "Go through, turn left, or turn right without stopping, still yielding to anyone lawfully in the intersection", "Treat it as a yield sign and slow to 30 km/h", "Stop first, then proceed as at a four-way stop"], "a": 1, "ex": "Flashing green: through, left or right without stopping; opposing traffic faces red, but you still yield to pedestrians or vehicles lawfully in the intersection.", "ref": "Driver's Guide, Spring 2026, Ch.2 Flashing green light, PDF p.25"}, {"id": "T11", "q": "You face a green arrow pointing right AND a solid red light. You want to go straight. You:", "o": ["Go straight carefully, since the arrow makes the red a yield", "Stay stopped; with a red light you may proceed only in the arrow's direction", "Go straight once the right-turners have cleared", "Treat it as a flashing red and go after a full stop"], "a": 1, "ex": "Green arrow with red: you may enter only in the direction of the arrow.", "ref": "Driver's Guide, Spring 2026, Ch.2 Green arrow with red light, PDF p.25"}, {"id": "T12", "q": "When is a LEFT turn on a red light allowed in Alberta?", "o": ["Never, under any circumstances", "From any street onto a one-way street, after stopping", "Only from a one-way street onto a one-way street, after a complete stop", "From a two-way street onto a one-way street, without stopping"], "a": 2, "ex": "The only left on red: one-way onto one-way, after a complete stop, unless a sign prohibits it.", "ref": "Driver's Guide, Spring 2026, Ch.2 Solid red light, PDF p.24"}, {"id": "T13", "q": "Every light at an intersection is flashing RED. This intersection is:", "o": ["Treated as a four-way stop", "Uncontrolled: the car on the right goes first", "Closed until a police officer directs traffic", "Yield-controlled: slow down without stopping"], "a": 0, "ex": "A flashing red is treated like a stop sign; all flashing red = four-way stop.", "ref": "Driver's Guide, Spring 2026, Ch.2 Flashing red light, PDF p.25"}, {"id": "T14", "q": "The light ahead has been green for a while. What's the guide's tip for judging when it will change?", "o": ["Count to ten, then expect it to change", "Check the pedestrian signal: if it shows DON'T WALK, be ready to stop", "Watch the cross traffic for brake lights", "Speed up a little to clear it before yellow"], "a": 1, "ex": "A 'stale' green: if the pedestrian signal shows DON'T WALK, be ready to stop.", "ref": "Driver's Guide, Spring 2026, Ch.2 Solid green light, PDF p.24", "cap": ""}, {"id": "T15", "q": "A pedestrian crossing sign has yellow lights that are FLASHING. Your maximum speed:", "o": ["50 km/h, and watch for people", "40 km/h until past the sign", "30 km/h, and yield or stop for pedestrians", "Whatever the posted limit is"], "a": 2, "ex": "Flashing yellow lights on a school, playground or pedestrian sign: max 30 km/h and yield or stop for pedestrians.", "ref": "Driver's Guide, Spring 2026, Ch.2 Pedestrian signals and signs, PDF p.26", "img": "crosswalk", "cap": ""}, {"id": "T16", "q": "This Calgary school zone sign shows 08:00\u201317:00 SCHOOL DAYS. It's a school day, 4:45 p.m. Is the 30 km/h limit in effect?", "o": ["No; school zones end at 4:30 p.m.", "Yes; when a municipality posts different times under the sign, those apply", "Only if children are visible", "No; the posted times are for buses only"], "a": 1, "ex": "Default provincial times are 8\u20139:30, 11:30\u20131:30, 3\u20134:30 on school days, but municipalities may set different times, posted beneath the sign.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones, PDF p.33", "img": "school", "cap": "Calgary school zone sign: read the time tab"}, {"id": "T17", "q": "No time tab is posted. Which hours does a school zone apply?", "o": ["School days: 8:00\u20139:30, 11:30\u20131:30, 3:00\u20134:30", "Every day: 8:00\u20139:30, 11:30\u20131:30, 3:00\u20134:30", "School days: 7:30\u20139:00, 11:30\u20131:00, 3:00\u20135:00", "School days: 8:00 a.m.\u20134:30 p.m."], "a": 0, "ex": "Provincial default: school days only, three periods.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones, PDF p.32"}, {"id": "T18", "q": "Saturday in July, 9:30 p.m., sunset was 9:45 p.m. You're in this playground zone behind a slow car. May you pass?", "o": ["Yes; playground zones are school days only", "Yes, once you're under 30 km/h", "No; it's in effect until one hour after sunset and no passing is allowed while it's in effect", "No, but only because it's a weekend"], "a": 2, "ex": "Playground zones apply every day 8:30 a.m. to one hour after sunset (unless posted otherwise), and you may not pass while it's in effect.", "ref": "Driver's Guide, Spring 2026, Ch.2 Playground zones, PDF p.33", "img": "playground", "cap": ""}, {"id": "T19", "q": "A school sign with NO speed tab under it means:", "o": ["A school zone: 30 km/h on school days", "A school area: use caution; children may be walking or crossing", "A school bus stop ahead: be ready to stop", "The end of the school zone"], "a": 1, "ex": "No speed sign attached = a school area, a caution warning only.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones and areas, PDF p.33"}, {"id": "T20", "q": "Overhead lane signal shows a solid red X over your lane. You must:", "o": ["Slow down and continue carefully", "Not enter or stay in that lane; move safely into a lane with a green arrow", "Stop under the signal until it changes", "Use the lane only to turn left"], "a": 1, "ex": "A red X means oncoming traffic is using that lane: don't enter or remain.", "ref": "Driver's Guide, Spring 2026, Ch.2 Lane reversal signals, PDF p.26"}, {"id": "T21", "q": "Normal dry roads. The minimum following time the guide recommends behind a car is:", "o": ["One second", "Two seconds", "Three seconds", "Four seconds"], "a": 1, "ex": "Two seconds minimum in normal conditions (works at any speed); four seconds for large vehicles like motor homes.", "ref": "Driver's Guide, Spring 2026, Ch.7 Maintain your following time and distance, PDF p.92"}, {"id": "T22", "q": "Stopped in traffic behind another car, how much space should you leave?", "o": ["Enough to see its rear tires touching the road", "Enough to move into another lane without having to reverse", "About one car length, whatever the speed", "As little as possible, to keep traffic moving"], "a": 1, "ex": "Leave room to pull out into another lane without reversing.", "ref": "Driver's Guide, Spring 2026, Ch.7 Proactive driving, PDF p.92"}, {"id": "T23", "q": "You miss the turn the examiner asked for. Best response:", "o": ["Stop and reverse back to the turn, if it's quiet", "Continue to the next intersection or exit, and let the examiner redirect you", "Make a quick U-turn mid-block", "Stop in the lane and ask the examiner what to do"], "a": 1, "ex": "If you miss your exit or turn, continue to the next one. Never reverse on a roadway.", "ref": "Driver's Guide, Spring 2026, Ch.7 Plan ahead, PDF p.92"}, {"id": "T24", "q": "Before the test starts, the examiner checks your car. Which is NOT on the guide's required list?", "o": ["Working horn and speedometer", "Headlights, brake lights, and signal lights", "A spare tire and a jack", "Enough fuel for the road test"], "a": 2, "ex": "Listed: plate and insurance, lights, horn, speedometer, brakes, windshield and wipers, tires, doors, seats and belts, exhaust, mirrors, fuel. A spare tire isn't listed.", "ref": "Driver's Guide, Spring 2026, Ch.1 Class 5 road test (vehicle requirements), PDF p.14"}, {"id": "T25", "q": "Examiner: \"Turn right at the lights.\" Calgary, 17 Ave & Richmond Rd SW. Your light is solid red AND the extra red arrow below it is lit (the bike signal is on). What do you do?", "o": ["Stop, then turn right once pedestrians and traffic are clear", "Stay stopped; no right turn while the red arrow is lit", "Turn right without stopping, since the arrow points right", "Stop, then turn right only if no cyclist is in sight"], "a": 1, "ex": "The City's board says: green, YES (yield to pedestrians); red, YES (stop, then yield); red arrow, NO. The red arrow lights when cyclists have the right of way.", "ref": "CityNews Calgary, Aug 25, 2025 (photo: CityNews/Phoenix Phillips), calgary.citynews.ca/2025/08/25/calgary-traffic-sign-red-light-right-turn/", "img": "calgary17ave", "cap": "Trap: solid red alone = stop, then turn OK. Red ARROW lit = no right turn. Photo: CityNews Calgary"}, {"id": "T26", "q": "St. Albert Trail & Gate Ave, 11:30 p.m. on a Tuesday. The digital sign has switched to \"left turn yield on green\". Your light is solid green with NO arrow. You want to turn left. You:", "o": ["Wait for a green arrow, as the sign requires during the day", "Turn left after yielding to oncoming traffic and pedestrians", "Turn left without yielding, since the sign gives you the turn", "Go straight; left turns are closed overnight in this pilot"], "a": 1, "ex": "In the pilot, the sign shows \"no left turn on red\" by day. During low-traffic hours (10 p.m. to 5:30 a.m. weekdays, 10 p.m. to 7 a.m. weekends) it shows \"left turn yield on green\": you may turn on a plain green if you yield. If the sign malfunctions, follow the traffic lights.", "ref": "St. Albert Gazette, Oct 6, 2026 (photo: Kevin Ma/St. Albert Gazette), s ide.", "n": 26, "wrong": 5, "key": "roadtest-class5.html", "links": "<div class=links><a href=\"./\">\u2b05 Back to the knowledge test quiz</a></div>", "pass": 22};

function balPos(n){for(let t=0;t<500;t++){const c=[0,1,2,3].map(i=>Math.floor(n/4)+(i<n%4?1:0));const p=[];let ok=true;for(let i=0;i<n;i++){let ch=[0,1,2,3].filter(k=>c[k]>0&&!(i>=2&&p[i-1]==k&&p[i-2]==k));if(!ch.length){ok=false;break}const tot=ch.reduce((a,k)=>a+c[k],0);let r=Math.random()*tot,k=ch[0];for(const x of ch){r-=c[x];if(r<0){k=x;break}}p.push(k);c[k]--}if(ok)return p}return Array.from({length:n},(_,i)=>i%4)}

function pickReal(){const sk='seen_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(Q).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,Q.length));

function start(mode,list){const qs=list||(mode=='real'?pickReal():shuf(Q));S={mode,qs,i:0,ok:0,bad:0,missed:[],pos:balPos(qs.length)};show()}
function head(){const n=S.qs.length,p=S.i/n*100;return `<div class=stats><span>Q ${Math.min(S.i+1,n)}/${n}</span><span>✅ ${S.ok} ❌ ${S.bad}</span></div><div class=bar><i style="width:${p}%"></i></div>`+(S.mode=='real'?`<div class="stats strikes" style="justify-content:flex-start;gap:4px">Wrong: ${S.bad}/${CFG.wrong} ${'<span class=on></span>'.repeat(S.bad)}${'<span></span>'.repeat(Math.max(0,CFG.wrong-S.bad))}</div>`:'')}
function show(){const q=S.qs[S.i];

function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;r?S.ok++:(S.bad++,S.missed.push({q,k}));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=S.mode=='real'&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class=card><div class=fb style="color:var(${r?'--ok':'--bad'})">${r?'✅ Correct':'❌ Wrong, answer '+'ABCD'[S.ord.indexOf(q.a)]}</div><p>${q.ex}</p><div class=ref>${q.ref}</div></div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);$('fb').scrollIntoView({behavior:'smooth'})}
function topics(){const g={};S.missed.forEach(({q})=>{const c=q.ch||q.ref;(g[c]=g[c]||[]).push(q)});
return `<h2>Review these topics</h2><div class=card>`+Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([c,qs])=>`<p><b>${c}</b> (${qs.length} missed)<br><span class=ref>${[...new Set(qs.map(q=>q.sec||''))].filter(Boolean).join(' · ')}</span></p>`).join('')+`</div>`}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){const n=S.qs.length,real=S.mode=='real';const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(CFG.key)||0;if(S.ok>b)localStorage.setItem(CFG.key,S.ok)}
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'❌ FAIL'}</h1><div class=card>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}</div>`+
(S.missed.length?`<button class=pri onclick="start('missed',shuf(S.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`+topics()+`<h2>Missed questions (${S.missed.length})</h2>`+S.missed.map(({q,k})=>`<div class=card><b>${q.q}</b><p style="color:var(--bad)">✘ Your answer: ${q.o[k]}</p><p style="color:var(--ok)">✔ Correct: ${q.o[q.a]}</p><p>${q.ex}</p><div class=ref>📖 Review: ${q.ref}</div></div>`).join(''):'<div class=card>No missed questions. 🎯</div>')+`<button onclick="home()">🏠 Home</button>`;scrollTo(0,0)}
