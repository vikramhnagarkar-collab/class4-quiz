<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 5 Road Test Practice</title>
<style>
:root{--bg:#f6f7f9;--fg:#111;--card:#fff;--mut:#666;--ok:#1a8f3c;--bad:#c62828;--acc:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eee;--card:#1d2228;--mut:#9aa;--acc:#64a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0003}
button{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 14px;font-size:18px;text-align:left;border-radius:12px;border:2px solid #8884;background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;text-align:center;font-weight:700;border:0}
button.ok{border-color:var(--ok);background:#1a8f3c22}button.bad{border-color:var(--bad);background:#c6282822}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:flex;justify-content:space-between;font-size:15px;margin:6px 0;color:var(--mut)}
.strikes{justify-content:flex-start;align-items:center;gap:4px}.strikes span{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8884;margin-right:3px;vertical-align:middle}.strikes span.on{background:var(--bad)}
.sign{text-align:center}.sign img{max-height:150px;max-width:70%}.cap{font-size:13px;color:var(--mut)}
.fb{font-weight:700;font-size:20px}.ref{font-size:14px;color:var(--mut)}h1{font-size:24px}
.links a{display:block;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #8884;color:var(--acc);text-decoration:none;font-weight:600}nav.top{display:flex;gap:4px;margin:4px 0 10px;font-size:12px}nav.top a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid #8886;color:inherit;text-decoration:none;line-height:1.2}nav.top a.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.hint{background:#fff3c4;color:#5a4500;border-radius:10px;padding:10px;margin:8px 0}button.hb{width:auto;padding:8px 14px;font-size:14px}button.elim{opacity:.35;text-decoration:line-through}</style></head><body><nav class=top id=nav></nav><main id="app"></main>
<script>
const Q=[{"id": "T1", "q": "Examiner: \"At the lights, turn right.\" The light is solid red, there's no sign, and the crosswalk is clear. What does the examiner expect?", "o": ["Stop completely before the stop line or crosswalk, then turn when safe, yielding to traffic", "Slow to a crawl at the stop line, then turn right if no traffic is coming", "Slow to a crawl at the stop line, then turn right on red if no traffic is coming either way", "Stop past the crosswalk where you can see better, then turn when clear"], "a": 0, "ex": "Right on red is allowed with no prohibiting sign, but only after a complete stop before the stop line or crosswalk. Rolling it is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.2 Traffic control signals: solid red light, PDF p.24", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Traffic control signals: solid red light", "h": "Red means a full stop first, even when turning. Where is the legal stopping point?"}, {"id": "T2", "q": "Which of these is NOT listed as an automatic road test failure?", "o": ["Rolling through a right turn on red without stopping completely", "Driving too fast for the conditions, even under the limit", "Climbing over the curb while parking", "Leaving your signal on a little too long after a lane change"], "a": 3, "ex": "The guide lists speeding/too fast, failing to stop fully (stop sign or right on red), failing to yield, obstructing traffic, climbing the curb or failing to park in three attempts, and poor observation at uncontrolled intersections. A late signal cancel costs points but isn't on that list.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing the road test, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing the road test", "h": "Five behaviours are automatic fails. Which choice is just a minor habit, not one of them?"}, {"id": "T3", "q": "Examiner: \"Parallel park behind the blue car.\" How many tries do you get before it's an automatic fail?", "o": ["One attempt only", "Two attempts", "Three attempts", "Unlimited, but each costs points"], "a": 2, "ex": "Being unable to park legally in three attempts is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "The guide gives a specific number of tries to park legally. It's more than two."}, {"id": "T4", "q": "You finish the parallel park. The law says your wheels can be at most how far from the curb?", "o": ["30 centimetres", "50 centimetres", "75 centimetres", "1 metre"], "a": 1, "ex": "Wheels must not be more than 50 cm from the curb.", "ref": "Driver's Guide, Spring 2026, Ch.3 Parallel parking, PDF p.54", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Parallel parking", "h": "The legal gap is less than a metre but more than a ruler's length."}, {"id": "T5", "q": "Starting the parallel park, where do you first stop beside the parked car (vehicle B)?", "o": ["Front bumpers lined up, about half a metre apart", "Rear bumpers lined up, about one metre (3 ft) apart", "Your rear bumper at its front bumper, 2 metres apart", "Your front bumper at its rear bumper, 1 metre apart"], "a": 1, "ex": "Stop when your rear bumper lines up with vehicle B's rear bumper, parallel, about 1 m apart.", "ref": "Driver's Guide, Spring 2026, Ch.3 Parallel parking, PDF p.54", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Parallel parking", "img": "dParStart", "cap": "Diagram (not to scale), based on the guide text", "h": "You line up with vehicle B before reversing. Think about which bumpers match and the side gap."}, {"id": "T6", "q": "Examiner: \"Park facing uphill here.\" There IS a curb on your right. Which way do you turn the front wheels?", "o": ["Right, toward the curb, then roll forward to touch it", "Left, toward the centre, and roll back until the right front tire touches the curb", "Straight ahead, with the park brake set firmly", "Right, toward the curb, and roll back gently until the right front tire touches it"], "a": 1, "ex": "Uphill with a curb: wheels left, roll back gently so the right front tire rests on the curb.", "ref": "Driver's Guide, Spring 2026, Ch.3 Hill parking, PDF p.57", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Hill parking", "h": "With a curb, you want the curb to catch the car if it rolls back."}, {"id": "T7", "q": "Same hill, but now there's NO curb. Facing uphill, you turn the wheels:", "o": ["Left, toward the centre of the road", "Right, toward the edge of the road", "Straight, since there's no curb to catch you", "Left, then roll back until the car stops"], "a": 1, "ex": "Uphill without a curb: wheels right, so a rolling car goes off the road, not into traffic.", "ref": "Driver's Guide, Spring 2026, Ch.3 Hill parking, PDF p.57", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Hill parking", "img": "dHillNo", "cap": "Diagram (not to scale), based on the guide text", "h": "Picture the car rolling backward. Which wheel angle sends it away from traffic?"}, {"id": "T8", "q": "Parking facing DOWNHILL on the right side, with or without a curb, you turn the wheels:", "o": ["Left, toward the centre", "Right, toward the curb or edge", "Left with a curb, right without", "Straight, with the park brake set"], "a": 1, "ex": "Facing downhill, always turn the front wheels to the right.", "ref": "Driver's Guide, Spring 2026, Ch.3 Hill parking, PDF p.57", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Hill parking", "img": "dDown", "cap": "Diagram (not to scale), based on the guide text", "h": "Downhill, a rolling car moves forward. Should it end up in traffic or off the road?"}, {"id": "T9", "q": "Quiet residential intersection, no signs or signals. The examiner is watching for:", "o": ["You keeping your speed so you don't obstruct traffic", "You slowing and looking, ready to yield to drivers on your right", "You honking lightly to warn cross traffic", "You stopping fully, as you would at a four-way stop, then going in turn"], "a": 1, "ex": "Failing to slow or look properly at an uncontrolled intersection is an automatic fail; be ready to yield to the right.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "No signs at all. Which direction does the default right-of-way rule favour?"}, {"id": "T10", "q": "Your light is a FLASHING GREEN. What may you do?", "o": ["Go straight only; turns need a green arrow", "Go through, turn left, or turn right without stopping, still yielding to anyone lawfully in the intersection", "Treat it as a yield sign and slow to 30 km/h", "Stop first, then proceed as you would at a four-way stop, taking turns with other drivers"], "a": 1, "ex": "Flashing green: through, left or right without stopping; opposing traffic faces red, but you still yield to pedestrians or vehicles lawfully in the intersection.", "ref": "Driver's Guide, Spring 2026, Ch.2 Flashing green light, PDF p.25", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Flashing green light", "img": "dFlashG", "cap": "Diagram (not to scale), based on the guide text", "h": "Flashing green is a protected signal. Think about which movements are allowed without stopping."}, {"id": "T11", "q": "You face a green arrow pointing right AND a solid red light. You want to go straight. You:", "o": ["Go straight carefully, since the green arrow turns the red light into a yield for everyone", "Stay stopped; with a red light you may proceed only in the arrow's direction", "Go straight once the right-turners have cleared", "Treat it as a flashing red and go after a full stop"], "a": 1, "ex": "Green arrow with red: you may enter only in the direction of the arrow.", "ref": "Driver's Guide, Spring 2026, Ch.2 Green arrow with red light, PDF p.25", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Green arrow with red light", "img": "dArrow", "cap": "Diagram (not to scale), based on the guide text", "h": "An arrow only covers the direction it points. What does the red mean for everything else?"}, {"id": "T12", "q": "When is a LEFT turn on a red light allowed in Alberta?", "o": ["Never, under any circumstances", "From any street onto a one-way street, after stopping", "Only from a one-way street onto a one-way street, after a complete stop", "From a two-way street onto a one-way street, without stopping"], "a": 2, "ex": "The only left on red: one-way onto one-way, after a complete stop, unless a sign prohibits it.", "ref": "Driver's Guide, Spring 2026, Ch.2 Solid red light, PDF p.24", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Solid red light", "h": "Left on red is very limited. Think about the type of street you leave and the one you enter."}, {"id": "T13", "q": "Every light at an intersection is flashing RED. This intersection is:", "o": ["Treated as a four-way stop", "Uncontrolled: the car on the right goes first", "Closed until a police officer directs traffic", "Yield-controlled: slow down without stopping"], "a": 0, "ex": "A flashing red is treated like a stop sign; all flashing red = four-way stop.", "ref": "Driver's Guide, Spring 2026, Ch.2 Flashing red light, PDF p.25", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Flashing red light", "img": "ab_flashred", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Treat each flashing red like the sign it imitates."}, {"id": "T14", "q": "The light ahead has been green for a while. What's the guide's tip for judging when it will change?", "o": ["Count to ten, then expect it to change", "Check the pedestrian signal: if it shows DON'T WALK, be ready to stop", "Watch the cross traffic for brake lights", "Speed up a little so you can clear the intersection before the light turns yellow"], "a": 1, "ex": "A 'stale' green: if the pedestrian signal shows DON'T WALK, be ready to stop.", "ref": "Driver's Guide, Spring 2026, Ch.2 Solid green light, PDF p.24", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Solid green light", "img": "ab_dontwalk", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Another signal at the corner counts down before the green ends."}, {"id": "T15", "q": "A pedestrian crossing sign has yellow lights that are FLASHING. Your maximum speed:", "o": ["50 km/h, and watch for people", "40 km/h until past the sign", "30 km/h, and yield or stop for pedestrians", "Whatever the posted limit is"], "a": 2, "ex": "Flashing yellow lights on a school, playground or pedestrian sign: max 30 km/h and yield or stop for pedestrians.", "ref": "Driver's Guide, Spring 2026, Ch.2 Pedestrian signals and signs, PDF p.26", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Pedestrian signals and signs", "img": "crosswalk", "cap": "", "h": "Flashing lights on a pedestrian sign set the same limit as a school zone."}, {"id": "T16", "q": "This Calgary school zone sign shows 08:00\u201317:00 SCHOOL DAYS. It's a school day, 4:45 p.m. Is the 30 km/h limit in effect?", "o": ["No; school zones always end at 4:30 p.m. no matter what is posted under the sign", "Yes; when a municipality posts different times under the sign, those apply", "Only if children are visible", "No; the posted times are for buses only"], "a": 1, "ex": "Default provincial times are 8\u20139:30, 11:30\u20131:30, 3\u20134:30 on school days, but municipalities may set different times, posted beneath the sign.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones, PDF p.33", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "School zones", "img": "school", "cap": "Calgary school zone sign: read the time tab", "h": "Look at what's posted beneath the sign. Municipal times replace the default."}, {"id": "T17", "q": "No time tab is posted. Which hours does a school zone apply?", "o": ["School days: 8:00\u20139:30, 11:30\u20131:30, 3:00\u20134:30", "Every day: 8:00\u20139:30, 11:30\u20131:30, 3:00\u20134:30", "School days: 7:30\u20139:00, 11:30\u20131:00, 3:00\u20135:00", "School days: 8:00 a.m.\u20134:30 p.m."], "a": 0, "ex": "Provincial default: school days only, three periods.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones, PDF p.32", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "School zones", "h": "The default schedule has three periods, and it applies on school days only."}, {"id": "T18", "q": "Saturday in July, 9:30 p.m., sunset was 9:45 p.m. You're in this playground zone behind a slow car. May you pass?", "o": ["Yes; playground zones are school days only", "Yes, once you're under 30 km/h", "No; it's in effect until one hour after sunset and no passing is allowed while it's in effect", "No, but only because it's a weekend"], "a": 2, "ex": "Playground zones apply every day 8:30 a.m. to one hour after sunset (unless posted otherwise), and you may not pass while it's in effect.", "ref": "Driver's Guide, Spring 2026, Ch.2 Playground zones, PDF p.33", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Playground zones", "img": "ab_playground", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Playground zones run every day until a set time after sunset. Check the clock."}, {"id": "T19", "q": "A school sign with NO speed tab under it means:", "o": ["A school zone: 30 km/h on school days", "A school area: use caution; children may be walking or crossing", "A school bus stop ahead: be ready to stop", "The end of the school zone"], "a": 1, "ex": "No speed sign attached = a school area, a caution warning only.", "ref": "Driver's Guide, Spring 2026, Ch.2 School zones and areas, PDF p.33", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "School zones and areas", "img": "ab_schoolarea", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Is there a speed tab? Without one, the sign is a warning, not a speed zone."}, {"id": "T20", "q": "Overhead lane signal shows a solid red X over your lane. You must:", "o": ["Slow down and continue carefully", "Not enter or stay in that lane; move safely into a lane with a green arrow", "Stop under the signal until it changes", "Stop under the signal and wait in that lane until the signal changes back"], "a": 1, "ex": "A red X means oncoming traffic is using that lane: don't enter or remain.", "ref": "Driver's Guide, Spring 2026, Ch.2 Lane reversal signals, PDF p.26", "ch": "Driver's Guide, Spring 2026, Ch.2", "sec": "Lane reversal signals", "img": "ab_redx", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "A red X over a lane means the lane isn't for you right now."}, {"id": "T21", "q": "Normal dry roads. The minimum following time the guide recommends behind a car is:", "o": ["One second", "Two seconds", "Three seconds", "Four seconds"], "a": 1, "ex": "Two seconds minimum in normal conditions (works at any speed); four seconds for large vehicles like motor homes.", "ref": "Driver's Guide, Spring 2026, Ch.7 Maintain your following time and distance, PDF p.92", "ch": "Driver's Guide, Spring 2026, Ch.7", "sec": "Maintain your following time and distance", "h": "The minimum following gap in good conditions is a small number of seconds."}, {"id": "T22", "q": "Stopped in traffic behind another car, how much space should you leave?", "o": ["Enough to see its rear tires touching the road", "Enough to move into another lane without having to reverse", "About one car length, whatever the speed", "As little as possible, so you keep traffic moving and the line behind you short"], "a": 1, "ex": "Leave room to pull out into another lane without reversing.", "ref": "Driver's Guide, Spring 2026, Ch.7 Proactive driving, PDF p.92", "ch": "Driver's Guide, Spring 2026, Ch.7", "sec": "Proactive driving", "img": "dQueue", "cap": "Diagram (not to scale), based on the guide text", "h": "Leave enough room to get around the car ahead without backing up."}, {"id": "T23", "q": "You miss the turn the examiner asked for. Best response:", "o": ["Stop and reverse back to the turn, if it's quiet", "Continue to the next intersection or exit, and let the examiner redirect you", "Make a quick U-turn mid-block", "Stop in the lane and ask the examiner what to do"], "a": 1, "ex": "If you miss your exit or turn, continue to the next one. Never reverse on a roadway.", "ref": "Driver's Guide, Spring 2026, Ch.7 Plan ahead, PDF p.92", "ch": "Driver's Guide, Spring 2026, Ch.7", "sec": "Plan ahead", "h": "Fixing a missed turn should never involve a sudden or illegal manoeuvre."}, {"id": "T24", "q": "Before the test starts, the examiner checks your car. Which is NOT on the guide's required list?", "o": ["Working horn and speedometer", "Headlights, brake lights, and signal lights", "A spare tire and a jack", "Enough fuel for the road test"], "a": 2, "ex": "Listed: plate and insurance, lights, horn, speedometer, brakes, windshield and wipers, tires, doors, seats and belts, exhaust, mirrors, fuel. A spare tire isn't listed.", "ref": "Driver's Guide, Spring 2026, Ch.1 Class 5 road test (vehicle requirements), PDF p.14", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Class 5 road test (vehicle requirements)", "h": "The list covers safety equipment you'd use on the drive. What isn't used to drive at all?"}, {"id": "T25", "q": "Examiner: \"Turn right at the lights.\" Calgary, 17 Ave & Richmond Rd SW. Your light is solid red AND the extra red arrow below it is lit (the bike signal is on). What do you do?", "o": ["Stop, then turn right once pedestrians and traffic are clear", "Stay stopped; no right turn while the red arrow is lit", "Turn right without stopping, since the arrow points right", "Stop, then turn right only if no cyclist is in sight"], "a": 1, "ex": "The City's board says: green, YES (yield to pedestrians); red, YES (stop, then yield); red arrow, NO. The red arrow lights when cyclists have the right of way.", "ref": "CityNews Calgary, Aug 25, 2025 (photo: CityNews/Phoenix Phillips), calgary.citynews.ca/2025/08/25/calgary-traffic-sign-red-light-right-turn/", "img": "calgary17ave", "cap": "Trap: solid red alone = stop, then turn OK. Red ARROW lit = no right turn. Photo: CityNews Calgary", "h": "This intersection has an extra signal for cyclists. What does a RED ARROW forbid?"}, {"id": "T26", "q": "St. Albert Trail & Gate Ave, 11:30 p.m. on a Tuesday. The digital sign has switched to \"left turn yield on green\". Your light is solid green with NO arrow. You want to turn left. You:", "o": ["Wait for a green arrow, as the sign requires during the day", "Turn left after yielding to oncoming traffic and pedestrians", "Turn left without yielding, since the sign gives you the turn", "Go straight; left turns are closed overnight in this pilot"], "a": 1, "ex": "In the pilot, the sign shows \"no left turn on red\" by day. During low-traffic hours (10 p.m. to 5:30 a.m. weekdays, 10 p.m. to 7 a.m. weekends) it shows \"left turn yield on green\": you may turn on a plain green if you yield. If the sign malfunctions, follow the traffic lights.", "ref": "St. Albert Gazette, Oct 6, 2026 (photo: Kevin Ma/St. Albert Gazette), stalbertgazette.com/local-news/st-albert-tests-time-of-day-flexible-left-turns-at-gate-ave-intersection-12858443", "img": "stalbert", "cap": "Daytime mode shown. Trap: the same sign changes by time of day. Photo: St. Albert Gazette", "h": "The sign's message changes overnight. What does 'yield on green' require of you?"}, {"id": "T27", "q": "Examiner: \"When you're ready, get set up.\" Put the guide's pre-drive habits in order:", "o": ["Lock doors, seat, head restraint, mirrors, seat belt", "Seat belt, mirrors, seat, head restraint, lock doors", "Seat, mirrors, seat belt, lock doors, head restraint", "Mirrors, seat, lock doors, head restraint, seat belt"], "a": 0, "ex": "The guide lists them in this order: lock doors, seat and seat back, head restraint, mirrors, seat belt.", "ref": "Driver's Guide, Spring 2026, Ch.3 Pre-drive basics, PDF p.46", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Pre-drive basics", "h": "Start with security, then fit the car to you, and buckle up last."}, {"id": "T28", "q": "How far should you sit from the steering wheel, as recommended by Transport Canada?", "o": ["At least 25 centimetres", "At least 15 centimetres", "At least 40 centimetres", "Exactly 50 centimetres"], "a": 0, "ex": "At least 25 cm (10 in) from the steering wheel.", "ref": "Driver's Guide, Spring 2026, Ch.3 Adjust your seat, PDF p.46", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Adjust your seat", "h": "Transport Canada's distance is roughly the length of a hand-span plus."}, {"id": "T29", "q": "Your car has an adjustable head restraint. The examiner sees it set correctly when its centre is level with:", "o": ["The top of your ears", "The base of your neck", "Your shoulders", "The top of your head"], "a": 0, "ex": "Centre of the head restraint level with the top of your ears.", "ref": "Driver's Guide, Spring 2026, Ch.3 Adjust your head restraint, PDF p.47", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Adjust your head restraint", "h": "Line the head restraint up with a feature on the side of your head."}, {"id": "T30", "q": "The examiner asks where your hands go on a standard steering wheel. BEST answer:", "o": ["About 9 and 3 o'clock", "About 12 and 6 o'clock", "About 8 and 4 o'clock", "Both hands at 12 o'clock"], "a": 0, "ex": "Left hand at about 9 o'clock, right at about 3 (10 and 2 if the wheel design requires).", "ref": "Driver's Guide, Spring 2026, Ch.3 Steering, PDF p.50", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Steering", "h": "Picture the wheel as a clock. Hands sit level, on opposite sides."}, {"id": "T31", "q": "Examiner: \"Pull away from the curb when ready.\" You're parked on the right side. Which is NOT part of the guide's routine?", "o": ["Signal right to show you're parked", "Check your path is clear", "Check inside and outside mirrors", "Shoulder check your blind spot"], "a": 0, "ex": "Check path, mirrors, shoulder check, then use the LEFT signal when moving away from the right side.", "ref": "Driver's Guide, Spring 2026, Ch.3 Pre-drive basics, PDF p.47", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Pre-drive basics", "h": "You're leaving the right curb. Which signal tells traffic you're joining it?"}, {"id": "T32", "q": "Average perception time plus reaction time, per the guide, is about:", "o": ["1.5 seconds (\u00be s each)", "0.75 seconds in total", "3 seconds (1.5 s each)", "2 seconds in total"], "a": 0, "ex": "Perception about \u00be s and reaction about \u00be s.", "ref": "Driver's Guide, Spring 2026, Ch.3 Stopping time and distance, PDF p.51", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Stopping time and distance", "h": "The guide splits this into two stages with the same average time."}, {"id": "T33", "q": "Examiner: \"Stop behind the white line ahead.\" To finish braking smoothly you should:", "o": ["Ease off the brake slightly, then reapply just before stopping", "Press harder right before you stop", "Shift into neutral and coast the last few metres to the line", "Pump the brake quickly three times"], "a": 0, "ex": "Release pressure slightly and reapply just before you stop.", "ref": "Driver's Guide, Spring 2026, Ch.3 Braking, PDF p.52", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Braking", "h": "A smooth stop means easing pressure near the end, not adding it."}, {"id": "T34", "q": "You must stop quickly in a car WITHOUT ABS. The guide's technique is:", "o": ["Threshold braking, without locking the wheels", "Lock the wheels hard so the car stops in the shortest distance", "Pump the brake and steer hard", "Shift into park while braking"], "a": 0, "ex": "Threshold braking: brake without locking the wheels, so you can still steer.", "ref": "Driver's Guide, Spring 2026, Ch.3 Braking, PDF p.52", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Braking", "h": "Without ABS, locked wheels mean no steering. Brake just short of that."}, {"id": "T35", "q": "Examiner: \"Reverse in a straight line to the pole.\" What speed is expected?", "o": ["A crawl or slow walking speed", "About 10 km/h", "The same as forward parking speed", "Any speed if the path is clear"], "a": 0, "ex": "All reversing must be done at a crawl or slow walking speed.", "ref": "Driver's Guide, Spring 2026, Ch.3 Reversing, PDF p.53", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Reversing", "h": "Reversing speed should let you stop instantly. Think walking pace."}, {"id": "T36", "q": "Reversing straight, you drift. How much should you turn the wheel to correct?", "o": ["No more than a quarter turn", "A full turn the other way", "Half a turn toward the curb", "As much as needed, quickly"], "a": 0, "ex": "Turn no more than a quarter turn in the direction you want the rear to go.", "ref": "Driver's Guide, Spring 2026, Ch.3 Reversing, PDF p.53", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Reversing", "h": "Small corrections are key when reversing. The guide gives a limit."}, {"id": "T37", "q": "Reversing, you want the REAR of the car to go left. You turn the wheel:", "o": ["Left", "Right", "Straight, then left", "Right, then quickly left"], "a": 0, "ex": "Turn the wheel in the direction you want the rear to go. The front swings the opposite way.", "ref": "Driver's Guide, Spring 2026, Ch.3 Reversing, PDF p.53", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Reversing", "h": "When reversing, steer toward where you want the BACK of the car to go."}, {"id": "T38", "q": "Backing out of a driveway onto a two-lane-each-way street. Which is ALWAYS true?", "o": ["Back into the nearest lane only, then go forward", "Back across both lanes to line up", "Back into the far lane first so you leave room for traffic", "Back out quickly to clear traffic"], "a": 0, "ex": "Steer into the nearest traffic lane and go forward. Do not reverse into a second lane.", "ref": "Driver's Guide, Spring 2026, Ch.3 Reversing, PDF p.53", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Reversing", "img": "dDrive", "cap": "Diagram (not to scale), based on the guide text", "h": "Reversing across extra lanes adds risk. How far into the road should you back?"}, {"id": "T39", "q": "You overshoot the stop line at a red. May you reverse back behind it?", "o": ["No; reversing into a crosswalk or intersection is illegal", "Yes, if you check that no one is behind you and reverse slowly", "Yes, slowly, with hazards on", "Only if a pedestrian is waiting"], "a": 0, "ex": "It is illegal to move in reverse into an intersection or crosswalk.", "ref": "Driver's Guide, Spring 2026, Ch.3 Reversing, PDF p.53", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Reversing", "h": "Reversing near an intersection is restricted. Where may you never back into?"}, {"id": "T40", "q": "Examiner: \"Parallel park here.\" After stopping beside vehicle B, you reverse straight about how far before steering right?", "o": ["About half a metre", "About 2 metres", "About 1.5 metres", "Not at all; steer right at once"], "a": 0, "ex": "Reverse straight about \u00bd m, then steer sharply right to about 45\u00b0.", "ref": "Driver's Guide, Spring 2026, Ch.3 Parallel parking, PDF p.54", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Parallel parking", "h": "The first straight reverse before steering is short, well under a metre."}, {"id": "T41", "q": "During the parallel park, when do you turn the wheel sharply LEFT?", "o": ["When your front right corner lines up with B's rear bumper", "When your rear wheel touches the curb", "As soon as you start reversing from beside vehicle B", "When you're at 90\u00b0 to the curb"], "a": 0, "ex": "Straighten, keep reversing until the right corner of your front bumper lines up with B's rear bumper, then turn sharply left.", "ref": "Driver's Guide, Spring 2026, Ch.3 Parallel parking, PDF p.54", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Parallel parking", "img": "dParMid", "cap": "Diagram (not to scale), based on the guide text", "h": "Watch where car B's rear bumper sits relative to the front of your car."}, {"id": "T42", "q": "Leaving a parallel spot with a car in front. Which comes FIRST?", "o": ["Check mirrors, then reverse close to the car behind", "Signal left, then pull out", "Steer sharply left and move forward, then check your mirrors", "Shoulder check, then reverse"], "a": 0, "ex": "Check mirrors, reverse close to (not touching) the car behind, signal left, shoulder check, then move forward steering sharply left.", "ref": "Driver's Guide, Spring 2026, Ch.3 Leaving a parallel park, PDF p.55", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Leaving a parallel park", "h": "Before moving at all, gather information. Then make room behind you."}, {"id": "T43", "q": "Examiner: \"Park in a stall on your right.\" Approaching perpendicular stalls, keep about how far from the parked cars?", "o": ["About 2 metres", "About 1 metre", "About 3 metres", "About half a metre"], "a": 0, "ex": "Keep about 2 m (6 ft) between you and the rear of the parked vehicles.", "ref": "Driver's Guide, Spring 2026, Ch.3 Perpendicular parking, PDF p.56", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Perpendicular parking", "img": "dPerp", "cap": "Diagram (not to scale), based on the guide text", "h": "Approach the stalls with space to swing in, about a car-width or so."}, {"id": "T44", "q": "Which perpendicular stall is easier to enter, per the guide?", "o": ["One on your left, since you have more room for the angle", "One on your right, since it's closer to the curb", "Either side, as long as you reverse into the stall from the street", "Either, but only by reversing in"], "a": 0, "ex": "A 90\u00b0 stall on the left is easier (more room for the angle), but only enter left stalls in a parking lot.", "ref": "Driver's Guide, Spring 2026, Ch.3 Perpendicular parking, PDF p.56", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Perpendicular parking", "h": "Turning into a stall needs room for the angle. Which side gives more?"}, {"id": "T45", "q": "Angle parking on the right: keep about how far from the rear of the parked vehicles?", "o": ["One and a half metres", "Half a metre", "Three metres", "Two and a half metres"], "a": 0, "ex": "Remain about 1.5 m (5 ft) away from the rear of the parked vehicle.", "ref": "Driver's Guide, Spring 2026, Ch.3 Angle parking, PDF p.55", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Angle parking", "img": "dAngle", "cap": "Diagram (not to scale), based on the guide text", "h": "Angle stalls need less side room than 90\u00b0 stalls. The gap is under 2 m."}, {"id": "T46", "q": "Uphill WITH a curb: wheels turned and rolled back to the curb. What else must you do?", "o": ["Set the park brake and shift into park", "Leave it in drive with the brake on", "Turn on hazard lights", "Leave it in neutral"], "a": 0, "ex": "Always set the park brake and place the transmission in park (or low gear for manual).", "ref": "Driver's Guide, Spring 2026, Ch.3 Hill parking, PDF p.57", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Hill parking", "img": "dHill", "cap": "Diagram (not to scale), based on the guide text", "h": "Wheels and curb are only part of it. What two controls hold the car?"}, {"id": "T47", "q": "You're parking on the LEFT side of a one-way street, facing downhill. Your wheels go:", "o": ["Left, the opposite of right-side parking", "Right, toward traffic", "Straight ahead", "Right, then rolled to the curb"], "a": 0, "ex": "On the left side, turn the front wheels the opposite way to right-side parking.", "ref": "Driver's Guide, Spring 2026, Ch.3 Hill parking, PDF p.57", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Hill parking", "h": "On the LEFT side, everything about right-side wheel direction reverses."}, {"id": "T48", "q": "Which is a legal place to park?", "o": ["6 metres from a stop sign", "4 metres from a fire hydrant", "1 metre from a driveway", "3 metres from a marked crosswalk"], "a": 0, "ex": "No parking within 5 m of a stop/yield sign, hydrant, or marked crosswalk, or within 1.5 m of a driveway.", "ref": "Driver's Guide, Spring 2026, Ch.3 Do not park here, PDF p.58", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Do not park here", "img": "dC5Park", "cap": "Diagram (not to scale), based on the guide text", "h": "Several no-parking distances are 5 m. Which option is past that?"}, {"id": "T49", "q": "The hydrant is set back from the curb on a lawn. You may not park within 5 m of:", "o": ["The point on the curb nearest the hydrant", "The hydrant itself only", "The nearest driveway", "The property line"], "a": 0, "ex": "When the hydrant is not at the curb, measure from the curb point nearest it.", "ref": "Driver's Guide, Spring 2026, Ch.3 Do not park here, PDF p.58", "ch": "Driver's Guide, Spring 2026, Ch.3", "sec": "Do not park here", "img": "dHydrant", "cap": "Diagram (not to scale), based on the guide text", "h": "When the hydrant isn't at the curb, measure from the curb, not the lawn."}, {"id": "T50", "q": "Four-way stop. You and a car to your RIGHT arrive at the same time. Who goes first?", "o": ["The car on your right", "You, since you're on the left", "Whoever is going straight", "Whoever is larger"], "a": 0, "ex": "First to arrive goes first; at the same time, the vehicle on the right goes first.", "ref": "Driver's Guide, Spring 2026, Ch.4 Three- and four-way stops, PDF p.61", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Three- and four-way stops", "img": "d4way", "cap": "Diagram (not to scale), based on the guide text", "h": "Arriving together at a courtesy corner, use the same rule as uncontrolled intersections."}, {"id": "T51", "q": "Uncontrolled intersection. A car approaches from your LEFT at the same time. Which is BEST?", "o": ["You have the right-of-way, but make sure it yields first", "Yield to it, because the vehicle on your left always has priority", "Stop fully, as at a stop sign", "Speed up to clear first"], "a": 0, "ex": "Yield to vehicles on your right. Even with the right-of-way, be sure the other car will yield.", "ref": "Driver's Guide, Spring 2026, Ch.4 Uncontrolled intersections, PDF p.61", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Uncontrolled intersections", "img": "dUnc", "cap": "Diagram (not to scale), based on the guide text", "h": "The other car is on your left. The default rule favours the right, but stay cautious."}, {"id": "T52", "q": "A yield sign, and no traffic or pedestrians at all. You:", "o": ["May proceed without a complete stop", "Must stop completely anyway", "Must stop for three seconds", "Must wait for the car behind"], "a": 0, "ex": "If there's no one to yield to, you may proceed without stopping.", "ref": "Driver's Guide, Spring 2026, Ch.4 Yield signs, PDF p.61", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Yield signs", "img": "ab_yield", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Yield means stop only if you need to. Is anyone there?"}, {"id": "T53", "q": "A police officer waves you through a RED light. You:", "o": ["Follow the officer's direction", "Wait for the light to turn green", "Stop, then follow the light", "Honk to confirm first"], "a": 0, "ex": "Directions from a peace or police officer must be followed over signs or signals.", "ref": "Driver's Guide, Spring 2026, Ch.4 Right-of-way, PDF p.60", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Right-of-way", "h": "There's a ranking: officer, signals, signs. Who's on top?"}, {"id": "T54", "q": "You have the right-of-way, but a car is clearly not stopping. The guide says:", "o": ["You're still responsible to do everything to avoid a collision", "Keep going; they'll be at fault", "Keep going at the same speed, since they'll be at fault for the crash", "Speed up to get through first"], "a": 0, "ex": "Even with the right-of-way, you must do everything you can to prevent a collision.", "ref": "Driver's Guide, Spring 2026, Ch.4 Right-of-way, PDF p.60", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Right-of-way", "h": "Having the right-of-way doesn't end your duty. What's still expected?"}, {"id": "T55", "q": "Stop sign, stop line AND marked crosswalk. Where do you stop?", "o": ["Before the stop line", "Before the crosswalk, past the line", "Where you can see best", "Within 3 m of the cross road"], "a": 0, "ex": "Where a stop line is marked, stop before it.", "ref": "Driver's Guide, Spring 2026, Ch.4 Rules for stopping at intersections, PDF p.60", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Rules for stopping at intersections", "img": "ab_stop", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "Which marking exists specifically to tell drivers where to stop?"}, {"id": "T56", "q": "Examiner: \"Turn left at the next intersection.\" You're stopped in the intersection waiting. Your wheels should be:", "o": ["Straight ahead, right of the yellow line", "Turned left, so you are ready to go the moment a gap opens", "Turned right, toward the curb", "Straddling the yellow line"], "a": 0, "ex": "Keep wheels straight and stay right of the yellow line, so a rear-end hit won't push you into oncoming traffic.", "ref": "Driver's Guide, Spring 2026, Ch.4 Left turns, PDF p.67", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Left turns", "img": "dLeft", "cap": "Diagram (not to scale), based on the guide text", "h": "If you're hit from behind while waiting, where would turned wheels send you?"}, {"id": "T57", "q": "Waiting to turn left on green, there's room for one car ahead of you in the intersection. You:", "o": ["Wait behind the crosswalk", "Pull in beside the first car", "Enter and stop in the crosswalk", "Turn from the second lane"], "a": 0, "ex": "Remain behind the crosswalk if there's only room for one vehicle ahead. Enter when it clears.", "ref": "Driver's Guide, Spring 2026, Ch.4 Left turns, PDF p.67", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Left turns", "img": "dLeftQ", "cap": "Diagram (not to scale), based on the guide text", "h": "Only enter if there's room. Where do you wait when it's full?"}, {"id": "T58", "q": "Turning left off a two-lane highway, what's the step drivers often miss?", "o": ["A left shoulder check for someone passing you", "A right shoulder check", "Hazard lights on", "Stopping on the shoulder first"], "a": 0, "ex": "Before turning left off a two-lane highway, shoulder check left to be sure you're not being passed.", "ref": "Driver's Guide, Spring 2026, Ch.4 Left turns, PDF p.67", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Left turns", "h": "On a two-lane highway, someone might be passing you just as you turn left."}, {"id": "T59", "q": "Left from a two-way road onto a ONE-WAY road. Turn into:", "o": ["The first available lane on the left side", "The lane on the far right", "Any lane, after signalling", "The centre lane only"], "a": 0, "ex": "Two-way onto one-way: turn into the first available lane on the left side.", "ref": "Driver's Guide, Spring 2026, Ch.4 Left turns, PDF p.67", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Left turns", "img": "dC5OneWay", "cap": "Diagram (not to scale), based on the guide text", "h": "Avoid crossing lanes mid-turn. Which lane do you reach first?"}, {"id": "T60", "q": "Examiner: \"Right at the lights.\" Pedestrians are still in the crosswalk you'll cross. You:", "o": ["Wait until they're safely out before entering the crosswalk", "Enter as soon as they have passed your lane, then turn behind them", "Turn behind them carefully", "Inch forward to show intent"], "a": 0, "ex": "Do not enter the crosswalk to turn until pedestrians are safely out of the intersection.", "ref": "Driver's Guide, Spring 2026, Ch.4 Right turns, PDF p.66", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Right turns", "img": "dPedTurn", "cap": "Diagram (not to scale), based on the guide text", "h": "The crosswalk isn't yours until pedestrians are completely clear."}, {"id": "T61", "q": "A curb lane lined with parking meters. Which statement is CORRECT?", "o": ["It's a travel lane used for turning", "It's a parking lane, not for driving", "Only buses may use it", "You must never turn from it"], "a": 0, "ex": "The lane next to the curb is a curb lane, not a parking lane, and is used to turn off and onto roads.", "ref": "Driver's Guide, Spring 2026, Ch.4 Right turns, PDF p.65", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Right turns", "img": "dC5Meters", "cap": "Diagram (not to scale), based on the guide text", "h": "Metered curb lanes still move traffic. What else are they used for?"}, {"id": "T62", "q": "Examiner: \"Take the third exit at the roundabout.\" Which lane and signal on approach?", "o": ["Left lane, left signal", "Right lane, right signal", "Left lane, no signal", "Right lane, left signal"], "a": 0, "ex": "Not the first exit: approach in the left lane and signal left.", "ref": "Driver's Guide, Spring 2026, Ch.4 Exiting circular intersections, PDF p.65", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Exiting circular intersections", "img": "dC5RB3", "cap": "Diagram (not to scale), based on the guide text", "h": "Any exit after the first: which lane and signal show you're staying in longer?"}, {"id": "T63", "q": "In the roundabout, when do you switch on your right signal to exit?", "o": ["After passing the exit before yours", "As soon as you enter", "Only once you're in the exit lane", "Halfway around"], "a": 0, "ex": "Signal right after passing the exit before your intended exit.", "ref": "Driver's Guide, Spring 2026, Ch.4 Exiting circular intersections, PDF p.65", "ch": "Driver's Guide, Spring 2026, Ch.4", "sec": "Exiting circular intersections", "img": "dC5RBexit", "cap": "Diagram (not to scale), based on the guide text", "h": "Signal to leave once you've passed the exit just before yours."}, {"id": "T64", "q": "Examiner: \"Change lanes to the left when safe.\" Which is NOT in the guide's lane-change routine?", "o": ["Slow down well below traffic speed", "Check that the lane change is permitted", "Shoulder check the blind spot", "Turn off the signal afterwards"], "a": 0, "ex": "Keep your speed as much as possible. Slowing down isn't part of the routine.", "ref": "Driver's Guide, Spring 2026, Ch.5 Changing lanes, PDF p.73", "ch": "Driver's Guide, Spring 2026, Ch.5", "sec": "Changing lanes", "h": "The routine keeps you blending with traffic. What would disrupt that?"}, {"id": "T65", "q": "Vehicles E and F are just beside and behind you. In properly adjusted mirrors, you see them:", "o": ["Not at all; they're in your blind spots", "In the inside mirror", "In the outside mirrors, if they are set to show the horizon", "Through peripheral vision"], "a": 0, "ex": "Areas beside and slightly behind you aren't visible in mirrors: shoulder check.", "ref": "Driver's Guide, Spring 2026, Ch.5 Blind spots, PDF p.72", "ch": "Driver's Guide, Spring 2026, Ch.5", "sec": "Blind spots", "img": "dC5Blind", "cap": "Diagram (not to scale), based on the guide text", "h": "Think about what a shoulder check is for."}, {"id": "T66", "q": "Correctly adjusted outside mirrors put the horizon:", "o": ["In the middle of each mirror", "At the top of each mirror", "At the bottom of each mirror", "Out of view"], "a": 0, "ex": "From your driving position, see the horizon in the middle of each mirror.", "ref": "Driver's Guide, Spring 2026, Ch.5 Blind spots, PDF p.72", "ch": "Driver's Guide, Spring 2026, Ch.5", "sec": "Blind spots", "h": "Mirror set-up uses a horizon reference. Where in the mirror should it sit?"}, {"id": "T67", "q": "You're the slowest car on a three-lane highway. You should use:", "o": ["The right lane", "The centre lane", "The left lane", "Any lane, if at the limit"], "a": 0, "ex": "Slower traffic uses the lane furthest right, leaving the left for passing.", "ref": "Driver's Guide, Spring 2026, Ch.5 Passing on a multi-lane highway, PDF p.73", "ch": "Driver's Guide, Spring 2026, Ch.5", "sec": "Passing on a multi-lane highway", "img": "dC5Hwy3", "cap": "Diagram (not to scale), based on the guide text", "h": "Slower traffic keeps out of the passing lane. Which side is that?"}, {"id": "T68", "q": "Driving well below the limit on a clear road during your test. This could be:", "o": ["An automatic fail for obstructing traffic", "Fine on a test, since driving slower is always the safer choice", "A point only if under 30 km/h", "Required for new drivers"], "a": 0, "ex": "Obstructing traffic by driving too slowly or stopping unnecessarily is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "Driving too slowly can be its own automatic fail. What's the name of that fault?"}, {"id": "T69", "q": "Which is an automatic fail EVEN IF you're under the posted limit?", "o": ["Driving too fast for the conditions", "Signalling a bit early", "Hands at 10 and 2", "A slightly wide stop"], "a": 0, "ex": "Exceeding the speed limit OR driving too fast for the conditions is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "Under the limit can still be too fast. What else does the guide measure speed against?"}, {"id": "T70", "q": "Points add up during the test. Which is TRUE?", "o": ["Exceed the maximum points and you fail", "Points only matter for automatic fails", "Points reset after each section", "There's no point system"], "a": 0, "ex": "Drivers earn points for mistakes, with a set limit. Exceed it and you fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "The test uses demerit-style error points with a ceiling."}, {"id": "T71", "q": "Changing lanes, you cut off a car in the next lane. This is:", "o": ["An automatic fail: failing to yield during a lane change", "Only a minor point, as long as the other car managed to brake", "Fine if you signalled", "Only a fail on highways"], "a": 0, "ex": "Failing to yield the right-of-way during a lane change is an automatic fail.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "Cutting someone off is a right-of-way failure. Is that on the automatic list?"}, {"id": "T72", "q": "Who may ride along on your Class 5 road test?", "o": ["No one, except a monitoring government official", "A parent or guardian, as long as they sit in the back seat", "Your instructor", "A service animal only"], "a": 0, "ex": "No passengers or pets are allowed on a road test, except a government official accompanying the examiner.", "ref": "Driver's Guide, Spring 2026, Ch.1 Driver examiner, PDF p.17", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Driver examiner", "h": "The road test is just you and the examiner, with one official exception."}, {"id": "T73", "q": "Which is NOT required on the vehicle you bring to the road test?", "o": ["A backup camera", "A working horn", "A speedometer", "Enough fuel for the test"], "a": 0, "ex": "The list includes plate and insurance, lights, horn, speedometer, brakes, windshield, tires, doors, seats/belts, exhaust, mirrors and fuel. No backup camera.", "ref": "Driver's Guide, Spring 2026, Ch.1 Class 5 road test, PDF p.14", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Class 5 road test", "h": "The vehicle list is basic safety equipment. Which option is a convenience feature?"}, {"id": "T74", "q": "A driver aged 66 takes the Class 5 road test. Which manoeuvre is NOT required?", "o": ["Parallel parking", "Perpendicular parking", "Hill parking", "Lane changes"], "a": 0, "ex": "Drivers over 65 are not required to complete a parallel park.", "ref": "Driver's Guide, Spring 2026, Ch.1 Class 5 road test, PDF p.14", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Class 5 road test", "h": "Older drivers are excused from one specific parking manoeuvre."}, {"id": "T75", "q": "You pass your road test. What makes your licence update official?", "o": ["Taking the road test permit to a registry agent", "The examiner's signature on your learner licence", "Waiting for it in the mail", "Nothing; it's automatic"], "a": 0, "ex": "Take the road test permit to a registry agent. The permit is not a driver's licence.", "ref": "Driver's Guide, Spring 2026, Ch.1 Common reasons for not passing, PDF p.15", "ch": "Driver's Guide, Spring 2026, Ch.1", "sec": "Common reasons for not passing", "h": "The road test permit isn't a licence. Where do you take it?"}, {"id": "T76", "q": "Railway crossing sign WITH a stop sign, as shown. Where must you stop?", "o": ["Between 5 m and 15 m from the nearest rail", "Between 2 m and 5 m from the nearest rail", "Between 15 m and 30 m from the nearest rail", "Stop only if the gates are down, otherwise keep your speed"], "a": 0, "ex": "A stop sign at a railway crossing requires a complete stop between 5 m (15 ft) and 15 m (50 ft) from the nearest rail.", "ref": "Driver's Guide, Spring 2026, Ch.8 Railway crossings, PDF p.105", "ch": "Driver's Guide, Spring 2026, Ch.8", "sec": "Railway crossings", "img": "dRailStop", "cap": "Diagram (not to scale), based on the guide text", "h": "A stop sign at a crossing has a stop range measured from the nearest rail."}, {"id": "T77", "q": "At a railway crossing sign with no gates, a train is sounding its horn. You must stop if it's approaching within:", "o": ["500 metres (about five city blocks)", "150 metres (about one and a half blocks)", "1 kilometre (about ten blocks)", "300 metres (about three blocks)"], "a": 0, "ex": "You must stop when a train is visible or sounding a signal and approaching within 500 m (about five city blocks).", "ref": "Driver's Guide, Spring 2026, Ch.8 Railway crossings, PDF p.105", "ch": "Driver's Guide, Spring 2026, Ch.8", "sec": "Railway crossings", "img": "ab_rail", "cap": "Sign artwork: Alberta Driver's Guide (Spring 2026), Government of Alberta. Open Government Licence \u2013 Alberta", "h": "The guide links this distance to city blocks."}];const IMG={"school": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAGPCAYAAAB1dM37AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAAGFFSURBVHja7V11fBTH+37u4i4QiJIEKQ4hEDRAIcFLcSvFCoVCsQJtqdBCv1iBFgkFCkVbnCDBJXhwp7gGSSAkAeI+vz/2d9vb2727vbu9y10yz+czn+R2Z2dn5dl5551XZKAoyXAC0Lpcead+tnbyxjk5BZ7p7/OcAcDFzTbD3t46NS+n6ExSUuZmALEAsugtK5mQ0VtQIlHX28f517dvsyPr1LdHyw7ZViENi1C2PFC2PFMh+TVTrl2Q4/g+h8KbV3Lg7m5/8PWrzMkAbtJbSIlOYb5w9SrvtDw/L6/n5xOLrPoMK4S7p7gD36UAG5ZbYdUCeYGtre3WpNeZIwCk01tKiU5hXqjt4Wl/IuIj4j55Tq5MLMGFCD9jkh05vl/29m1qTksA/9JbS4lOYR5o6uJmc/Sn+QV23T4lkjS4ba0MMyZa56an5bcCcJbeYkp0iuJFMxdXm6Pz/863/bCDtA0f2wdMGGiTn56W/yGAM/RWU6JTFNdI7mpz7Le1+batO2mumJQI/HuF+SuTAV7eQK1QoJyP5uNOHQLGfmKTn56W3wbACXrLKShMT/Lc5TtAHuYJl/s5IL+tBalZD0QmAwG4RSYDqRUKMv9vpq66dlbvAXFxtckD0JLedgoKMyL5iYcMiVXJra7UaQBy8hElOwWFxZB8+xmQMuXEk1xRypQD2XFWFNk/pI+BgqIYSb7rPIi7p+4kVxQXN5Do05TsFBRmS/LoOBBXd/1Jriiu7oxUQMleckC17pZDco3a9esXgSGdgLR3wvttbIGP+wL1mzK/L54G9mwB8vOE67u6A2v2AXUaCO9X0sa3BXCcPiIKimIeycv7guy5zD9u90VmHx3ZKSgsfE7u5Q1y8Ib644/c1kx2OmenoLBwklOy0zk6hZnPyW9dBQZ1AN6lCu/38gb+OQRUqibuhE8fAv0jgdcJwvtd3IA1e4G6DemcnRKdwiJJTslOiU5RSkhOyV6yIae3wGzQrLhJDgBBlYH1R4DyvsL7098DgzsB1y8I72/eFli0Id/GxdXmEJ2z0xGdgk/yo8VNcjqyU6JTlCKSS0X204eBMf0o2SnRKcyW5JTslOgUpYTklOyU6BTFTHJv const NAV=[['index.html','./','📝 Class 4 Knowledge Test (Written)'],['roadtest-class5.html','roadtest-class5.html','🚗 Class 5 Road Test Practice'],['roadtest-class4.html','roadtest-class4.html','🚕 Class 4 Taxi/Rideshare Scenarios'],['signs-class4.html','signs-class4.html','🚦 Class 4 Road Signs Quiz']];
$('nav').innerHTML=NAV.map(([k,h,t])=>`<a href="${h}" class="${CFG.page==k?'cur':''}"${CFG.page==k?' aria-current=page':''}>${t}</a>`).join('');
function hintText(q){return q.h||('Think about the guide section: “'+(q.sec||q.ref.split(',').slice(-2,-1)[0]||q.ref).trim()+'”. One wrong option is now crossed out.')}
function hint(){const q=S.qs[S.i];if(S.done||S.hinted[S.i])return;S.hinted[S.i]=1;if(S.mode=='hard'){$('hb').outerHTML=`<div class=hint>💡 ${q.h}</div>`;return}const w=S.ord.filter(k=>k!=q.a);const e=w[Math.random()*w.length|0];$('o'+e).classList.add('elim');$('o'+e).disabled=true;$('hb').outerHTML=`<div class=hint>💡 ${hintText(q)}</div>`}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function balPos(n){for(let t=0;t<500;t++){const c=[0,1,2,3].map(i=>Math.floor(n/4)+(i<n%4?1:0));const p=[];let ok=true;for(let i=0;i<n;i++){let ch=[0,1,2,3].filter(k=>c[k]>0&&!(i>=2&&p[i-1]==k&&p[i-2]==k));if(!ch.length){ok=false;break}const tot=ch.reduce((a,k)=>a+c[k],0);let r=Math.random()*tot,k=ch[0];for(const x of ch){r-=c[x];if(r<0){k=x;break}}p.push(k);c[k]--}if(ok)return p}return Array.from({length:n},(_,i)=>i%4)}
function home(){const best=localStorage.getItem(CFG.key)||'–';
$('app').innerHTML=`<h1>${CFG.title}</h1><div class=card><b>${Q.length}</b> questions in the bank.<br>${CFG.intro}<br>Real test: ${Math.min(CFG.n,Q.length)} random, stops at ${CFG.wrong} wrong, pass = ${CFG.pass}/${Math.min(CFG.n,Q.length)}.<div class=stats><span>Best real-test score: ${best}</span>${QHx.length?`<span>🔥 Hard best: ${localStorage.getItem(CFG.key+'_hard')||'–'}</span>`:''}</div></div>
<button class=pri onclick="start('real')">▶ Real test (${Math.min(CFG.n,Q.length)})</button><button class=pri onclick="start('all')">📚 Practice all (${Q.length})</button>${QHx.length?`<button class=pri onclick="start('hard')">🔥 Hard mode (difficulty 9) · ${Math.min(CFG.n,QHx.length)} of ${QHx.length}</button>`:''}<button class=pri onclick="start('weak')">🎯 Weak spots (${Math.min(CFG.n,Q.length)})</button>${CFG.cats?'<h3>Practice by category</h3><div class=cats>'+CFG.cats.map(([k,t])=>`<button onclick="start('cat',shuf(Q.filter(q=>q.cat=='${k}')))">${t} (${Q.filter(q=>q.cat==k).length})</button>`).join('')+'</div>':''}<div class=card style="font-size:14px">${weakInfo()}<br><label><input type=checkbox ${tmOn()?'checked':''} onchange="localStorage.setItem('timer',this.checked?'1':'0')"> ⏱ Show timer and pace per question</label></div>${CFG.links}`}
function pickHard(){const sk='seen_hard_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(QHx).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,QHx.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
function pickReal(){const sk='seen_'+CFG.key;let seen={};try{seen=JSON.parse(localStorage.getItem(sk)||'{}')}catch(e){}
const att=(+localStorage.getItem(sk+'_n')||0)+1;const qs=shuf(Q).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,Math.min(CFG.n,Q.length));
qs.forEach(q=>seen[q.id]=att);localStorage.setItem(sk,JSON.stringify(seen));localStorage.setItem(sk+'_n',att);return shuf(qs)}
const MK='miss_'+CFG.key;function getM(){try{return JSON.parse(localStorage.getItem(MK)||'{"q":{},"t":{}}')}catch(e){return {q:{},t:{}}}}
function tkey(q){return (q.ch||'')+(q.sec?' · '+q.sec:'')}
function recM(q,ok){const m=getM();if(ok){if(m.q[q.id])m.q[q.id]=Math.max(0,m.q[q.id]-1)}else{m.q[q.id]=(m.q[q.id]||0)+1;m.t[tkey(q)]=(m.t[tkey(q)]||0)+1;const c=(q.ch||'');m.t['CH:'+c]=(m.t['CH:'+c]||0)+1}localStorage.setItem(MK,JSON.stringify(m))}
function pickWeak(){const m=getM();const sc=q=>(m.q[q.id]||0)*4+(m.t[tkey(q)]||0)*2+(m.t['CH:'+(q.ch||'')]||0)*0.5+Math.random()*0.3;return Q.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,Math.min(CFG.n,Q.length))}
function weakInfo(){const m=getM();const t=Object.entries(m.t).filter(([k])=>!k.startsWith('CH:')).sort((a,b)=>b[1]-a[1]).slice(0,3);return t.length?'Top weak spots: '+t.map(([k,v])=>k.replace(/^.*?, /,'')+' ('+v+')').join('; '):'No misses recorded yet. Take a test first.'}
let TM=null;function tmOn(){return localStorage.getItem('timer')=='1'}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){const e=$('tm');if(!e||!S)return;const el=(Date.now()-S.t0)/1000,n=Math.max(1,S.i+(S.done?1:0));e.textContent='⏱ '+fmt(el)+' · pace '+fmt(el/n)+'/q'}
function start(mode,list){const qs=list||(mode=='real'?pickReal():mode=='hard'?pickHard():mode=='weak'?shuf(pickWeak()):shuf(Q));clearInterval(TM);if(tmOn())TM=setInterval(tick,1000);S={t0:Date.now(),mode,qs,i:0,ok:0,bad:0,missed:[],hinted:{},hints:0,pos:balPos(qs.length)};show()}
function head(){const n=S.qs.length,p=S.i/n*100;return (tmOn()?`<div class=stats><span id=tm>⏱ ${fmt((Date.now()-S.t0)/1000)}</span></div>`:'')+`<div class=stats><span>Q ${Math.min(S.i+1,n)}/${n}</span><span>✅ ${S.ok} ❌ ${S.bad}</span></div><div class=bar><i style="width:${p}%"></i></div>`+(isR(S.mode)?`<div class="stats strikes" style="justify-content:flex-start;gap:4px">Wrong: ${S.bad}/${CFG.wrong} ${'<span class=on></span>'.repeat(S.bad)}${'<span></span>'.repeat(Math.max(0,CFG.wrong-S.bad))}</div>`:'')}
function show(){const q=S.qs[S.i];
$('app').innerHTML=head()+`<div class=card>${q.img?`<div class=sign><img alt="road sign" src="${IMG[q.img]}">${q.cap?`<div class=cap>${q.cap}</div>`:''}</div>`:''}<p><b>${q.q}</b></p><button class=hb id=hb onclick="hint()">💡 Hint</button></div>`+(S.ord=(()=>{const d=shuf([0,1,2,3].filter(k=>k!=q.a));d.splice(S.pos[S.i],0,q.a);return d})()).map((k,p)=>`<button id=o${k} onclick="pick(${k})">${'ABCD'[p]}. ${q.o[k]}</button>`).join('')+`<div id=fb></div>`}
function pick(k){const q=S.qs[S.i];if(S.done)return;S.done=1;const r=k==q.a;recM(q,r);if(S.hinted[S.i])S.hints++;r?S.ok++:(S.bad++,S.missed.push({q,k,h:!!S.hinted[S.i]}));
$('o'+q.a).classList.add('ok');if(!r)$('o'+k).classList.add('bad');
const end=isR(S.mode)&&S.bad>=CFG.wrong;
$('fb').innerHTML=`<div class=card><div class=fb style="color:var(${r?'--ok':'--bad'})">${r?'✅ Correct':'❌ Wrong, answer '+'ABCD'[S.ord.indexOf(q.a)]}</div><p>${q.ex}</p><div class=ref>${q.ref}</div></div><button class=pri onclick="next(${end})">${end?'See result':S.i+1<S.qs.length?'Next ▶':'See result'}</button>`;
document.querySelectorAll('button[id^=o]').forEach(b=>b.disabled=true);$('fb').scrollIntoView({behavior:'smooth'})}
function topics(){const g={};S.missed.forEach(({q})=>{const c=q.ch||q.ref;(g[c]=g[c]||[]).push(q)});
return `<h2>Review these topics</h2><div class=card>`+Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([c,qs])=>`<p><b>${c}</b> (${qs.length} missed)<br><span class=ref>${[...new Set(qs.map(q=>q.sec||''))].filter(Boolean).join(' · ')}</span></p>`).join('')+`</div>`}
function next(end){S.done=0;S.i++;if(end||S.i>=S.qs.length)result();else{show();scrollTo(0,0)}}
function result(){clearInterval(TM);const n=S.qs.length,real=isR(S.mode),BK=CFG.key+(S.mode=='hard'?'_hard':'');const pass=real?(S.ok>=CFG.pass&&S.bad<CFG.wrong):S.ok/n>=25/30;
if(real){const b=+localStorage.getItem(BK)||0;if(S.ok>b)localStorage.setItem(BK,S.ok)}
$('app').innerHTML=`<h1>${pass?'🎉 PASS':'❌ FAIL'}</h1><div class=card>Score: <b>${S.ok}</b> / ${n}${real&&S.bad>=CFG.wrong?' (stopped at '+CFG.wrong+' wrong)':''}<div class=bar><i style="width:${S.ok/n*100}%;background:var(${pass?'--ok':'--bad'})"></i></div>${real?`Need ${CFG.pass}/${n} and fewer than ${CFG.wrong} wrong.`:''}<p>⏱ Time: ${fmt((Date.now()-S.t0)/1000)} · pace ${fmt((Date.now()-S.t0)/1000/Math.max(1,Math.min(S.i,n)))} per question</p><p>💡 Hints used: ${S.hints} of ${Math.min(S.i,n)} answered${S.hints?' (on '+(S.hints-S.missed.filter(m=>m.h).length)+' you got right, '+S.missed.filter(m=>m.h).length+' missed)':''}</p></div>`+
(S.missed.length?`<button class=pri onclick="start('missed',shuf(S.missed.map(m=>m.q)))">🔁 Retry missed only (${S.missed.length})</button>`+topics()+`<h2>Missed questions (${S.missed.length})</h2>`+S.missed.map(({q,k,h})=>`<div class=card><b>${q.q}</b>${h?'<p class=hint>💡 You used a hint on this one</p>':''}<p style="color:var(--bad)">✘ Your answer: ${q.o[k]}</p><p style="color:var(--ok)">✔ Correct: ${q.o[q.a]}</p><p>${q.ex}</p><div class=ref>📖 Review: ${q.ref}</div></div>`).join(''):'<div class=card>No missed questions. 🎯</div>')+`<button onclick="home()">🏠 Home</button>`;scrollTo(0,0)}
home();
</script></body></html>
